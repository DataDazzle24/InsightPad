function iniciarInteracoesClientePagamentoPDV() {
  if (window.__pdv_cliente_pagamento_iniciado) return;
  window.__pdv_cliente_pagamento_iniciado = true;

  const btnAbrir = document.getElementById("btnClientePagamento");
  const modal = document.getElementById("modalClientePagamento");
  const box = document.getElementById("boxClientePagamento");
  const btnCancelar = document.getElementById("btnCancelarClientePagamento");
  const btnConfirmar = document.getElementById("btnConfirmarClientePagamento");

  const inputNome = document.getElementById("inputClientePagamentoNome");
  const inputCPF = document.getElementById("inputClientePagamentoCPF");
  const inputSexo = document.getElementById("inputClientePagamentoSexo");
  const inputNascimento = document.getElementById("inputClientePagamentoNascimento");
  const inputIdade = document.getElementById("inputClientePagamentoIdade");
  const inputEmail = document.getElementById("inputClientePagamentoEmail");
  const listaNome = document.getElementById("listaClientePagamentoNome");
  const qtdCompras = document.getElementById("clienteQtdCompras");
  const totalCompras = document.getElementById("clienteTotalCompras");
  const nomeSelecionado = document.getElementById("nomeClientePagamento");

  if (!btnAbrir || !modal || !box || !btnCancelar || !btnConfirmar || !inputNome || !inputCPF ||
      !inputSexo || !inputNascimento || !inputIdade || !inputEmail || !listaNome || !qtdCompras ||
      !totalCompras || !nomeSelecionado) {
    console.error("Cliente no pagamento: elementos não encontrados.");
    return;
  }

  const nomesClientes = [];
  const toastWarn = (msg) => (window.toastr ? toastr.warning(msg) : alert(msg));

  let mapaClientePorNome = new Map();
  let mapaClientePorCPF = new Map();

  function reconstruirBaseClientes() {
    const clientes = Array.isArray(itensCli) ? itensCli : [];
    const novosNomes = clientes.map(c => c.nome).filter(Boolean).sort((a, b) => a.localeCompare(b));
    const novoMapaNome = new Map();
    const novoMapaCPF = new Map();

    clientes.forEach(cliente => {
      const nomeKey = normalizarTextoCaixa(cliente?.nome);
      const cpfKey = somenteDigitosCaixa(cliente?.cpf);

      if (nomeKey && !novoMapaNome.has(nomeKey)) novoMapaNome.set(nomeKey, cliente);
      if (cpfKey && !novoMapaCPF.has(cpfKey)) novoMapaCPF.set(cpfKey, cliente);
    });

    nomesClientes.length = 0;
    nomesClientes.push(...novosNomes);
    mapaClientePorNome = novoMapaNome;
    mapaClientePorCPF = novoMapaCPF;
  }

  reconstruirBaseClientes();

  if (typeof configurarDropdown === "function") {
    configurarDropdown(inputNome, listaNome, nomesClientes);
  }

  window.__pdvClientePagamento_recarregarClientes = reconstruirBaseClientes;

  function preencherCamposCliente(cliente) {
    if (!cliente) return;

    const resumo = obterResumoClienteCaixa(cliente.idCliente);

    inputNome.value = cliente.nome || "";
    inputCPF.value = aplicarMascaraCPFCaixaValor(cliente.cpf || "");
    inputSexo.value = cliente.sexo || "";
    inputNascimento.value = cliente.dataNascimento || "";
    inputIdade.value = cliente.idade || calcularIdadeClienteCaixa(cliente.dataNascimento);
    inputEmail.value = cliente.email || "";
    qtdCompras.textContent = String(resumo.qtdCompras || 0);
    totalCompras.textContent = formatBRL(resumo.totalCompras || 0);
  }

  function limparCamposCliente() {
    inputNome.value = "";
    inputCPF.value = "";
    inputSexo.value = "";
    inputNascimento.value = "";
    inputIdade.value = "";
    inputEmail.value = "";
    qtdCompras.textContent = "0";
    totalCompras.textContent = formatBRL(0);
  }

  function abrirModalCliente() {
    limparCamposCliente();

    if (clienteSelecionadoPDV) {
      preencherCamposCliente(clienteSelecionadoPDV);
      btnConfirmar.textContent = "EDITAR";
    } else {
      btnConfirmar.textContent = "CONFIRMAR";
    }

    modal.classList.add("ativo");
    esconderSugestoes(listaNome);
    if (document.activeElement && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }
  }

  function fecharModalCliente() {
    modal.classList.remove("ativo");
  }

  function obterClienteDigitado() {
    const cpf = somenteDigitosCaixa(inputCPF.value);
    if (cpf.length === 11 && mapaClientePorCPF.has(cpf)) return mapaClientePorCPF.get(cpf);

    const nomeKey = normalizarTextoCaixa(inputNome.value);
    if (nomeKey && mapaClientePorNome.has(nomeKey)) return mapaClientePorNome.get(nomeKey);

    return null;
  }

  function atualizarResumoCabecalho() {
    if (clienteSelecionadoPDV) {
      nomeSelecionado.textContent = clienteSelecionadoPDV.nome || "";
      btnAbrir.title = "Editar cliente";
      btnAbrir.classList.add("editar");
      const icone = btnAbrir.querySelector("i");
      if (icone) icone.className = "bi bi-person-check-fill";
    } else {
      nomeSelecionado.textContent = "";
      btnAbrir.title = "Adicionar cliente";
      btnAbrir.classList.remove("editar");
      const icone = btnAbrir.querySelector("i");
      if (icone) icone.className = "bi bi-person-plus-fill";
    }
  }

  btnAbrir.addEventListener("click", abrirModalCliente);
  btnCancelar.addEventListener("click", fecharModalCliente);

  modal.addEventListener("click", (e) => {
    if (e.target === modal) fecharModalCliente();
  });

  box.addEventListener("click", (e) => e.stopPropagation());

  listaNome.addEventListener("click", () => {
    setTimeout(() => {
      const cliente = mapaClientePorNome.get(normalizarTextoCaixa(inputNome.value));
      if (cliente) preencherCamposCliente(cliente);
    }, 0);
  }, true);

  inputNome.addEventListener("change", () => {
    const cliente = mapaClientePorNome.get(normalizarTextoCaixa(inputNome.value));
    if (cliente) preencherCamposCliente(cliente);
  });

  inputCPF.addEventListener("input", () => {
    inputCPF.value = aplicarMascaraCPFCaixaValor(inputCPF.value);
    const cpf = somenteDigitosCaixa(inputCPF.value);
    if (cpf.length === 11) {
      const cliente = mapaClientePorCPF.get(cpf);
      if (cliente) preencherCamposCliente(cliente);
      else toastWarn("Cliente não encontrado para este CPF.");
    }
  });

  btnConfirmar.addEventListener("click", () => {
    const cliente = obterClienteDigitado();
    if (!cliente) {
      toastWarn("Selecione um cliente ativo pelo nome ou CPF completo.");
      return;
    }

    clienteSelecionadoPDV = cliente;
    atualizarResumoCabecalho();
    fecharModalCliente();
  });

  window.__pdvClientePagamento_limpar = function() {
    clienteSelecionadoPDV = null;
    atualizarResumoCabecalho();
  };

  window.__pdvClientePagamento_atualizarHeader = atualizarResumoCabecalho;
  atualizarResumoCabecalho();
}


// INTERAÇÕES ENTRE CAMPOS  =========================================================

function iniciarInteracoesPagamentoPDV() {
  if (window.__pdv_pagamento_iniciado) return;
  window.__pdv_pagamento_iniciado = true;

  const modal            = document.getElementById("modalPagamento");

  const totalCompra      = document.getElementById("pag_total_compra");
  const descontoCompra   = document.getElementById("desconto_compra");
  const totalComDesconto = document.getElementById("pag_desconto_compra");

  const troco            = document.getElementById("pag_troco");

  const forma1           = document.getElementById("pag_forma1");
  const forma2           = document.getElementById("pag_forma2");

  const valor1           = document.getElementById("pag_valor1");
  const valor2           = document.getElementById("pag_valor2");

  const lista1           = document.getElementById("pag_lista_forma1");
  const lista2           = document.getElementById("pag_lista_forma2");

  if (!modal || !totalCompra || !descontoCompra || !totalComDesconto || !troco ||
      !forma1 || !forma2 || !valor1 || !valor2 || !lista1 || !lista2) {
    console.error("Pagamento: elementos do modal não encontrados.");
    return;
  }

  const toastWarn = (msg) => (window.toastr ? toastr.warning(msg) : alert(msg));

  // --------- opções fixas ----------
  const formasPagamento = ["DINHEIRO", "PIX", "CARTÃO DÉBITO", "CARTÃO CRÉDITO"];

  if (typeof configurarDropdown === "function") {
    configurarDropdown(forma1, lista1, formasPagamento);
    configurarDropdown(forma2, lista2, formasPagamento);
  }

  // Flags para saber se o valor foi “auto-preenchido” ou digitado pelo usuário
  valor1.dataset.auto = "1";
  valor2.dataset.auto = "1";

  // Estado inicial (sempre que abrir)
  function resetarPagamento() {
    forma1.value = "";
    forma2.value = "";

    descontoCompra.value = "";
    totalComDesconto.value = totalCompra.value || "R$ 0,00";

    valor1.value = "";
    valor2.value = "";

    forma2.disabled = true;
    valor1.disabled = true;
    valor2.disabled = true;

    troco.value = "R$ 0,00";

    valor1.dataset.auto = "1";
    valor2.dataset.auto = "1";
  }

  // (1) Atualiza total com desconto
  function atualizarTotalComDesconto() {
    const total = parseBRL(totalCompra.value);
    const descTxt = String(descontoCompra.value || "").trim();

    // se vazio -> total com desconto = total
    if (!descTxt) {
      totalComDesconto.value = formatBRL(total);
      return;
    }

    let desconto = parseBRL(descTxt);

    // valida desconto <= total
    if (desconto > total) {
      desconto = total;
      toastWarn("O desconto não pode ser maior que o valor total!");
      // ajusta visualmente o campo para o máximo permitido
      descontoCompra.value = formatBRL(desconto);
    }

    const novoTotal = Math.max(0, total - desconto);
    totalComDesconto.value = formatBRL(novoTotal);
  }

  // (3) Troco: max(0, (valor1 + valor2) - totalComDesconto)
  function atualizarTroco() {
    const total = parseBRL(totalComDesconto.value);
    const v1 = parseBRL(valor1.value);
    const v2 = parseBRL(valor2.value);

    const pago = (Number.isFinite(v1) ? v1 : 0) + (Number.isFinite(v2) ? v2 : 0);
    const trocoNum = Math.max(0, pago - total);

    troco.value = formatBRL(trocoNum);
  }

  // (2) Habilitação em cadeia + auto preenchimentos
  function atualizarEstadoPagamento() {
    // sempre recalcula o total com desconto antes
    atualizarTotalComDesconto();

    const totalDesc = parseBRL(totalComDesconto.value);

    const temForma1 = String(forma1.value || "").trim() !== "";
    const v1 = parseBRL(valor1.value);

    // Forma1 -> Valor1
    valor1.disabled = !temForma1;

    // Se forma1 acabou de ser selecionada e o valor1 estiver em "auto"
    if (temForma1 && valor1.dataset.auto === "1") {
      valor1.value = formatBRL(totalDesc);
    }

    // Decide se pode habilitar a forma2:
    // Só faz sentido se tiver forma1 e valor1 menor que total com desconto (ainda falta pagar)
    const faltaPagar = Math.max(0, totalDesc - (Number.isFinite(v1) ? v1 : 0));
    const podeForma2 = temForma1 && Number.isFinite(v1) && v1 > 0 && faltaPagar > 0.00001;

    forma2.disabled = !podeForma2;

    // Se não pode forma2, limpa tudo da forma2/valor2
    if (!podeForma2) {
      forma2.value = "";
      valor2.value = "";
      valor2.disabled = true;
      valor2.dataset.auto = "1";
    }

    const temForma2 = String(forma2.value || "").trim() !== "";

    // Forma2 -> Valor2
    valor2.disabled = !(podeForma2 && temForma2);

    // Se forma2 selecionada, valor2 auto = restante (se ainda em auto)
    if (podeForma2 && temForma2 && valor2.dataset.auto === "1") {
      const restante = Math.max(0, totalDesc - (Number.isFinite(v1) ? v1 : 0));
      valor2.value = formatBRL(restante);
    }

    atualizarTroco();
  }

  // ============================================================
  // EVENTOS
  // ============================================================

  // Desconto: recalcula total com desconto e (se valor1 auto) atualiza valor1 + estado
  descontoCompra.addEventListener("input", () => {
    atualizarTotalComDesconto();

    // se forma1 já escolhida e valor1 ainda é auto, acompanha o novo total
    if (String(forma1.value || "").trim() !== "" && valor1.dataset.auto === "1") {
      const totalDesc = parseBRL(totalComDesconto.value);
      valor1.value = formatBRL(totalDesc);
    }

    // se forma2 selecionada e valor2 auto, recalcula restante
    if (String(forma2.value || "").trim() !== "" && valor2.dataset.auto === "1") {
      const totalDesc = parseBRL(totalComDesconto.value);
      const v1 = parseBRL(valor1.value);
      const restante = Math.max(0, totalDesc - (Number.isFinite(v1) ? v1 : 0));
      valor2.value = formatBRL(restante);
    }

    atualizarEstadoPagamento();
  });

  // Clique na lista da forma1 -> depois do click seu dropdown preenche o input
  lista1.addEventListener("click", () => {
    setTimeout(() => {
      // marcou como auto (queremos preencher automaticamente)
      valor1.dataset.auto = "1";
      atualizarEstadoPagamento();
    }, 0);
  }, true);

  // Digitação manual na forma1 também
  forma1.addEventListener("input", () => {
    // quando o usuário digita e escolhe, mantém auto inicialmente
    valor1.dataset.auto = "1";
    atualizarEstadoPagamento();
  });

  // Valor1 manual -> desliga auto
  valor1.addEventListener("input", () => {
    valor1.dataset.auto = "0";

    // se forma2 estiver selecionada e valor2 ainda auto, atualiza restante
    if (String(forma2.value || "").trim() !== "" && valor2.dataset.auto === "1") {
      const totalDesc = parseBRL(totalComDesconto.value);
      const v1 = parseBRL(valor1.value);
      const restante = Math.max(0, totalDesc - (Number.isFinite(v1) ? v1 : 0));
      valor2.value = formatBRL(restante);
    }

    atualizarEstadoPagamento();
  });

  // Clique na lista da forma2 -> valida + calcula valor2
  lista2.addEventListener("click", () => {
    setTimeout(() => {
      const totalDesc = parseBRL(totalComDesconto.value);
      const v1 = parseBRL(valor1.value);

      // Regra: se valor1 já pagou tudo, não deixa usar forma2
      if (Math.abs(v1 - totalDesc) < 0.00001) {
        toastWarn("O valor total já foi inserido na forma de pagamento 1");
        forma2.value = "";
        valor2.value = "";
        valor2.disabled = true;
        valor2.dataset.auto = "1";
        atualizarEstadoPagamento();
        return;
      }

      // Auto: valor2 = totalDesc - valor1
      valor2.dataset.auto = "1";
      atualizarEstadoPagamento();
    }, 0);
  }, true);

  // Digitação manual na forma2 (caso permita)
  forma2.addEventListener("input", () => {
    valor2.dataset.auto = "1";
    atualizarEstadoPagamento();
  });

  // Valor2 manual -> desliga auto
  valor2.addEventListener("input", () => {
    valor2.dataset.auto = "0";
    atualizarEstadoPagamento();
  });

  // Exponho utilitários simples pra você chamar no abrir/fechar
  window.__pdvPagamento_resetar = resetarPagamento;
  window.__pdvPagamento_atualizar = atualizarEstadoPagamento;

  // Helpers BRL (iguais ao seu padrão robusto)
  function parseBRL(valorTexto) {
    if (valorTexto === null || valorTexto === undefined) return 0;
    if (typeof valorTexto === "number") return Number.isFinite(valorTexto) ? valorTexto : 0;

    let s = String(valorTexto).trim();
    if (!s) return 0;

    s = s.replace(/\u00A0/g, " ");
    s = s.replace(/[Rr]\$\s*/g, "");
    s = s.replace(/\s/g, "");

    const lastComma = s.lastIndexOf(",");
    const lastDot = s.lastIndexOf(".");

    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (lastComma > -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (lastDot > -1) {
      const parts = s.split(".");
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join("") + "." + dec;
      }
      s = s.replace(/,/g, "");
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function formatBRL(n) {
    const fmt = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(Number(n) || 0);

    return fmt.replace(/\u00A0/g, " ");
  }
}


// FUNÇÃO PARA HABILITAR FUNÇÕES COM O TECLADO ==============================

function habilitarAtalhosPagamentoPDV() {
  if (window.__pdv_pagamento_atalhos) return;
  window.__pdv_pagamento_atalhos = true;

  const modal = document.getElementById("modalPagamento");
  const box = document.getElementById("modalPagamentoBox");

  const desconto = document.getElementById("desconto_compra");

  const forma1 = document.getElementById("pag_forma1");
  const lista1 = document.getElementById("pag_lista_forma1");

  const valor1 = document.getElementById("pag_valor1");

  const forma2 = document.getElementById("pag_forma2");
  const lista2 = document.getElementById("pag_lista_forma2");

  const valor2 = document.getElementById("pag_valor2");

  const btnFinalizar = document.getElementById("btnFinalizarCompra");

  if (!modal || !box || !desconto || !forma1 || !valor1 || !forma2 || !valor2) {
    console.error("Atalhos pagamento: elementos não encontrados.");
    return;
  }

  // Ordem de navegação
  const ordem = [desconto, forma1, valor1, forma2, valor2, btnFinalizar].filter(Boolean);

  function dentroDoModal(target) {
    return box.contains(target);
  }

  function isDisabled(el) {
    return !el || el.disabled || el.getAttribute("disabled") !== null;
  }

  function proximoCampo(atual) {
    const i = ordem.indexOf(atual);
    for (let k = i + 1; k < ordem.length; k++) {
      if (!isDisabled(ordem[k])) return ordem[k];
    }
    return null;
  }

  function campoAnterior(atual) {
    const i = ordem.indexOf(atual);
    for (let k = i - 1; k >= 0; k--) {
      if (!isDisabled(ordem[k])) return ordem[k];
    }
    return null;
  }

  function abrirDropdown(input, ul) {
    if (!input) return;
    input.focus();
    // dispara seu listener de focus do configurarDropdown (abre sugestões)
    try { input.dispatchEvent(new Event("focus")); } catch (e) {}
    // fallback caso a lista já tenha itens
    if (ul) ul.style.display = "block";
  }

  // Se a lista estiver aberta e o usuário estiver navegando nela,
  // deixamos o Enter selecionar a opção, e só depois avançamos.
  function listaAberta(ul) {
    return !!ul && ul.style.display === "block";
  }

  document.addEventListener("keydown", (e) => {
    // Só quando o modal estiver aberto e o foco estiver dentro dele
    if (!modal.classList.contains("ativo")) return;
    if (!dentroDoModal(e.target)) return;

    // TAB = navegação padrão
    if (e.key === "Tab") return;

    // ESC = fechar modal
    if (e.key === "Escape") {
      e.preventDefault();
      if (typeof fecharModalPagamento === "function") fecharModalPagamento();
      return;
    }

    // F9 = encerrar
    if (e.key === "F9") {
      e.preventDefault();
      if (typeof encerrar === "function") encerrar();
      else console.warn("Função encerrar() não encontrada.");
      return;
    }

    // ENTER / SHIFT+ENTER
    if (e.key !== "Enter") return;

    // SHIFT+ENTER = voltar
    if (e.shiftKey) {
      e.preventDefault();
      const prev = campoAnterior(e.target);
      if (!prev) return;

      // se voltar para forma, abre a lista (fica bom no PDV)
      if (prev === forma1) return abrirDropdown(forma1, lista1);
      if (prev === forma2) return abrirDropdown(forma2, lista2);

      prev.focus();
      try { prev.select?.(); } catch (err) {}
      return;
    }

    // ENTER normal = avançar com regras
    // 1) Desconto -> Forma1 (abrindo lista)
    if (e.target === desconto) {
      e.preventDefault();
      return abrirDropdown(forma1, lista1);
    }

    // 2) Forma1 -> Valor1
    if (e.target === forma1) {
      // Se a lista está aberta, deixa o Enter selecionar primeiro
      if (listaAberta(lista1) && String(forma1.value || "").trim() === "") return;

      // avança após seleção
      e.preventDefault();
      valor1.focus();
      try { valor1.select?.(); } catch (err) {}
      return;
    }

    // 3) Valor1 -> (Forma2 se habilitado) senão -> Finalizar
    if (e.target === valor1) {
      e.preventDefault();
      if (!isDisabled(forma2)) return abrirDropdown(forma2, lista2);
      if (btnFinalizar) btnFinalizar.focus();
      return;
    }

    // 4) Forma2 -> Valor2
    if (e.target === forma2) {
      if (listaAberta(lista2) && String(forma2.value || "").trim() === "") return;

      e.preventDefault();
      valor2.focus();
      try { valor2.select?.(); } catch (err) {}
      return;
    }

    // 5) Valor2 -> Finalizar
    if (e.target === valor2) {
      e.preventDefault();
      if (btnFinalizar) btnFinalizar.focus();
      return;
    }

    // 6) Se estiver em algum outro elemento dentro do modal: segue ordem padrão
    e.preventDefault();
    const prox = proximoCampo(e.target);
    if (prox === forma1) return abrirDropdown(forma1, lista1);
    if (prox === forma2) return abrirDropdown(forma2, lista2);
    prox?.focus();
  });
}

function abrirModalPagamento() {
  const modal = document.getElementById("modalPagamento");
  const tdTotalCarrinho = document.getElementById("ftVlrTotal");

  const inputTotalCompra = document.getElementById("pag_total_compra");
  const inputDesconto = document.getElementById("desconto_compra");
  const inputTotalComDesconto = document.getElementById("pag_desconto_compra");

  const forma1 = document.getElementById("pag_forma1");

  if (!modal || !tdTotalCarrinho || !inputTotalCompra || !inputDesconto || !inputTotalComDesconto) {
    console.error("Elementos do modal de pagamento não encontrados.");
    return;
  }

  // garante que listeners do pagamento existam
  iniciarInteracoesPagamentoPDV();
  if (typeof window.__pdvClientePagamento_limpar === "function") window.__pdvClientePagamento_limpar();

  // Total do carrinho -> normaliza e formata
  const totalTxt = String(tdTotalCarrinho.textContent || "").trim() || "R$ 0,00";

  // Usa suas helpers globais (as que você já tem no arquivo)
  const totalNum = (typeof parseBRL === "function") ? parseBRL(totalTxt) : 0;
  const totalFmt = (typeof formatBRL === "function") ? formatBRL(totalNum) : totalTxt;

  // Preenche total e total com desconto (inicialmente igual)
  inputTotalCompra.value = totalFmt;
  inputDesconto.value = "";
  inputTotalComDesconto.value = totalFmt;

  // reseta e atualiza estado (mantém suas regras de habilitação)
  if (typeof window.__pdvPagamento_resetar === "function") window.__pdvPagamento_resetar();
  if (typeof window.__pdvPagamento_atualizar === "function") window.__pdvPagamento_atualizar();

  modal.classList.add("ativo");
  setTimeout(() => forma1?.focus(), 0);
}

/* =========================================================================================
   Helpers BRL (mesmo padrão robusto que você já usa)
   ========================================================================================= */

function parseBRL(valorTexto) {
  if (valorTexto === null || valorTexto === undefined) return 0;
  if (typeof valorTexto === "number") return Number.isFinite(valorTexto) ? valorTexto : 0;

  let s = String(valorTexto).trim();
  if (!s) return 0;

  s = s.replace(/\u00A0/g, " ");
  s = s.replace(/[Rr]\$\s*/g, "");
  s = s.replace(/\s/g, "");

  const lastComma = s.lastIndexOf(",");
  const lastDot = s.lastIndexOf(".");

  if (lastComma > -1 && lastDot > -1) {
    if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
    else s = s.replace(/,/g, "");
  } else if (lastComma > -1) {
    s = s.replace(/\./g, "").replace(",", ".");
  } else if (lastDot > -1) {
    const parts = s.split(".");
    if (parts.length > 2) {
      const dec = parts.pop();
      s = parts.join("") + "." + dec;
    }
    s = s.replace(/,/g, "");
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

function formatBRL(n) {
  const fmt = new Intl.NumberFormat("pt-BR", {
    style: "currency",
    currency: "BRL",
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(n) || 0);

  return fmt.replace(/\u00A0/g, " ");
}

// =================================================================================================
// FINALIZAR VENDA (PDV) - tudo no JS, GS só insere
// =================================================================================================
function encerrar() {
  const toast = {
    ok: (m) => (window.toastr ? toastr.success(m) : alert(m)),
    warn: (m) => (window.toastr ? toastr.warning(m) : alert(m)),
    err: (m) => (window.toastr ? toastr.error(m) : alert(m))
  };

  // -----------------------------
  // ELEMENTOS
  // -----------------------------
  const tbody = document.getElementById("tb_carrinho_corpo");
  const inputFilial = document.getElementById("inputFilial");

  // Campos do pagamento
  const pag_total_compra = document.getElementById("pag_total_compra");
  const desconto_compra = document.getElementById("desconto_compra");
  const pag_desconto_compra = document.getElementById("pag_desconto_compra");

  const pag_forma1 = document.getElementById("pag_forma1");
  const pag_valor1 = document.getElementById("pag_valor1");
  const pag_forma2 = document.getElementById("pag_forma2");
  const pag_valor2 = document.getElementById("pag_valor2");
  const pag_troco = document.getElementById("pag_troco");

  if (!tbody) return toast.err("Carrinho não encontrado (tb_carrinho_corpo).");
  if (!inputFilial) return toast.err("Campo de filial não encontrado (inputFilial).");

  // -----------------------------
  // HELPERS
  // -----------------------------
  function normalizaTexto(v) {
    return String(v || "")
      .trim()
      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  // BRL -> centavos (robusto)
  function parseBRLtoCents(v) {
    if (v === null || v === undefined) return 0;
    if (typeof v === "number") return Math.round((Number.isFinite(v) ? v : 0) * 100);

    let s = String(v).trim();
    if (!s) return 0;

    s = s.replace(/\u00A0/g, " ");
    s = s.replace(/[Rr]\$\s*/g, "");
    s = s.replace(/\s/g, "");

    const lastComma = s.lastIndexOf(",");
    const lastDot = s.lastIndexOf(".");

    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (lastComma > -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (lastDot > -1) {
      const parts = s.split(".");
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join("") + "." + dec;
      }
      s = s.replace(/,/g, "");
    }

    const n = Number(s);
    return Number.isFinite(n) ? Math.round(n * 100) : 0;
  }

  function centsToNumber(cents) {
    return (Number(cents) || 0) / 100;
  }

  // qtd pode vir "2", "2,5", etc
  function parseNumeroBR(v) {
    if (v === null || v === undefined) return 0;
    if (typeof v === "number") return Number.isFinite(v) ? v : 0;

    let s = String(v).trim();
    if (!s) return 0;

    s = s.replace(/\u00A0/g, " ");
    s = s.replace(/[R$\s]/g, "");

    const temVirgula = s.includes(",");
    const temPonto = s.includes(".");

    if (temVirgula && temPonto) s = s.replace(/\./g, "").replace(",", ".");
    else if (temVirgula && !temPonto) s = s.replace(",", ".");
    else if (!temVirgula && temPonto) {
      const parts = s.split(".");
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join("") + "." + dec;
      }
    }

    const n = parseFloat(s);
    return Number.isFinite(n) ? n : 0;
  }

  // data BR (usa hora local da máquina)
  function agoraBR() {
    const d = new Date();
    const pad = (x) => String(x).padStart(2, "0");
    const dd = pad(d.getDate());
    const mm = pad(d.getMonth() + 1);
    const yyyy = d.getFullYear();
    const hh = pad(d.getHours());
    const mi = pad(d.getMinutes());
    const ss = pad(d.getSeconds());
    return {
      data: `${dd}/${mm}/${yyyy}`,
      dataHora: `${dd}/${mm}/${yyyy} ${hh}:${mi}:${ss}`
    };
  }

  // -----------------------------
  // MAPAS (DE->PARA)
  // -----------------------------
  const mapaProdPorNome = new Map();
  (Array.isArray(itensProd) ? itensProd : []).forEach((p) => {
    const k = normalizaTexto(p?.nome);
    if (k && !mapaProdPorNome.has(k)) mapaProdPorNome.set(k, p);
  });

  const mapaFilPorNome = new Map();
  (Array.isArray(itensFil) ? itensFil : []).forEach((f) => {
    const k = normalizaTexto(f?.nome);
    if (k && !mapaFilPorNome.has(k)) mapaFilPorNome.set(k, f);
  });

  // codigoprod -> lista de saídas
  const mapaSaidasPorProd = new Map();
  (Array.isArray(itensSaida) ? itensSaida : []).forEach((s) => {
    const k = String(s?.codigoprod || "").trim();
    if (!k) return;
    if (!mapaSaidasPorProd.has(k)) mapaSaidasPorProd.set(k, []);
    mapaSaidasPorProd.get(k).push(s);
  });

  // -----------------------------
  // 4) FILIAL NOME -> CÓDIGO
  // -----------------------------
  const nomeFilial = String(inputFilial.value || "").trim();
  if (!nomeFilial) return toast.warn("Selecione uma filial antes de finalizar.");

  const filObj = mapaFilPorNome.get(normalizaTexto(nomeFilial));
  if (!filObj) return toast.err(`Filial não encontrada no cadastro: "${nomeFilial}"`);

  const codigoFilial = String(filObj.codigo || "").trim();
  if (!codigoFilial) return toast.err("Código da filial inválido no cadastro.");

  // -----------------------------
  // 1) LER CARRINHO (COL 1..4) + DE->PARA NOME->CÓDIGO
  // -----------------------------
  const trs = Array.from(tbody.querySelectorAll("tr"));
  if (trs.length === 0) return toast.warn("Carrinho vazio.");

  const vendidos = [];
  for (const tr of trs) {
    const tds = tr.querySelectorAll("td");
    if (tds.length < 4) continue;

    const nome = String(tds[0].textContent || "").trim();
    const qtd = parseInt(String(tds[1].textContent || "").trim(), 10);

    const unitCents = parseBRLtoCents(tds[2].textContent || "");
    let totalCents = parseBRLtoCents(tds[3].textContent || "");

    if (!nome || !Number.isFinite(qtd) || qtd <= 0) continue;

    const prod = mapaProdPorNome.get(normalizaTexto(nome));
    if (!prod) return toast.err(`Produto não encontrado no cadastro: "${nome}"`);

    if (!totalCents && unitCents) totalCents = unitCents * qtd;

    vendidos.push({
      soldIndex: vendidos.length,
      nome,
      codigo: String(prod.codigo || "").trim(),
      qtd,
      totalBrutoCents: totalCents
    });
  }

  if (vendidos.length === 0) return toast.warn("Nenhum item válido no carrinho.");

  const totalBrutoCarrinhoCents = vendidos.reduce((a, b) => a + (b.totalBrutoCents || 0), 0);
  if (totalBrutoCarrinhoCents <= 0) return toast.warn("Total do carrinho inválido.");

  // -----------------------------
  // 5) CAMPOS DO PAGAMENTO
  // -----------------------------
  const totalCompraCents = parseBRLtoCents(pag_total_compra?.value || "");
  const descontoCents = parseBRLtoCents(desconto_compra?.value || "");
  const totalComDescontoCentsCampo = parseBRLtoCents(pag_desconto_compra?.value || "");

  const totalBaseCents = totalCompraCents > 0 ? totalCompraCents : totalBrutoCarrinhoCents;
  const totalComDescontoCents =
    totalComDescontoCentsCampo > 0 ? totalComDescontoCentsCampo : Math.max(0, totalBaseCents - descontoCents);

  if (descontoCents > totalBaseCents) {
    return toast.warn("Desconto não pode ser maior que o total da compra.");
  }

  const forma1 = String(pag_forma1?.value || "").trim();
  const forma2 = String(pag_forma2?.value || "").trim();
  const valor1Cents = parseBRLtoCents(pag_valor1?.value || "");
  const valor2Cents = parseBRLtoCents(pag_valor2?.value || "");
  const trocoCents = parseBRLtoCents(pag_troco?.value || "");

  // -----------------------------
  // 3) DESCONTO PONDERADO (1º nível: entre produtos vendidos)
  // -----------------------------
  const descPorProduto = new Array(vendidos.length).fill(0);

  if (descontoCents > 0) {
    let resto = descontoCents;
    for (let i = 0; i < vendidos.length; i++) {
      const v = vendidos[i];
      if (i === vendidos.length - 1) {
        descPorProduto[i] = resto;
      } else {
        const parte = Math.round(descontoCents * (v.totalBrutoCents / totalBrutoCarrinhoCents));
        descPorProduto[i] = parte;
        resto -= parte;
      }
    }
  }

  vendidos.forEach((v, i) => {
    v.descCents = descPorProduto[i] || 0;
    v.totalLiquidoCents = Math.max(0, v.totalBrutoCents - v.descCents);
  });

  // -----------------------------
  // 2 + 3) MOVIMENTAÇÕES DE ESTOQUE (com desconto ponderado 2º nível)
  // -----------------------------
  const movimentos = [];

for (const v of vendidos) {
  const listaSaidas = mapaSaidasPorProd.get(v.codigo) || [];

  // fallback: se não existir mapeamento, trata como "o próprio produto sai"
  const saidas = (listaSaidas.length > 0)
    ? listaSaidas
    : [{ codigosaida: v.codigo, qtd: 1, preco: centsToNumber(v.totalLiquidoCents / v.qtd) }];

  const comps = [];

  for (const s of saidas) {
    const codSaida = String(s?.codigosaida || "").trim();
    if (!codSaida) continue;

    // qtd de saída por 1 unidade vendida
    const qtdSaidaBase = parseNumeroBR(s?.qtd);
    const qtdSaidaBaseOk = (Number.isFinite(qtdSaidaBase) && qtdSaidaBase > 0) ? qtdSaidaBase : 1;

    // quantidade TOTAL que sai do estoque = qtdSaidaBase * qtdVendida
    const qtdTotalSaida = qtdSaidaBaseOk * v.qtd;

    // preço unitário de saída
    const precoUnitCents = parseBRLtoCents(s?.preco);

    // ✅ VALOR TOTAL = qtdTotalSaida * preçoUnitário
    const valorTotalCents = Math.round(qtdTotalSaida * (precoUnitCents > 0 ? precoUnitCents : 0));

    comps.push({
      soldIndex: v.soldIndex,
      codigosaida: codSaida,
      qtd: qtdTotalSaida,
      valorTotalCents,
      valorUnitarioCents: precoUnitCents > 0 ? precoUnitCents : 0
    });
  }

  // Se por algum motivo não montou nada, fallback simples
  if (comps.length === 0) {
    comps.push({
      soldIndex: v.soldIndex,
      codigosaida: v.codigo,
      qtd: v.qtd,
      valorTotalCents: v.totalLiquidoCents,
      valorUnitarioCents: v.qtd > 0 ? Math.round(v.totalLiquidoCents / v.qtd) : 0
    });
  }

  // 2º nível: distribui desconto do produto vendido entre suas saídas
  const somaValorComp = comps.reduce((acc, c) => acc + (c.valorTotalCents || 0), 0);

  if (v.descCents > 0 && somaValorComp > 0) {
    let resto = v.descCents;

    for (let i = 0; i < comps.length; i++) {
      const c = comps[i];
      let descComp = 0;

      if (i === comps.length - 1) {
        descComp = resto;
      } else {
        descComp = Math.round(v.descCents * ((c.valorTotalCents || 0) / somaValorComp));
        resto -= descComp;
      }

      c.valorTotalCents = Math.max(0, (c.valorTotalCents || 0) - descComp);
    }
  }

  comps.forEach(c => {
    c.valorUnitarioCents = c.qtd > 0 ? Math.round((c.valorTotalCents || 0) / c.qtd) : 0;
  });

  comps.forEach(c => movimentos.push(c));
}

  // -----------------------------
  // PAYLOAD FINAL
  // -----------------------------
  const { data, dataHora } = agoraBR();

  const payload = {
    carrinho: {
      idCliente: clienteSelecionadoPDV ? String(clienteSelecionadoPDV.idCliente || "").trim() : "",
      total: centsToNumber(totalBaseCents),
      desconto: centsToNumber(descontoCents),
      totalComDesconto: centsToNumber(totalComDescontoCents),
      forma1,
      valor1: centsToNumber(valor1Cents),
      forma2,
      valor2: centsToNumber(valor2Cents),
      troco: centsToNumber(trocoCents),
      filial: codigoFilial,
      dataHora
    },

    // VENDA_PRODUTO: valor = total do item após desconto ponderado
    produtos: vendidos.map((v) => ({
      soldIndex: v.soldIndex,
      codigoprod: v.codigo,
      valor: centsToNumber(v.totalLiquidoCents),
      qtd: v.qtd
    })),

    // EST_MOVIMENTACOES: valor = preço total do componente após ponderações
    movimentos: movimentos.map((m) => ({
      soldIndex: m.soldIndex,
      codigosaida: m.codigosaida,
      qtd: Number(m.qtd || 0),
      valor: centsToNumber(m.valorUnitarioCents || 0),
      filial: codigoFilial,
      tipomov: "SAÍDA VENDA",
      dataMov: data,
      dataHora
    }))
  };

  // -----------------------------
  // CHAMA GS
  // -----------------------------
  const run = obterGoogleRunCaixa();

  if (!run || !run.salvarVendaPDV) {
    if (!caixaEstaOnline()) return salvarVendaOfflineCaixa(payload);
    return toast.err("Backend não encontrado: salvarVendaPDV().");
  }

  if (!caixaEstaOnline()) {
    return salvarVendaOfflineCaixa(payload);
  }

  if (typeof mostrarCarregamentoModal === "function") mostrarCarregamentoModal();

  run
    .withSuccessHandler((resp) => {
      if (!resp || !resp.sucesso) {
        if (typeof esconderCarregamentoModal === "function") esconderCarregamentoModal();
        return toast.err(resp?.mensagem || "Erro ao salvar venda.");
      }

      atualizarDadosCaixaAposVenda((ok) => {
        if (typeof esconderCarregamentoModal === "function") esconderCarregamentoModal();

        if (!ok) {
          toast.warn("Venda salva, mas não foi possível atualizar os dados da tela automaticamente.");
          return;
        }

        limparVendaAposFinalizarCaixa();
        toast.ok(`Venda salva com sucesso! Carrinho #${resp.idCarrinho}`);
        dispararAtualizacaoDashboardAnaliticoCaixa(resp.idCarrinho);
      });
    })
    .withFailureHandler((err) => {
      if (typeof esconderCarregamentoModal === "function") esconderCarregamentoModal();
      console.error(err);

      if (!caixaEstaOnline()) {
        salvarVendaOfflineCaixa(payload);
        return;
      }

      toast.err("Erro no Apps Script ao salvar venda.");
    })
    .salvarVendaPDV(payload);
}
