<script>


// ==========================================================================================================================================
// VARIÁVEIS GLOBAIS
// ==========================================================================================================================================

let todosprodutos = [];
let todasfilais = [];

// Timeout para controlar o debounce da pesquisa
let timeoutId = null;

// Armazena a referência da linha selecionada na tabela
let linhaSelecionada = null;

let clienteSelecionadoPDV = null;

let sincronizandoFilaOfflineCaixa = false;
let dadosConsultaCaixaCarregados = false;

const CAIXA_OFFLINE_DB = "InsightPad_Caixa_Offline";
const CAIXA_OFFLINE_DB_VERSION = 1;
const CAIXA_OFFLINE_STORE_SNAPSHOT = "snapshot";
const CAIXA_OFFLINE_STORE_FILA = "filaVendas";

const CaixaOfflineDB = (() => {
  function abrir() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error("IndexedDB indisponível neste navegador."));
        return;
      }

      const req = indexedDB.open(CAIXA_OFFLINE_DB, CAIXA_OFFLINE_DB_VERSION);

      req.onupgradeneeded = (ev) => {
        const db = ev.target.result;

        if (!db.objectStoreNames.contains(CAIXA_OFFLINE_STORE_SNAPSHOT)) {
          db.createObjectStore(CAIXA_OFFLINE_STORE_SNAPSHOT, { keyPath: "id" });
        }

        if (!db.objectStoreNames.contains(CAIXA_OFFLINE_STORE_FILA)) {
          const fila = db.createObjectStore(CAIXA_OFFLINE_STORE_FILA, { keyPath: "idLocal" });
          fila.createIndex("criadoEm", "criadoEm", { unique: false });
          fila.createIndex("status", "status", { unique: false });
        }
      };

      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error("Falha ao abrir armazenamento offline."));
    });
  }

  function transacao(storeName, mode, executor) {
    return abrir().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(storeName, mode);
      const store = tx.objectStore(storeName);
      let resultado;

      tx.oncomplete = () => {
        db.close();
        resolve(resultado);
      };
      tx.onerror = () => {
        db.close();
        reject(tx.error || new Error("Falha na transação offline."));
      };

      resultado = executor(store);
    }));
  }

  return {
    salvarSnapshot(dados) {
      return transacao(CAIXA_OFFLINE_STORE_SNAPSHOT, "readwrite", (store) => {
        store.put({ id: "caixa", atualizadoEm: new Date().toISOString(), dados });
      });
    },

    carregarSnapshot() {
      return abrir().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(CAIXA_OFFLINE_STORE_SNAPSHOT, "readonly");
        const store = tx.objectStore(CAIXA_OFFLINE_STORE_SNAPSHOT);
        const req = store.get("caixa");

        req.onsuccess = () => resolve(req.result ? req.result.dados : null);
        req.onerror = () => reject(req.error || new Error("Falha ao carregar snapshot offline."));
        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      }));
    },

    adicionarVenda(payload) {
      const registro = {
        idLocal: gerarIdLocalVendaOfflineCaixa(),
        criadoEm: new Date().toISOString(),
        status: "PENDENTE",
        tentativas: 0,
        payload
      };

      return transacao(CAIXA_OFFLINE_STORE_FILA, "readwrite", (store) => {
        store.put(registro);
      }).then(() => registro);
    },

    listarPendencias() {
      return abrir().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(CAIXA_OFFLINE_STORE_FILA, "readonly");
        const store = tx.objectStore(CAIXA_OFFLINE_STORE_FILA);
        const req = store.getAll();

        req.onsuccess = () => {
          const lista = Array.isArray(req.result) ? req.result : [];
          resolve(lista
            .filter(item => item && item.status !== "SINCRONIZADO")
            .sort((a, b) => String(a.criadoEm || "").localeCompare(String(b.criadoEm || ""))));
        };
        req.onerror = () => reject(req.error || new Error("Falha ao listar pendências offline."));
        tx.oncomplete = () => db.close();
        tx.onerror = () => db.close();
      }));
    },

    removerVenda(idLocal) {
      return transacao(CAIXA_OFFLINE_STORE_FILA, "readwrite", (store) => {
        store.delete(idLocal);
      });
    },

    marcarErro(idLocal, mensagem) {
      return abrir().then((db) => new Promise((resolve, reject) => {
        const tx = db.transaction(CAIXA_OFFLINE_STORE_FILA, "readwrite");
        const store = tx.objectStore(CAIXA_OFFLINE_STORE_FILA);
        const req = store.get(idLocal);

        req.onsuccess = () => {
          const item = req.result;
          if (item) {
            item.status = "ERRO";
            item.tentativas = Number(item.tentativas || 0) + 1;
            item.ultimoErro = mensagem || "Erro ao sincronizar.";
            item.atualizadoEm = new Date().toISOString();
            store.put(item);
          }
        };
        req.onerror = () => reject(req.error || new Error("Falha ao atualizar pendência offline."));
        tx.oncomplete = () => {
          db.close();
          resolve();
        };
        tx.onerror = () => {
          db.close();
          reject(tx.error || new Error("Falha ao marcar erro offline."));
        };
      }));
    }
  };
})();

function gerarIdLocalVendaOfflineCaixa() {
  const rnd = Math.random().toString(36).slice(2, 10);
  return `PDV-${Date.now()}-${rnd}`;
}

function caixaEstaOnline() {
  return navigator.onLine !== false;
}

function obterGoogleRunCaixa() {
  return (typeof google !== "undefined" && google.script && google.script.run) ? google.script.run : null;
}

function dispararAtualizacaoDashboardAnaliticoCaixa(idCarrinho) {
  const run = obterGoogleRunCaixa();
  if (!run || !run.atualizarDashboardAnaliticoSegundoPlano || !idCarrinho) return;

  run
    .withFailureHandler((err) => {
      console.warn("Atualizacao analitica de venda nao concluida em segundo plano.", err);
    })
    .atualizarDashboardAnaliticoSegundoPlano("VENDA", idCarrinho, "REPROCESSAR");
}

function montarSnapshotCaixaAtual() {
  return {
    itensProd: Array.isArray(itensProd) ? itensProd : [],
    itensSaida: Array.isArray(itensSaida) ? itensSaida : [],
    itensFil: Array.isArray(itensFil) ? itensFil : [],
    itensEst: Array.isArray(itensEst) ? itensEst : [],
    itensPromo: Array.isArray(itensPromo) ? itensPromo : [],
    itensCli: Array.isArray(itensCli) ? itensCli : [],
    resumoClientesVenda: resumoClientesVenda || {}
  };
}

function salvarSnapshotCaixaAtual() {
  return CaixaOfflineDB.salvarSnapshot(montarSnapshotCaixaAtual()).catch((err) => {
    console.warn("Não foi possível salvar snapshot offline do Caixa.", err);
  });
}

function atualizarIndicadorOfflineCaixa() {
  const box = document.getElementById("pdv_offline_box");
  const statusConexao = document.getElementById("pdv_status_conexao");
  const statusPendencias = document.getElementById("pdv_status_pendencias");
  const btnSync = document.getElementById("btnResincronizarPDV");

  return CaixaOfflineDB.listarPendencias()
    .then((pendencias) => {
      const qtd = pendencias.length;
      const online = caixaEstaOnline();

      if (statusConexao) {
        statusConexao.textContent = sincronizandoFilaOfflineCaixa ? "SINCRONIZANDO" : (online ? "ONLINE" : "OFFLINE");
      }

      if (statusPendencias) {
        statusPendencias.textContent = `${qtd} ${qtd === 1 ? "PENDÊNCIA" : "PENDÊNCIAS"}`;
      }

      if (box) {
        box.classList.toggle("online", online && qtd === 0 && !sincronizandoFilaOfflineCaixa);
        box.classList.toggle("offline", !online || qtd > 0);
        box.classList.toggle("sincronizando", sincronizandoFilaOfflineCaixa);
      }

      document.body.classList.toggle("pdv-offline", !online);

      if (btnSync) {
        btnSync.disabled = !online || qtd === 0 || sincronizandoFilaOfflineCaixa;
        btnSync.classList.toggle("sincronizando", sincronizandoFilaOfflineCaixa);
      }
    })
    .catch((err) => {
      console.warn("Falha ao atualizar indicador offline.", err);
    });
}

function bloquearNavegacaoOfflineCaixa() {
  document.addEventListener("click", (ev) => {
    if (caixaEstaOnline()) return;

    const alvo = ev.target.closest("a[href], #btnGerenciarAcessosCabecalho, #btnLogoutCabecalho, button[data-page], [data-navegar]");
    if (!alvo) return;

    const dentroCaixa = alvo.id === "btnResincronizarPDV";
    if (dentroCaixa) return;

    ev.preventDefault();
    ev.stopPropagation();

    if (window.toastr) {
      toastr.warning("Você está offline. Finalize as vendas pendentes antes de sair do Caixa.");
    }
  }, true);
}

function salvarVendaOfflineCaixa(payload) {
  return CaixaOfflineDB.adicionarVenda(payload)
    .then((registro) => {
      if (Array.isArray(itensEst) && Array.isArray(payload?.movimentos)) {
        payload.movimentos.forEach((m) => {
          itensEst.push({
            codigoprod: String(m?.codigosaida || "").trim(),
            tipomov: String(m?.tipomov || "SAÍDA VENDA").trim(),
            qtd: String(m?.qtd || "").trim(),
            filial: String(m?.filial || "").trim(),
            status: "S"
          });
        });
      }

      salvarSnapshotCaixaAtual();
      limparVendaAposFinalizarCaixa();
      atualizarIndicadorOfflineCaixa();

      if (window.toastr) {
        toastr.warning(`Venda salva na fila offline (${registro.idLocal}). Resincronize quando a internet voltar.`);
      }
    })
    .catch((err) => {
      console.error(err);
      if (window.toastr) toastr.error("Não foi possível gravar a venda na fila offline.");
    });
}

function sincronizarPendenciasOfflineCaixa(manual = false) {
  if (sincronizandoFilaOfflineCaixa) return;

  if (!caixaEstaOnline()) {
    if (manual && window.toastr) toastr.warning("Sem internet para resincronizar agora.");
    atualizarIndicadorOfflineCaixa();
    return;
  }

  CaixaOfflineDB.listarPendencias()
    .then((pendencias) => {
      if (!pendencias.length) {
        if (manual && window.toastr) toastr.info("Não há vendas pendentes para sincronizar.");
        atualizarIndicadorOfflineCaixa();
        return;
      }

      const run = obterGoogleRunCaixa();

      if (!run || !run.sincronizarVendasOfflineCaixa) {
        if (window.toastr) toastr.error("Backend de resincronização não encontrado.");
        return;
      }

      sincronizandoFilaOfflineCaixa = true;
      atualizarIndicadorOfflineCaixa();
      if (typeof mostrarCarregamentoModal === "function") mostrarCarregamentoModal();

      const lote = pendencias.map((item) => ({
        idLocal: item.idLocal,
        payload: item.payload
      }));

      run
        .withSuccessHandler((resp) => {
          const resultados = Array.isArray(resp?.resultados) ? resp.resultados : [];
          const operacoes = resultados.map((r) => {
            if (r && r.sucesso) return CaixaOfflineDB.removerVenda(r.idLocal);
            return CaixaOfflineDB.marcarErro(r?.idLocal, r?.mensagem || "Erro ao sincronizar venda.");
          });

          Promise.allSettled(operacoes).then(() => {
            sincronizandoFilaOfflineCaixa = false;
            if (typeof esconderCarregamentoModal === "function") esconderCarregamentoModal();
            atualizarIndicadorOfflineCaixa();

            const sincronizadas = resultados.filter(r => r && r.sucesso).length;
            const comErro = resultados.length - sincronizadas;

            if (sincronizadas > 0) {
              atualizarDadosCaixaAposVenda(() => {
                if (comErro > 0) {
                  if (window.toastr) toastr.warning(`${sincronizadas} venda(s) sincronizada(s). ${comErro} pendência(s) ficaram com erro.`);
                } else if (window.toastr) {
                  toastr.success(`${sincronizadas} venda(s) offline sincronizada(s) com sucesso.`);
                }
                resultados
                  .filter(r => r && r.sucesso && r.idCarrinho)
                  .forEach(r => dispararAtualizacaoDashboardAnaliticoCaixa(r.idCarrinho));
              });
            } else if (window.toastr) {
              toastr.error(resp?.mensagem || "Nenhuma venda pendente foi sincronizada.");
            }
          });
        })
        .withFailureHandler((err) => {
          console.error(err);
          sincronizandoFilaOfflineCaixa = false;
          if (typeof esconderCarregamentoModal === "function") esconderCarregamentoModal();
          atualizarIndicadorOfflineCaixa();
          if (window.toastr) toastr.error("Erro ao resincronizar vendas offline.");
        })
        .sincronizarVendasOfflineCaixa(lote);
    })
    .catch((err) => {
      console.error(err);
      if (manual && window.toastr) toastr.error("Não foi possível ler a fila offline.");
      atualizarIndicadorOfflineCaixa();
    });
}

function inicializarCaixaOffline() {
  bloquearNavegacaoOfflineCaixa();
  salvarSnapshotCaixaAtual();
  atualizarIndicadorOfflineCaixa();

  const btnSync = document.getElementById("btnResincronizarPDV");
  if (btnSync) {
    btnSync.addEventListener("click", () => sincronizarPendenciasOfflineCaixa(true));
  }

  window.addEventListener("online", () => {
    if (window.toastr) toastr.info("Conexão restabelecida. Verificando pendências do Caixa.");
    atualizarIndicadorOfflineCaixa();
    sincronizarPendenciasOfflineCaixa(false);
  });

  window.addEventListener("offline", () => {
    if (window.toastr) toastr.warning("Conexão perdida. O Caixa continuará registrando vendas na fila offline.");
    atualizarIndicadorOfflineCaixa();
  });

  if (!caixaEstaOnline()) {
    CaixaOfflineDB.carregarSnapshot()
      .then((snapshot) => {
        if (snapshot) {
          reaplicarDadosCaixaAtualizados({ sucesso: true, ...snapshot });
          if (window.toastr) toastr.info("Dados locais do Caixa carregados para operação offline.");
        }
      })
      .catch((err) => console.warn("Não foi possível carregar snapshot offline do Caixa.", err))
      .finally(() => atualizarIndicadorOfflineCaixa());
  } else {
    sincronizarPendenciasOfflineCaixa(false);
  }
}

const inputProduto = document.getElementById('inputProduto');

function normalizarTextoCaixa(valor) {
  return String(valor || '')
    .trim()
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '');
}

function parseNumeroCaixa(valor) {
  if (valor === null || valor === undefined) return 0;
  if (typeof valor === 'number') return Number.isFinite(valor) ? valor : 0;

  let s = String(valor).trim();
  if (!s) return 0;

  s = s.replace(/\u00A0/g, ' ');
  s = s.replace(/[Rr]\$\s*/g, '');
  s = s.replace(/\s/g, '');

  const lastComma = s.lastIndexOf(',');
  const lastDot = s.lastIndexOf('.');

  if (lastComma > -1 && lastDot > -1) {
    if (lastComma > lastDot) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else if (lastComma > -1) {
    s = s.replace(/\./g, '').replace(',', '.');
  } else if (lastDot > -1) {
    const parts = s.split('.');
    if (parts.length > 2) {
      const dec = parts.pop();
      s = parts.join('') + '.' + dec;
    }
  }

  const n = Number(s);
  return Number.isFinite(n) ? n : 0;
}

let mapaPromocaoCaixa = null;

function obterMapaPromocaoCaixa() {
  if (mapaPromocaoCaixa) return mapaPromocaoCaixa;

  mapaPromocaoCaixa = new Map();
  (Array.isArray(itensPromo) ? itensPromo : []).forEach(promo => {
    const id = String(promo?.idPromocao || '').trim();
    if (id && !mapaPromocaoCaixa.has(id)) mapaPromocaoCaixa.set(id, promo);
  });

  return mapaPromocaoCaixa;
}

function obterPrecoVendaProdutoCaixa(prod) {
  const emPromocao = normalizarTextoCaixa(prod?.emPromocao) === 'sim';
  const idPromocao = String(prod?.idPromocaoVigente || '').trim();

  if (emPromocao && idPromocao) {
    const promo = obterMapaPromocaoCaixa().get(idPromocao);
    const statusPromo = String(promo?.status || '').trim();
    const precoPromo = parseNumeroCaixa(promo?.precoPromocao);

    if (promo && statusPromo === '2' && precoPromo > 0) return precoPromo;
  }

  return parseNumeroCaixa(prod?.preco);
}

function somenteDigitosCaixa(valor) {
  return String(valor || '').replace(/\D/g, '');
}

function aplicarMascaraCPFCaixaValor(valor) {
  const v = somenteDigitosCaixa(valor).slice(0, 11);
  return v
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d)/, '$1.$2')
    .replace(/(\d{3})(\d{1,2})$/, '$1-$2');
}

function calcularIdadeClienteCaixa(dataNascimento) {
  const texto = String(dataNascimento || '').trim();
  if (!texto) return '';

  let dia, mes, ano;

  const br = texto.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  const iso = texto.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);

  if (br) {
    dia = Number(br[1]);
    mes = Number(br[2]);
    ano = Number(br[3]);
  } else if (iso) {
    ano = Number(iso[1]);
    mes = Number(iso[2]);
    dia = Number(iso[3]);
  } else {
    return '';
  }

  const nasc = new Date(ano, mes - 1, dia);
  if (Number.isNaN(nasc.getTime()) || nasc > new Date()) return '';

  const hoje = new Date();
  let idade = hoje.getFullYear() - nasc.getFullYear();
  const antesAniversario =
    hoje.getMonth() < nasc.getMonth() ||
    (hoje.getMonth() === nasc.getMonth() && hoje.getDate() < nasc.getDate());

  if (antesAniversario) idade--;
  return idade >= 0 ? String(idade) : '';
}

function obterResumoClienteCaixa(idCliente) {
  const resumo = (resumoClientesVenda && resumoClientesVenda[String(idCliente || '').trim()]) || {};
  return {
    qtdCompras: Number(resumo.qtdCompras || 0),
    totalCompras: Number(resumo.totalCompras || 0)
  };
}

function reaplicarDadosCaixaAtualizados(resp) {
  if (!resp || !resp.sucesso) return false;

  itensProd = Array.isArray(resp.itensProd) ? resp.itensProd : [];
  itensSaida = Array.isArray(resp.itensSaida) ? resp.itensSaida : [];
  itensFil = Array.isArray(resp.itensFil) ? resp.itensFil : [];
  itensEst = Array.isArray(resp.itensEst) ? resp.itensEst : [];
  itensPromo = Array.isArray(resp.itensPromo) ? resp.itensPromo : [];
  itensCli = Array.isArray(resp.itensCli) ? resp.itensCli : [];
  resumoClientesVenda = resp.resumoClientesVenda || {};

  mapaPromocaoCaixa = null;

  const novosProdutos = itensProd
    .filter(item => item && item.nome && item.nome.trim() !== '')
    .map(item => item.nome);

  const novasFiliais = itensFil
    .filter(item => item && item.nome && item.nome.trim() !== '')
    .map(item => item.nome);

  todosprodutos.length = 0;
  todosprodutos.push(...novosProdutos);

  todasfilais.length = 0;
  todasfilais.push(...novasFiliais);

  if (typeof window.__pdvClientePagamento_recarregarClientes === "function") {
    window.__pdvClientePagamento_recarregarClientes();
  }

  if (typeof window.__pdvRecalcularSaldoPorFilialAtual === "function") {
    window.__pdvRecalcularSaldoPorFilialAtual();
  }

  return true;
}

function aplicarDadosConsultaCaixa(resp) {
  if (!resp || !resp.sucesso) return false;

  itensEst = Array.isArray(resp.itensEst) ? resp.itensEst : [];
  itensCli = Array.isArray(resp.itensCli) ? resp.itensCli : [];
  resumoClientesVenda = resp.resumoClientesVenda || {};
  dadosConsultaCaixaCarregados = true;

  if (typeof window.__pdvClientePagamento_recarregarClientes === "function") {
    window.__pdvClientePagamento_recarregarClientes();
  }

  if (typeof window.__pdvRecalcularSaldoPorFilialAtual === "function") {
    window.__pdvRecalcularSaldoPorFilialAtual();
  }

  salvarSnapshotCaixaAtual();
  return true;
}

function carregarDadosConsultaCaixaPosRender() {
  if (!caixaEstaOnline()) return;

  const run = obterGoogleRunCaixa();
  if (!run || !run.buscarDadosConsultaCaixa) return;

  run
    .withSuccessHandler((resp) => {
      const ok = aplicarDadosConsultaCaixa(resp);
      if (!ok && window.toastr) toastr.warning(resp?.mensagem || "Nao foi possivel carregar dados de consulta do Caixa.");
    })
    .withFailureHandler((err) => {
      console.error(err);
      if (window.toastr) toastr.warning("Nao foi possivel carregar os dados de consulta do Caixa.");
    })
    .buscarDadosConsultaCaixa();
}

function limparVendaAposFinalizarCaixa() {
  const tbody = document.getElementById("tb_carrinho_corpo");
  const ftTotal = document.getElementById("ftVlrTotal");
  const campos = [
    "inputEAN",
    "inputCodigo",
    "inputProduto",
    "inputQtdEstoque",
    "inputQuantidade",
    "inputValorUnitario",
    "inputValorTotal"
  ];

  if (tbody) tbody.innerHTML = "";
  if (ftTotal) ftTotal.textContent = "R$ 0,00";

  campos.forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });

  if (typeof fecharModalPagamento === "function") fecharModalPagamento();
}

function cancelarItemCaixa() {
  const camposProduto = [
    "inputEAN",
    "inputCodigo",
    "inputProduto",
    "inputQtdEstoque",
    "inputQuantidade",
    "inputValorUnitario",
    "inputValorTotal"
  ];

    const campo = document.getElementById(id);
    if (campo) campo.value = "";

    listaProduto.innerHTML = "";

  const inputEAN = document.getElementById("inputEAN");

}

function limparCarrinhoCaixa() {
  const tbody = document.getElementById("tb_carrinho_corpo");
  const ftTotal = document.getElementById("ftVlrTotal");

  if (tbody) tbody.innerHTML = "";

}

// FUNÇÃO QUE BLOQUEIA A TELA CASO A FILIAL NÃO SEJA INSERIDA
// ===============================================================================================================================================================================================
function iniciarBloqueioPorFilialPDV() {
  if (window.__pdv_bloqueio_filial_iniciado) return;
  window.__pdv_bloqueio_filial_iniciado = true;

  const inputFilial = document.getElementById("inputFilial");
  const areaConteudo = document.getElementById("pdv_content");

  if (!inputFilial || !areaConteudo) {
    console.error("PDV: inputFilial ou pdv_content não encontrado.");
    return;
  }

  const toastWarn = (msg) => (window.toastr ? toastr.warning(msg) : alert(msg));

  // Campos/botões que serão bloqueados (não inclui inputFilial nem btnVoltar)
  const idsParaBloquear = [
    "inputEAN",
    "inputCodigo",
    "inputProduto",
    "inputQuantidade",
    "btnCancelarItem",
    "btnIncluirItem",
    "btnLimparCarrinho",
    "btnIrPagamento",
  ];

  const elementos = idsParaBloquear
    .map((id) => document.getElementById(id))
    .filter(Boolean);

  // Guarda o estado original (pra restaurar depois)
  const estadoOriginalDisabled = new Map();
  elementos.forEach((el) => estadoOriginalDisabled.set(el, !!el.disabled));

  // Cria overlay (sem precisar mexer no HTML)
  let overlay = document.getElementById("pdv_lock_overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "pdv_lock_overlay";
    overlay.innerHTML = `
      <div class="pdv-lock-box">
        <i class="bi bi-shop"></i>
        <span>Selecione a filial para iniciar o PDV</span>
      </div>
    `;
    areaConteudo.appendChild(overlay);

    overlay.addEventListener("click", () => {
      toastWarn("Selecione a filial para iniciar o PDV.");
      inputFilial.focus();
      try { inputFilial.select(); } catch (e) {}
    });
  }

  function filialOk() {
    return String(inputFilial.value || "").trim() !== "";
  }

  function aplicarBloqueio() {
    const bloquear = !filialOk();

    // overlay por cima do conteúdo
    overlay.style.display = bloquear ? "flex" : "none";

    // desabilita/restaura campos e botões
    elementos.forEach((el) => {
      el.disabled = bloquear ? true : estadoOriginalDisabled.get(el);
    });

    // Fecha dropdown de produto se estiver aberto
    if (bloquear) {
      const listaProduto = document.getElementById("listaProduto");
      if (listaProduto) listaProduto.style.display = "none";
    }
  }

  // Reage quando o usuário seleciona/digita filial
  inputFilial.addEventListener("input", aplicarBloqueio);
  inputFilial.addEventListener("change", aplicarBloqueio);
  inputFilial.addEventListener("blur", aplicarBloqueio);

  // Estado inicial
  aplicarBloqueio();
}

function habilitarDesbloqueioAoSelecionarFilial() {
  const inputFilial = document.getElementById('inputFilial');
  const listaFilial = document.getElementById('listaFilial');
  const overlay = document.getElementById('pdv_lock_overlay');

  if (!inputFilial || !listaFilial || !overlay) return;

  // ✅ Ajuste aqui quais elementos devem ser bloqueados
  const elementosParaBloquear = [
    '#inputEAN',
    '#inputCodigo',
    '#inputProduto',
    '#inputQuantidade',
    '#btnCancelarItem',
    '#btnIncluirItem',
    '#btnLimparCarrinho',
    '#btnIrPagamento'
  ];

  function setBloqueio(bloqueado) {
    // blur
    overlay.style.display = bloqueado ? 'flex' : 'none';

    // desabilita/habilita campos e botões
    elementosParaBloquear.forEach(sel => {
      const el = document.querySelector(sel);
      if (!el) return;

      // inputs / buttons
      if ('disabled' in el) el.disabled = bloqueado;

      // opcional: trava clique mesmo se algum elemento não tiver disabled
      el.style.pointerEvents = bloqueado ? 'none' : '';
      el.style.userSelect = bloqueado ? 'none' : '';
    });

    // se bloqueou, força foco na filial
    if (bloqueado) {
      setTimeout(() => {
        try { inputFilial.focus(); } catch (e) {}
      }, 0);
    }
  }

  function atualizarLock() {
    const temFilial = String(inputFilial.value || '').trim() !== '';
    setBloqueio(!temFilial);
  }

  // ✅ Clique em uma opção da lista -> some o blur imediatamente
  listaFilial.addEventListener('click', (e) => {
    const li = e.target.closest('li');
    if (!li) return;

    const txt = (li.textContent || '').trim();
    if (!txt || /nenhum resultado/i.test(txt)) return;

    // espera o seu código preencher o input
    setTimeout(atualizarLock, 0);
  }, true);

  // ✅ Mantém funcionando se o usuário digitar manualmente também
  inputFilial.addEventListener('input', atualizarLock);
  inputFilial.addEventListener('change', atualizarLock);

  atualizarLock(); // estado inicial
}

function iniciarRelogioPDV() {
  const el = document.getElementById('pdv_relogio');
  if (!el) return;

  // Nomes dos dias em PT-BR
  const dias = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

  // Gera data/hora no fuso de Brasília (America/Sao_Paulo)
  const fmtData = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
  });

  const fmtHora = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false
  });

  function tick() {
    // Pega o "agora" no fuso de Brasília e extrai o dia da semana também no mesmo fuso
    const agora = new Date();

    // Para obter o dia da semana no fuso desejado, usamos formatToParts
    const parts = new Intl.DateTimeFormat('pt-BR', {
      timeZone: 'America/Sao_Paulo',
      weekday: 'long'
    }).formatToParts(agora);

    const weekdayLong = parts.find(p => p.type === 'weekday')?.value || '';
    // Converte "domingo" -> "Domingo"
    const diaSemana = weekdayLong.charAt(0).toUpperCase() + weekdayLong.slice(1);

    el.textContent = `${diaSemana} - ${fmtData.format(agora)} ${fmtHora.format(agora)}`;
  }

  tick();                  // mostra imediatamente
  setInterval(tick, 1000); // atualiza a cada segundo
}

// FUNÇÃO: MASCARA PARA INSERIR APENAS NUMEROS
// =======================================================================================================================================

function aplicarMascaraApenasNumeros3(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return console.error('Campo não encontrado:', idCampo);

  // (opcional) ajuda no mobile
  campo.setAttribute('inputmode', 'numeric');
  campo.setAttribute('maxlength', '15');

  // Bloqueia teclas não numéricas (mas permite navegação/atalhos)
  campo.addEventListener('keydown', (e) => {
    const permitidas = [
      'Backspace', 'Delete', 'Tab', 'Enter', 'Escape',
      'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
      'Home', 'End'
    ];

    if (permitidas.includes(e.key)) return;

    // Ctrl/Cmd + A/C/V/X
    if ((e.ctrlKey || e.metaKey) && ['a', 'c', 'v', 'x'].includes(e.key.toLowerCase())) return;

    // Só aceita dígitos 0-9
    if (!/^\d$/.test(e.key)) e.preventDefault();

    // Limite de 3 dígitos (respeita seleção: se tiver texto selecionado, permite substituir)
    const selLen = (campo.selectionEnd ?? 0) - (campo.selectionStart ?? 0);
    const futuroLen = campo.value.length - selLen + 1;
    if (futuroLen > 15) e.preventDefault();
  });

  // Sanitiza qualquer colagem/arrasto (remove não-dígitos e corta em 3)
  campo.addEventListener('input', (e) => {
    let v = e.target.value.replace(/\D/g, '').slice(0, 15);
    if (e.target.value !== v) e.target.value = v;
  });

  // Sanitiza também no paste (para evitar piscadas)
  campo.addEventListener('paste', (e) => {
    e.preventDefault();
    const texto = (e.clipboardData || window.clipboardData).getData('text') || '';
    const v = texto.replace(/\D/g, '').slice(0, 15);

    const start = campo.selectionStart ?? campo.value.length;
    const end = campo.selectionEnd ?? campo.value.length;

    const novo = (campo.value.slice(0, start) + v + campo.value.slice(end)).replace(/\D/g, '').slice(0, 15);
    campo.value = novo;

    const pos = Math.min((campo.value.length), start + v.length);
    campo.setSelectionRange(pos, pos);

    campo.dispatchEvent(new Event('input', { bubbles: true }));
  });
}


















// =======================================================================================================================================
// FUNÇÃO: APLICAR MÁSCARA DE VALOR
// =======================================================================================================================================

// Aplica máscara R$ 0,00 com entrada da direita para esquerda
// Agora: não preenche o campo no início (placeholder aparece). Só mostra "R$ 0,00" quando o usuário começar a digitar.
function aplicarMascaraValor(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return console.error('Campo não encontrado:', idCampo);

  // NÃO define valor inicial -> permite placeholder
  // campo.value = 'R$ 0,00';

  // Flag para evitar loops quando setamos value via código
  let atualizando = false;

  campo.addEventListener('focus', e => {
    setTimeout(() => {
      const len = e.target.value.length;
      e.target.setSelectionRange(len, len);
    });
  });

  campo.addEventListener('keydown', e => {
    const permitidas = [8, 9, 13, 27, 46]; // backspace, tab, enter, esc, del
    const ctrl = e.ctrlKey && [65, 67, 86, 88].includes(e.keyCode); // A,C,V,X
    const nav = e.keyCode >= 35 && e.keyCode <= 39; // setas, home, end
    const num = (!e.shiftKey && ((e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 96 && e.keyCode <= 105)));

    if (!(permitidas.includes(e.keyCode) || ctrl || nav || num)) e.preventDefault();
  });

  campo.addEventListener('input', e => {
    if (atualizando) return;

    // Se o usuário apagou tudo, mantém vazio para aparecer o placeholder
    const soNumeros = e.target.value.replace(/\D/g, '');
    if (soNumeros.length === 0) {
      atualizando = true;
      e.target.value = '';
      atualizando = false;
      return;
    }

    // Mantém sua lógica original, só que só roda quando houver dígitos
    let v = soNumeros.slice(0, 9) || '0';
    v = v.padStart(3, '0');
    const reais = v.slice(0, -2).replace(/^0+/, '') || '0';
    const centavos = v.slice(-2);

    atualizando = true;
    e.target.value = `R$ ${reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${centavos}`;
    atualizando = false;
  });

  campo.obterValor = () => parseInt((campo.value || '').replace(/\D/g, '')) / 100 || 0;

  campo.definirValor = valor => {
    // Se quiser "definir vazio", passe null/undefined/NaN
    if (valor === null || valor === undefined || Number.isNaN(valor)) {
      campo.value = '';
      return;
    }

    let v = Math.round(valor * 100).toString().padStart(3, '0').slice(0, 9);
    const reais = v.slice(0, -2).replace(/^0+/, '') || '0';
    const centavos = v.slice(-2);

    campo.value = `R$ ${reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${centavos}`;
  };
}

function iniciarInteracoesProdutoPDV() {
  if (window.__pdv_interacoes_produto_iniciadas) return;
  window.__pdv_interacoes_produto_iniciadas = true;

  const inputEAN         = document.getElementById('inputEAN');
  const inputCodigo      = document.getElementById('inputCodigo');
  const inputProduto     = document.getElementById('inputProduto');
  const listaProduto     = document.getElementById('listaProduto');

  const inputQtdEstoque  = document.getElementById('inputQtdEstoque');
  const inputQuantidade  = document.getElementById('inputQuantidade');

  const inputVlrUnit     = document.getElementById('inputValorUnitario');
  const inputVlrTotal    = document.getElementById('inputValorTotal');

  const inputFilial     = document.getElementById('inputFilial');
  const listaFilial     = document.getElementById('listaFilial'); 

  if (!inputEAN || !inputCodigo || !inputProduto || !inputQuantidade || !inputVlrUnit || !inputVlrTotal) {
    console.error('PDV: Campos obrigatórios não encontrados no DOM.');
    return;
  }

  // -------------------------------
  // HELPERS
  // -------------------------------
  const toastWarn = (msg) => (window.toastr ? toastr.warning(msg) : alert(msg));

  function soDigitos(v) {
    return String(v || '').replace(/\D/g, '');
  }

  function normalizaTexto(v) {
    return String(v || '')
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function isComboNao(valor) {
    return normalizaTexto(valor) === 'nao';
  }

  // ✅ FIX 2: parser BR robusto (aceita "R$49,90", "49,90", "49.9", 49.9, "1.234,56")
  function parseNumeroBR(v) {
    if (v === null || v === undefined) return 0;

    if (typeof v === 'number') {
      return Number.isFinite(v) ? v : 0;
    }

    let s = String(v).trim();
    if (!s) return 0;

    // remove símbolos e espaços
    s = s.replace(/[R$\s]/g, '');

    const temVirgula = s.includes(',');
    const temPonto = s.includes('.');

    if (temVirgula && temPonto) {
      // padrão BR: 1.234,56
      s = s.replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }

    if (temVirgula && !temPonto) {
      // padrão BR: 49,90
      s = s.replace(',', '.');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }

    if (!temVirgula && temPonto) {
      // padrão US/numérico: 49.9
      // (se tiver mais de um ponto, considera o último como decimal)
      const parts = s.split('.');
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join('') + '.' + dec; // remove pontos de milhar
      }
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }

    // só dígitos (inteiro)
    const n = parseFloat(s);
    return Number.isFinite(n) ? n : 0;
  }

  function parseBRL(valorTexto) {
      if (valorTexto === null || valorTexto === undefined) return 0;

      let s = String(valorTexto).trim();

      // Remove "R$" e espaços (inclui NBSP)
      s = s.replace(/\u00A0/g, " ");
      s = s.replace(/[Rr]\$\s*/g, "");
      s = s.replace(/\s/g, "");

      // Detecta separador decimal pelo ÚLTIMO '.' ou ',' encontrado
      const lastComma = s.lastIndexOf(",");
      const lastDot = s.lastIndexOf(".");

      if (lastComma > lastDot) {
        // PT-BR: vírgula decimal, ponto milhar
        s = s.replace(/\./g, "").replace(",", ".");
      } else if (lastDot > lastComma) {
        // EN: ponto decimal, vírgula milhar
        s = s.replace(/,/g, "");
        // '.' fica como decimal
      } else {
        // Sem separador: se vier tipo "4990", trata como centavos (49.90)
        if (/^\d+$/.test(s) && s.length >= 3) {
          s = s.slice(0, -2) + "." + s.slice(-2);
        }
      }

      const n = Number(s);
      return Number.isFinite(n) ? n : 0;
  }

  function formatBRL(valor) {
    const n = Number(valor || 0);
    return n.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  // ✅ FIX 1: normaliza código para comparar (resolve "0012" vs "12")
  function normalizaCodigo(v) {
    const s = String(v ?? '').trim();
    if (!s) return '';
    if (/^\d+$/.test(s)) return s.replace(/^0+/, '') || '0';
    return s.toUpperCase();
  }

  function limparCamposItem() {
    inputEAN.value = '';
    inputCodigo.value = '';
    inputProduto.value = '';
    if (inputQtdEstoque) inputQtdEstoque.value = '';
    inputQuantidade.value = '';
    inputVlrUnit.value = '';
    inputVlrTotal.value = '';

    if (document.activeElement && typeof document.activeElement.blur === 'function') {
      document.activeElement.blur();
    }

    setTimeout(() => inputEAN.focus(), 0);
  }

  // -------------------------------
  // ✅ SALDO POR PRODUTO (AGORA FILTRADO POR FILIAL SELECIONADA)
  // saldo = ENTRADA - SAÍDA
  // -------------------------------

  // Mapa: nome(normalizado) -> codigo da filial
  const mapaFilialNomeCodigo = new Map();
  (Array.isArray(itensFil) ? itensFil : []).forEach(f => {
    const nomeKey = normalizaTexto(f?.nome);
    if (!nomeKey) return;
    if (!mapaFilialNomeCodigo.has(nomeKey)) mapaFilialNomeCodigo.set(nomeKey, f?.codigo);
  });

  function obterCodigoFilialSelecionada() {
    const nome = String(inputFilial?.value || '').trim();
    if (!nome) return null;

    const cod = mapaFilialNomeCodigo.get(normalizaTexto(nome));
    if (cod === undefined || cod === null || String(cod).trim() === '') return null;

    const n = parseInt(String(cod).trim(), 10);
    return Number.isFinite(n) ? n : null;
  }

  // tenta achar o campo da filial em itensEst (prioriza mov.filial)
  function extrairCodigoFilialMov(mov) {
    const candidatos = [
      mov?.filial,
      mov?.codfilial,
      mov?.codigoFilial,
      mov?.codigofilial,
      mov?.codFilial
    ];

    for (const c of candidatos) {
      if (c === undefined || c === null) continue;
      const n = parseInt(String(c).trim(), 10);
      if (Number.isFinite(n)) return n;
    }
    return null;
  }

  // ✅ agora o saldoPorProduto vira "dinâmico"
  let saldoPorProduto = new Map();

  function recalcularSaldoPorFilialAtual() {
    saldoPorProduto = new Map();

    const codFilial = obterCodigoFilialSelecionada();
    const base = Array.isArray(itensEst) ? itensEst : [];

    // se não tiver filial ainda, não calcula saldo (ou pode calcular geral, se preferir)
    if (codFilial === null) {
      return; // <- mais seguro pro seu lock (sem filial, sem saldo)
      // se você quiser calcular geral quando não tiver filial, troque por:
      // movs = base;
    }

    const movs = base.filter(mov => extrairCodigoFilialMov(mov) === codFilial);

    movs.forEach(mov => {
      if (!mov) return;

      const key = normalizaCodigo(mov.codigoprod);
      if (!key) return;

      const tipo = normalizaTexto(mov.tipomov);
      const qtd  = parseNumeroBR(mov.qtd);

      if (!Number.isFinite(qtd) || qtd === 0) return;

      const atual = saldoPorProduto.get(key) || 0;

      if (tipo.includes('entrada')) saldoPorProduto.set(key, atual + qtd);
      if (tipo.includes('saida'))   saldoPorProduto.set(key, atual - qtd);
    });
  }

  // calcula uma vez ao iniciar
  recalcularSaldoPorFilialAtual();

  // recalcula quando a filial mudar (digitando/alterando)
  if (inputFilial) {
    inputFilial.addEventListener('change', recalcularSaldoPorFilialAtual);
    inputFilial.addEventListener('input',  () => setTimeout(recalcularSaldoPorFilialAtual, 0));
  }

  // recalcula quando escolher na lista (clique)
  if (listaFilial) {
    listaFilial.addEventListener('click', () => {
      // espera o seu código preencher o inputFilial
      setTimeout(recalcularSaldoPorFilialAtual, 0);
    }, true);
  }

  function obterSaldoEstoque(codProd) {
    return saldoPorProduto.get(normalizaCodigo(codProd)) || 0;
  }

  window.__pdvRecalcularSaldoPorFilialAtual = function() {
    recalcularSaldoPorFilialAtual();

    const codProdutoAtual = String(inputCodigo?.value || '').trim();
    if (codProdutoAtual && inputQtdEstoque) {
      inputQtdEstoque.value = String(obterSaldoEstoque(codProdutoAtual));
    }
  };

  function calcularTotal() {
    const qtd = parseFloat(String(inputQuantidade.value || '').replace(',', '.'));
    const unit = parseBRL(inputVlrUnit.value);

    if (!Number.isFinite(qtd) || qtd <= 0 || !Number.isFinite(unit) || unit <= 0) {
      inputVlrTotal.value = '';
      return;
    }

    inputVlrTotal.value = formatBRL(qtd * unit);
  }

  function acionarInserirEFinalizar() {
    if (typeof inserir === 'function') {
      inserir();
    } else {
      console.warn('Função inserir() não encontrada no escopo global.');
      toastWarn('Função inserir() não encontrada. Verifique seu JS.');
    }
  }

  function preencherCamposProduto(prod, preencherEAN = false) {
    if (preencherEAN) inputEAN.value = prod.ean || '';

    inputCodigo.value = prod.codigo || '';
    inputProduto.value = prod.nome || '';

    // preço: agora parseia certo "49.9" e "R$49,90"
    const precoNum = obterPrecoVendaProdutoCaixa(prod);
    inputVlrUnit.value = precoNum ? formatBRL(precoNum) : '';

    // estoque (só se combo == "Não")
    if (inputQtdEstoque) {
      if (isComboNao(prod.combo)) {
        inputQtdEstoque.value = String(obterSaldoEstoque(prod.codigo));
      } else {
        inputQtdEstoque.value = '';
      }
    }

    setTimeout(() => {
      inputQuantidade.focus();

      const qtd = parseInt(String(inputQuantidade.value || '').trim(), 10);
      if (Number.isFinite(qtd) && qtd > 0) {
        calcularTotal();
        acionarInserirEFinalizar();
      } else {
        try { inputQuantidade.select(); } catch(e) {}
      }
    }, 0);
  }

  // -------------------------------
  // MAPAS PARA BUSCA RÁPIDA
  // -------------------------------
  const mapaEAN = new Map();
  const mapaCodigo = new Map();
  const mapaNome = new Map();

  (Array.isArray(itensProd) ? itensProd : []).forEach(p => {
    if (!p) return;

    const eanKey = soDigitos(p.ean);
    const codKey = normalizaCodigo(p.codigo);
    const nomeKey = normalizaTexto(p.nome);

    if (eanKey && !mapaEAN.has(eanKey)) mapaEAN.set(eanKey, p);
    if (codKey && !mapaCodigo.has(codKey)) mapaCodigo.set(codKey, p);
    if (nomeKey && !mapaNome.has(nomeKey)) mapaNome.set(nomeKey, p);
  });

  function buscarPorEAN(valor) {
    return mapaEAN.get(soDigitos(valor)) || null;
  }
  function buscarPorCodigo(valor) {
    return mapaCodigo.get(normalizaCodigo(valor)) || null;
  }
  function buscarPorNome(valor) {
    return mapaNome.get(normalizaTexto(valor)) || null;
  }

  // -------------------------------
  // EVENTOS
  // -------------------------------
  inputEAN.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();

    const prod = buscarPorEAN(inputEAN.value);
    if (!prod) {
      toastWarn('Código de barras (EAN) não encontrado!');
      inputEAN.focus();
      try { inputEAN.select(); } catch(err) {}
      return;
    }

    preencherCamposProduto(prod, false);
  });

  inputCodigo.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();

    const prod = buscarPorCodigo(inputCodigo.value);
    if (!prod) {
      toastWarn('Código do produto não encontrado!');
      inputCodigo.focus();
      try { inputCodigo.select(); } catch(err) {}
      return;
    }

    preencherCamposProduto(prod, true); // preenche EAN também
  });

  if (listaProduto) {
    listaProduto.addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;

      const nomeSelecionado = (li.textContent || '').trim();
      if (!nomeSelecionado || /nenhum resultado/i.test(nomeSelecionado)) return;

      const prod = buscarPorNome(nomeSelecionado);
      if (!prod) return;

      preencherCamposProduto(prod, true);
    });
  }

  inputProduto.addEventListener('change', () => {
    const prod = buscarPorNome(inputProduto.value);
    if (!prod) return;
    preencherCamposProduto(prod, true);
  });

  inputQuantidade.addEventListener('input', () => {
    calcularTotal();
  });

  inputQuantidade.addEventListener('focus', () => {
    const qtd = parseInt(String(inputQuantidade.value || '').trim(), 10);
    if (Number.isFinite(qtd) && qtd > 0) {
      calcularTotal();
      acionarInserirEFinalizar();
    }
  });

  inputQuantidade.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    e.preventDefault();
    calcularTotal();
    acionarInserirEFinalizar();
  });
}

function inserir() {
  const elProduto = document.getElementById("inputProduto");
  const elQtd = document.getElementById("inputQuantidade");

  const elEAN = document.getElementById("inputEAN");
  const elCodigo = document.getElementById("inputCodigo");
  const elQtdEstoque = document.getElementById("inputQtdEstoque");
  const elVlrUnit = document.getElementById("inputValorUnitario");
  const elVlrTotal = document.getElementById("inputValorTotal");

  const tbody = document.getElementById("tb_carrinho_corpo");
  const elFooterTotal = document.getElementById("ftVlrTotal");

  if (!tbody || !elFooterTotal) {
    console.error("Tabela do carrinho não encontrada (tb_carrinho_corpo / ftVlrTotal).");
    return;
  }

  const nomeProduto = (elProduto?.value || "").trim();
  const qtdTxt = (elQtd?.value || "").trim();
  const qtdNum = parseInt(qtdTxt, 10);

  // ✅ Campos obrigatórios
  const produtoVazio = nomeProduto === "";
  const qtdVaziaOuInvalida = qtdTxt === "" || !Number.isFinite(qtdNum) || qtdNum <= 0;

  if (produtoVazio || qtdVaziaOuInvalida) {
    if (window.toastr) toastr.warning("O nome do produto e quantidade são campos obrigatórios!");
    else alert("O nome do produto e quantidade são campos obrigatórios!");
    (produtoVazio ? elProduto : elQtd)?.focus();
    return;
  }

  // Busca o produto na lista (case-insensitive)
  const prodObj = (Array.isArray(itensProd) ? itensProd : []).find(p =>
    (p?.nome || "").trim().toUpperCase() === nomeProduto.toUpperCase()
  );

  if (!prodObj) {
    (window.toastr ? toastr.error : alert)("Produto não encontrado na base.");
    elProduto?.focus();
    return;
  }

  // ✅ PREÇO: parse robusto (aceita "R$49,90", "49,90", "49.9", "49.90", "1.234,56", etc.)
  const valorUnitNum = obterPrecoVendaProdutoCaixa(prodObj);

  if (!Number.isFinite(valorUnitNum) || valorUnitNum < 0) {
    (window.toastr ? toastr.error : alert)("Preço do produto inválido no cadastro.");
    return;
  }

  const valorTotalNum = qtdNum * valorUnitNum;

  const valorUnitFmt = formatBRL(valorUnitNum);
  const valorTotalFmt = formatBRL(valorTotalNum);

  // ✅ NOVO: AGRUPAR SE O PRODUTO JÁ EXISTE NO CARRINHO
  const linhasCarrinho = Array.from(tbody.querySelectorAll("tr"));

  const chaveCodigo = String(prodObj.codigo || "").trim();
  const chaveNome = String(prodObj.nome || "").trim().toUpperCase();

  const linhaExistente = linhasCarrinho.find(tr => {
    const cod = String(tr.dataset.codigo || "").trim();
    const nome = String(tr.dataset.nome || "").trim().toUpperCase();

    // prioriza código; se não houver, usa nome
    if (chaveCodigo && cod) return cod === chaveCodigo;
    return nome === chaveNome;
  });

  if (linhaExistente) {
    const tdQtdExist   = linhaExistente.children[1]; // coluna 2
    const tdUnitExist  = linhaExistente.children[2]; // coluna 3
    const tdTotalExist = linhaExistente.children[3]; // coluna 4

    const qtdAnt = parseInt(String(tdQtdExist.textContent || "0").trim(), 10) || 0;
    const totalAnt = parseBRL(tdTotalExist.textContent || "R$ 0,00") || 0;

    const novaQtd = qtdAnt + qtdNum;
    const novoTotal = totalAnt + valorTotalNum;

    // mantém coerência: unitário = total / qtd (média ponderada)
    const novoUnit = novaQtd > 0 ? (novoTotal / novaQtd) : 0;

    tdQtdExist.textContent = String(novaQtd);
    tdTotalExist.textContent = formatBRL(novoTotal);
    tdUnitExist.textContent = formatBRL(novoUnit);

    atualizarTotalCarrinho();
    limparCamposItem();
    elEAN?.focus();
    return;
  }

  // --- Cria a linha ---
  const tr = document.createElement("tr");

  // (Opcional) guardar infos úteis na linha
  tr.dataset.codigo = prodObj.codigo || "";
  tr.dataset.nome = prodObj.nome || "";
  tr.dataset.ean = prodObj.ean || "";

  // Coluna 1: Produto
  const tdProd = document.createElement("td");
  tdProd.textContent = prodObj.nome;

  // Coluna 2: Quantidade
  const tdQtd = document.createElement("td");
  tdQtd.textContent = String(qtdNum);

  // Coluna 3: Valor unitário
  const tdVlrUnit = document.createElement("td");
  tdVlrUnit.textContent = valorUnitFmt;

  // Coluna 4: Valor total
  const tdVlrTotal = document.createElement("td");
  tdVlrTotal.textContent = valorTotalFmt;

  // Coluna 5: Ações (editar + excluir)
  const tdAcoes = document.createElement("td");
  tdAcoes.style.whiteSpace = "nowrap";

  const wrapAcoes = document.createElement("div");
  wrapAcoes.style.display = "inline-flex";
  wrapAcoes.style.alignItems = "center";
  wrapAcoes.style.justifyContent = "center";
  wrapAcoes.style.gap = "8px";
  wrapAcoes.style.width = "100%";

  const iconEdit = document.createElement("i");
  iconEdit.className = "bi bi-pencil-square iconEdit";
  iconEdit.title = "Editar item";

  const iconDel = document.createElement("i");
  iconDel.className = "bi bi-trash3 iconDelete";
  iconDel.title = "Excluir item";

  iconEdit.addEventListener("click", (e) => {
    e.stopPropagation();
    if (typeof abrirModalEdicaoItem === "function") abrirModalEdicaoItem(tr);
    else console.log("Clique editar:", tr.dataset);
  });

  iconDel.addEventListener("click", (e) => {
    e.stopPropagation();
    if (typeof abrirModalExclusaoItem === "function") abrirModalExclusaoItem(tr);
    else {
      tr.remove();
      atualizarTotalCarrinho();
    }
  });

  wrapAcoes.appendChild(iconEdit);
  wrapAcoes.appendChild(iconDel);
  tdAcoes.appendChild(wrapAcoes);

  tr.appendChild(tdProd);
  tr.appendChild(tdQtd);
  tr.appendChild(tdVlrUnit);
  tr.appendChild(tdVlrTotal);
  tr.appendChild(tdAcoes);

  tbody.appendChild(tr);

  // Atualiza total do rodapé
  atualizarTotalCarrinho();

  // (Opcional) atualiza os campos da esquerda com os valores formatados
  if (elVlrUnit) elVlrUnit.value = valorUnitFmt;
  if (elVlrTotal) elVlrTotal.value = valorTotalFmt;

  // Limpa campos e volta foco pro EAN
  limparCamposItem();
  elEAN?.focus();

  // ---------------- helpers internos ----------------

  function atualizarTotalCarrinho() {
    const linhas = Array.from(tbody.querySelectorAll("tr"));
    let soma = 0;

    for (const linha of linhas) {
      const tdTotal = linha.children?.[3]; // 4ª coluna
      const v = parseBRL(tdTotal?.textContent || "");
      if (Number.isFinite(v)) soma += v;
    }

    elFooterTotal.textContent = formatBRL(soma);
  }

  function limparCamposItem() {
    if (elEAN) elEAN.value = "";
    if (elCodigo) elCodigo.value = "";
    if (elProduto) elProduto.value = "";
    if (elQtd) elQtd.value = "";
    if (elQtdEstoque) elQtdEstoque.value = "";
    if (elVlrUnit) elVlrUnit.value = "";
    if (elVlrTotal) elVlrTotal.value = "";
    document.activeElement?.blur?.();
  }

  // ✅ parse BRL ROBUSTO (resolve seu "49.9" -> 49.9 e NÃO 499)
  function parseBRL(valorTexto) {
    if (valorTexto === null || valorTexto === undefined) return 0;

    // número já vem numérico (ex: 49.9)
    if (typeof valorTexto === "number") return Number.isFinite(valorTexto) ? valorTexto : 0;

    let s = String(valorTexto).trim();
    if (!s) return 0;

    // remove R$ e espaços (inclui NBSP)
    s = s.replace(/\u00A0/g, " ");
    s = s.replace(/[Rr]\$\s*/g, "");
    s = s.replace(/\s/g, "");

    const lastComma = s.lastIndexOf(",");
    const lastDot = s.lastIndexOf(".");

    if (lastComma > -1 && lastDot > -1) {
      // tem os dois: decide pelo último separador
      if (lastComma > lastDot) {
        // BR: 1.234,56
        s = s.replace(/\./g, "").replace(",", ".");
      } else {
        // EN: 1,234.56
        s = s.replace(/,/g, "");
      }
    } else if (lastComma > -1) {
      // só vírgula: BR decimal
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (lastDot > -1) {
      // só ponto: EN decimal (ou múltiplos pontos -> último é decimal)
      const parts = s.split(".");
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join("") + "." + dec; // remove pontos de milhar
      }
      s = s.replace(/,/g, ""); // remove vírgulas caso existam como milhar
    } else {
      // só dígitos: mantém como inteiro normal (ex: "50" => 50)
      // (se você quiser tratar "4990" como 49.90, dá pra mudar aqui)
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function formatBRL(n) {
    const fmt = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(Number(n) || 0);

    return fmt.replace(/\u00A0/g, " ");
  }
}






















function iniciarModalEstoquePorFilial() {
  if (window.__modal_estoque_filial_iniciado) return;
  window.__modal_estoque_filial_iniciado = true;

  const btnLupa   = document.getElementById('btnAbrirModalEstoqueFilial');
  const modal     = document.getElementById('modalEstoqueFilial');

  const tbody     = document.getElementById('tb_estoque_filial_corpo');

  const inputProduto = document.getElementById('inputProduto');

  const toastWarn = (msg) => (window.toastr ? toastr.warning(msg) : alert(msg));
  const toastErr  = (msg) => (window.toastr ? toastr.error(msg) : alert(msg));

  if (!btnLupa || !modal || !tbody) {
    console.warn('Modal estoque: elementos não encontrados (lupa/modal/tbody).');
    return;
  }

  // ---------------- helpers ----------------
  function normalizaTexto(v) {
    return String(v || '')
      .trim()
      .toLowerCase()
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '');
  }

  function normalizaCodigo(v) {
    const s = String(v ?? '').trim();
    if (!s) return '';
    if (/^\d+$/.test(s)) return s.replace(/^0+/, '') || '0';
    return s.toUpperCase();
  }

  function parseNumeroBR(v) {
    if (v === null || v === undefined) return 0;
    if (typeof v === 'number') return Number.isFinite(v) ? v : 0;

    let s = String(v).trim();
    if (!s) return 0;

    // remove R$, espaços e NBSP
    s = s.replace(/\u00A0/g, ' ');
    s = s.replace(/[Rr]\$\s*/g, '');
    s = s.replace(/\s/g, '');

    const lastComma = s.lastIndexOf(',');
    const lastDot   = s.lastIndexOf('.');

    if (lastComma > -1 && lastDot > -1) {
      // decide pelo último separador
      if (lastComma > lastDot) {
        s = s.replace(/\./g, '').replace(',', '.'); // BR
      } else {
        s = s.replace(/,/g, ''); // EN
      }
    } else if (lastComma > -1) {
      s = s.replace(/\./g, '').replace(',', '.'); // BR
    } else if (lastDot > -1) {
      const parts = s.split('.');
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join('') + '.' + dec;
      }
      s = s.replace(/,/g, '');
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function obterCodigoProdutoSelecionado() {
    const codCampo = normalizaCodigo(inputCodigo?.value);
    if (codCampo) return codCampo;

    const nome = (inputProduto?.value || '').trim();
    if (!nome) return '';

    const prod = (Array.isArray(itensProd) ? itensProd : []).find(p =>
      normalizaTexto(p?.nome) === normalizaTexto(nome)
    );

    return normalizaCodigo(prod?.codigo);
  }

  function calcularSaldoPorFilial(codProd) {
    const saldo = new Map(); // filialCodigo -> saldo

    const est = Array.isArray(itensEst) ? itensEst : [];
    for (const mov of est) {
      if (!mov) continue;

      const codMov = normalizaCodigo(mov.codigoprod);
      if (!codMov || codMov !== codProd) continue;

      const filialCod = normalizaCodigo(mov.filial); // <- precisa existir em itensEst
      if (!filialCod) continue;

      const tipo = normalizaTexto(mov.tipomov);
      const qtd  = parseNumeroBR(mov.qtd);
      if (!Number.isFinite(qtd) || qtd === 0) continue;

      const atual = saldo.get(filialCod) || 0;
      if (tipo.includes('entrada')) saldo.set(filialCod, atual + qtd);
      else if (tipo.includes('saida')) saldo.set(filialCod, atual - qtd);
    }

    return saldo;
  }

  function renderTabela(saldoMap) {
    tbody.innerHTML = '';

    const filiais = Array.isArray(itensFil) ? itensFil : [];
    if (!filiais.length) {
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 2;
      td.textContent = 'Nenhuma filial cadastrada.';
      tr.appendChild(td);
      tbody.appendChild(tr);
      return;
    }

    // ordena por nome (opcional)
    const filiaisOrdenadas = [...filiais].sort((a, b) =>
      String(a?.nome || '').localeCompare(String(b?.nome || ''), 'pt-BR', { sensitivity: 'base' })
    );

    for (const f of filiaisOrdenadas) {
      const codFil = normalizaCodigo(f?.codigo);
      const nomeFil = String(f?.nome || '').trim() || '(Sem nome)';

      const qtd = saldoMap.get(codFil) ?? 0;

      const tr = document.createElement('tr');

      const tdFil = document.createElement('td');
      tdFil.textContent = nomeFil;

      const tdQtd = document.createElement('td');
      tdQtd.textContent = String(qtd);

      tr.appendChild(tdFil);
      tr.appendChild(tdQtd);
      tbody.appendChild(tr);
    }
  }

  function abrirModal() {
    const codProd = obterCodigoProdutoSelecionado();
    if (!codProd) {
      toastWarn('Selecione um produto antes de abrir a disponibilidade em estoque.');
      return;
    }

    // valida se itensEst tem filial
    const temFilialEmEst = (Array.isArray(itensEst) ? itensEst : []).some(m => m && m.filial !== undefined);
    if (!temFilialEmEst) {
      toastErr('Não encontrei a coluna "filial" em itensEst. Verifique se ela está sendo enviada no JSON.');
      return;
    }

    const saldoMap = calcularSaldoPorFilial(codProd);
    renderTabela(saldoMap);

    modal.classList.add('ativo');
  }

  function fecharModal() {
    modal.classList.remove('ativo');
  }

  // ---------------- eventos ----------------
  btnLupa.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    abrirModal();
  });

  if (btnFechar) {
    btnFechar.addEventListener('click', (e) => {
      e.preventDefault();
      fecharModal();
    });
  }

  // (Opcional) clicar fora da caixa fecha também
  modal.addEventListener('click', (e) => {
    if (e.target === modal) fecharModal();
  });

  // ESC fecha
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('ativo')) fecharModal();
  });
}

// CONFIGURAÇÃO GERAL DOS DROPDOWNS SIMPLES
// =================================================================================================================================================
// Ao final desse bloco de código devemos informar quais elementos farão parte dessa configuração

function configurarDropdown(inputCampo, listaUl, dados) {
  if (!inputCampo || !listaUl) return;
  let timeoutId = null;

  // EVENTO: DIGITAÇÃO NO CAMPO DE PESQUISA =======================================================
  inputCampo.addEventListener('input', function (e) {
    const texto = e.target.value;

    // Cancela timeout anterior (debounce)
    if (timeoutId) clearTimeout(timeoutId);

    // Aguarda 300ms após parar de digitar para filtrar
    timeoutId = setTimeout(function () {
      filtrarEMostrarSugestoes(texto, dados, listaUl, inputCampo);
    }, 300);
  });

  document.addEventListener('click', function (e) {
  // NÃO fecha se clicou dentro do próprio input ou dentro da lista
  if (e.target === inputCampo || listaUl.contains(e.target)) return;

  // NÃO fecha se clicou dentro do container do dropdown
  if (e.target.closest('.dropdown-container')) return;

  esconderSugestoes(listaUl);
  });

  // EVENTO: FOCO NO CAMPO - MOSTRA TODAS AS OPÇÕES ================================================
  inputCampo.addEventListener('focus', function () {
      mostrarSugestoes(dados, listaUl, inputCampo);
  });

  // EVENTO: CLICAR FORA - FECHA DROPDOWN ==========================================================
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dropdown-container')) {
      esconderSugestoes(listaUl);
    }
  });

  // EVENTO: NAVEGAÇÃO POR TECLADO =================================================================
  inputCampo.addEventListener('keydown', function (e) {
    const items = listaUl.querySelectorAll('li');
    const selected = listaUl.querySelector('li.selected');

    switch (e.key) {
      case 'ArrowDown':
        e.preventDefault();
        navegarSugestoes(items, selected, 'down');
        break;
      case 'ArrowUp':
        e.preventDefault();
        navegarSugestoes(items, selected, 'up');
        break;
      case 'Enter':
        e.preventDefault();
        if (selected) {
          selecionarOpcao(selected.textContent, inputCampo, listaUl);
        }
        break;
      case 'Escape':
        esconderSugestoes(listaUl);
        break;
    }
  });
}


// FUNÇÕES AUXILIARES==================================================================================================


// Filtra dados e exibe sugestões ===================================================================================
function filtrarEMostrarSugestoes(texto, dados, listaUl, inputCampo) {
 const textoFiltro = (texto || '').trim().toLowerCase();
  if (textoFiltro === '') {
    mostrarSugestoes(dados, listaUl, inputCampo);
    return;
  }
  const filtrados = dados.filter(item => item.toLowerCase().includes(textoFiltro));
  mostrarSugestoes(filtrados, listaUl, inputCampo);
}

// Exibe a lista de sugestões =======================================================================================
function mostrarSugestoes(lista, listaUl, inputCampo) {
  listaUl.innerHTML = '';

  if (lista.length === 0) {
    const noResults = document.createElement('li');
    noResults.textContent = 'Nenhum resultado encontrado';
    noResults.style.cssText = 'padding: 10px; color: #666; font-style: italic;';
    listaUl.appendChild(noResults);
  } else {
    lista.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      li.style.cssText = 'padding: 10px; cursor: pointer; border-bottom: 1px solid #eee;';

      // Evento de clique no item
      li.addEventListener('click', function () {
        selecionarOpcao(item, inputCampo, listaUl);
      });

      // Evento de hover
      li.addEventListener('mouseenter', function () {
        const selected = listaUl.querySelector('li.selected');
        if (selected) {
          selected.classList.remove('selected');
          selected.style.backgroundColor = '';
        }
        li.classList.add('selected');
        li.style.backgroundColor = '#f5f5f5';
      });

      listaUl.appendChild(li);
    });
  }

  listaUl.style.display = 'block';
}

// Esconde o dropdown ===============================================================================================
function esconderSugestoes(listaUl) {
  listaUl.style.display = 'none';
}

// Seleciona uma opção ==============================================================================================
function selecionarOpcao(valor, inputCampo, listaUl) {
  inputCampo.value = valor;
  esconderSugestoes(listaUl);
}

// Navega pelas sugestões com setas =================================================================================
function navegarSugestoes(items, selected, direction) {
  if (items.length === 0) return;

  let index = -1;
  if (selected) {
    index = Array.from(items).indexOf(selected);
    selected.classList.remove('selected');
    selected.style.backgroundColor = '';
  }

  if (direction === 'down') {
    index = index < items.length - 1 ? index + 1 : 0;
  } else {
    index = index > 0 ? index - 1 : items.length - 1;
  }

  items[index].classList.add('selected');
  items[index].style.backgroundColor = '#f5f5f5';
  items[index].scrollIntoView({ block: 'nearest' });
}

// guarda a linha que está sendo editada (para usar depois no "confirmar", se você quiser)
let __linhaEditandoCarrinho = null;

function abrirModalEdicaoItem(tr) {
  const modal = document.getElementById("modalEdicaoItem");
  if (!modal || !tr || !tr.children || tr.children.length < 4) return;

  // inputs do modal
  const inpProd   = document.getElementById("edit_produto");
  const inpQtd    = document.getElementById("edit_quantidade");
  const inpUnit   = document.getElementById("edit_valor_unit");
  const inpTotal  = document.getElementById("edit_valor_total");

  if (!inpProd || !inpQtd || !inpUnit || !inpTotal) return;

  // pega valores da linha
  const vProd  = (tr.children[0].textContent || "").trim();
  const vQtd   = (tr.children[1].textContent || "").trim();
  const vUnit  = (tr.children[2].textContent || "").trim();
  const vTotal = (tr.children[3].textContent || "").trim();

  // preenche modal
  inpProd.value  = vProd;
  inpQtd.value   = vQtd;     // número
  inpUnit.value  = vUnit;    // "R$ xx,xx"
  inpTotal.value = vTotal;   // "R$ xx,xx"

  // guarda referência da linha
  __linhaEditandoCarrinho = tr;

  // cria (ou reutiliza) handler de recalculo sem duplicar listeners
  if (!inpQtd.__pdvEditHandler) {
    inpQtd.__pdvEditHandler = () => {
      const qtdNum = parseFloat(String(inpQtd.value || "").replace(",", "."));
      const unitNum = parseBRL(inpUnit.value);

      if (!Number.isFinite(qtdNum) || qtdNum <= 0 || !Number.isFinite(unitNum) || unitNum < 0) {
        inpTotal.value = "";
        return;
      }
      inpTotal.value = formatBRL(qtdNum * unitNum);
    };

    inpQtd.addEventListener("input", inpQtd.__pdvEditHandler);
    inpQtd.addEventListener("change", inpQtd.__pdvEditHandler);
  }

  // força um recalculo ao abrir (caso a qtd esteja diferente)
  inpQtd.__pdvEditHandler();

  // abre o modal
  modal.classList.add("ativo");

  // foca no campo editável
  setTimeout(() => inpQtd.focus(), 0);

  // ---------------- helpers locais ----------------
  function parseBRL(valorTexto) {
    if (valorTexto === null || valorTexto === undefined) return 0;
    if (typeof valorTexto === "number") return Number.isFinite(valorTexto) ? valorTexto : 0;

    let s = String(valorTexto).trim();
    if (!s) return 0;

    s = s.replace(/\u00A0/g, " ");
    s = s.replace(/[Rr]\$\s*/g, "");
    s = s.replace(/\s/g, "");

    const lastComma = s.lastIndexOf(",");
    const lastDot = s.lastIndexOf(".");

    if (lastComma > -1 && lastDot > -1) {
      if (lastComma > lastDot) s = s.replace(/\./g, "").replace(",", ".");
      else s = s.replace(/,/g, "");
    } else if (lastComma > -1) {
      s = s.replace(/\./g, "").replace(",", ".");
    } else if (lastDot > -1) {
      const parts = s.split(".");
      if (parts.length > 2) {
        const dec = parts.pop();
        s = parts.join("") + "." + dec;
      }
      s = s.replace(/,/g, "");
    }

    const n = Number(s);
    return Number.isFinite(n) ? n : 0;
  }

  function formatBRL(n) {
    const fmt = new Intl.NumberFormat("pt-BR", {
      style: "currency",
      currency: "BRL",
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }).format(Number(n) || 0);

    return fmt.replace(/\u00A0/g, " ");
  }
}

      maximumFractionDigits: 2
    }).format(Number(n) || 0);

    return fmt.replace(/\u00A0/g, " ");
  }
}
