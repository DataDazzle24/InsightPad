<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <title>Insight Pad</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000000;
        color: #fff;
        font-family: "DejaVu Sans Mono", Arial, sans-serif;
      }

      .gate-page {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at 26% 44%, rgba(66, 220, 250, 0.13), transparent 27%),
          radial-gradient(circle at 78% 48%, rgba(66, 220, 250, 0.09), transparent 28%),
          radial-gradient(circle at 52% 100%, rgba(54, 219, 46, 0.04), transparent 33%),
          linear-gradient(135deg, #000000 0%, #03090b 51%, #000000 100%);
      }

      .gate-page::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(66, 220, 250, 0.26) 1px, transparent 1px);
        background-size: 38px 38px;
        opacity: 0.18;
        mask-image: radial-gradient(ellipse at center, transparent 18%, black 58%, black 100%);
      }

      .gate-page::after {
        content: "";
        position: absolute;
        inset: 20px;
        pointer-events: none;
        border: 1px solid rgba(66, 220, 250, 0.05);
        clip-path: polygon(0 0, 22% 0, 22% 1px, 1px 1px, 1px 26%, 0 26%, 0 0, 100% 0, 100% 28%, calc(100% - 1px) 28%, calc(100% - 1px) 1px, 80% 1px, 80% 0, 100% 0, 100% 100%, 80% 100%, 80% calc(100% - 1px), calc(100% - 1px) calc(100% - 1px), calc(100% - 1px) 72%, 100% 72%, 100% 100%, 0 100%, 0 72%, 1px 72%, 1px calc(100% - 1px), 22% calc(100% - 1px), 22% 100%, 0 100%);
      }

      .gate-bg-effects {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
        color: #42DCFA;
      }

      .hud-corner {
        position: absolute;
        width: clamp(120px, 17vw, 230px);
        height: clamp(74px, 11vw, 138px);
        opacity: 0.58;
      }

      .hud-corner-left {
        top: 26px;
        left: 22px;
        border-top: 2px solid #42DCFA;
        border-left: 1px solid rgba(66, 220, 250, 0.75);
        clip-path: polygon(0 0, 100% 0, 100% 10%, 29% 10%, 16% 34%, 16% 78%, 0 100%);
      }

      .hud-corner-right {
        right: 18px;
        bottom: 25px;
        border-right: 1px solid rgba(66, 220, 250, 0.72);
        border-bottom: 2px solid #42DCFA;
        transform: rotate(180deg);
        clip-path: polygon(0 0, 100% 0, 100% 10%, 29% 10%, 16% 34%, 16% 78%, 0 100%);
      }

      .hud-radar {
        position: absolute;
        top: clamp(24px, 5vw, 60px);
        right: clamp(34px, 8vw, 100px);
        width: clamp(104px, 12vw, 158px);
        aspect-ratio: 1;
        border-radius: 50%;
        opacity: 0.31;
        background:
          radial-gradient(circle, #42DCFA 0 2px, transparent 3px 20%, rgba(66, 220, 250, 0.5) 21% 21.7%, transparent 22% 39%, rgba(66, 220, 250, 0.42) 40% 40.7%, transparent 41% 58%, rgba(66, 220, 250, 0.32) 59% 59.8%, transparent 60%);
      }

      .hud-radar::before,
      .hud-radar::after {
        content: "";
        position: absolute;
        background: rgba(66, 220, 250, 0.28);
      }

      .hud-radar::before {
        top: 50%;
        left: -16px;
        right: -16px;
        height: 1px;
      }

      .hud-radar::after {
        left: 50%;
        top: -16px;
        bottom: -16px;
        width: 1px;
      }

      .hud-line-chart {
        position: absolute;
        left: clamp(24px, 4vw, 58px);
        bottom: clamp(43px, 7vw, 75px);
        width: clamp(230px, 28vw, 430px);
        height: clamp(82px, 11vw, 134px);
        opacity: 0.2;
        background: linear-gradient(90deg, rgba(66, 220, 250, 0.38), rgba(66, 220, 250, 0.75));
        clip-path: polygon(0 88%, 14% 78%, 25% 81%, 37% 56%, 49% 67%, 58% 37%, 67% 49%, 81% 12%, 82% 14%, 67% 53%, 58% 41%, 49% 71%, 37% 60%, 25% 85%, 14% 82%, 0 92%);
      }

      .hud-bars {
        position: absolute;
        right: clamp(35px, 6vw, 82px);
        bottom: clamp(38px, 6vw, 68px);
        height: 112px;
        display: flex;
        align-items: flex-end;
        gap: 9px;
        opacity: 0.16;
      }

      .hud-bars i {
        display: block;
        width: 7px;
        background: rgba(66, 220, 250, 0.7);
      }

      .hud-bars i:nth-child(1) { height: 22px; }
      .hud-bars i:nth-child(2) { height: 39px; }
      .hud-bars i:nth-child(3) { height: 52px; }
      .hud-bars i:nth-child(4) { height: 77px; }
      .hud-bars i:nth-child(5) { height: 62px; }
      .hud-bars i:nth-child(6) { height: 95px; }

      .gate-card {
        position: relative;
        z-index: 1;
        width: min(88vw, 430px);
        min-height: 410px;
        padding: 42px 34px 36px;
        border: 1.5px solid rgba(66, 220, 250, 0.96);
        border-radius: 28px;
        background: linear-gradient(145deg, rgba(5, 12, 15, 0.94), rgba(0, 0, 0, 0.9));
        box-shadow:
          0 0 29px rgba(66, 220, 250, 0.26),
          inset 0 0 32px rgba(66, 220, 250, 0.045),
          0 28px 80px rgba(0, 0, 0, 0.66);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 26px;
      }

      .gate-logo-wrap {
        position: relative;
        width: 190px;
        height: 190px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .gate-logo {
        position: relative;
        z-index: 2;
        width: 126px;
        height: 126px;
        object-fit: contain;
        filter: drop-shadow(0 0 15px rgba(66, 220, 250, 0.45));
      }

      .spinner {
        position: absolute;
        inset: 0;
        width: 190px;
        height: 190px;
        border: 4px solid rgba(66, 220, 250, 0.1);
        border-top: 4px solid #42DCFA;
        border-right: 4px solid rgba(66, 220, 250, 0.38);
        border-radius: 50%;
        animation: girar 1s linear infinite;
      }

      .gate-status {
        margin: 0;
        color: #36DB2E;
        font-family: "DejaVu Sans Mono", Arial, sans-serif;
        font-size: clamp(0.88rem, 1.4vw, 1.02rem);
        font-weight: 900;
        line-height: 1.35;
        letter-spacing: 0;
        text-align: center;
        text-shadow: 0 0 14px rgba(54, 219, 46, 0.22);
      }

      .gate-substatus {
        margin: -16px 0 0;
        color: rgba(255, 255, 255, 0.68);
        font-family: Arial, sans-serif;
        font-size: 0.82rem;
        font-weight: 700;
        text-align: center;
      }

      @keyframes girar {
        to {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 600px) {
        .gate-card {
          width: 80vw;
          min-height: 360px;
          padding: 32px 22px 30px;
          border-radius: 23px;
        }

        .gate-logo-wrap,
        .spinner {
          width: 155px;
          height: 155px;
        }

        .gate-logo {
          width: 104px;
          height: 104px;
        }

        .hud-corner,
        .hud-radar,
        .hud-bars,
        .hud-line-chart {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="gate-page">
      <div class="gate-bg-effects" aria-hidden="true">
        <span class="hud-corner hud-corner-left"></span>
        <span class="hud-corner hud-corner-right"></span>
        <span class="hud-radar"></span>
        <span class="hud-line-chart"></span>
        <span class="hud-bars">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </span>
      </div>

      <section class="gate-card" aria-live="polite" aria-busy="true">
        <div class="gate-logo-wrap">
          <img class="gate-logo" src="https://drive.google.com/thumbnail?id=1T6pWIpQeH-jPowvh63mPQDJVIjA3VJBJ&sz=w2000" alt="Insight Pad">
          <div class="spinner" aria-hidden="true"></div>
        </div>
        <p class="gate-status">Carregando dados da página ...</p>
        <p class="gate-substatus">Aguarde enquanto preparamos a tela.</p>
      </section>
    </main>

    <script>
      (function() {
        document.title = 'Insight Pad';

        const URL_WEBAPP = <?!= JSON.stringify(urlWebApp) ?>;
        const PAGE_DESTINO = <?!= JSON.stringify(pageDestino) ?>;
        const CHAVE_TOKEN = 'insightpad_auth_token';
        const CHAVE_USUARIO = 'insightpad_auth_usuario';
        const CHAVE_PERMISSOES = 'insightpad_auth_permissoes';
        const CHAVE_DISPOSITIVO = 'insightpad_auth_dispositivo';
        const CHAVE_PRE_RENDER_PAGE = 'insightpad_pre_render_page';
        const CHAVE_PRE_RENDER_ATE = 'insightpad_pre_render_ate';

        function obterIdDispositivo() {
          let id = localStorage.getItem(CHAVE_DISPOSITIVO) || '';

          if (!id) {
            id = window.crypto && typeof window.crypto.randomUUID === 'function'
              ? window.crypto.randomUUID()
              : String(Date.now()) + '-' + Math.random().toString(36).slice(2);
            localStorage.setItem(CHAVE_DISPOSITIVO, id);
          }

          return id;
        }

        function substituirConteudo(html) {
          document.open();
          document.write(html);
          document.close();
        }

        function irParaLogin() {
          google.script.run
            .withSuccessHandler(substituirConteudo)
            .withFailureHandler(function() {
              document.querySelector('.gate-status').textContent =
                'NAO FOI POSSIVEL CARREGAR O LOGIN';
            })
            .carregarLoginPublico();
        }

        const token = localStorage.getItem(CHAVE_TOKEN) || '';

        if (!token) {
          irParaLogin();
          return;
        }

        google.script.run
          .withSuccessHandler(function(resultado) {
            if (!resultado || !resultado.autenticado) {
              localStorage.removeItem(CHAVE_TOKEN);
              localStorage.removeItem(CHAVE_USUARIO);
              localStorage.removeItem(CHAVE_PERMISSOES);
              irParaLogin();
              return;
            }

            if (!resultado.autorizado || !resultado.html) {
              document.querySelector('.gate-status').textContent =
                resultado.mensagem || 'ACESSO NAO AUTORIZADO';
              return;
            }

            localStorage.setItem(CHAVE_USUARIO, JSON.stringify(resultado.usuario || {}));
            localStorage.setItem(CHAVE_PERMISSOES, JSON.stringify(resultado.permissoes || {}));
            localStorage.setItem(CHAVE_PRE_RENDER_PAGE, PAGE_DESTINO);
            localStorage.setItem(CHAVE_PRE_RENDER_ATE, String(Date.now() + 45000));

            substituirConteudo(resultado.html);
          })
          .withFailureHandler(function() {
            document.querySelector('.gate-status').textContent =
              'NAO FOI POSSIVEL CARREGAR A PAGINA';
          })
          .carregarPaginaProtegida(token, PAGE_DESTINO, obterIdDispositivo());
      })();
    </script>
  </body>
</html>
