<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title><?= tituloPagina ?></title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,250,0,200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

  <?!= Chamar("EstiloCabecalho") ?>
  <?!= Chamar("Gestao_Acessos_Estilo") ?>
</head>

<body>
  <?!= Chamar("Cabecalho", { tituloPagina: tituloPagina }) ?>

  <main id="geral">
    <section id="caixaPrincipal">
      <div id="barraAcoes">
        <div class="grupo-acoes">
          <button id="btnVoltar" type="button" class="botao-icone" title="Voltar">
            <i id="cad_icone" class="bi bi-arrow-left-circle"></i>
          </button>

          <button id="btnCriarUsuario" type="button" class="botao-criar-usuario">
            <i class="bi bi-people"></i>
            <span>CONTROLE DE USUÁRIOS</span>
          </button>
        </div>

        <div class="grupo-acoes grupo-acoes-direita">
          <button id="btnRecarregarAcessos" type="button" class="botao-acao botao-cinza">
            <i class="bi bi-arrow-clockwise"></i>
            <span>RECARREGAR</span>
          </button>

          <button id="btnSalvarAcessos" type="button" class="botao-acao botao-verde">
            <i class="bi bi-check2-circle"></i>
            <span>SALVAR</span>
          </button>
        </div>
      </div>

      <div id="painelPermissoes">
        <div class="painel-topo">
          <div class="campo-moderno dropdown-container">
            <label for="selectEscopoAcesso">Tipo de permissão</label>
            <input type="text" id="inputEscopoAcesso" class="input-moderno" placeholder="Digite e selecione o tipo de permissão">
            <ul id="listaEscopoAcesso" class="sugestoes"></ul>
            <select id="selectEscopoAcesso" class="select-tecnico" tabindex="-1" aria-hidden="true">
              <option value="perfil">PERMISSÃO POR PERFIL</option>
              <option value="usuario">PERMISSÃO POR USUÁRIO</option>
            </select>
          </div>

          <div class="campo-moderno dropdown-container">
            <label for="selectEntidadeAcesso">Selecionar</label>
            <input type="text" id="inputEntidadeAcesso" class="input-moderno" placeholder="Digite e selecione o registro">
            <ul id="listaEntidadeAcesso" class="sugestoes"></ul>
            <select id="selectEntidadeAcesso" class="select-tecnico" tabindex="-1" aria-hidden="true">
              <option value="">CARREGANDO...</option>
            </select>
          </div>

          <div class="campo-moderno campo-alvo-selecionado">
            <label for="resumoAlvoAcesso">Alvo selecionado</label>
            <div id="resumoAlvoAcesso" class="resumo-acesso">-</div>
          </div>
        </div>

        <div class="aviso-acesso" id="avisoAcesso"></div>

        <div id="areaTabelaAcessos">
          <table id="tabelaAcessos">
            <thead id="tb_cabecalho">
              <tr>
                <th>MÓDULO</th>
                <th>PÁGINA</th>
                <th>ACESSAR</th>
                <th>CADASTRAR</th>
                <th>EDITAR</th>
                <th>EXCLUIR</th>
                <th>EXPORTAR</th>
                <th>GERENCIAR</th>
              </tr>
            </thead>
            <tbody id="tb_corpo">
              <tr>
                <td colspan="8" class="linha-vazia">Carregando permissões...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="modalCarregamento" class="loading-overlay">
    <div class="loading-box">
      <div class="loading-container">
        <img src="https://drive.google.com/thumbnail?id=1T6pWIpQeH-jPowvh63mPQDJVIjA3VJBJ" alt="Logo" class="loading-logo">
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>

  <?!= Chamar("Gestao_Acessos_JS") ?>
</body>
</html>
