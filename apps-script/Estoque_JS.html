function montarDadosSaldoEstoque() {
  const mapaSaldo = new Map();
  if (!Array.isArray(dadosTabela)) return [];

  dadosTabela.forEach(linha => {
    if (!Array.isArray(linha) || linha.length < 10) return;
    const tipo = normalizarTextoBase(linha[COL_EST.TIPO]);
    const codigoProduto = String(linha[COL_EST.PRODUTO] ?? "").trim();
    const codigoFilial = String(linha[COL_EST.FILIAL] ?? "").trim();
    const qtd = obterQuantidadeMovimentacao(linha[COL_EST.QTD]);

    if (!codigoProduto || !codigoFilial || !qtd) return;

    let fator = 0;
    if (tipo.includes("ENTRADA")) fator = 1;
    if (tipo.includes("SAIDA")) fator = -1;
    if (!fator) return;

    const chave = `${codigoFilial}||${codigoProduto}`;
    const atual = mapaSaldo.get(chave) || {
      filial: obterNomeFilialPorCodigo(codigoFilial),
      produto: obterNomeProdutoPorCodigo(codigoProduto),
      saldo: 0
    };

    atual.saldo += qtd * fator;
    mapaSaldo.set(chave, atual);
  });

  return Array.from(mapaSaldo.values()).sort((a, b) => {
    const filial = a.filial.localeCompare(b.filial, "pt-BR");
    if (filial !== 0) return filial;
    return a.produto.localeCompare(b.produto, "pt-BR");
  });
}

  if (idTransferenciaSelecionada) abrirModalEdicaoTransferencia(idTransferenciaSelecionada);
  else resetarTransferencia();

  document.getElementById("modalTransferencia").classList.add("ativo");
}

function abrirModalEdicaoTransferencia(idTransferencia) {
  const linhas = obterLinhasTransferenciaAtiva(idTransferencia);

  if (linhas.length === 0) {
    toastr.warning("Transferência não encontrada nos dados atuais.");
    resetarTransferencia();
    return;
  }

  const saidas = linhas.filter(linha => normalizarTextoBase(linha[COL_EST.TIPO]).includes("SAIDA"));
  const entradas = linhas.filter(linha => normalizarTextoBase(linha[COL_EST.TIPO]).includes("ENTRADA"));

  if (saidas.length === 0 || entradas.length === 0) {
    toastr.warning("Transferência incompleta. Não foi possível abrir para edição.");
    resetarTransferencia();
    return;
  }

  idTransferenciaEmEdicao = idTransferencia;
  document.getElementById("inputTransferenciaFilialOrigem").value = obterNomeFilialPorCodigo(saidas[0][COL_EST.FILIAL]);
  document.getElementById("inputTransferenciaFilialDestino").value = obterNomeFilialPorCodigo(entradas[0][COL_EST.FILIAL]);

  const container = document.getElementById("containerItensTransferencia");
  container.innerHTML = "";

  saidas.forEach(linha => {
    const bloco = criarBlocoTransferencia(obterNomeProdutoPorCodigo(linha[COL_EST.PRODUTO]), String(linha[COL_EST.QTD] || "").trim());
    container.appendChild(bloco);
    adicionarEventosBlocoTransferencia(bloco);
  });

  configurarModoTransferencia("edicao");
  atualizarEstadoBotaoAdicionarTransferencia();
}

function abrirModalPesquisa() {
  const modal = document.getElementById("modalPesquisa");
  if (!modal) return;
  modal.classList.add("ativo");

  // As opcoes vêm do backend e representam toda a base, nao apenas as 100 linhas visiveis.
  const listas = typeof listasFiltrosEstoque !== "undefined" && listasFiltrosEstoque ? listasFiltrosEstoque : {};
  configurarDropdownMulti(inputPesquisarTipo, listaUlPesquisarTipo, Array.isArray(listas.tipos) ? listas.tipos : todostipos);
  configurarDropdownMulti(inputPesquisarProduto, listaUlPesquisarProduto, Array.isArray(listas.produtos) ? listas.produtos : todosprodutos);
  configurarDropdownMulti(inputPesquisarFilial, listaUlPesquisarFilial, Array.isArray(listas.filiais) ? listas.filiais : todasfilais);
}

function aplicarPesquisaNaTabela() {
  // Converte nomes escolhidos no modal para codigos antes de consultar o backend.
  const tipRaw = (document.getElementById("inputPesquisarTipo")?.value || "").trim();
  const proRaw = (document.getElementById("inputPesquisarProduto")?.value || "").trim();
  const filRaw = (document.getElementById("inputPesquisarFilial")?.value || "").trim();
  const movRaw = (document.getElementById("inputPesquisarDataMovimentacao")?.value || "").trim();
  const cadRaw = (document.getElementById("inputPesquisarDataCadastro")?.value || "").trim();

  const periodoMov = obterPeriodoTextoEstoque(movRaw);
  const periodoCad = obterPeriodoTextoEstoque(cadRaw);

  carregarPrimeiraPaginaEstoque({
    tipo: parseListaMulti(tipRaw).join(";"),
    produto: parseListaMulti(proRaw).map(obterCodigoProdutoPorNome).filter(Boolean).join(";"),
    filial: parseListaMulti(filRaw).map(obterCodigoFilialPorNome).filter(Boolean).join(";"),
    dataMovInicial: periodoMov.inicial,
    dataMovFinal: periodoMov.final,
    dataCadInicial: periodoCad.inicial,
    dataCadFinal: periodoCad.final
  });
  fecharModalPesquisa();
}

function renderTabelaAPartirDeArray(dados, anexar) {
  const tbody = document.getElementById("tb_corpo");
  if (!tbody) return;
  if (!anexar) {
    tbody.innerHTML = "";
    linhaSelecionada = null;
  }

  const frag = document.createDocumentFragment();
  dados.forEach(linha => {
    frag.appendChild(criarLinhaTabelaEstoque(linha));
  });
  tbody.appendChild(frag);
}

function Limpar() {
  document.getElementById("inputPesquisarTipo").value = "";
  document.getElementById("inputPesquisarProduto").value = "";
  document.getElementById("inputPesquisarFilial").value = "";
  document.getElementById("inputPesquisarDataMovimentacao").value = "";
  document.getElementById("inputPesquisarDataCadastro").value = "";
  carregarPrimeiraPaginaEstoque({});
  toastr.info("Filtros removidos com sucesso!");
}

function obterCodigoProdutoPorNome(nomeProduto) {
  const nome = normalizarTextoBase(nomeProduto);
  const produto = mapaProdutoPorNomeEstoque.get(nome);
  return produto ? produto.codigo : "";
}

function obterCodigoFilialPorNome(nomeFilial) {
  const nome = normalizarTextoBase(nomeFilial);
  const filial = mapaFilialPorNomeEstoque.get(nome);
  return filial ? filial.codigo : "";
}

function reconstruirMapasConsultaEstoque() {
  mapaProdutoPorCodigoEstoque = new Map();
  mapaProdutoPorNomeEstoque = new Map();
  mapaFilialPorCodigoEstoque = new Map();
  mapaFilialPorNomeEstoque = new Map();
  mapaNfPorIdEstoque = new Map();

  (Array.isArray(itensProd) ? itensProd : []).forEach(item => {
    const codigo = String(item?.codigo || "").trim();
    const nome = normalizarTextoBase(item?.nome);
    if (codigo) mapaProdutoPorCodigoEstoque.set(codigo, item);
    if (nome) mapaProdutoPorNomeEstoque.set(nome, item);
  });

  (Array.isArray(itensFil) ? itensFil : []).forEach(item => {
    const codigo = String(item?.codigo || "").trim();
    const nome = normalizarTextoBase(item?.nome);
    if (codigo) mapaFilialPorCodigoEstoque.set(codigo, item);
    if (nome) mapaFilialPorNomeEstoque.set(nome, item);
  });

  (Array.isArray(dadosNfs) ? dadosNfs : []).forEach(nf => {
    const id = String(nf?.[0] || "").trim();
    if (id) mapaNfPorIdEstoque.set(id, nf);
  });
}

function obterPeriodoTextoEstoque(valor) {
  const partes = String(valor || "").split("-").map(p => p.trim()).filter(Boolean);
  return {
    inicial: partes[0] || "",
    final: partes[1] || ""
  };
}

function obterTextoCelulaEstoque(linha, indice) {
  const valor = linha[indice];

  if (indice === COL_EST.NF) {
    return String(valor ?? "").trim() || "SEM NF";
  }

  return valor || "";
}

function obterValorCampoMonetario(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return 0;
  return campo.obterValor ? campo.obterValor() : obterValorMonetarioNumero(campo.value);
}

function aplicarMascaraValorEmElemento(campo) {
  if (!campo) return;
  let atualizando = false;
  campo.setAttribute("inputmode", "numeric");

  campo.addEventListener("keydown", e => {
    const permitidas = [8, 9, 13, 27, 46];
    const ctrl = e.ctrlKey && [65, 67, 86, 88].includes(e.keyCode);
    const nav = e.keyCode >= 35 && e.keyCode <= 39;
    const num = (!e.shiftKey && ((e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 96 && e.keyCode <= 105)));
    if (!(permitidas.includes(e.keyCode) || ctrl || nav || num)) e.preventDefault();
  });

  campo.addEventListener("input", e => {
    if (atualizando) return;
    const soNumeros = e.target.value.replace(/\D/g, "");
    if (!soNumeros) {
      atualizando = true;
      e.target.value = "";
      atualizando = false;
      return;
    }

    let v = soNumeros.slice(0, 9).padStart(3, "0");
    const reais = v.slice(0, -2).replace(/^0+/, "") || "0";
    const centavos = v.slice(-2);
    atualizando = true;
    e.target.value = `R$ ${reais.replace(/\B(?=(\d{3})+(?!\d))/g, ".")},${centavos}`;
    atualizando = false;
  });

  campo.obterValor = () => parseInt((campo.value || "").replace(/\D/g, ""), 10) / 100 || 0;
  campo.definirValor = valor => {
    if (valor === null || valor === undefined || Number.isNaN(Number(valor))) {
      campo.value = "";
      return;
    }
    campo.value = formatarMoedaBR(Number(valor));
  };
}

function aplicarMascaraApenasNumerosFlex(campo) {
  if (!campo) return;
  campo.setAttribute("inputmode", "numeric");
  campo.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 6);
  });
}

function aplicarMascaraSomenteNumeros(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.setAttribute("inputmode", "numeric");
  campo.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "");
  });
}

function aplicarMascaraCpf(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.setAttribute("inputmode", "numeric");
  campo.addEventListener("input", function() {
    let v = this.value.replace(/\D/g, "").slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    this.value = v;
  });
}

function aplicarMascaraCnpj(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.setAttribute("inputmode", "numeric");
  campo.addEventListener("input", function() {
    let v = this.value.replace(/\D/g, "").slice(0, 14);
    v = v.replace(/^(\d{2})(\d)/, "$1.$2");
    v = v.replace(/^(\d{2})\.(\d{3})(\d)/, "$1.$2.$3");
    v = v.replace(/\.(\d{3})(\d)/, ".$1/$2");
    v = v.replace(/(\d{4})(\d)/, "$1-$2");
    this.value = v;
  });
}
