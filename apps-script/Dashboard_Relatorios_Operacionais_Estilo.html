<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: #eef3f8;
  font-family: "DejaVu Sans Mono", monospace;
}

body:not(.sessao-validada) #dashboard_geral {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

body.sessao-validada #dashboard_geral {
  opacity: 1;
  visibility: visible;
}

#dashboard_geral {
  position: absolute;
  top: 8vh;
  left: 0;
  width: 100vw;
  height: 92vh;
  display: flex;
  overflow: hidden;
  background: #eef3f8;
}

#dashboard_nav {
  width: 5%;
  min-width: 62px;
  height: 100%;
  background: #1f252d;
  color: #e5edf6;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  box-shadow: 8px 0 24px rgba(15, 23, 42, 0.18);
  z-index: 4;
}

.dashboard-nav-centro {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.dashboard-nav-btn,
.dashboard-exportar {
  border: none;
  background: transparent;
  color: rgba(229, 237, 246, 0.48);
  cursor: pointer;
  transition: color 0.2s ease, transform 0.2s ease, background-color 0.2s ease;
}

.dashboard-nav-btn {
  width: 44px;
  height: 44px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 1.35rem;
}

.dashboard-nav-btn:hover,
.dashboard-nav-btn.ativo {
  color: #42DCFA;
  background: rgba(66, 220, 250, 0.13);
  transform: translateY(-1px);
}

.dashboard-exportar {
  position: absolute;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  font-size: 1.15rem;
}

.dashboard-exportar:hover {
  color: #42DCFA;
}

.dashboard-exportar span {
  font-size: 0.62rem;
  font-weight: 700;
}

#dashboard_conteudo {
  width: 95%;
  height: 100%;
  padding: 14px;
  overflow: hidden;
  position: relative;
}

.dashboard-carga-bruta {
  position: absolute;
  top: 16px;
  left: 50%;
  width: min(520px, 44vw);
  min-height: 38px;
  padding: 8px 14px 9px;
  border: 1px solid rgba(66, 220, 250, 0.35);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.96);
  box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
  transform: translate(-50%, -8px);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  z-index: 6;
  transition: opacity 0.22s ease, transform 0.22s ease, visibility 0.22s ease;
}

.dashboard-carga-bruta.ativo {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, 0);
}

.dashboard-carga-bruta span {
  display: block;
  margin-bottom: 6px;
  color: #334155;
  font-size: 0.64rem;
  font-weight: 800;
  line-height: 1.25;
  text-align: center;
}

.dashboard-carga-bruta-trilho {
  width: 100%;
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: #e7edf4;
}

.dashboard-carga-bruta-trilho i {
  display: block;
  width: 8%;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #42DCFA, #36DB2E);
  box-shadow: 0 0 12px rgba(66, 220, 250, 0.38);
  transition: width 0.35s ease;
}

.dashboard-controle-bloqueado {
  opacity: 0.46 !important;
  cursor: not-allowed !important;
  pointer-events: none !important;
}

.dashboard-visao {
  display: none;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.dashboard-visao.ativo {
  display: flex;
  flex-direction: column;
}

.dashboard-topo {
  height: 7%;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}

.dashboard-topo-clientes {
  position: relative;
}

.clientes-paginas {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}

.clientes-paginas button {
  min-width: 96px;
}

.dashboard-topo h2 {
  margin: 0;
  color: #111827;

  font-weight: 900;

.dashboard-topo p {
  margin: 4px 0 0;

.dashboard-titulo-linha {

}

.btn-info-dashboard {

  color: #42DCFA;

  align-items: center;
  justify-content: center;

}

.btn-info-dashboard:hover {
  border-color: rgba(66, 220, 250, 0.7);
  transform: translateY(-1px);
}

.dashboard-topo-acoes {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}

.btn-filtro-dashboard,
.tabela-header-dashboard button,
.grafico-titulo button,
.grafico-acoes button,
.janela-botoes button {
  border: 1px solid #e5e7eb;

.btn-filtro-dashboard:focus,

.grafico-titulo button:focus,

.btn-filtro-dashboard:hover,
.tabela-header-dashboard button:hover,
.grafico-titulo button:hover,
.grafico-acoes button:hover,
.janela-botoes button:hover {
  color: #42DCFA;
  border-color: rgba(66, 220, 250, 0.7);
  transform: translateY(-1px);
}

.dashboard-cards {
  height: 17%;
  min-height: 116px;
  display: grid;
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 10px;
  padding-bottom: 12px;
}

.dashboard-cards-estoque {
  height: 17%;

}

}

.dashboard-cards-categorias {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.dash-card-cliente strong {
  font-size: clamp(1.05rem, 1.45vw, 1.42rem);
}

.dash-card-categoria strong {
  font-size: clamp(0.82rem, 1vw, 1.02rem);
}

.dashboard-cards-categorias .dash-card-categoria small {

}

.dashboard-cards-categorias .dash-card-categoria:nth-child(1) small { color: #1d4ed8; }
.dashboard-cards-categorias .dash-card-categoria:nth-child(2) small { color: #16a34a; }
.dashboard-cards-categorias .dash-card-categoria:nth-child(3) small { color: #d97706; }

.dashboard-cards-categorias .dash-card-categoria:nth-child(6) small { color: #dc2626; }

.dash-card {

.card-composto-linha b {

.card-composto-crescimento {

.card-composto-crescimento.positivo {

.dashboard-miolo {
