/* ================================================================================================================
   LAYOUT DO CALENDÁRIO
   ============================================================================================================== */

/* Painel da esquerda */
.datepicker-date-display{
  background-color: black !important;
}
.datepicker-date-display .date-text,
.datepicker-date-display .year-text{
  color: #fff !important;
}

/* ===== DIAS (NÚMEROS) PRETOS ===== */
.datepicker-table td .datepicker-day-button{
  color: #000 !important;
}

/* Dia de hoje (mantém preto) */
.datepicker-table td.is-today .datepicker-day-button{
  color: #000 !important;
}

/* Dias de outros meses (opcional mais claro) */
.datepicker-table td.is-outside-current-month .datepicker-day-button{
  color: rgba(0,0,0,.35) !important;
}

/* ===== DIA SELECIONADO: bolinha azul + número branco ===== */
.datepicker-table td.is-selected{
  background-color: black !important;
}
.datepicker-table td.is-selected .datepicker-day-button{
  color: #fff !important;
}

/* Hover */
.datepicker-table td .datepicker-day-button:hover{
  background-color: rgba(6, 6, 61, 0.12) !important;
}

/* Arredonda o “quadro” inteiro do datepicker */
.datepicker-modal,
.datepicker-container{
  border-radius: 14px !important;
  overflow: hidden !important; /* garante que o painel azul também respeite o raio */
}

/* (Opcional) arredonda o painel da esquerda também */
.datepicker-date-display{
  border-top-left-radius: 14px !important;
  border-bottom-left-radius: 14px !important;
}

/* Dias bloqueados (futuros): deixa bem cinza e sem interação visual */
.datepicker-table td.is-disabled .datepicker-day-button{
  color: rgba(0,0,0,.28) !important;   /* número cinza */
  cursor: not-allowed !important;
}

/* Remove hover nos dias desabilitados */
.datepicker-table td.is-disabled .datepicker-day-button:hover{
  background: transparent !important;
}

/* Aumenta a largura do calendário para caber nomes de meses longos */
.datepicker-container{
  min-width: 380px !important;  /* ajuste: 360~420 */
}

/* Garante que o texto do mês não quebre e tenha espaço */
.datepicker-controls{
  width: 100% !important;
}

.datepicker-controls .month-text,
.datepicker-controls .year-text{
  white-space: nowrap !important;
}

/* Entre início e fim */
.datepicker-table td.range-between{
  background-color: rgba(6, 6, 61, 0.18) !important;
}

/* Início e fim (bolinha azul) */
.datepicker-table td.range-start,
.datepicker-table td.range-end{
  background-color: black !important;
}

/* Animações */
