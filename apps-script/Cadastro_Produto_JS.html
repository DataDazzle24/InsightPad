function validarEstoqueMaximoMinimo(valorMax, valorMin) {
  const max = parseInt(valorMax, 10) || 0;
  const min = parseInt(valorMin, 10) || 0;

  if (max <= 0) {
    return { valido: false, mensagem: 'O estoque mÃ¡ximo deve ser maior que zero.' };
  }

  if (max <= min) {
    return { valido: false, mensagem: 'O estoque mÃ¡ximo deve ser maior que o estoque mÃ­nimo.' };
  }

  return { valido: true };
}

const controleToastEstoque = {
  cadastro: 0,
  edicao: 0
};

function mostrarToastEstoqueComThrottle(chave, mensagem) {
  const agora = Date.now();
  const ultimo = controleToastEstoque[chave] || 0;

  if (agora - ultimo > 1200) {
    toastr.warning(mensagem);
    controleToastEstoque[chave] = agora;
  }
}

function validarEstoqueEmTempoReal(prefixo = '') {
  const inputMax = document.getElementById(`input${prefixo}Estmaximo`);
  const inputMin = document.getElementById(`input${prefixo}Estminimo`);

  if (!inputMax || !inputMin) return;

  const valorMaxBruto = String(inputMax.value || '').trim();
  const valorMinBruto = String(inputMin.value || '').trim();

  // sem nada preenchido, nÃ£o faz nada
  if (!valorMaxBruto && !valorMinBruto) return;

  const max = parseInt(valorMaxBruto, 10) || 0;
  const min = parseInt(valorMinBruto, 10) || 0;

  const chave = prefixo === 'Editar' ? 'edicao' : 'cadastro';

  if (valorMaxBruto && max <= 0) {
    mostrarToastEstoqueComThrottle(chave, 'O estoque mÃ¡ximo deve ser maior que zero.');
    return;
  }

  // sÃ³ compara se ambos estiverem preenchidos
  if (valorMaxBruto && valorMinBruto && max <= min) {
    mostrarToastEstoqueComThrottle(chave, 'O estoque mÃ¡ximo deve ser sempre maior que o estoque mÃ­nimo.');
  }
}

function configurarValidacaoEstoqueTempoReal() {
  [
    'inputEstmaximo',
    'inputEstminimo',
    'inputEditarEstmaximo',
    'inputEditarEstminimo'
  ].forEach(function(id) {
    const campo = document.getElementById(id);
    if (!campo) return;

    campo.addEventListener('input', function() {
      const prefixo = id.includes('Editar') ? 'Editar' : '';
      validarEstoqueEmTempoReal(prefixo);
    });

    campo.addEventListener('change', function() {
      const prefixo = id.includes('Editar') ? 'Editar' : '';
      validarEstoqueEmTempoReal(prefixo);
    });
  });
}

    const flagCombo = (linha[18] ?? '').toString().trim().toUpperCase();

    // SÃ³ entra se coluna J for "NÃ£o"
    if (flagCombo !== 'SIM' && nomeProduto) {
      set.add(nomeProduto);

      // =========================
      // NOVO: itensProd (A e B)
      // =========================
      const codigo = (linha[0] ?? '').toString().trim();   // Coluna A
      if (!mapItens.has(nomeProduto)) {
        mapItens.set(nomeProduto, { codigo: codigo, nome: nomeProduto });
      }
    }
  });

  // Distintos + ordenado
  todosprodutos = Array.from(set).sort((a, b) => a.localeCompare(b, 'pt-BR'));

  // NOVO: lista de objetos ordenada por nome
  const itensProd = Array.from(mapItens.values())
    .sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));

  // Expondo para uso global (se preferir const local apenas, posso ajustar)
  window.itensProd = itensProd;

function carregarListaProdutosPromocao() {
  if (!Array.isArray(dadosTabelaProd) || dadosTabelaProd.length === 0) {
    todosprodutosPromocao = [];
    return;
  }

  const nomes = new Set();

  dadosTabelaProd.forEach(function(linha) {

    const nome = String(linha[3] || '').trim();
    if (nome) nomes.add(nome);

  todosprodutosPromocao = Array.from(nomes).sort(function(a, b) {

  });
}

function parseMoedaBR(valor) {
  return parseFloat(
    String(valor || '')
      .replace(/[^\d,.-]/g, '')
      .replace(/\./g, '')
      .replace(',', '.')
  ) || 0;
}

function brDateTimeToInputDateTimeLocal(valor) {
  const texto = String(valor || '').trim();
  if (!texto) return '';

  const partes = texto.split(' ');
  const data = partes[0] || '';
  const hora = partes[1] || '00:00';

  const [dd, mm, yyyy] = data.split('/');
  if (!dd || !mm || !yyyy) return '';

  const horaSemSegundos = hora.slice(0, 5);

  return `${yyyy}-${mm}-${dd}T${horaSemSegundos}`;
}

function inputDateTimeLocalToTimestamp(valor) {
  if (!valor) return 0;
  const dt = new Date(valor);
  return isNaN(dt.getTime()) ? 0 : dt.getTime();
}

  }

  const linhaProduto = mapaProdutoPorNome.get(nomeNormalizado);

  if (!linhaProduto) {

function recalcularLucroPromocao() {
  if (!inputPromocaoPrecoVenda || !inputPromocaoPrecoCusto || !inputPromocaoLucro) return;

  const venda = typeof inputPromocaoPrecoVenda.obterValor === 'function'
    ? inputPromocaoPrecoVenda.obterValor()
    : 0;

  const custo = typeof inputPromocaoPrecoCusto.obterValor === 'function'
    ? inputPromocaoPrecoCusto.obterValor()
    : 0;

  const valorVendaBruto = String(inputPromocaoPrecoVenda.value || '').trim();
  const valorCustoBruto = String(inputPromocaoPrecoCusto.value || '').trim();

  if (!valorVendaBruto && !valorCustoBruto) {
    if (typeof inputPromocaoLucro.definirValor === 'function') {
      inputPromocaoLucro.definirValor(null);
    }
    return;
  }

  const lucro = venda - custo;

  if (typeof inputPromocaoLucro.definirValor === 'function') {
    inputPromocaoLucro.definirValor(lucro);
  }

  if (valorVendaBruto && valorCustoBruto && custo > venda) {
    mostrarToastLucroPromocaoComThrottle(
      'AtenÃ§Ã£o: esta promoÃ§Ã£o estÃ¡ com prejuÃ­zo. O preÃ§o promocional estÃ¡ menor que o custo.'
    );
  }
}

function exportarLinhasParaCSV(cabecalho, linhas, nomeArquivo) {
  const limparTexto = (t) => String(t ?? '').replace(/\s+/g, ' ').trim();
  const csvEscape = (valor) => {
    const v = limparTexto(valor);
    const precisaAspas = /[",\n\r]/.test(v);
    const vEsc = v.replace(/"/g, '""');
    return precisaAspas ? `"${vEsc}"` : vEsc;
  };

  const linhasCSV = [];
  linhasCSV.push((cabecalho || []).map(csvEscape).join(','));

  (linhas || []).forEach(function(linha) {
    linhasCSV.push((linha || []).map(csvEscape).join(','));
  });

  const csvFinal = '\uFEFF' + linhasCSV.join('\r\n');
  const blob = new Blob([csvFinal], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nomeArquivo || 'Historico_Promocoes.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Aplica mÃ¡scara R$ 0,00 com entrada da direita para esquerda
// Agora: nÃ£o preenche o campo no inÃ­cio (placeholder aparece). SÃ³ mostra "R$ 0,00" quando o usuÃ¡rio comeÃ§ar a digitar.
function aplicarMascaraValor(idCampo) {
  const campo = document.getElementById(idCampo);
  if (!campo) return console.error('Campo nÃ£o encontrado:', idCampo);

  // NÃƒO define valor inicial -> permite placeholder
  // campo.value = 'R$ 0,00';

  // Flag para evitar loops quando setamos value via cÃ³digo
  let atualizando = false;

  campo.addEventListener('focus', e => {
    setTimeout(() => {
      const len = e.target.value.length;
      e.target.setSelectionRange(len, len);
    });
  });

  campo.addEventListener('keydown', e => {
    const permitidas = [8, 9, 13, 27, 46]; // backspace, tab, enter, esc, del
    const ctrl = e.ctrlKey && [65, 67, 86, 88].includes(e.keyCode); // A,C,V,X
    const nav = e.keyCode >= 35 && e.keyCode <= 39; // setas, home, end
    const num = (!e.shiftKey && ((e.keyCode >= 48 && e.keyCode <= 57) || (e.keyCode >= 96 && e.keyCode <= 105)));

    if (!(permitidas.includes(e.keyCode) || ctrl || nav || num)) e.preventDefault();
  });

  campo.addEventListener('input', e => {
    if (atualizando) return;

    // Se o usuÃ¡rio apagou tudo, mantÃ©m vazio para aparecer o placeholder
    const soNumeros = e.target.value.replace(/\D/g, '');
    if (soNumeros.length === 0) {
      atualizando = true;
      e.target.value = '';
      atualizando = false;
      return;
    }

    // MantÃ©m sua lÃ³gica original, sÃ³ que sÃ³ roda quando houver dÃ­gitos
    let v = soNumeros.slice(0, 9) || '0';
    v = v.padStart(3, '0');
    const reais = v.slice(0, -2).replace(/^0+/, '') || '0';
    const centavos = v.slice(-2);

    atualizando = true;
    e.target.value = `R$ ${reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${centavos}`;
    atualizando = false;
  });

  campo.obterValor = () => parseInt((campo.value || '').replace(/\D/g, '')) / 100 || 0;

  campo.definirValor = valor => {
    // Se quiser "definir vazio", passe null/undefined/NaN
    if (valor === null || valor === undefined || Number.isNaN(valor)) {
      campo.value = '';
      return;
    }

    let v = Math.round(valor * 100).toString().padStart(3, '0').slice(0, 9);
    const reais = v.slice(0, -2).replace(/^0+/, '') || '0';
    const centavos = v.slice(-2);

    campo.value = `R$ ${reais.replace(/\B(?=(\d{3})+(?!\d))/g, '.')},${centavos}`;
  };
}

function construirLinhasTabelaComJoin() {
  const linhasFinais = [];

  if (!Array.isArray(dadosTabelaProd) || dadosTabelaProd.length === 0) {
    return linhasFinais;
  }

  const mapaCategoria = new Map(
    (Array.isArray(itensCat) ? itensCat : []).map(item => [
      String(item.codigo || '').trim(),
      String(item.nome || '').trim()
    ])
  );

  const mapaSubcategoria = new Map(
    (Array.isArray(todassubcategorias) ? todassubcategorias : []).map(item => [
      String(item.codigo || '').trim(),
      String(item.nome || '').trim()
    ])
  );

  const mapaFornecedor = new Map(
    (Array.isArray(itensForn) ? itensForn : []).map(item => [
      String(item.codigo || '').trim(),
      String(item.nome || '').trim()
    ])
  );

  const mapaNomeProdutoPorId = new Map(
    dadosTabelaProd.map(prod => [
      String(prod[0] || '').trim(),
      String(prod[3] || '').trim()
    ])
  );

  const mapaSaidasPorProduto = new Map();

  if (Array.isArray(dadosTabelaSaida)) {
    dadosTabelaSaida.forEach(saida => {
      if (!Array.isArray(saida)) return;

      const idProduto = String(saida[0] || '').trim();
      if (!idProduto) return;

      if (!mapaSaidasPorProduto.has(idProduto)) {
        mapaSaidasPorProduto.set(idProduto, []);
      }

      mapaSaidasPorProduto.get(idProduto).push(saida);
    });
  }

  dadosTabelaProd.forEach(produto => {
    if (!Array.isArray(produto)) return;

    const idProduto = String(produto[0] || '').trim();

    const linhaBase = [
      produto[0] || "",                                                       // 0 ID
      produto[1] || "",                                                       // 1 EM_PROMOCAO
      produto[3] || "",                                                       // 2 NOME_PRODUTO
      produto[4] || "",                                                       // 3 COD_INTERNO_PROD
      mapaCategoria.get(String(produto[5] || '').trim()) || produto[5] || "", // 4 CATEGORIA
      mapaSubcategoria.get(String(produto[6] || '').trim()) || produto[6] || "", // 5 SUBCATEGORIA
      produto[7] || "",                                                       // 6 EAN
      produto[8] || "",                                                       // 7 MARCA
      produto[9] || "",                                                       // 8 TIPO_TAMANHO
      produto[10] || "",                                                      // 9 TAMANHO
      produto[11] || "",                                                      // 10 COR
      mapaFornecedor.get(String(produto[12] || '').trim()) || produto[12] || "", // 11 FORNECEDOR
      produto[13] || "",                                                      // 12 EST_MAXIMO
      produto[14] || "",                                                      // 13 EST_MINIMO
      produto[15] || "",                                                      // 14 PRECO_VENDA
      produto[16] || "",                                                      // 15 PRECO_CUSTO
      produto[17] || "",                                                      // 16 OBSERVACAO
      produto[18] || "",                                                      // 17 COMBO
      "",                                                                     // 18 PRODUTO DE SAÃDA
      "",                                                                     // 19 QTD. SAÃDA
      "",                                                                     // 20 VALOR UNITÃRIO
      produto[19] || "",                                                      // 21 CRIADO_EM
      produto[20] || ""                                                       // 22 EDITADO_EM
    ];

    const saidasDoProduto = mapaSaidasPorProduto.get(idProduto) || [];

    if (saidasDoProduto.length === 0) {
      linhasFinais.push(linhaBase);
      return;
    }

    saidasDoProduto.forEach(saida => {
      const idProdutoSaida = String(saida[1] || '').trim();
      const nomeProdutoSaida = mapaNomeProdutoPorId.get(idProdutoSaida) || `ID ${idProdutoSaida}`;

      const linhaJoin = linhaBase.slice();
      linhaJoin[18] = nomeProdutoSaida; // PRODUTO DE SAÃDA
      linhaJoin[19] = saida[2] || "";   // QTD
      linhaJoin[20] = saida[3] || "";   // VALOR UNITÃRIO

      linhasFinais.push(linhaJoin);
    });
  });

  return linhasFinais;
}

function carregarDadosIniciais() {
  const corpoTabela = document.getElementById("tb_corpo");

  // sempre que a tabela Ã© reconstruÃ­da, a seleÃ§Ã£o antiga deixa de valer

function obterLinhasSelecionadasValidas() {

function limparSelecaoLinhas() {
    linhasSelecionadas.forEach(function(linha) {
        if (linha && linha.classList) linha.classList.remove("selecionada");
    });
    linhasSelecionadas = [];
    linhaSelecionada = null;
}

// Marca linha selecionada (verde) ou desmarca se clicar novamente
function selecionarLinha(linha, evento) {
    const selecaoMultipla = !!(evento && (evento.ctrlKey || evento.metaKey));
    obterLinhasSelecionadasValidas();

    if (selecaoMultipla) {
        const indiceLinha = linhasSelecionadas.indexOf(linha);
        if (indiceLinha >= 0) {
            linha.classList.remove("selecionada");
            linhasSelecionadas.splice(indiceLinha, 1);
        } else {
            linha.classList.add("selecionada");
            linhasSelecionadas.push(linha);
        }
    } else {
        const jaSelecionadaUnica = linhasSelecionadas.length === 1 && linhasSelecionadas[0] === linha;
        limparSelecaoLinhas();
        if (!jaSelecionadaUnica) {
            linha.classList.add("selecionada");
            linhasSelecionadas = [linha];
        }
    }

    linhaSelecionada = linhasSelecionadas.length ? linhasSelecionadas[linhasSelecionadas.length - 1] : null;
}

// ==============================================================================================================================================
// FUNÃ‡ÃƒO: ATIVAR O LEITOR DE CÃ“DIGO DE BARRAS PARA OS CAMPOS DE EAN
// ==============================================================================================================================================

function habilitarLeitorSomenteEAN() {
  const allowedIds = new Set(['inputEAN', 'inputEditarEAN']);

  // Buffer para capturar o "digitar rÃ¡pido" do leitor
  let buffer = '';
  let lastTime = 0;
  let scannerMode = false;

  // Ajustes finos
  const MAX_INTERVAL_MS = 35;   // intervalo tÃ­pico entre teclas do leitor (muito rÃ¡pido)
  const MIN_LEN_TO_TREAT_AS_SCAN = 6; // mÃ­nimo de chars p/ considerar leitura (EAN geralmente > 8)

  function isAllowedTarget(target) {
    return target && target.id && allowedIds.has(target.id);
  }

  function isPrintableKey(e) {
    // teclas que "produzem caractere"
    return e.key && e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey;
  }

  // Captura em fase "capture" para conseguir bloquear antes de preencher outros inputs
  document.addEventListener('keydown', function (e) {
    const target = e.target;

    // Se estÃ¡ usando ctrl/cmd/alt, ignore (atalhos)
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    const dt = now - lastTime;
    lastTime = now;

    // Se veio muito rÃ¡pido, Ã© forte candidato a leitor
    // (scannerMode liga apÃ³s alguns caracteres rÃ¡pidos em sequÃªncia)
    if (dt > 0 && dt <= MAX_INTERVAL_MS) {
      // sÃ³ acumula caracteres imprimÃ­veis e Enter
      if (isPrintableKey(e)) {
        buffer += e.key;
      } else if (e.key === 'Enter') {
        // final da leitura
      }
      if (buffer.length >= MIN_LEN_TO_TREAT_AS_SCAN) scannerMode = true;
    } else {
      // lento demais: provavelmente digitaÃ§Ã£o humana -> reseta
      buffer = '';
      scannerMode = false;
      return;
    }

    // Se detectou padrÃ£o de leitor e o foco NÃƒO Ã© permitido, bloqueia a digitaÃ§Ã£o
    if (scannerMode && !isAllowedTarget(target)) {
      // bloqueia caracteres e Enter para nÃ£o "escrever" no campo errado
      if (isPrintableKey(e) || e.key === 'Enter') {
        e.preventDefault();
        e.stopPropagation();
      }
    }
  }, true);

  // Quando Enter vem (final da leitura), decide se aplica ou descarta
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;

    const target = e.target;

    // Se nÃ£o estamos em modo scanner, nÃ£o mexe
    if (!scannerMode) {
      buffer = '';
      return;
    }

    // Se o foco Ã© permitido, preenche o input com o buffer (EAN)
    if (isAllowedTarget(target)) {
      e.preventDefault(); // evita submit acidental
      target.value = buffer;

      // Dispara evento input para seus listeners reagirem (filtro, validaÃ§Ã£o, etc.)
      target.dispatchEvent(new Event('input', { bubbles: true }));
    } else {
      // foco nÃ£o permitido: apenas descarta (e jÃ¡ estamos bloqueando a digitaÃ§Ã£o)
      e.preventDefault();
    }

    // reseta
    buffer = '';
    scannerMode = false;

  }, true);

  // Se o usuÃ¡rio clicar fora/blur, nÃ£o mantÃ©m buffer pendurado
  document.addEventListener('click', function () {
    buffer = '';
    scannerMode = false;
  }, true);
}

function atualizarCamposSaida() {
  const get = (id) => document.getElementById(id);

  function wrapperOf(el) {
    return el?.closest?.('.form-group') ||
           el?.closest?.('.dropdown-container') ||
           el?.parentElement ||
           el;
  }

  function setVisible(el, visible) {
    if (!el) return;
    const w = wrapperOf(el);
    if (w) w.style.display = visible ? '' : 'none';
  }

  function setEnabled(el, enabled) {
    if (!el) return;
    el.disabled = !enabled;
    el.style.backgroundColor = enabled ? '' : '#e0e0e0';
  }

  function hasValue(el) {
    return !!(el && String(el.value || '').trim() !== '');
  }

  function clearValue(el) {
    if (!el) return;
    el.value = '';
  }

  function getOrder(prefix) {
    return [
      `input${prefix}Prodsaida1`, `input${prefix}Qtdsaida1`, `input${prefix}Valorsaida1`,
      `input${prefix}Prodsaida2`, `input${prefix}Qtdsaida2`, `input${prefix}Valorsaida2`,
      `input${prefix}Prodsaida3`, `input${prefix}Qtdsaida3`, `input${prefix}Valorsaida3`,
    ];
  }

  // =========================
  // CADASTRO (mantido igual)
  // =========================
  function applyCadastro() {
    const chk = get('inputProdutoCombo') || get('inputCheckbox');
    const checked = !!chk?.checked;

    const els = getOrder('').map(get);

    // Checkbox desmarcada -> ESCONDE, BLOQUEIA e LIMPA
    if (!checked) {
      els.forEach(el => {
        setVisible(el, false);
        setEnabled(el, false);
        clearValue(el);
      });
      return;
    }

    // Checkbox marcada -> mostra tudo
    els.forEach(el => setVisible(el, true));

    // Cascata baseada em "tem valor" no anterior
    for (let i = 0; i < els.length; i++) {
      const el = els[i];
      if (!el) continue;

      if (i === 0) {
        setEnabled(el, true);
        continue;
      }

      const prev = els[i - 1];
      const prevFilled = hasValue(prev);

      if (prevFilled) {
        setEnabled(el, true);
      } else {
        for (let j = i; j < els.length; j++) {
          if (!els[j]) continue;
          setEnabled(els[j], false);
          clearValue(els[j]);
        }
        break;
      }
    }
  }

  // =========================
  // EDIÃ‡ÃƒO (AJUSTADO)
  // =========================
  function applyEdicao() {
    const chk = get('inputEditarProdutoCombo') || get('inputEditarCheckbox');
    const checked = !!chk?.checked;

    const els = getOrder('Editar').map(get);

    // 1) Checkbox DESMARCADA: NÃƒO MOSTRA campos de saÃ­da (produto simples)
    if (!checked) {
      els.forEach(el => {
        setVisible(el, false);
        setEnabled(el, false);
        // NÃƒO limpamos aqui para nÃ£o apagar dados se usuÃ¡rio sÃ³ desmarcar/remarcar
      });
      return;
    }

    // 2) Checkbox MARCADA: mostra tudo
    els.forEach(el => setVisible(el, true));

    // Se for "virar combo" (produto simples -> marcou checkbox), normalmente estarÃ¡ tudo vazio.
    // Nesse caso, aplica cascata igual cadastro (e limpa/trava a partir do primeiro vazio).
    const anyFilled = els.some(hasValue);

    if (!anyFilled) {
      // Cascata igual ao cadastro, porÃ©m SEM precisar digitar (baseado em valor)
      for (let i = 0; i < els.length; i++) {
        const el = els[i];
        if (!el) continue;

        if (i === 0) {
          setEnabled(el, true); // prod1 habilitado
          continue;
        }

        const prev = els[i - 1];
        const prevFilled = hasValue(prev);

        if (prevFilled) {
          setEnabled(el, true);
        } else {
          // trava + limpa daqui pra frente (pra aparecerem em branco e na ordem)
          for (let j = i; j < els.length; j++) {
            if (!els[j]) continue;
            setEnabled(els[j], false);
            clearValue(els[j]);
          }
          break;
        }
      }
      return;
    }

    // Caso "combo": jÃ¡ existem valores preenchidos ao abrir o modal.
    // Queremos: campos preenchidos habilitados + o prÃ³ximo campo da sequÃªncia habilitado.
    // ImplementaÃ§Ã£o: cascata baseada no valor do campo anterior, SEM limpar.
    for (let i = 0; i < els.length; i++) {
      const el = els[i];
      if (!el) continue;

      if (i === 0) {
        setEnabled(el, true);
        continue;
      }

      const prev = els[i - 1];
      const prevFilled = hasValue(prev);

      if (prevFilled) {
        // se o anterior tem valor, o atual fica habilitado (mesmo que vazio: ele Ã© o "prÃ³ximo")
        setEnabled(el, true);
      } else {
        // a partir do momento que o anterior estÃ¡ vazio, bloqueia os prÃ³ximos (sem limpar)
        for (let j = i; j < els.length; j++) {
          if (!els[j]) continue;
          setEnabled(els[j], false);
        }
        break;
      }
    }
  }

  applyCadastro();
  applyEdicao();

  ['', 'Editar'].forEach(function(prefixo) {
    for (let i = 1; i <= 3; i++) {
      atualizarValorAtualProdutoSaida(prefixo, i);
    }
  });
}

// - Garante que seleÃ§Ã£o via UL (LI) tambÃ©m atualize a cascata, mesmo sem digitar
// =================================================================================================
function configurarCamposSaidaCombo() {
  const idsParaOuvir = [
    // Cadastro
    'inputProdutoCombo', 'inputCheckbox',
    'inputProdsaida1','inputQtdsaida1','inputValorsaida1',
    'inputProdsaida2','inputQtdsaida2','inputValorsaida2',
    'inputProdsaida3','inputQtdsaida3','inputValorsaida3',

    // EdiÃ§Ã£o
    'inputEditarProdutoCombo', 'inputEditarCheckbox',
    'inputEditarProdsaida1','inputEditarQtdsaida1','inputEditarValorsaida1',
    'inputEditarProdsaida2','inputEditarQtdsaida2','inputEditarValorsaida2',
    'inputEditarProdsaida3','inputEditarQtdsaida3','inputEditarValorsaida3',
  ];

  // Set global (pra funcionar mesmo se vocÃª chamar configurarCamposSaidaCombo() mais de uma vez)
  if (!document.__ulsSugestoesProd) document.__ulsSugestoesProd = new Set();
  const ulsSugestoesProd = document.__ulsSugestoesProd;

  idsParaOuvir.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;

    const isCheckbox = id.includes('Combo') || id.includes('Checkbox');
    const isProdDrop  = id.includes('Prodsaida');

    if (isCheckbox) {
      el.addEventListener('change', atualizarCamposSaida);
      el.addEventListener('click', atualizarCamposSaida);
      return;
    }

    el.addEventListener('input', atualizarCamposSaida);
    el.addEventListener('change', atualizarCamposSaida);
    el.addEventListener('blur', atualizarCamposSaida);

    if (isProdDrop) {
      const container = el.closest('.dropdown-container') || el.parentElement;
      const ul = container?.querySelector('ul.sugestoes') || container?.querySelector('ul');
      if (ul) ulsSugestoesProd.add(ul);

      el.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') setTimeout(atualizarCamposSaida, 0);
      });
    }
  });

  // Listener global CAPTURE: clique em LI dentro das ULs -> atualiza cascata depois de preencher o input
  if (!document.__listenerDropdownSaidaCapture) {
    document.addEventListener('click', function (e) {
      const li = e.target.closest('li');
      if (!li) return;

      const ul = li.closest('ul');
      if (!ul) return;

      if (!document.__ulsSugestoesProd || !document.__ulsSugestoesProd.has(ul)) return;

      setTimeout(atualizarCamposSaida, 0);
    }, true);

    document.__listenerDropdownSaidaCapture = true;
  }

  // Ajusta estado inicial
  atualizarCamposSaida();
}

function calcularTotaisCombo(prefixo = '') {
  const isEdit = prefixo === 'Editar';

  const inputCombo = document.getElementById(`input${prefixo}ProdutoCombo`);
  const inputPrecoVenda = document.getElementById(`input${prefixo}PrecoVenda`);
  const inputPrecoCusto = document.getElementById(`input${prefixo}PrecoCusto`);
  const inputLucro = document.getElementById(`input${prefixo}Lucro`);

  if (!inputCombo || !inputPrecoVenda || !inputPrecoCusto || !inputLucro) return;

  if (!inputCombo.checked) {
    inputPrecoVenda.readOnly = false;
    inputPrecoCusto.readOnly = false;

    inputPrecoVenda.classList.remove('input-bloqueado');
    inputPrecoCusto.classList.remove('input-bloqueado');

    if (isEdit) recalcularLucroSimplesEdicao();
    else recalcularLucroSimples();

    return;
  }

  let totalVenda = 0;
  let totalCusto = 0;

  for (let i = 1; i <= 3; i++) {
    const inputProd = document.getElementById(`input${prefixo}Prodsaida${i}`);
    const inputQtd = document.getElementById(`input${prefixo}Qtdsaida${i}`);
    const inputValor = document.getElementById(`input${prefixo}Valorsaida${i}`);

    const nomeProduto = String(inputProd?.value || '').trim().toUpperCase();
    const qtd = parseFloat(String(inputQtd?.value || '0').replace(',', '.')) || 0;
    const valorVenda = inputValor?.obterValor ? inputValor.obterValor() : 0;

    if (nomeProduto && qtd > 0) {
      totalVenda += qtd * valorVenda;

      const linhaProduto = mapaProdutoPorNome.get(nomeProduto);
      if (linhaProduto) {
        const precoCustoItem = parseFloat(
          String(linhaProduto[16] || '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.')
        ) || 0;

        totalCusto += qtd * precoCustoItem;
      }
    }
  }

  inputPrecoVenda.readOnly = true;
  inputPrecoCusto.readOnly = true;

  inputPrecoVenda.classList.add('input-bloqueado');
  inputPrecoCusto.classList.add('input-bloqueado');

  if (inputPrecoVenda.definirValor) inputPrecoVenda.definirValor(totalVenda);
  if (inputPrecoCusto.definirValor) inputPrecoCusto.definirValor(totalCusto);

  const lucro = totalVenda - totalCusto;
  if (inputLucro.definirValor) inputLucro.definirValor(lucro);
}

// ====== Range Datepicker (2 cliques) ======
function initDatepickerRange(input, i18nBR) {
  const fmt = (d) => {
    const dd = String(d.getDate()).padStart(2, "0");
    const mm = String(d.getMonth() + 1).padStart(2, "0");
    const yy = d.getFullYear();
    return `${dd}/${mm}/${yy}`;
  };

  // Estado por input
  let start = null;
  let end = null;

  const instance = M.Datepicker.init(input, {
    format: 'dd/mm/yyyy',         // nÃ£o usamos direto no input, mas ok manter
    maxDate: new Date(),
    autoClose: false,             // IMPORTANTÃSSIMO: nÃ£o fecha no 1Âº clique
    showClearBtn: true,
    yearRange: 100,
    i18n: i18nBR,

    onOpen() {
      // Quando abrir, redesenha highlight (se jÃ¡ tiver start/end)
      setTimeout(() => highlightRange(instance, start, end), 0);
    },

    onSelect(date) {
      // date vem como Date
      if (!start || (start && end)) {
        // 1Âº clique (ou reinÃ­cio)
        start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        end = null;

        // opcional: limpa o input atÃ© fechar, ou mostra o comeÃ§o
        input.value = `${fmt(start)} - `;
        setTimeout(() => highlightRange(instance, start, end), 0);
        return;
      }

      // 2Âº clique
      const picked = new Date(date.getFullYear(), date.getMonth(), date.getDate());

      // se clicou antes do start, inverte
      if (picked.getTime() < start.getTime()) {
        end = start;
        start = picked;
      } else {
        end = picked;
      }

      input.value = `${fmt(start)} - ${fmt(end)}`;

      setTimeout(() => highlightRange(instance, start, end), 0);

      // agora pode fechar
      instance.close();
    }
  });

  // Clique no "Limpar" (Materialize nÃ£o expÃµe callback direto, entÃ£o limpamos ao apagar)
  input.addEventListener("input", () => {
    if (!input.value.trim()) {
      start = null;
      end = null;
      const inst = M.Datepicker.getInstance(input);
      if (inst) setTimeout(() => highlightRange(inst, start, end), 0);
    }
  });
}


// ====== Pinta o intervalo no calendÃ¡rio ======
function highlightRange(instance, start, end) {
  if (!instance || !instance.datepickerEl) return;

  const root = instance.datepickerEl;
  const tds = root.querySelectorAll(".datepicker-table td");

  // limpa classes antigas
  tds.forEach(td => {
    td.classList.remove("range-start", "range-end", "range-between");
  });

  if (!start) return;

  const startT = start.getTime();
  const endT = end ? end.getTime() : null;

  tds.forEach(td => {
    const btn = td.querySelector(".datepicker-day-button");
    if (!btn) return;

    // tenta ler data do DOM do Materialize
    const day = parseInt(btn.getAttribute("data-day"), 10);
    const month = parseInt(btn.getAttribute("data-month"), 10);
    const year = parseInt(btn.getAttribute("data-year"), 10);

    if (Number.isNaN(day) || Number.isNaN(month) || Number.isNaN(year)) return;

    const cellDate = new Date(year, month, day);
    const cellT = cellDate.getTime();

    // 1 clique: marca sÃ³ o inÃ­cio
    if (!endT) {
      if (cellT === startT) td.classList.add("range-start");
      return;
    }

    // 2 cliques: marca intervalo
    if (cellT === startT) td.classList.add("range-start");
    else if (cellT === endT) td.classList.add("range-end");
    else if (cellT > startT && cellT < endT) td.classList.add("range-between");
  });
}

function configurarDropdown(inputCampo, listaUl, dados) {
  if (!inputCampo || !listaUl) return;
  let timeoutId = null;

  // EVENTO: DIGITAÃ‡ÃƒO NO CAMPO DE PESQUISA =======================================================
  inputCampo.addEventListener('input', function (e) {
    const texto = e.target.value;

    // Cancela timeout anterior (debounce)
    if (timeoutId) clearTimeout(timeoutId);

    // Aguarda 300ms apÃ³s parar de digitar para filtrar
    timeoutId = setTimeout(function () {
      filtrarEMostrarSugestoes(texto, dados, listaUl, inputCampo);
    }, 300);
  });

  document.addEventListener('click', function (e) {
  // NÃƒO fecha se clicou dentro do prÃ³prio input ou dentro da lista
  if (e.target === inputCampo || listaUl.contains(e.target)) return;

  // NÃƒO fecha se clicou dentro do container do dropdown
  if (e.target.closest('.dropdown-container')) return;

  esconderSugestoes(listaUl);
  });

  // EVENTO: FOCO NO CAMPO - MOSTRA TODAS AS OPÃ‡Ã•ES ================================================
  inputCampo.addEventListener('focus', function () {
      mostrarSugestoes(dados, listaUl, inputCampo);
  });

  // EVENTO: CLICAR FORA - FECHA DROPDOWN ==========================================================
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dropdown-container')) {
      esconderSugestoes(listaUl);
    }
  });

  // EVENTO: NAVEGAÃ‡ÃƒO POR TECLADO =================================================================
  inputCampo.addEventListener('keydown', function (e) {
    const items = listaUl.querySelectorAll('li');
    const selected = listaUl.querySelector('li.selected');

    switch (e.key) {
      case 'ArrowDown':
        e.preventDefault();
        navegarSugestoes(items, selected, 'down');
        break;
      case 'ArrowUp':
        e.preventDefault();
        navegarSugestoes(items, selected, 'up');
        break;
      case 'Enter':
        e.preventDefault();
        if (selected) {
          selecionarOpcao(selected.textContent, inputCampo, listaUl);
        }
        break;
      case 'Escape':
        esconderSugestoes(listaUl);
        break;
    }
  });
}

// Filtra dados e exibe sugestÃµes ===================================================================================
function filtrarEMostrarSugestoes(texto, dados, listaUl, inputCampo) {
 const textoFiltro = (texto || '').trim().toLowerCase();
  if (textoFiltro === '') {
    mostrarSugestoes(dados, listaUl, inputCampo);
    return;
  }
  const filtrados = dados.filter(item => item.toLowerCase().includes(textoFiltro));
  mostrarSugestoes(filtrados, listaUl, inputCampo);
}

// Exibe a lista de sugestÃµes =======================================================================================
function mostrarSugestoes(lista, listaUl, inputCampo) {
  listaUl.innerHTML = '';

  if (lista.length === 0) {
    const noResults = document.createElement('li');
    noResults.textContent = 'Nenhum resultado encontrado';
    noResults.style.cssText = 'padding: 10px; color: #666; font-style: italic;';
    listaUl.appendChild(noResults);
  } else {
    lista.forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      li.style.cssText = 'padding: 10px; cursor: pointer; border-bottom: 1px solid #eee;';

      // Evento de clique no item
      li.addEventListener('click', function () {
        selecionarOpcao(item, inputCampo, listaUl);
      });

      // Evento de hover
      li.addEventListener('mouseenter', function () {
        const selected = listaUl.querySelector('li.selected');
        if (selected) {
          selected.classList.remove('selected');
          selected.style.backgroundColor = '';
        }
        li.classList.add('selected');
        li.style.backgroundColor = '#f5f5f5';
      });

      listaUl.appendChild(li);
    });
  }

  listaUl.style.display = 'block';
}

// Esconde o dropdown ===============================================================================================
function esconderSugestoes(listaUl) {
  listaUl.style.display = 'none';
}

// Seleciona uma opÃ§Ã£o ==============================================================================================
function selecionarOpcao(valor, inputCampo, listaUl) {
  inputCampo.value = valor;
  esconderSugestoes(listaUl);
  inputCampo.dispatchEvent(new Event('change', { bubbles: true }));
}

// Navega pelas sugestÃµes com setas =================================================================================
function navegarSugestoes(items, selected, direction) {
  if (items.length === 0) return;

  let index = -1;
  if (selected) {
    index = Array.from(items).indexOf(selected);
    selected.classList.remove('selected');
    selected.style.backgroundColor = '';
  }

  if (direction === 'down') {
    index = index < items.length - 1 ? index + 1 : 0;
  } else {
    index = index > 0 ? index - 1 : items.length - 1;
  }

  items[index].classList.add('selected');
  items[index].style.backgroundColor = '#f5f5f5';
  items[index].scrollIntoView({ block: 'nearest' });
}

function configurarDropdownDependente(inputPai, listaUlPai, inputFilho, listaUlFilho, obterListaFilha) {
  if (!inputPai || !listaUlPai || !inputFilho || !listaUlFilho) return;

  inputFilho._dadosDropdown = [];

  function atualizarFilho() {
    const opcoes = obterListaFilha(inputPai.value);
    inputFilho._dadosDropdown = opcoes;
    inputFilho.value = '';
    listaUlFilho.innerHTML = '';
    esconderSugestoes(listaUlFilho);
  }

  inputFilho.addEventListener('focus', function () {
    mostrarSugestoes(inputFilho._dadosDropdown || [], listaUlFilho, inputFilho);
  });

  inputFilho.addEventListener('click', function () {
    mostrarSugestoes(inputFilho._dadosDropdown || [], listaUlFilho, inputFilho);
  });

  inputFilho.addEventListener('input', function (e) {
    filtrarEMostrarSugestoes(
      e.target.value,
      inputFilho._dadosDropdown || [],
      listaUlFilho,
      inputFilho
    );
  });

  document.addEventListener('click', function (e) {
    if (e.target === inputFilho || listaUlFilho.contains(e.target)) return;
    if (e.target.closest('.dropdown-container')) return;
    esconderSugestoes(listaUlFilho);
  });

  inputPai.addEventListener('input', atualizarFilho);
  inputPai.addEventListener('change', atualizarFilho);
  inputPai.addEventListener('blur', atualizarFilho);

  atualizarFilho();
}

// CONFIGURAÃ‡ÃƒO GERAL DOS DROPDOWNS MULTISELEÃ‡ÃƒO - USADOS NA PARTE DE PESQUISA

// Essa funÃ§Ã£o serÃ¡ chamada dentro da funÃ§Ã£o de abrir modal de pesquisa, onde passaremos os elementos que farÃ£o parte dessa configuraÃ§Ã£o

function configurarDropdownMulti(inputCampo, listaUl, dados, separador = "; ") {
  if (!inputCampo || !listaUl) return;

  // Guarda os selecionados (mantÃ©m mesmo com filtro)
  const selecionados = new Set();

  const normalizar = (v) => String(v ?? "").trim();
  const lower = (v) => normalizar(v).toLowerCase();

  function obterOpcoesValidas() {
    return Array.from(new Set((dados || []).map(normalizar).filter(Boolean)));
  }

  String(inputCampo.value || "")
    .split(";")
    .map(normalizar)
    .filter(Boolean)
    .forEach(valor => selecionados.add(valor));

  function atualizarInput() {
    inputCampo.value = Array.from(selecionados).join(separador);
  }

  function render(lista) {
    listaUl.innerHTML = "";

    const opcoesTodas = obterOpcoesValidas();

    if (opcoesTodas.length) {
      const todosSelecionados = opcoesTodas.every(valor => selecionados.has(valor));
      const algunsSelecionados = opcoesTodas.some(valor => selecionados.has(valor));
      const liTodos = document.createElement("li");
      liTodos.style.cssText = "padding: 10px; border-bottom: 1px solid #ddd; display:flex; align-items:center; gap:10px; font-weight:700;";

      const chkTodos = document.createElement("input");
      chkTodos.type = "checkbox";
      chkTodos.checked = todosSelecionados;
      chkTodos.indeterminate = !todosSelecionados && algunsSelecionados;
      chkTodos.style.cursor = "pointer";

      const labelTodos = document.createElement("span");
      labelTodos.textContent = "Selecionar todos";
      labelTodos.style.cssText = "cursor: pointer; user-select: none;";

      liTodos.addEventListener("click", () => {
        const marcarTodos = !opcoesTodas.every(valor => selecionados.has(valor));
        opcoesTodas.forEach(valor => {
          if (marcarTodos) selecionados.add(valor);
          else selecionados.delete(valor);
        });
        atualizarInput();
        render(lista);
      });

      liTodos.appendChild(chkTodos);
      liTodos.appendChild(labelTodos);
      listaUl.appendChild(liTodos);
    }

    if (!lista || lista.length === 0) {
      const li = document.createElement("li");
      li.textContent = "Nenhum resultado encontrado";
      li.style.cssText = "padding: 10px; color: #666; font-style: italic;";
      listaUl.appendChild(li);
      listaUl.style.display = "block";
      return;
    }

    lista.forEach(item => {
      const valor = normalizar(item);
      if (!valor) return;

      const li = document.createElement("li");
      li.style.cssText = "padding: 10px; border-bottom: 1px solid #eee; display:flex; align-items:center; gap:10px;";

      const chk = document.createElement("input");
      chk.type = "checkbox";
      chk.checked = selecionados.has(valor);
      chk.style.cursor = "pointer";

      const label = document.createElement("span");
      label.textContent = valor;
      label.style.cssText = "cursor: pointer; user-select: none;";

      function alternar() {
        if (chk.checked) selecionados.add(valor);
        else selecionados.delete(valor);
        atualizarInput();
      }

      // clique no checkbox
      chk.addEventListener("change", alternar);

      // clique no texto tambÃ©m alterna
      label.addEventListener("click", () => {
        chk.checked = !chk.checked;
        alternar();
      });

      li.appendChild(chk);
      li.appendChild(label);
      listaUl.appendChild(li);
    });

    listaUl.style.display = "block";
  }

  function mostrarTudo() {
    render(dados);
  }

  function filtrar() {
    const texto = lower(inputCampo.value);
    // Filtra digitando: aqui vamos considerar o "Ãºltimo termo" apÃ³s ';'
    // para permitir que o usuÃ¡rio continue digitando mesmo com itens jÃ¡ selecionados.
    const ultimoTermo = texto.split(";").pop().trim();

    if (!ultimoTermo) {
      mostrarTudo();
      return;
    }

    const filtrados = dados.filter(item => lower(item).includes(ultimoTermo));
    render(filtrados);
  }

  // Abre no clique/focus
  inputCampo.addEventListener("focus", mostrarTudo);
  inputCampo.addEventListener("click", mostrarTudo);

  // Filtra ao digitar
  inputCampo.addEventListener("input", () => {
    // debounce simples (opcional)
    clearTimeout(inputCampo._ddTimeout);
    inputCampo._ddTimeout = setTimeout(filtrar, 150);
  });

  // Fechar ao clicar fora
  document.addEventListener("click", (e) => {
    if (e.target === inputCampo) return;
    if (listaUl.contains(e.target)) return;
    if (e.target.closest(".dropdown-container")) return;
    listaUl.style.display = "none";
  });

  // (Opcional) ESC fecha
  inputCampo.addEventListener("keydown", (e) => {
    if (e.key === "Escape") listaUl.style.display = "none";
  });

  // Exponho um helper se vocÃª quiser limpar depois
  inputCampo._clearMulti = () => {
    selecionados.clear();
    atualizarInput();
    listaUl.style.display = "none";
  };
}

// Filtra dados da tabela baseado na pesquisa
function FiltroProd(){

    var CampoProduto = document.getElementById("pesquisa");
    var CorpoTabela = document.getElementById("tb_corpo");
    var produto = CampoProduto.value.trim();

    // Valida se o campo estÃ¡ preenchido
    if(produto === ""){
        toastr.warning('Antes de pesquisar selecione um produto!');
        return false;
    }

    // Limpa a tabela
    while(CorpoTabela.hasChildNodes()){
        CorpoTabela.removeChild(CorpoTabela.lastChild);
    }

    // Verifica se hÃ¡ dados disponÃ­veis
    if (typeof dadosTabela === 'undefined' || !dadosTabela || !Array.isArray(dadosTabela)) {
        toastr.error('Dados nÃ£o disponÃ­veis. Recarregue a pÃ¡gina.');
        return false;
    }

    var criterio = produto.toLowerCase();
    
    // Filtra dados pela coluna de nome (Ã­ndice 1)
    var dadosFiltrados = dadosTabela.filter(function(linha){
        var nomeProduto = linha[1] ? linha[1].toString().toLowerCase() : "";
        return nomeProduto === criterio;
    });

    // Verifica se encontrou resultados
    if(dadosFiltrados.length === 0){

    }

    // Preenche tabela com dados filtrados
    dadosFiltrados.forEach(function(r){

        });

    });

    toastr.success('Encontrado(s) ' + dadosFiltrados.length + ' registro(s)!');
}

// ==============================================================================================================================================

function exportarTabelaParaCSV(nomeArquivo) {
  const thead = document.querySelector("#tb_cabecalho");
  const tbody = document.querySelector("#tb_corpo");

  if (!thead || !tbody) {
    console.warn("CabeÃ§alho ou corpo da tabela nÃ£o encontrado.");
    return;
  }

  // ===== helpers =====
  const limparTexto = (t) => String(t ?? "").replace(/\s+/g, " ").trim();

  // Escapa CSV: aspas duplas e vÃ­rgulas/quebras de linha
  const csvEscape = (valor) => {
    const v = limparTexto(valor);
    const precisaAspas = /[",\n\r]/.test(v);
    const vEsc = v.replace(/"/g, '""');
    return precisaAspas ? `"${vEsc}"` : vEsc;
  };

  const linhasCSV = [];

  // ===== cabeÃ§alho =====
  const ths = Array.from(thead.querySelectorAll("th"));
  const cabecalho = ths.map(th => csvEscape(th.textContent));
  linhasCSV.push(cabecalho.join(",")); // separado por vÃ­rgula

  // ===== corpo =====
  const trs = Array.from(tbody.querySelectorAll("tr"));
  trs.forEach(tr => {
    const tds = Array.from(tr.querySelectorAll("td"));
    const linha = tds.map(td => csvEscape(td.textContent));
    linhasCSV.push(linha.join(","));
  });

  // Monta arquivo (UTF-8 com BOM pra abrir bem no Excel PT-BR)
  const csvFinal = "\uFEFF" + linhasCSV.join("\r\n");
  const blob = new Blob([csvFinal], { type: "text/csv;charset=utf-8;" });

  // Download
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nomeArquivo || "export.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Abre o modal de pesquisa --------------------------------------------------------------------------------------

function abrirModalPesquisa() {
    // 1) Abre o modal
    const modal = document.getElementById("modalPesquisa");
    if (!modal) return;
    modal.classList.add("ativo");

    // 2) Pega as linhas atualmente exibidas na tabela (interface)
    const tbody = document.getElementById("tb_corpo");
    if (!tbody) return;

    const linhas = Array.from(tbody.querySelectorAll("tr"));

    // 3) Coleta valores distintos (coluna 3 = index 2 / coluna 5 = index 4)
    const setNome = new Set();
    const setCategoria = new Set();
    const setEAN = new Set();
    const setMarca = new Set();
    const setFornecedor = new Set();
    const setCombo = new Set();
    const setProdsaida = new Set();

    linhas.forEach(tr => {

      const tds = tr.querySelectorAll("td");
      if (!tds || tds.length < 23) return;

      const nome = (tds[2].textContent || "").trim();
      const categoria = (tds[4].textContent || "").trim();
      const ean = (tds[6].textContent || "").trim();
      const marca = (tds[7].textContent || "").trim();
      const fornecedor = (tds[11].textContent || "").trim();
      const combo = (tds[17].textContent || "").trim();
      const prodsaida = (tds[18].textContent || "").trim();

      if (nome) setNome.add(nome);
      if (categoria) setCategoria.add(categoria);
      if (ean) setEAN.add(ean);
      if (marca) setMarca.add(marca);
      if (fornecedor) setFornecedor.add(fornecedor);
      if (combo) setCombo.add(combo);
      if (prodsaida) setProdsaida.add(prodsaida);
      
    });

    // 4) Ordena (opcional, fica melhor)
    const nomes = Array.from(setNome).sort((a, b) => a.localeCompare(b));
    const categorias = Array.from(setCategoria).sort((a, b) => a.localeCompare(b));
    const eans = Array.from(setEAN).sort((a, b) => a.localeCompare(b));
    const marcas = Array.from(setMarca).sort((a, b) => a.localeCompare(b));
    const fornecedores = Array.from(setFornecedor).sort((a, b) => a.localeCompare(b));
    const combos = Array.from(setCombo).sort((a, b) => a.localeCompare(b));
    const prodsaidas = Array.from(setProdsaida).sort((a, b) => a.localeCompare(b));

    configurarDropdownMulti(inputPesquisarNome, listaUlPesquisarNome, nomes);
    configurarDropdownMulti(inputPesquisarCategoria, listaUlPesquisarCategoria, categorias);
    configurarDropdownMulti(inputPesquisarEAN, listaUlPesquisarEAN, eans);
    configurarDropdownMulti(inputPesquisarMarca, listaUlPesquisarMarca, marcas);
    configurarDropdownMulti(inputPesquisarFornecedor, listaUlPesquisarFornecedor, fornecedores);
    configurarDropdownMulti(inputPesquisarCombo, listaUlPesquisarCombo, combos);
    configurarDropdownMulti(inputPesquisarProdsaida, listaUlPesquisarProdsaida, prodsaidas);

}

      if (!ok) return false;
    }

    if (listaCom.length > 0) {
      const valor = normLower(r[18]);
      const ok = listaCom.some(x => normLower(x) === valor);
      if (!ok) return false;
    }

    // AND 4: PerÃ­odo de cadastro
    if (rangeCad) {
      const ts = parseDataHoraBRToTS(r[21]);
      if (!ts) return false;
      if (ts < rangeCad.iniTS || ts > rangeCad.fimTS) return false;
    }

    return true;
  });

  // ====== Renderiza a tabela com o resultado filtrado ======
  renderTabelaAPartirDeArray(filtradas);
  fecharModalPesquisa();

  // (Opcional) fechar modal de pesquisa se quiser
  // document.getElementById("modalPesquisa")?.classList.remove("ativo");
}


// ===== Helpers =====

// "nome1; nome2; nome3" -> ["nome1","nome2","nome3"]
function parseListaMulti(str) {
  const s = String(str || "").trim();
  if (!s) return [];
  return s
    .split(";")
    .map(x => x.trim())
    .filter(Boolean);
}

// "dd/MM/yyyy - dd/MM/yyyy" -> {iniTS, fimTS} (fim no final do dia)
function parseRangeBR(str) {
  const s = String(str || "").trim();
  if (!s) return null;

  const parts = s.split("-").map(p => p.trim());
  if (parts.length < 2) return null;

  const ini = parseDataBRToTS(parts[0], false);
  const fim = parseDataBRToTS(parts[1], true);

  if (!ini || !fim) return null;

  return { iniTS: ini, fimTS: fim };
}

// "dd/MM/yyyy" -> timestamp (00:00:00) ou (23:59:59)
function parseDataBRToTS(str, fimDoDia) {
  const s = String(str || "").trim();
  const [dd, MM, yyyy] = s.split("/").map(n => parseInt(n, 10));
  if (!yyyy || !MM || !dd) return 0;

  const h = fimDoDia ? 23 : 0;
  const m = fimDoDia ? 59 : 0;
  const sec = fimDoDia ? 59 : 0;

  return new Date(yyyy, MM - 1, dd, h, m, sec).getTime();
}

// "dd/MM/yyyy HH:mm:ss" OU "dd/MM/yyyy" -> timestamp
function parseDataHoraBRToTS(str) {
  const s = String(str || "").trim();
  if (!s) return 0;

  const [dataParte, horaParte] = s.split(" ");
  if (!dataParte) return 0;

  const [dd, MM, yyyy] = dataParte.split("/").map(n => parseInt(n, 10));
  if (!yyyy || !MM || !dd) return 0;

  let hh = 0, mm = 0, ss = 0;
  if (horaParte) {
    const hparts = horaParte.split(":").map(n => parseInt(n, 10));
    hh = isNaN(hparts[0]) ? 0 : hparts[0];
    mm = isNaN(hparts[1]) ? 0 : hparts[1];
    ss = isNaN(hparts[2]) ? 0 : hparts[2];
  }

  return new Date(yyyy, MM - 1, dd, hh, mm, ss).getTime();
}

// Renderiza a tabela (sÃ³ reescreve o tbody com as linhas filtradas)
function renderTabelaAPartirDeArray(linhas) {
  const tbody = document.getElementById("tb_corpo");
  if (!tbody) return;

  tbody.innerHTML = "";

  linhas.forEach(function(r) {
    const tr = document.createElement("tr");

    for (let i = 0; i < r.length && i < 23; i++) {
      const td = document.createElement("td");
      preencherCelulaTabela(td, r[i], i);
      tr.appendChild(td);
    }

    tr.addEventListener("click", function (evento) {
      selecionarLinha(this, evento);
    });

    tbody.appendChild(tr);
  });
}
