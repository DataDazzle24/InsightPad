  function percentualMetrica(valor, total) {
    return total ? (Number(valor || 0) / Number(total || 0)) * 100 : 0;
  }

  function atualizarDashboard() {
    if (pacote.modoAgregado) {
      renderizarResumoVendasDashboard();
      if (pacote.estoqueResumo) renderizarResumoEstoqueDashboard();
      if (pacote.clientesResumo) renderizarResumoClientesDashboard();
      if (pacote.categoriasResumo) renderizarResumoCategoriasDashboard();
      return;
    }

    const contexto = obterContextoFiltrado();
    atualizarCards(contexto);
    atualizarGrafico(contexto);
    atualizarTabela(contexto);
    const contextoEstoque = obterContextoEstoqueFiltrado();
    atualizarCardsEstoque(contextoEstoque);
    atualizarGraficoEstoque(contextoEstoque);
    atualizarTabelaEstoque(contextoEstoque);
    if (pacote.clientesResumo) renderizarResumoClientesDashboard();
    if (pacote.categoriasResumo) renderizarResumoCategoriasDashboard();
  }

  function obterContextoFiltrado() {
    const vendasPermitidas = new Set();
    const produtosPermitidos = new Set();
    const periodo = parsePeriodoAnalise(estado.filtros.periodo);

    (pacote.itensVenda || []).forEach(function(item) {
      const produto = estado.mapaProdutos.get(String(item.idProduto));
      const venda = estado.mapaVendas.get(String(item.idCarrinho));
      if (!produto || !venda) return;

      if (estado.filtros.produto && String(item.idProduto) !== estado.filtros.produto) return;
      if (estado.filtros.fornecedor && String(produto.idFornecedor) !== estado.filtros.fornecedor) return;
      if (estado.filtros.categoria && String(produto.idCategoria) !== estado.filtros.categoria) return;
      if (estado.filtros.subcategoria && String(produto.idSubcategoria) !== estado.filtros.subcategoria) return;
      if (estado.filtros.filial && String(venda.idFilial) !== estado.filtros.filial) return;
      if (periodo.inicioTS && Number(venda.dataTS || 0) < periodo.inicioTS) return;
      if (periodo.fimTS && Number(venda.dataTS || 0) > periodo.fimTS) return;
      if (estado.periodoSelecionado) {
        const chave = estado.periodo === "mes" ? venda.mesKey : venda.diaKey;
        if (chave !== estado.periodoSelecionado) return;
      }
      if (estado.itemSelecionado && String(item.idProduto) !== estado.itemSelecionado) return;

      vendasPermitidas.add(String(item.idCarrinho));
      produtosPermitidos.add(String(item.idProduto));
    });

    const vendas = (pacote.vendas || []).filter(function(venda) {
      return vendasPermitidas.has(String(venda.idCarrinho));
    });

    const itens = (pacote.itensVenda || []).filter(function(item) {
      return vendasPermitidas.has(String(item.idCarrinho)) && produtosPermitidos.has(String(item.idProduto));
    });

    return { vendas: vendas, itens: itens };
  }

  function parsePeriodoAnalise(texto) {
    const bruto = String(texto || "").trim();
    if (!bruto) return { inicioTS: 0, fimTS: 0 };

    const partes = bruto.split(/\s+-\s+/).filter(Boolean);
    const inicio = parseDataBR(partes[0]);
    const fim = parseDataBR(partes[1] || partes[0]);

    return {
      inicioTS: inicio ? new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate(), 0, 0, 0, 0).getTime() : 0,
      fimTS: fim ? new Date(fim.getFullYear(), fim.getMonth(), fim.getDate(), 23, 59, 59, 999).getTime() : 0
    };
  }

  function parseDataBR(texto) {
    const match = String(texto || "").trim().match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!match) return null;

    const data = new Date(Number(match[3]), Number(match[2]) - 1, Number(match[1]));
    return isNaN(data.getTime()) ? null : data;
  }

  function calcularResumo(contexto) {
    const vendas = contexto.vendas || [];
    const itens = contexto.itens || [];
    const custoPorVenda = new Map();
    let volume = 0;
    let custoTotal = 0;

    itens.forEach(function(item) {
      const custo = Number(item.custoTotal || 0);
      volume += Number(item.qtd || 0);
      custoTotal += custo;
      custoPorVenda.set(String(item.idCarrinho), (custoPorVenda.get(String(item.idCarrinho)) || 0) + custo);
    });

    const faturamento = vendas.reduce(function(acc, venda) {
      return acc + Number(venda.faturamento || 0);
    }, 0);

    const lucro = faturamento - custoTotal;
    const margem = faturamento > 0 ? (lucro / faturamento) * 100 : 0;

    return {
      qtdVendas: vendas.length,
      volume: vendas.length,
      qtdItens: volume,
      faturamento: faturamento,
      custoTotal: custoTotal,
      lucro: lucro,
      margem: margem,
      ticket: vendas.length ? faturamento / vendas.length : 0,
      custoPorVenda: custoPorVenda
    };
  }

  function atualizarCards(contexto) {
    const resumo = calcularResumo(contexto);
    setText("cardVolume", formatQtd(resumo.volume));
    setText("cardFaturamento", formatBRL(resumo.faturamento));
    setText("cardLucro", formatBRL(resumo.lucro));
    setText("cardLucroMargem", "Margem " + formatPercent(resumo.margem));
    setText("cardTicket", formatBRL(resumo.ticket));
    atualizarCardsCompostosFixos();
  }

  function atualizarCardsCompostosFixos() {
    const mensal = calcularResumoMensalFixo();
    preencherCardComposto("Volume", mensal.volume, false);
    preencherCardComposto("Lucro", mensal.lucro, true);
  }

  function preencherCardComposto(prefixo, dados, moeda) {
    setText("card" + prefixo + "MesFechado", moeda ? formatBRL(dados.ultimo) : formatQtd(dados.ultimo));
    setText("card" + prefixo + "MediaLabel", "Media " + dados.qtdMeses + (dados.qtdMeses === 1 ? " mes" : " meses"));
    setText("card" + prefixo + "Media", moeda ? formatBRL(dados.media) : formatQtd(dados.media));

    const el = document.getElementById("card" + prefixo + "Crescimento");
    if (!el) return;

    el.textContent = formatPercent(dados.crescimento);
    el.classList.remove("positivo", "negativo");
    if (dados.crescimento > 0) el.classList.add("positivo");
    if (dados.crescimento < 0) el.classList.add("negativo");
  }

  function calcularResumoMensalFixo() {
    const custoPorVenda = new Map();

    (pacote.itensVenda || []).forEach(function(item) {
      custoPorVenda.set(String(item.idCarrinho), (custoPorVenda.get(String(item.idCarrinho)) || 0) + Number(item.custoTotal || 0));
    });

    const porMes = new Map();

    (pacote.vendas || []).forEach(function(venda) {
      const key = venda.mesKey;
      if (!key) return;

      if (!porMes.has(key)) {
        porMes.set(key, { key: key, volume: 0, lucro: 0 });
      }

      const item = porMes.get(key);
      item.volume += 1;
      item.lucro += Number(venda.faturamento || 0) - Number(custoPorVenda.get(String(venda.idCarrinho)) || 0);
    });

    function obterMesFechadoAnterior() {
      const hoje = new Date();
      return new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1).toISOString().slice(0, 7);
    }

    const ultimoMesFechado = obterMesFechadoAnterior();
    if (!porMes.has(ultimoMesFechado)) {
      porMes.set(ultimoMesFechado, { key: ultimoMesFechado, volume: 0, lucro: 0 });
    }

    const fechados = Array.from(porMes.values()).filter(function(item) {
      return item.key <= ultimoMesFechado;
    }).sort(function(a, b) {
      return a.key.localeCompare(b.key);
    });

    const janela = fechados.slice(-12);
    const ultimo = janela.find(function(item) {
      return item.key === ultimoMesFechado;
    }) || { key: ultimoMesFechado, volume: 0, lucro: 0 };

    function resumo(campo) {
      const soma = janela.reduce(function(acc, item) {
        return acc + Number(item[campo] || 0);
      }, 0);
      const media = janela.length ? soma / janela.length : 0;
      const valorUltimo = Number(ultimo[campo] || 0);

      return {
        ultimo: valorUltimo,
        media: media,
        crescimento: media ? ((valorUltimo - media) / media) * 100 : 0,
        qtdMeses: janela.length
      };
    }

    return {
      volume: resumo("volume"),
      lucro: resumo("lucro")
    };
  }

  function atualizarGrafico(contexto) {
    const agregados = agregarPorPeriodo(contexto);
    const limite = estado.periodo === "mes" ? 12 : 14;
    const maxInicio = Math.max(0, agregados.length - limite);
    if (estado.janelaInicio === null || estado.janelaInicio === undefined) estado.janelaInicio = maxInicio;
    if (estado.janelaInicio > maxInicio) estado.janelaInicio = maxInicio;
    if (estado.janelaInicio < 0) estado.janelaInicio = 0;

    const visiveis = agregados.slice(estado.janelaInicio, estado.janelaInicio + limite);
    estado.periodosVisiveis = visiveis;
    const titulo = tituloMetricasVendas() + (estado.periodo === "mes" ? " por mes" : " por dia");
    setText("tituloGrafico", titulo);
    document.getElementById("legendaMediaMensal")?.classList.toggle("oculta", estado.periodo !== "mes");
    const series = montarSeriesGrafico(visiveis, agregados);

    if (!estado.chart) {
      estado.chart = echarts.init(document.getElementById("graficoVendas"));
      estado.chart.on("click", function(params) {
        const item = estado.periodosVisiveis[params.dataIndex];
        if (!item) return;
        estado.periodoSelecionado = estado.periodoSelecionado === item.key ? "" : item.key;
        atualizarDashboard();
      });
    }

    estado.chart.setOption({
      legend: {
        show: metricasVendasSelecionadas().length > 1,
        top: 0,
        right: 0,
        textStyle: { color: "#64748b", fontSize: 10 }
      },
      grid: { left: 48, right: temVolumeSecundarioVendas() ? 48 : 20, top: metricasVendasSelecionadas().length > 1 ? 38 : 30, bottom: 48 },
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "shadow" },
        formatter: function(params) {
          const lista = Array.isArray(params) ? params : [];
          if (!lista.length) return "";
          const dado = visiveis[lista[0].dataIndex];
          let html = "<strong>" + escapeHtml(dado.label) + "</strong>";
          lista.forEach(function(p) {
            const metrica = p.seriesId || metricaPorNomeSerieVendas(p.seriesName);
            html += "<br>" + escapeHtml(p.seriesName) + ": " + formatValorMetrica(p.value, metrica);
          });
          return html;
        }
      },
      xAxis: {
        type: "category",
        data: visiveis.map(function(item) { return item.label; }),
        axisTick: { show: false },
        axisLine: { lineStyle: { color: "#e2e8f0" } },
        axisLabel: { color: "#334155", fontSize: 10 }
      },
      yAxis: montarEixosVendas(),
      series: series
    }, true);
  }

  function montarSeriesGrafico(visiveis, agregados) {
    return montarSeriesVendas(visiveis, agregados);
  }

  function agregarPorPeriodo(contexto) {
    const mapa = new Map();
    const vendasContexto = new Set((contexto.vendas || []).map(function(venda) { return String(venda.idCarrinho); }));
    const custoPorVenda = new Map();

    (contexto.itens || []).forEach(function(item) {
      custoPorVenda.set(String(item.idCarrinho), (custoPorVenda.get(String(item.idCarrinho)) || 0) + Number(item.custoTotal || 0));
    });

    (pacote.vendas || []).forEach(function(venda) {
      if (!vendasContexto.has(String(venda.idCarrinho))) return;
      const key = estado.periodo === "mes" ? venda.mesKey : venda.diaKey;
      if (!key) return;
      if (!mapa.has(key)) {
        mapa.set(key, { key: key, label: estado.periodo === "mes" ? formatMes(key) : formatDia(key), volume: 0, faturamento: 0, lucro: 0 });
      }
      const agg = mapa.get(key);
      agg.volume += 1;
      agg.faturamento += Number(venda.faturamento || 0);
      agg.lucro += Number(venda.faturamento || 0) - Number(custoPorVenda.get(String(venda.idCarrinho)) || 0);
    });

    return Array.from(mapa.values()).sort(function(a, b) {
      return a.key.localeCompare(b.key);
    });
  }

  function moverJanela(delta) {
    if (pacote.modoAgregado) {
      const agregados = pacote.vendasResumo?.grafico || [];
      const limite = estado.periodo === "mes" ? 12 : 14;
      const maxInicio = Math.max(0, agregados.length - limite);
      estado.janelaInicio = Math.max(0, Math.min(maxInicio, estado.janelaInicio + delta));
      renderizarGraficoVendasResumo();
      return;
    }

    const agregados = agregarPorPeriodo(obterContextoFiltrado());
    const limite = estado.periodo === "mes" ? 12 : 14;
    const maxInicio = Math.max(0, agregados.length - limite);
    estado.janelaInicio = Math.max(0, Math.min(maxInicio, estado.janelaInicio + delta));
    atualizarDashboard();
  }

  function atualizarTabela(contexto) {
    const tbody = document.getElementById("tbodyItensVendas");
    if (!tbody) return;

    estado.tabelaItens = agregarPorProduto(contexto);
    const lista = ordenarLista(estado.tabelaItens.slice());
    const resumo = lista.reduce(function(acc, item) {
      acc.volume += item.volume;
      acc.faturamento += item.faturamento;
      acc.lucro += item.lucro;
      return acc;
    }, { volume: 0, faturamento: 0, lucro: 0 });
    const margem = resumo.faturamento > 0 ? (resumo.lucro / resumo.faturamento) * 100 : 0;

    tbody.innerHTML = "";

    if (!lista.length) {
      const trVazio = document.createElement("tr");
      trVazio.innerHTML = '<td colspan="8">Nenhum item encontrado para o contexto atual.</td>';
      tbody.appendChild(trVazio);
      return;
    }

    const escalas = calcularEscalasTabela(lista);

    lista.forEach(function(item) {
      const tr = document.createElement("tr");
      tr.dataset.idProduto = item.idProduto;
      tr.classList.toggle("selecionada", estado.itemSelecionado === item.idProduto);
      tr.innerHTML =
        "<td>" + escapeHtml(item.nome) + "</td>" +
        "<td>" + escapeHtml(item.categoria) + "</td>" +
        "<td>" + escapeHtml(item.subcategoria) + "</td>" +
        "<td style=\"" + heatmapStyle(item.volume, escalas.volume) + "\">" + escapeHtml(formatQtd(item.volume)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.faturamento, escalas.faturamento) + "\">" + escapeHtml(formatBRL(item.faturamento)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.lucro, escalas.lucro) + "\">" + escapeHtml(formatBRL(item.lucro)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.lucroMedio, escalas.lucroMedio) + "\">" + escapeHtml(formatBRL(item.lucroMedio)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.margemMedia, escalas.margemMedia) + "\">" + escapeHtml(formatPercent(item.margemMedia)) + "</td>";
      tr.addEventListener("click", function() {
        estado.itemSelecionado = estado.itemSelecionado === item.idProduto ? "" : item.idProduto;
        atualizarDashboard();
      });
      tbody.appendChild(tr);
    });

    const trTotal = document.createElement("tr");
    trTotal.className = "linha-total-dashboard";
    trTotal.innerHTML = [
      "Total",
      "",
      "",
      formatQtd(resumo.volume),
      formatBRL(resumo.faturamento),
      formatBRL(resumo.lucro),
      formatBRL(lista.length ? resumo.lucro / lista.length : 0),
      formatPercent(margem)
    ].map(function(valor) {
      return "<td>" + escapeHtml(valor) + "</td>";
    }).join("");
    tbody.appendChild(trTotal);
  }

  function calcularEscalasTabela(lista) {
    const campos = ["volume", "faturamento", "lucro", "lucroMedio", "margemMedia"];
    const escalas = {};

    campos.forEach(function(campo) {
      const valores = lista.map(function(item) {
        return Number(item[campo] || 0);
      });
      escalas[campo] = {
        min: Math.min.apply(null, valores),
        max: Math.max.apply(null, valores)
      };
    });

    return escalas;
  }

  function heatmapStyle(valor, escala) {
    const min = Number(escala && escala.min || 0);
    const max = Number(escala && escala.max || 0);
    const n = Number(valor || 0);
    const intensidade = max === min ? 0.18 : Math.max(0.08, Math.min(0.38, 0.08 + ((n - min) / (max - min)) * 0.3));
    return "background: rgba(54, 219, 46, " + intensidade.toFixed(3) + "); color: #0f3f16; font-weight: 800;";
  }

  function agregarPorProduto(contexto) {
    const mapa = new Map();
    (contexto.itens || []).forEach(function(item) {
      const produto = estado.mapaProdutos.get(String(item.idProduto));
      if (!produto) return;
      if (!mapa.has(String(item.idProduto))) {
        mapa.set(String(item.idProduto), {
          idProduto: String(item.idProduto),
          nome: produto.nome || item.idProduto,
          categoria: produto.categoria || "",
          subcategoria: produto.subcategoria || "",
          volume: 0,
          faturamento: 0,
          lucro: 0,
          qtdLinhas: 0
        });
      }
      const agg = mapa.get(String(item.idProduto));
      const custo = Number(item.custoTotal || 0);
      const faturamento = Number(item.valorVenda || 0);
      agg.volume += Number(item.qtd || 0);
      agg.faturamento += faturamento;
      agg.lucro += faturamento - custo;
      agg.qtdLinhas++;
    });

    return Array.from(mapa.values()).map(function(item) {
      item.lucroMedio = item.qtdLinhas ? item.lucro / item.qtdLinhas : 0;
      item.margemMedia = item.faturamento > 0 ? (item.lucro / item.faturamento) * 100 : 0;
      return item;
    });
  }

  function alternarOrdenacao(campo) {
    if (estado.sort.campo !== campo) {
      estado.sort = { campo: campo, direcao: "desc" };
    } else if (estado.sort.direcao === "desc") {
      estado.sort.direcao = "asc";
    } else if (estado.sort.direcao === "asc") {
      estado.sort = { campo: "", direcao: "" };
    } else {
      estado.sort = { campo: campo, direcao: "desc" };
    }
    atualizarIndicadoresOrdenacao();
    if (pacote.modoAgregado) {
      renderizarTabelaVendasResumo();
      return;
    }
    atualizarTabela(obterContextoFiltrado());
  }

  function atualizarIndicadoresOrdenacao() {
    document.querySelectorAll(".tabela-dashboard th[data-sort]").forEach(function(th) {
      const texto = th.textContent.replace(/\s*[▲▼]$/, "");
      const ativo = th.dataset.sort === estado.sort.campo && estado.sort.direcao;
      th.textContent = texto + (ativo ? (estado.sort.direcao === "asc" ? " ▲" : " ▼") : "");
    });
  }

  function ordenarLista(lista) {
    if (!estado.sort.campo || !estado.sort.direcao) {
      return lista.sort(function(a, b) {
        return b.faturamento - a.faturamento;
      });
    }

    const campo = estado.sort.campo;
    const direcao = estado.sort.direcao;
    return lista.sort(function(a, b) {
      const va = a[campo];
      const vb = b[campo];
      let r;
      if (typeof va === "number" || typeof vb === "number") {
        r = Number(va || 0) - Number(vb || 0);
      } else {
        r = String(va || "").localeCompare(String(vb || ""), "pt-BR", { numeric: true });
      }
      return direcao === "asc" ? r : -r;
    });
  }

  function obterContextoEstoqueFiltrado() {
    const periodo = parsePeriodoAnalise(estado.filtros.periodo);
    const movimentos = [];

    (pacote.movimentacoesEstoque || []).forEach(function(mov) {
      const produto = estado.mapaProdutos.get(String(mov.idProduto));
      if (!produto) return;

      if (estado.filtros.produto && String(mov.idProduto) !== estado.filtros.produto) return;
      if (estado.filtros.fornecedor && String(produto.idFornecedor) !== estado.filtros.fornecedor) return;
      if (estado.filtros.categoria && String(produto.idCategoria) !== estado.filtros.categoria) return;
      if (estado.filtros.subcategoria && String(produto.idSubcategoria) !== estado.filtros.subcategoria) return;
      if (estado.filtros.filial && String(mov.idFilial) !== estado.filtros.filial) return;
      if (periodo.inicioTS && Number(mov.dataTS || 0) < periodo.inicioTS) return;
      if (periodo.fimTS && Number(mov.dataTS || 0) > periodo.fimTS) return;
      if (estado.estoque.periodoSelecionado) {
        const chave = estado.estoque.periodo === "mes" ? mov.mesKey : mov.diaKey;
        if (chave !== estado.estoque.periodoSelecionado) return;
      }
      if (estado.estoque.itemSelecionado && String(mov.idProduto) !== estado.estoque.itemSelecionado) return;

      movimentos.push(mov);
    });

    return { movimentos: movimentos };
  }

  function tipoEstoqueChave(tipo) {
    const texto = normalizarTexto(tipo);
    if (texto.includes("entrada")) return "entrada";
    if (texto.includes("perda")) return "saidaPerda";
    if (texto.includes("venda")) return "saidaVenda";
    return "";
  }

  function resumoEstoque(contexto) {
    const resumo = {
      qtdEntrada: 0,
      valorEntrada: 0,
      frete: 0,
      outrasCustas: 0,
      qtdSaidaVenda: 0,
      custoSaidaVenda: 0,
      lucroSaidaVenda: 0,
      qtdSaidaPerda: 0,
      valorSaidaPerda: 0
    };
    const nfsSomadas = new Set();
    const vendasSaida = new Set();

    (contexto.movimentos || []).forEach(function(mov) {
      const tipo = tipoEstoqueChave(mov.tipoMov);
      const qtd = Number(mov.qtd || 0);
      const valor = Number(mov.valorTotal || 0);

      if (tipo === "entrada") {
        resumo.qtdEntrada += qtd;
        resumo.valorEntrada += valor;
        if (mov.idNf && !nfsSomadas.has(String(mov.idNf))) {
          nfsSomadas.add(String(mov.idNf));
          const nf = obterNfEstoque(mov.idNf);
          resumo.frete += Number(mov.freteTransporte || nf.freteTransporte || 0);
          resumo.outrasCustas += Number(mov.outrasCustas || nf.outrasCustas || 0);
        }
      }

      if (tipo === "saidaVenda") {
        resumo.qtdSaidaVenda += qtd;
        resumo.custoSaidaVenda += valor;
        if (mov.idVenda) vendasSaida.add(String(mov.idVenda));
      }

      if (tipo === "saidaPerda") {
        resumo.qtdSaidaPerda += qtd;
        resumo.valorSaidaPerda += valor;
      }
    });

    if (vendasSaida.size) {
      resumo.lucroSaidaVenda = calcularLucroCarrinhos(Array.from(vendasSaida));
    }

    return resumo;
  }

  function obterNfEstoque(idNf) {
    const alvo = String(idNf || "").trim();
    if (!alvo) return {};
    const alvoCanonico = idCanonico(alvo);

    return (pacote.nfsEstoque || []).find(function(nf) {
      const id = String(nf.idNf || "").trim();
      return id === alvo || idCanonico(id) === alvoCanonico;
    }) || {};
  }

  function idCanonico(valor) {
    const texto = String(valor || "").trim();
    if (!texto) return "";
    const numerico = texto.replace(",", ".");
    if (/^\d+(?:\.0+)?$/.test(numerico)) return String(parseInt(numerico, 10));
    return texto.toUpperCase();
  }

  function calcularLucroCarrinhos(idsCarrinhos) {
    const ids = new Set((idsCarrinhos || []).map(function(id) { return String(id); }));
    const custoPorVenda = new Map();

    (pacote.itensVenda || []).forEach(function(item) {
      const id = String(item.idCarrinho);
      if (!ids.has(id)) return;
      custoPorVenda.set(id, (custoPorVenda.get(id) || 0) + Number(item.custoTotal || 0));
    });

    return (pacote.vendas || []).reduce(function(acc, venda) {
      const id = String(venda.idCarrinho);
      if (!ids.has(id)) return acc;
      return acc + Number(venda.faturamento || 0) - Number(custoPorVenda.get(id) || 0);
    }, 0);
  }

  function atualizarCardsEstoque(contexto) {
    const resumo = resumoEstoque(contexto);
    setText("cardEstQtdEntrada", formatQtd(resumo.qtdEntrada));
    setText("cardEstValorEntrada", formatBRL(resumo.valorEntrada));
    setText("cardEstFrete", formatBRL(resumo.frete));
    setText("cardEstOutrasCustas", formatBRL(resumo.outrasCustas));
    setText("cardEstQtdSaidaVenda", formatQtd(resumo.qtdSaidaVenda));
    setText("cardEstCustoSaidaVenda", formatBRL(resumo.custoSaidaVenda));
    setText("cardEstLucroSaidaVenda", formatBRL(resumo.lucroSaidaVenda));
    setText("cardEstQtdSaidaPerda", formatQtd(resumo.qtdSaidaPerda));
    setText("cardEstValorSaidaPerda", formatBRL(resumo.valorSaidaPerda));
  }

  function atualizarGraficoEstoque(contexto) {
    const agregados = agregarEstoquePorPeriodo(contexto);
    const limite = estado.estoque.periodo === "mes" ? 12 : 14;
    const maxInicio = Math.max(0, agregados.length - limite);
    if (estado.estoque.janelaInicio === null || estado.estoque.janelaInicio === undefined) estado.estoque.janelaInicio = maxInicio;
    if (estado.estoque.janelaInicio > maxInicio) estado.estoque.janelaInicio = maxInicio;
    if (estado.estoque.janelaInicio < 0) estado.estoque.janelaInicio = 0;

    const visiveis = agregados.slice(estado.estoque.janelaInicio, estado.estoque.janelaInicio + limite);
    estado.estoque.periodosVisiveis = visiveis;

    const metricaLabel = estado.estoque.metricas.length > 1 ? "Volume e faturamento" : rotuloMetricaEstoque(estado.estoque.metricas[0]);
    setText("tituloGraficoEstoque", metricaLabel + (estado.estoque.periodo === "mes" ? " por mes" : " por dia"));

    if (!estado.estoque.chart) {
      estado.estoque.chart = echarts.init(document.getElementById("graficoEstoque"));
      estado.estoque.chart.on("click", function(params) {
        const item = estado.estoque.periodosVisiveis[params.dataIndex];
        if (!item) return;
        estado.estoque.periodoSelecionado = estado.estoque.periodoSelecionado === item.key ? "" : item.key;
        atualizarDashboard();
      });
    }

    estado.estoque.chart.setOption({
      legend: {
        show: true,
        top: 0,
        right: 0,
        textStyle: { color: "#64748b", fontSize: 10 }
      },
      grid: { left: 48, right: 20, top: 34, bottom: 42 },
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "shadow" },
        formatter: function(params) {
          const lista = Array.isArray(params) ? params : [];
          if (!lista.length) return "";
          const dado = visiveis[lista[0].dataIndex];
          let html = "<strong>" + escapeHtml(dado.label) + "</strong>";
          lista.forEach(function(p) {
            html += "<br>" + escapeHtml(p.seriesName) + ": " + formatValorMetricaEstoque(p.value, p.seriesName);
          });
          return html;
        }
      },
      xAxis: {
        type: "category",
        data: visiveis.map(function(item) { return item.label; }),
        axisTick: { show: false },
        axisLine: { lineStyle: { color: "#e2e8f0" } },
        axisLabel: { color: "#334155", fontSize: 10 }
      },
      yAxis: {
        type: "value",
        axisLine: { show: false },
        splitLine: { lineStyle: { color: "#edf2f7" } },
        axisLabel: {
          color: "#64748b",
          formatter: function(value) {
            return abreviarNumero(value);
          }
        }
      },
      series: montarSeriesEstoque(visiveis)
    }, true);
  }

  function montarSeriesEstoque(visiveis) {
    const cores = ["#a8d7ff", "#b8f2b0", "#7fc5ef", "#7ee58a", "#c9e6ff", "#d4f8cd"];
    const series = [];
    let corIndex = 0;

    estado.estoque.tipos.forEach(function(tipo) {
      estado.estoque.metricas.forEach(function(metrica) {
        const campo = tipo + "_" + metrica;
        const nome = rotuloTipoEstoque(tipo) + " - " + rotuloMetricaEstoque(metrica);
        series.push({
          name: nome,
          type: "bar",
          data: visiveis.map(function(item) {
            return {
              value: item[campo] || 0,
              itemStyle: {
                color: estado.estoque.periodoSelecionado === item.key ? "#1d4ed8" : cores[corIndex % cores.length],
                borderRadius: [7, 7, 0, 0]
              }
            };
          }),
          barCategoryGap: visiveis.length <= 2 ? "34%" : "24%",
          emphasis: { itemStyle: { color: "#42DCFA" } },
          label: {
            show: true,
            position: "top",
            color: "#334155",
            fontSize: 9,
            formatter: function(params) {
              return metrica === "volume" ? abreviarNumero(params.value) : abreviarMoeda(params.value);
            }
          }
        });
        corIndex++;
      });
    });

    return series;
  }

  function agregarEstoquePorPeriodo(contexto) {
    const mapa = new Map();

    (contexto.movimentos || []).forEach(function(mov) {
      const tipo = tipoEstoqueChave(mov.tipoMov);
      if (!tipo) return;
      const key = estado.estoque.periodo === "mes" ? mov.mesKey : mov.diaKey;
      if (!key) return;

      if (!mapa.has(key)) {
        mapa.set(key, {
          key: key,
          label: estado.estoque.periodo === "mes" ? formatMes(key) : formatDia(key),
          entrada_volume: 0,
          entrada_faturamento: 0,
          saidaVenda_volume: 0,
          saidaVenda_faturamento: 0,
          saidaPerda_volume: 0,
          saidaPerda_faturamento: 0
        });
      }

      const item = mapa.get(key);
      item[tipo + "_volume"] += Number(mov.qtd || 0);
      item[tipo + "_faturamento"] += Number(mov.valorTotal || 0);
    });

    return Array.from(mapa.values()).sort(function(a, b) {
      return a.key.localeCompare(b.key);
    });
  }

  function moverJanelaEstoque(delta) {
    if (pacote.modoAgregado) {
      const agregados = pacote.estoqueResumo?.grafico || [];
      const limite = estado.estoque.periodo === "mes" ? 12 : 14;
      const maxInicio = Math.max(0, agregados.length - limite);
      estado.estoque.janelaInicio = Math.max(0, Math.min(maxInicio, estado.estoque.janelaInicio + delta));
      renderizarGraficoEstoqueResumo();
      return;
    }

    const agregados = agregarEstoquePorPeriodo(obterContextoEstoqueFiltrado());
    const limite = estado.estoque.periodo === "mes" ? 12 : 14;
    const maxInicio = Math.max(0, agregados.length - limite);
    estado.estoque.janelaInicio = Math.max(0, Math.min(maxInicio, estado.estoque.janelaInicio + delta));
    atualizarDashboard();
  }

  function atualizarTabelaEstoque(contexto) {
    const tbody = document.getElementById("tbodyItensEstoque");
    if (!tbody) return;

    estado.estoque.tabelaItens = agregarEstoquePorProduto(contexto);
    const lista = ordenarListaEstoque(estado.estoque.tabelaItens.slice());
    tbody.innerHTML = "";

    if (!lista.length) {
      const trVazio = document.createElement("tr");
      trVazio.innerHTML = '<td colspan="13">Nenhum item encontrado para o contexto atual.</td>';
      tbody.appendChild(trVazio);
      return;
    }

    const escalas = calcularEscalasEstoque(lista);
    const total = lista.reduce(function(acc, item) {
      acc.qtdEntrada += item.qtdEntrada;
      acc.valorEntrada += item.valorEntrada;
      acc.qtdSaidaVenda += item.qtdSaidaVenda;
      acc.custoSaidaVenda += item.custoSaidaVenda;
      acc.lucroSaidaVenda += item.lucroSaidaVenda;
      acc.qtdSaidaPerda += item.qtdSaidaPerda;
      acc.valorSaidaPerda += item.valorSaidaPerda;
      acc.saldo += item.saldo;
      return acc;
    }, { qtdEntrada: 0, valorEntrada: 0, qtdSaidaVenda: 0, custoSaidaVenda: 0, lucroSaidaVenda: 0, qtdSaidaPerda: 0, valorSaidaPerda: 0, saldo: 0 });

    lista.forEach(function(item) {
      const tr = document.createElement("tr");
      tr.dataset.idProduto = item.idProduto;
      tr.classList.toggle("selecionada", estado.estoque.itemSelecionado === item.idProduto);
      const statusSaldo = statusSaldoEstoque(item);
      tr.innerHTML =
        "<td>" + escapeHtml(item.nome) + "</td>" +
        "<td>" + escapeHtml(item.categoria) + "</td>" +
        "<td>" + escapeHtml(item.subcategoria) + "</td>" +
        "<td>" + escapeHtml(formatQtd(item.estMinimo)) + "</td>" +
        "<td>" + escapeHtml(formatQtd(item.estMaximo)) + "</td>" +
        "<td class=\"" + statusSaldo.classe + "\">" + statusSaldo.icone + " " + escapeHtml(formatQtd(item.saldo)) + "</td>" +
        "<td>" + escapeHtml(formatQtd(item.qtdEntrada)) + "</td>" +
        "<td>" + escapeHtml(formatBRL(item.valorEntrada)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.qtdSaidaVenda, escalas.qtdSaidaVenda) + "\">" + escapeHtml(formatQtd(item.qtdSaidaVenda)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.custoSaidaVenda, escalas.custoSaidaVenda) + "\">" + escapeHtml(formatBRL(item.custoSaidaVenda)) + "</td>" +
        "<td style=\"" + heatmapStyle(item.lucroSaidaVenda, escalas.lucroSaidaVenda) + "\">" + escapeHtml(formatBRL(item.lucroSaidaVenda)) + "</td>" +
        "<td style=\"" + heatmapStyleVermelho(item.qtdSaidaPerda, escalas.qtdSaidaPerda) + "\">" + escapeHtml(formatQtd(item.qtdSaidaPerda)) + "</td>" +
        "<td style=\"" + heatmapStyleVermelho(item.valorSaidaPerda, escalas.valorSaidaPerda) + "\">" + escapeHtml(formatBRL(item.valorSaidaPerda)) + "</td>";
      tr.addEventListener("click", function() {
        estado.estoque.itemSelecionado = estado.estoque.itemSelecionado === item.idProduto ? "" : item.idProduto;
        atualizarDashboard();
      });
      tbody.appendChild(tr);
    });

    const trTotal = document.createElement("tr");
    trTotal.className = "linha-total-dashboard";
    trTotal.innerHTML = [
      "Total",
      "",
      "",
      "",
      "",
      formatQtd(total.saldo),
      formatQtd(total.qtdEntrada),
      formatBRL(total.valorEntrada),
      formatQtd(total.qtdSaidaVenda),
      formatBRL(total.custoSaidaVenda),
      formatBRL(total.lucroSaidaVenda),
      formatQtd(total.qtdSaidaPerda),
      formatBRL(total.valorSaidaPerda)
    ].map(function(valor) {
      return "<td>" + escapeHtml(valor) + "</td>";
    }).join("");
    tbody.appendChild(trTotal);
  }

  function agregarEstoquePorProduto(contexto) {
    const mapa = new Map();

    (contexto.movimentos || []).forEach(function(mov) {
      const produto = estado.mapaProdutos.get(String(mov.idProduto));
      if (!produto) return;

      if (!mapa.has(String(mov.idProduto))) {
        mapa.set(String(mov.idProduto), {
          idProduto: String(mov.idProduto),
          nome: produto.nome || mov.idProduto,
          categoria: produto.categoria || "",
          subcategoria: produto.subcategoria || "",
          estMinimo: Number(produto.estMinimo || 0),
          estMaximo: Number(produto.estMaximo || 0),
          qtdEntrada: 0,
          valorEntrada: 0,
          qtdSaidaVenda: 0,
          custoSaidaVenda: 0,
          lucroSaidaVenda: 0,
          qtdSaidaPerda: 0,
          valorSaidaPerda: 0,
          saldo: 0
        });
      }

      const item = mapa.get(String(mov.idProduto));
      const tipo = tipoEstoqueChave(mov.tipoMov);
      const qtd = Number(mov.qtd || 0);
      const valor = Number(mov.valorTotal || 0);

      if (tipo === "entrada") {
        item.qtdEntrada += qtd;
        item.valorEntrada += valor;
        item.saldo += qtd;
      }
      if (tipo === "saidaVenda") {
        item.qtdSaidaVenda += qtd;
        item.custoSaidaVenda += valor;
        item.lucroSaidaVenda += Number(mov.lucroVenda || 0);
        item.saldo -= qtd;
      }
      if (tipo === "saidaPerda") {
        item.qtdSaidaPerda += qtd;
        item.valorSaidaPerda += valor;
        item.saldo -= qtd;
      }
    });

    return Array.from(mapa.values());
  }

  function statusSaldoEstoque(item) {
    const minimo = Number(item.estMinimo || 0);
    const maximo = Number(item.estMaximo || 0);
    const saldo = Number(item.saldo || 0);
    if (minimo && saldo < minimo) return { classe: "status-saldo-alerta", icone: '<span class="saldo-icone">▼</span>' };
    if (maximo && saldo > maximo) return { classe: "status-saldo-alerta", icone: '<span class="saldo-icone">▲</span>' };
    return { classe: "status-saldo-ok", icone: '<span class="saldo-icone">✓</span>' };
  }

  function calcularEscalasEstoque(lista) {
    const campos = ["qtdSaidaVenda", "custoSaidaVenda", "lucroSaidaVenda", "qtdSaidaPerda", "valorSaidaPerda"];
    const escalas = {};
    campos.forEach(function(campo) {
      const valores = lista.map(function(item) {
        return Number(item[campo] || 0);
      });
      escalas[campo] = {
        min: Math.min.apply(null, valores),
        max: Math.max.apply(null, valores)
      };
    });
    return escalas;
  }

  function heatmapStyleVermelho(valor, escala) {
    const min = Number(escala && escala.min || 0);
    const max = Number(escala && escala.max || 0);
    const n = Number(valor || 0);
    const intensidade = max === min ? 0.14 : Math.max(0.08, Math.min(0.34, 0.08 + ((n - min) / (max - min)) * 0.26));
    return "background: rgba(220, 38, 38, " + intensidade.toFixed(3) + "); color: #7f1d1d; font-weight: 800;";
  }

  function alternarOrdenacaoEstoque(campo) {
    if (estado.estoque.sort.campo !== campo) {
      estado.estoque.sort = { campo: campo, direcao: "desc" };
    } else if (estado.estoque.sort.direcao === "desc") {
      estado.estoque.sort.direcao = "asc";
    } else if (estado.estoque.sort.direcao === "asc") {
      estado.estoque.sort = { campo: "", direcao: "" };
    } else {
      estado.estoque.sort = { campo: campo, direcao: "desc" };
    }
    atualizarIndicadoresOrdenacaoEstoque();
    if (pacote.modoAgregado) {
      renderizarTabelaEstoqueResumo();
      return;
    }
    atualizarTabelaEstoque(obterContextoEstoqueFiltrado());
  }

  function atualizarIndicadoresOrdenacaoEstoque() {
    document.querySelectorAll(".tabela-dashboard th[data-sort-estoque]").forEach(function(th) {
      const texto = th.textContent.replace(/\s*[â–²â–¼]$/, "");
      const ativo = th.dataset.sortEstoque === estado.estoque.sort.campo && estado.estoque.sort.direcao;
      th.textContent = texto + (ativo ? (estado.estoque.sort.direcao === "asc" ? " â–²" : " â–¼") : "");
    });
  }

  function ordenarListaEstoque(lista) {
    if (!estado.estoque.sort.campo || !estado.estoque.sort.direcao) {
      return lista.sort(function(a, b) {
        return b.valorEntrada - a.valorEntrada;
      });
    }

    const campo = estado.estoque.sort.campo;
    const direcao = estado.estoque.sort.direcao;
    return lista.sort(function(a, b) {
      const va = a[campo];
      const vb = b[campo];
      let r;
      if (typeof va === "number" || typeof vb === "number") {
        r = Number(va || 0) - Number(vb || 0);
      } else {
        r = String(va || "").localeCompare(String(vb || ""), "pt-BR", { numeric: true });
      }
      return direcao === "asc" ? r : -r;
    });
  }

  function alternarOrdenacaoClientes(campo) {
    if (estado.clientes.sort.campo !== campo) {
      estado.clientes.sort = { campo: campo, direcao: "desc" };
    } else if (estado.clientes.sort.direcao === "desc") {
      estado.clientes.sort.direcao = "asc";
    } else if (estado.clientes.sort.direcao === "asc") {
      estado.clientes.sort = { campo: "", direcao: "" };
    } else {
      estado.clientes.sort = { campo: campo, direcao: "desc" };
    }
    atualizarIndicadoresOrdenacaoClientes();
    renderizarTabelaClientesResumo();
  }

  function atualizarIndicadoresOrdenacaoClientes() {
    document.querySelectorAll(".tabela-dashboard th[data-sort-clientes]").forEach(function(th) {
      const texto = th.textContent.replace(/\s*[▲▼]$/, "");
      const ativo = th.dataset.sortClientes === estado.clientes.sort.campo && estado.clientes.sort.direcao;
      th.textContent = texto + (ativo ? (estado.clientes.sort.direcao === "asc" ? " ▲" : " ▼") : "");
    });
  }

  function ordenarListaClientes(lista) {
    if (!estado.clientes.sort.campo || !estado.clientes.sort.direcao) {
      return lista.sort(function(a, b) {
        return Number(b.faturamento || 0) - Number(a.faturamento || 0);
      });
    }

    const campo = estado.clientes.sort.campo;
    const direcao = estado.clientes.sort.direcao;
    return lista.sort(function(a, b) {
      const va = a[campo];
      const vb = b[campo];
      let r;
      if (typeof va === "number" || typeof vb === "number") {
        r = Number(va || 0) - Number(vb || 0);
      } else {
        r = String(va || "").localeCompare(String(vb || ""), "pt-BR", { numeric: true });
      }
      return direcao === "asc" ? r : -r;
    });
  }

  function rotuloTipoEstoque(tipo) {
    if (tipo === "entrada") return "Entrada";
    if (tipo === "saidaVenda") return "Saida venda";
    if (tipo === "saidaPerda") return "Saida perda";
    return tipo;
  }

  function rotuloMetricaEstoque(metrica) {
    return metrica === "faturamento" ? "Faturamento" : "Volume";
  }

  function formatValorMetricaEstoque(valor, nomeSerie) {
    return String(nomeSerie || "").toLowerCase().includes("faturamento") ? formatBRL(valor) : formatQtd(valor);
  }

  function abrirInfoEstoque() {
    document.getElementById("modalInfoEstoque")?.classList.add("ativo");
  }

  function fecharInfoEstoque() {
    document.getElementById("modalInfoEstoque")?.classList.remove("ativo");
  }

  function abrirInfoVendas() {
    document.getElementById("modalInfoVendas")?.classList.add("ativo");
  }

  function fecharInfoVendas() {
    document.getElementById("modalInfoVendas")?.classList.remove("ativo");
  }

  function carregarScriptDashboard(src, globalName) {
    if (globalName && window[globalName]) return Promise.resolve();

    return new Promise(function(resolve, reject) {
      const existente = document.querySelector('script[data-dashboard-src="' + src + '"]');
      if (existente) {
        existente.addEventListener("load", resolve, { once: true });
        existente.addEventListener("error", reject, { once: true });
        return;
      }

      const script = document.createElement("script");
      script.src = src;
      script.async = true;
      script.dataset.dashboardSrc = src;
      script.onload = resolve;
      script.onerror = reject;
      document.head.appendChild(script);
    });
  }

  function carregarBibliotecasExportacao() {
    return carregarScriptDashboard("https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js", "html2canvas")
      .then(function() {
        return carregarScriptDashboard("https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js", "jspdf");
      });
  }

  function exportarPDF() {
    if (document.activeElement && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }

    const alvo = document.querySelector('.dashboard-visao.ativo');
    const areaConteudo = document.getElementById("dashboard_conteudo");
    if (!alvo) {
      toastWarn("Nao foi possivel encontrar a visao ativa para exportar.");
      return;
    }

    document.getElementById("loadingDashboard")?.classList.add("ativo");
    carregarBibliotecasExportacao()
      .then(function() {
        if (!window.html2canvas || !window.jspdf) throw new Error("Bibliotecas de exportacao indisponiveis.");
        redimensionarGrafico();
        return new Promise(function(resolve) {
          setTimeout(resolve, 160);
        });
      })
      .then(function() {
        const area = areaConteudo || alvo;
        const rect = area.getBoundingClientRect();
        const larguraCaptura = Math.ceil(rect.width || area.scrollWidth || area.offsetWidth || area.clientWidth);
        const alturaCaptura = Math.ceil(rect.height || area.scrollHeight || area.offsetHeight || area.clientHeight);
        const xCaptura = Math.max(0, Math.floor(rect.left + window.scrollX));
        const yCaptura = Math.max(0, Math.floor(rect.top + window.scrollY));

        return html2canvas(document.body, {
          scale: Math.min(2.5, Math.max(2, window.devicePixelRatio || 1)),
          backgroundColor: "#eef3f8",
          useCORS: true,
          x: xCaptura,
          y: yCaptura,
          width: larguraCaptura,
          height: alturaCaptura,
          windowWidth: document.documentElement.clientWidth,
          windowHeight: document.documentElement.clientHeight,
          scrollX: 0,
          scrollY: 0,
          ignoreElements: function(elemento) {
            return elemento && (elemento.id === "loadingDashboard" || !!elemento.closest?.("#loadingDashboard"));
          }
        });
      })
      .then(function(canvas) {
        const imgData = canvas.toDataURL("image/png");
        const largura = canvas.width;
        const altura = canvas.height;
        const pdf = new jspdf.jsPDF({
          orientation: largura >= altura ? "landscape" : "portrait",
          unit: "px",
          format: [largura, altura],
          compress: true
        });
        pdf.addImage(imgData, "PNG", 0, 0, largura, altura, undefined, "FAST");
        pdf.save("Relatorio_Operacional_" + estado.visao + ".pdf");
      })
      .catch(function(erro) {
        console.error(erro);
        toastErr("Erro ao exportar PDF.");
      })
      .finally(function() {
        document.getElementById("loadingDashboard")?.classList.remove("ativo");
      });
  }

  function redimensionarGrafico() {
    if (estado.chart) estado.chart.resize();
    if (estado.estoque.chart) estado.estoque.chart.resize();
    if (estado.clientes.chartRegiao) estado.clientes.chartRegiao.resize();
    if (estado.categorias.chartParticipacao) estado.categorias.chartParticipacao.resize();
    if (estado.categorias.chartTornado) estado.categorias.chartTornado.resize();
  }

  function setText(id, texto) {
    const el = document.getElementById(id);
    if (el) el.textContent = texto;
  }

  function rotuloMetrica(metrica) {
    if (metrica === "faturamento") return "Faturamento";
    if (metrica === "lucro") return "Lucro";
    return "Volume";
  }

  function rotuloMetricaClientes(metrica) {
    if (metrica === "faturamento") return "Faturamento";
    if (metrica === "lucro") return "Lucro";
    return "Volume";
  }

  function campoMetricaClientes(metrica) {
    if (metrica === "faturamento") return "faturamento";
    if (metrica === "lucro") return "lucro";
    return "qtdCompras";
  }

  function metricaPorNomeSerieVendas(nomeSerie) {
    const texto = normalizarTexto(nomeSerie);
    if (texto.includes("faturamento")) return "faturamento";
    if (texto.includes("lucro")) return "lucro";
    return "volume";
  }

  function formatValorMetrica(valor, metrica) {
    return metrica === "volume" ? formatQtd(valor) : formatBRL(valor);
  }

  function formatBRL(valor) {
    return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(Number(valor || 0)).replace(/\u00A0/g, " ");
  }

  function formatQtd(valor) {
    return new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 2 }).format(Number(valor || 0));
  }

  function formatDecimal(valor) {
    return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Number(valor || 0));
  }

  function formatPercent(valor) {
    return new Intl.NumberFormat("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }).format(Number(valor || 0)) + "%";
  }

  function abreviarNumero(valor) {
    const n = Number(valor || 0);
    if (Math.abs(n) >= 1000000) return (n / 1000000).toFixed(1).replace(".", ",") + "M";
    if (Math.abs(n) >= 1000) return (n / 1000).toFixed(0).replace(".", ",") + "k";
    return String(Math.round(n));
  }

  function abreviarMoeda(valor) {
    const n = Number(valor || 0);
    if (Math.abs(n) >= 1000000) return "R$ " + (n / 1000000).toFixed(1).replace(".", ",") + "M";
    if (Math.abs(n) >= 1000) return "R$ " + (n / 1000).toFixed(0).replace(".", ",") + "k";
    return "R$ " + Math.round(n);
  }

  function formatMes(key) {
    const partes = String(key || "").split("-");
    if (partes.length !== 2) return key;
    const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
    return meses[Number(partes[1]) - 1] + "/" + partes[0].slice(2);
  }

  function formatDia(key) {
    const partes = String(key || "").split("-");
    if (partes.length !== 3) return key;
    return partes[2] + "/" + partes[1] + "/" + partes[0];
  }

  function escapeHtml(valor) {
    return String(valor || "").replace(/[&<>"']/g, function(ch) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[ch];
    });
  }

  function toastWarn(msg) {
    if (window.toastr) toastr.warning(msg);
  }

  function toastOk(msg) {
    if (window.toastr) toastr.success(msg);
  }

  function toastErr(msg) {
    if (window.toastr) toastr.error(msg);
  }
})();
</script>
