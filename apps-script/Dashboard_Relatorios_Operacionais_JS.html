  function heatmapAzulInvertido(valor, escala) {
    const min = Number(escala && escala.min || 0);
    const max = Number(escala && escala.max || 0);
    const n = Number(valor || 0);
    const ratio = max === min ? 1 : 1 - Math.max(0, Math.min(1, (n - min) / (max - min)));
    const intensidade = Math.max(0.1, Math.min(0.36, 0.1 + ratio * 0.26));
    return "background: rgba(66, 220, 250, " + intensidade.toFixed(3) + "); color: #0f3f56; font-weight: 800;";
  }

  function formatValorMetricaClientes(valor, metrica) {
    return metrica === "volume" ? formatQtd(valor) : formatBRL(valor);
  }

  function selecionarRegiaoClientes(dimensao, nome) {
    const valorSelecionado = String(nome || "").trim();
    if (!valorSelecionado) return;

    if (dimensao === "bairro") {
      const jaSelecionado = normalizarTexto(estado.filtrosClientes.bairro) === normalizarTexto(valorSelecionado);
      estado.filtrosClientes.bairro = jaSelecionado ? "" : valorSelecionado;
      estado.filtrosClientes.bairroNome = jaSelecionado ? "" : valorSelecionado;
      if (!jaSelecionado) {
        estado.filtrosClientes.cidade = "";
        estado.filtrosClientes.cidadeNome = "";
      }
    } else {
      const jaSelecionado = normalizarTexto(estado.filtrosClientes.cidade) === normalizarTexto(valorSelecionado);
      estado.filtrosClientes.cidade = jaSelecionado ? "" : valorSelecionado;
      estado.filtrosClientes.cidadeNome = jaSelecionado ? "" : valorSelecionado;
      if (!jaSelecionado) {
        estado.filtrosClientes.bairro = "";
        estado.filtrosClientes.bairroNome = "";
      }
    }

    estado.clientes.classeSelecionada = "";
    if (pacote.modoAgregado) {
      pacote.clientesResumo = null;
      carregarResumoClientesDashboard(true);
    } else {
      calcularResumoClientesLocal();
      renderizarResumoClientesDashboard();
    }
    preencherFiltros();
  }

  function filtroRegiaoClientesAtivo(dimensao, nome) {
    const valor = String(nome || "").trim();
    if (!valor) return false;
    if (dimensao === "bairro") return normalizarTexto(estado.filtrosClientes.bairro) === normalizarTexto(valor);
    return normalizarTexto(estado.filtrosClientes.cidade) === normalizarTexto(valor);
  }

  function calcularResumoClientesLocal() {
    const filtros = estado.filtrosClientes || {};
    const periodo = parsePeriodoAnalise(filtros.periodo);
    const temPeriodo = !!(periodo.inicioTS || periodo.fimTS);
    const metricaAbc = ["volume", "faturamento", "lucro"].includes(estado.clientes.metricaAbc) ? estado.clientes.metricaAbc : "volume";
    const mapaClientes = montarMapaClientesLocal();
    const custoPorVenda = calcularCustoPorVendaLocal();
    const primeiraCompraTS = {};
    const vendasHistoricas = [];

    (pacote.vendas || []).forEach(function(venda) {
      const idCliente = String(venda.idCliente || "").trim();
      if (!idCliente) return;
      const cliente = mapaClientes.get(idCliente) || { idCliente: idCliente, nome: idCliente, cidade: "", bairro: "", dataNascimento: "" };
      if (!passaFiltroClienteLocal(cliente, filtros)) return;

      const dataTS = Number(venda.dataTS || 0);
      const item = {
        idCarrinho: String(venda.idCarrinho || ""),
        idCliente: idCliente,
        cliente: cliente,
        faturamento: Number(venda.faturamento || 0),
        lucro: Number(venda.faturamento || 0) - Number(custoPorVenda.get(String(venda.idCarrinho)) || 0),
        dataTS: dataTS,
        mesKey: venda.mesKey || ""
      };

      vendasHistoricas.push(item);
      if (dataTS && (!primeiraCompraTS[idCliente] || dataTS < primeiraCompraTS[idCliente])) primeiraCompraTS[idCliente] = dataTS;
    });

    const vendasContexto = vendasHistoricas.filter(function(venda) {
      if (periodo.inicioTS && Number(venda.dataTS || 0) < periodo.inicioTS) return false;
      if (periodo.fimTS && Number(venda.dataTS || 0) > periodo.fimTS) return false;
      return true;
    });

    const regioesMunicipio = new Map();
    const regioesBairro = new Map();
    const ultimaCompraPorCliente = new Map();

    vendasContexto.forEach(function(venda) {
      acumularRegiaoClienteLocal(regioesMunicipio, venda.cliente.cidade || "SEM MUNICIPIO", venda);
      acumularRegiaoClienteLocal(regioesBairro, venda.cliente.bairro || "SEM BAIRRO", venda);

      const atual = ultimaCompraPorCliente.get(venda.idCliente);
      if (!atual || Number(venda.dataTS || 0) > Number(atual.dataTS || 0)) ultimaCompraPorCliente.set(venda.idCliente, venda);
    });

    const hojeBase = new Date();
    const hojeInicio = new Date(hojeBase.getFullYear(), hojeBase.getMonth(), hojeBase.getDate()).getTime();
    const aniversariantes = (pacote.clientes || []).filter(function(cliente) {
      return passaFiltroClienteLocal(cliente, filtros);
    }).map(function(cliente) {
      const info = infoAniversarioLocal(cliente.dataNascimento, hojeBase);
      if (!info) return null;
      return {
        idCliente: cliente.idCliente,
        nome: cliente.nome || cliente.idCliente,
        cidade: cliente.cidade || "",
        aniversario: info.label,
        proximoTS: info.proximoTS
      };
    }).filter(Boolean).sort(function(a, b) {
      return Number(a.proximoTS || 0) - Number(b.proximoTS || 0);
    });

    const semComprar = Array.from(ultimaCompraPorCliente.values()).map(function(venda) {
      const dataUltima = venda.dataTS ? new Date(venda.dataTS) : null;
      const ultimaInicio = dataUltima ? new Date(dataUltima.getFullYear(), dataUltima.getMonth(), dataUltima.getDate()).getTime() : 0;
      return {
        idCliente: venda.idCliente,
        nome: venda.cliente.nome || venda.idCliente,
        cidade: venda.cliente.cidade || "",
        bairro: venda.cliente.bairro || "",
        ultimaCompra: dataUltima ? formatDataLocal(dataUltima) : "",
        ultimaCompraTS: Number(venda.dataTS || 0),
        diasSemComprar: ultimaInicio ? Math.max(0, Math.floor((hojeInicio - ultimaInicio) / 86400000)) : 0
      };
    }).sort(function(a, b) {
      return Number(b.diasSemComprar || 0) - Number(a.diasSemComprar || 0);
    });

    const tabelaMap = new Map();
    vendasContexto.forEach(function(venda) {
      if (!tabelaMap.has(venda.idCliente)) {
        tabelaMap.set(venda.idCliente, {
          idCliente: venda.idCliente,
          nome: venda.cliente.nome || venda.idCliente,
          cidade: venda.cliente.cidade || "",
          bairro: venda.cliente.bairro || "",
          qtdCompras: 0,
          faturamento: 0,
          lucro: 0,
          meses: {}
        });
      }
      const item = tabelaMap.get(venda.idCliente);
      item.qtdCompras += 1;
      item.faturamento += Number(venda.faturamento || 0);
      item.lucro += Number(venda.lucro || 0);
      if (venda.mesKey) item.meses[venda.mesKey] = true;
    });

    const tabelaBase = Array.from(tabelaMap.values());
    tabelaBase.forEach(function(item) {
      const mesesCliente = Math.max(1, Object.keys(item.meses || {}).length);
      item.ticketMedio = item.qtdCompras ? item.faturamento / item.qtdCompras : 0;
      item.frequenciaMensal = item.qtdCompras / mesesCliente;
      item.classesPorMetrica = {};
      item.valoresMetricaAbc = {
        volume: Number(item.qtdCompras || 0),
        faturamento: Number(item.faturamento || 0),
        lucro: Number(item.lucro || 0)
      };
      delete item.meses;
    });

    const abcPorMetrica = {
      volume: calcularAbcClientesLocal(tabelaBase, "volume"),
      faturamento: calcularAbcClientesLocal(tabelaBase, "faturamento"),
      lucro: calcularAbcClientesLocal(tabelaBase, "lucro")
    };

    tabelaBase.forEach(function(item) {
      item.classe = item.classesPorMetrica[metricaAbc] || "C";
      item.valorMetricaAbc = valorMetricaClienteLocal(item, metricaAbc);
    });

    const clientesAtivosSet = {};
    let carrinhos = 0;
    let faturamento = 0;
    let lucro = 0;
    vendasContexto.forEach(function(venda) {
      clientesAtivosSet[venda.idCliente] = true;
      carrinhos += 1;
      faturamento += Number(venda.faturamento || 0);
      lucro += Number(venda.lucro || 0);
    });

    let novosClientes = 0;
    Object.keys(primeiraCompraTS).forEach(function(idCliente) {
      const ts = Number(primeiraCompraTS[idCliente] || 0);
      if (!ts) return;
      if (!temPeriodo || ((!periodo.inicioTS || ts >= periodo.inicioTS) && (!periodo.fimTS || ts <= periodo.fimTS))) novosClientes += 1;
    });

    let clientesInativos = 0;
    if (temPeriodo) {
      Object.keys(primeiraCompraTS).forEach(function(idCliente) {
        if (periodo.inicioTS && Number(primeiraCompraTS[idCliente] || 0) >= periodo.inicioTS) return;
        if (!clientesAtivosSet[idCliente]) clientesInativos += 1;
      });
    }

    const qtdClientesAtivos = Object.keys(clientesAtivosSet).length;
    const mesesFrequencia = temPeriodo ? 1 : qtdMesesDistintosLocal(vendasContexto);
    const frequenciaMedia = qtdClientesAtivos ? carrinhos / qtdClientesAtivos / mesesFrequencia : 0;

    pacote.clientesResumo = {
      sucesso: true,
      atualizadoEm: pacote.atualizadoEm || "",
      filtros: pacote.filtros || {},
      cards: {
        clientesAtivos: qtdClientesAtivos,
        novosClientes: novosClientes,
        clientesInativos: temPeriodo ? clientesInativos : 0,
        clientesInativosMensagem: temPeriodo ? "" : "selecione um periodo",
        ticketMedio: carrinhos ? faturamento / carrinhos : 0,
        frequenciaMedia: frequenciaMedia,
        frequenciaLabel: temPeriodo ? "Compras por cliente no periodo" : "Media mensal por cliente"
      },
      totais: { carrinhos: carrinhos, faturamento: faturamento, lucro: lucro, metricaAbc: metricaAbc },
      abc: abcPorMetrica[metricaAbc] || abcPorMetrica.volume,
      abcPorMetrica: abcPorMetrica,
      regioes: {
        municipio: Array.from(regioesMunicipio.values()).sort(function(a, b) { return Number(b.volume || 0) - Number(a.volume || 0); }),
        bairro: Array.from(regioesBairro.values()).sort(function(a, b) { return Number(b.volume || 0) - Number(a.volume || 0); })
      },
      aniversariantes: aniversariantes,
      semComprar: semComprar,
      tabela: tabelaBase
    };
  }

  function calcularResumoCategoriasLocal() {
    const filtros = estado.filtros || {};
    const periodo = parsePeriodoAnalise(filtros.periodo);
    const categorias = new Map();
    const subcategorias = new Map();
    const crescimentoAtual = new Map();
    const crescimentoAnterior = new Map();
    const crescimentoAtualSub = new Map();
    const crescimentoAnteriorSub = new Map();
    const nomesCategoriasCrescimento = new Map();
    const ultimoMesFechado = ultimoMesFechadoLocal();
    const mesAnterior = deslocarMesKeyLocal(ultimoMesFechado, -1);

    (pacote.itensVenda || []).forEach(function(item) {
      const venda = estado.mapaVendas.get(String(item.idCarrinho));
      const produto = estado.mapaProdutos.get(String(item.idProduto));
      if (!venda || !produto) return;
      if (filtros.filial && String(venda.idFilial) !== String(filtros.filial)) return;
      if (filtros.categoria && String(produto.idCategoria) !== String(filtros.categoria)) return;
      if (filtros.subcategoria && String(produto.idSubcategoria) !== String(filtros.subcategoria)) return;

      const qtd = Number(item.qtd || 0);
      const faturamento = Number(item.valorVenda || 0);
      const lucro = faturamento - Number(item.custoTotal || 0);
      const idCategoria = String(produto.idCategoria || produto.categoria || "SEM CATEGORIA");
      const idSubcategoria = String(produto.idSubcategoria || produto.subcategoria || "SEM SUBCATEGORIA");
      nomesCategoriasCrescimento.set(idCategoria, produto.categoria || idCategoria);

      if (venda.mesKey === ultimoMesFechado) {
        crescimentoAtual.set(idCategoria, (crescimentoAtual.get(idCategoria) || 0) + qtd);
        crescimentoAtualSub.set(idSubcategoria, (crescimentoAtualSub.get(idSubcategoria) || 0) + qtd);
      }
      if (venda.mesKey === mesAnterior) {
        crescimentoAnterior.set(idCategoria, (crescimentoAnterior.get(idCategoria) || 0) + qtd);
        crescimentoAnteriorSub.set(idSubcategoria, (crescimentoAnteriorSub.get(idSubcategoria) || 0) + qtd);
      }

      if (periodo.inicioTS && Number(venda.dataTS || 0) < periodo.inicioTS) return;
      if (periodo.fimTS && Number(venda.dataTS || 0) > periodo.fimTS) return;

      acumularCategoriaLocal(categorias, idCategoria, produto.categoria || idCategoria, qtd, faturamento, lucro);
      acumularCategoriaLocal(subcategorias, idSubcategoria, produto.subcategoria || idSubcategoria, qtd, faturamento, lucro, produto.categoria || idCategoria);
    });

    const listaCategorias = finalizarCategoriasLocal(Array.from(categorias.values()));
    const listaSubcategorias = finalizarCategoriasLocal(Array.from(subcategorias.values()));
    const totalVolumeCat = somarCampoLocal(listaCategorias, "volume");
    const totalVolumeSub = somarCampoLocal(listaSubcategorias, "volume");
    const topCategoria = maiorPorLocal(listaCategorias, "volume");
    const topSubcategoria = maiorPorLocal(listaSubcategorias, "volume");
    const melhorMargem = maiorPorLocal(listaCategorias, "margem");
    const maiorFaturamento = maiorPorLocal(listaCategorias, "faturamento");
    const maiorLucro = maiorPorLocal(listaCategorias, "lucro");
    let maiorCrescimento = { nome: "-", valor: 0 };

    const idsCrescimento = new Set();
    crescimentoAtual.forEach(function(_, id) { idsCrescimento.add(id); });
    crescimentoAnterior.forEach(function(_, id) { idsCrescimento.add(id); });
    idsCrescimento.forEach(function(id) {
      const atual = Number(crescimentoAtual.get(String(id)) || 0);
      const anterior = Number(crescimentoAnterior.get(String(id)) || 0);
      const crescimento = anterior ? ((atual - anterior) / anterior) * 100 : (atual > 0 ? 100 : 0);
      if (crescimento > Number(maiorCrescimento.valor || 0)) {
        maiorCrescimento = { nome: nomesCategoriasCrescimento.get(String(id)) || String(id), valor: crescimento };
      }
    });

    aplicarCrescimentoCategoriasLocal(listaCategorias, crescimentoAtual, crescimentoAnterior);
    aplicarCrescimentoCategoriasLocal(listaSubcategorias, crescimentoAtualSub, crescimentoAnteriorSub);

    pacote.categoriasResumo = {
      sucesso: true,
      atualizadoEm: pacote.atualizadoEm || "",
      cards: {
        topCategoria: cardPercentualCategoriaLocal(topCategoria, totalVolumeCat, "volume"),
        topSubcategoria: cardPercentualCategoriaLocal(topSubcategoria, totalVolumeSub, "volume"),
        melhorMargem: { nome: melhorMargem.nome || "-", valor: Number(melhorMargem.margem || 0) },
        maiorCrescimento: maiorCrescimento,
        maiorFaturamento: { nome: maiorFaturamento.nome || "-", valor: Number(maiorFaturamento.faturamento || 0) },
        maiorLucro: { nome: maiorLucro.nome || "-", valor: Number(maiorLucro.lucro || 0) }
      },
      categorias: listaCategorias.sort(function(a, b) { return Number(b.volume || 0) - Number(a.volume || 0); }),
      subcategorias: listaSubcategorias.sort(function(a, b) { return Number(b.volume || 0) - Number(a.volume || 0); })
    };
  }

  function montarMapaClientesLocal() {
    const mapa = new Map();
    (pacote.clientes || []).forEach(function(cliente) {
      mapa.set(String(cliente.idCliente || ""), cliente);
    });
    return mapa;
  }

  function calcularCustoPorVendaLocal() {
    const mapa = new Map();
    (pacote.itensVenda || []).forEach(function(item) {
      const idCarrinho = String(item.idCarrinho || "");
      mapa.set(idCarrinho, (mapa.get(idCarrinho) || 0) + Number(item.custoTotal || 0));
    });
    return mapa;
  }

  function passaFiltroClienteLocal(cliente, filtros) {
    filtros = filtros || {};
    if (!cliente) return false;
    if (filtros.cliente && String(cliente.idCliente) !== String(filtros.cliente)) return false;
    if (filtros.cidade && normalizarTexto(cliente.cidade) !== normalizarTexto(filtros.cidade)) return false;
    if (filtros.bairro && normalizarTexto(cliente.bairro) !== normalizarTexto(filtros.bairro)) return false;
    return true;
  }

  function acumularRegiaoClienteLocal(mapa, nome, venda) {
    const chave = String(nome || "-").trim() || "-";
    if (!mapa.has(chave)) mapa.set(chave, { nome: chave, volume: 0, faturamento: 0, lucro: 0 });
    const item = mapa.get(chave);
    item.volume += 1;
    item.faturamento += Number(venda.faturamento || 0);
    item.lucro += Number(venda.lucro || 0);
  }

  function infoAniversarioLocal(valor, hoje) {
    const data = parseDataBR(valor);
    if (!data) return null;

    const dia = data.getDate();
    const mes = data.getMonth();
    const hojeInicio = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).getTime();
    let proximo = new Date(hoje.getFullYear(), mes, dia);
    if (proximo.getTime() < hojeInicio) proximo = new Date(hoje.getFullYear() + 1, mes, dia);

    return {
      label: String(dia).padStart(2, "0") + "/" + String(mes + 1).padStart(2, "0"),
      proximoTS: proximo.getTime()
    };
  }

  function formatDataLocal(data) {
    return String(data.getDate()).padStart(2, "0") + "/" + String(data.getMonth() + 1).padStart(2, "0") + "/" + data.getFullYear();
  }

  function calcularAbcClientesLocal(lista, metrica) {
    const ordenada = (lista || []).slice().sort(function(a, b) {
      return valorMetricaClienteLocal(b, metrica) - valorMetricaClienteLocal(a, metrica);
    });
    const totalMetrica = ordenada.reduce(function(acc, item) {
      return acc + Math.max(0, valorMetricaClienteLocal(item, metrica));
    }, 0);
    let acumulado = 0;
    const abc = {
      A: { clientes: 0, faturamento: 0, metrica: 0 },
      B: { clientes: 0, faturamento: 0, metrica: 0 },
      C: { clientes: 0, faturamento: 0, metrica: 0 }
    };

    ordenada.forEach(function(item) {
      const valorParticipacao = Math.max(0, valorMetricaClienteLocal(item, metrica));
      const percAntes = totalMetrica ? acumulado / totalMetrica : 1;
      let classe = "C";
      if (totalMetrica > 0 && percAntes < 0.8) classe = "A";
      else if (totalMetrica > 0 && percAntes < 0.95) classe = "B";

      item.classesPorMetrica[metrica] = classe;
      abc[classe].clientes += 1;
      abc[classe].faturamento += Number(item.faturamento || 0);
      abc[classe].metrica += valorParticipacao;
      acumulado += valorParticipacao;
    });

    Object.keys(abc).forEach(function(classe) {
      abc[classe].percentBase = ordenada.length ? (abc[classe].clientes / ordenada.length) * 100 : 0;
      abc[classe].percentMetrica = totalMetrica ? (abc[classe].metrica / totalMetrica) * 100 : 0;
    });
    return abc;
  }

  function qtdMesesDistintosLocal(vendas) {
    const meses = new Set();
    (vendas || []).forEach(function(venda) {
      if (venda.mesKey) meses.add(venda.mesKey);
    });
    return Math.max(1, meses.size);
  }

  function ultimoMesFechadoLocal() {
    const hoje = new Date();
    const data = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
    return data.getFullYear() + "-" + String(data.getMonth() + 1).padStart(2, "0");
  }

  function deslocarMesKeyLocal(mesKey, delta) {
    const partes = String(mesKey || "").split("-");
    if (partes.length !== 2) return "";
    const data = new Date(Number(partes[0]), Number(partes[1]) - 1 + Number(delta || 0), 1);
    return data.getFullYear() + "-" + String(data.getMonth() + 1).padStart(2, "0");
  }

  function acumularCategoriaLocal(mapa, id, nome, qtd, faturamento, lucro, categoria) {
    const chave = id || nome || "-";
    if (!mapa.has(chave)) {
      mapa.set(chave, { id: chave, nome: nome || "-", volume: 0, faturamento: 0, lucro: 0, margem: 0, qtdLinhas: 0 });
    }
    const item = mapa.get(chave);
    item.volume += Number(qtd || 0);
    item.faturamento += Number(faturamento || 0);
    item.lucro += Number(lucro || 0);
    item.qtdLinhas += 1;
    if (categoria) item.categoria = categoria;
  }

  function finalizarCategoriasLocal(lista) {
    return (lista || []).map(function(item) {
      item.margem = item.faturamento ? (Number(item.lucro || 0) / Number(item.faturamento || 0)) * 100 : 0;
      return item;
    });
  }

  function somarCampoLocal(lista, campo) {
    return (lista || []).reduce(function(acc, item) {
      return acc + Number(item[campo] || 0);
    }, 0);
  }

  function maiorPorLocal(lista, campo) {
    return (lista || []).slice().sort(function(a, b) {
      return Number(b[campo] || 0) - Number(a[campo] || 0);
    })[0] || { nome: "-", valor: 0 };
  }

  function aplicarCrescimentoCategoriasLocal(lista, atualMap, anteriorMap) {
    (lista || []).forEach(function(item) {
      const atual = Number(atualMap.get(String(item.id)) || 0);
      const anterior = Number(anteriorMap.get(String(item.id)) || 0);
      item.crescimento = anterior ? ((atual - anterior) / anterior) * 100 : (atual > 0 ? 100 : 0);
    });
  }

  function cardPercentualCategoriaLocal(item, total, campo) {
    return {
      nome: item.nome || "-",
      valor: total ? (Number(item[campo] || 0) / total) * 100 : 0
    };
  }

  function renderizarResumoCategoriasDashboard() {
    const resumo = pacote.categoriasResumo;
    if (!resumo || !resumo.sucesso) return;

    const cards = resumo.cards || {};
    preencherCardCategoria("TopCategoria", cards.topCategoria, false, " em vendas");
    preencherCardCategoria("TopSubcategoria", cards.topSubcategoria, false, " em vendas");
    preencherCardCategoria("MelhorMargem", cards.melhorMargem, false, " de margem");
    preencherCardCategoria("MaiorCrescimento", cards.maiorCrescimento, false, " vs. mes anterior");
    preencherCardCategoria("MaiorFaturamento", cards.maiorFaturamento, true, "");
    preencherCardCategoria("MaiorLucro", cards.maiorLucro, true, "");
    renderizarGraficoCategoriasParticipacao();
    renderizarGraficoCategoriasTornado();
    renderizarTabelaCategoriasDetalhe();
  }

  function preencherCardCategoria(prefixo, dados, moeda, sufixo) {
    dados = dados || {};
    setText("cardCat" + prefixo + "Nome", dados.nome || "-");
    setText("cardCat" + prefixo + "Valor", moeda ? formatBRL(dados.valor) : formatPercent(dados.valor));
  }

  function listaCategoriasPorDimensao(dimensao) {
    const resumo = pacote.categoriasResumo || {};
    const dados = resumo[dimensao === "subcategoria" ? "subcategorias" : "categorias"] || [];
    return Array.isArray(dados) ? dados.slice() : [];
  }

  function renderizarTabelaCategoriasDetalhe() {
    const thead = document.getElementById("theadCategoriasDetalhe");
    const tbody = document.getElementById("tbodyCategoriasDetalhe");
    const tabela = document.querySelector(".tabela-dashboard-categorias-detalhe");
    if (!thead || !tbody || !tabela) return;

    const dimensao = estado.categorias.detalheDimensao === "subcategoria" ? "subcategoria" : "categoria";
    const mostrarSubcategoria = dimensao === "subcategoria";
    tabela.classList.toggle("sem-subcategoria", !mostrarSubcategoria);
    setText("tituloCategoriasDetalhe", mostrarSubcategoria ? "Detalhamento por categoria e subcategoria" : "Detalhamento por categoria");

    thead.innerHTML = "<tr>" +
      "<th data-sort-categorias=\"categoria\">Categoria</th>" +
      (mostrarSubcategoria ? "<th data-sort-categorias=\"subcategoria\">Subcategoria</th>" : "") +
      "<th data-sort-categorias=\"volume\">Quantidade de vendas</th>" +
      "<th data-sort-categorias=\"participacaoVendas\">Particip. vendas</th>" +
      "<th data-sort-categorias=\"faturamento\">Faturamento</th>" +
      "<th data-sort-categorias=\"participacaoFaturamento\">Particip. fatur.</th>" +
      "<th data-sort-categorias=\"lucro\">Lucro</th>" +
      "<th data-sort-categorias=\"participacaoLucro\">Particip. lucros</th>" +
      "<th data-sort-categorias=\"margem\">Margem media</th>" +
      "<th data-sort-categorias=\"crescimento\">Crescimento vendas</th>" +
      "</tr>";

    const listaBase = listaCategoriasPorDimensao(dimensao);

    if (!listaBase.length) {
      tbody.innerHTML = "<tr><td colspan=\"" + (mostrarSubcategoria ? 10 : 9) + "\">Nenhum dado encontrado.</td></tr>";
      return;
    }

    const totais = listaBase.reduce(function(acc, item) {
      acc.volume += Number(item.volume || 0);
      acc.faturamento += Number(item.faturamento || 0);
      acc.lucro += Number(item.lucro || 0);
      return acc;
    }, { volume: 0, faturamento: 0, lucro: 0 });

    const dados = listaBase.map(function(item) {
      const participacaoVendas = percentualMetrica(item.volume, totais.volume);
      const participacaoFaturamento = percentualMetrica(item.faturamento, totais.faturamento);
      const participacaoLucro = percentualMetrica(item.lucro, totais.lucro);
      const crescimento = Number(item.crescimento || 0);
      const categoria = mostrarSubcategoria ? (item.categoria || "-") : (item.nome || "-");
      const subcategoria = item.nome || "-";

      return Object.assign({}, item, {
        categoria: categoria,
        subcategoria: subcategoria,
        participacaoVendas: participacaoVendas,
        participacaoFaturamento: participacaoFaturamento,
        participacaoLucro: participacaoLucro,
        crescimento: crescimento
      });
    });

    ordenarDadosCategoriasDetalhe(dados);

    const linhas = dados.map(function(item) {
      const crescimento = Number(item.crescimento || 0);
      const classeCrescimento = crescimento < 0 ? "negativo" : "positivo";
      const iconeCrescimento = crescimento < 0 ? "bi-arrow-down-right" : "bi-arrow-up-right";

      return "<tr>" +
        "<td title=\"" + escapeHtml(item.categoria) + "\">" + escapeHtml(item.categoria) + "</td>" +
        (mostrarSubcategoria ? "<td title=\"" + escapeHtml(item.subcategoria) + "\">" + escapeHtml(item.subcategoria) + "</td>" : "") +
        "<td>" + escapeHtml(formatQtd(item.volume)) + "</td>" +
        "<td style=\"" + heatmapStyleAzul(item.participacaoVendas) + "\">" + escapeHtml(formatPercent(item.participacaoVendas)) + "</td>" +
        "<td>" + escapeHtml(formatBRL(item.faturamento)) + "</td>" +
        "<td style=\"" + heatmapStyleAzul(item.participacaoFaturamento) + "\">" + escapeHtml(formatPercent(item.participacaoFaturamento)) + "</td>" +
        "<td>" + escapeHtml(formatBRL(item.lucro)) + "</td>" +
        "<td style=\"" + heatmapStyleAzul(item.participacaoLucro) + "\">" + escapeHtml(formatPercent(item.participacaoLucro)) + "</td>" +
        "<td>" + escapeHtml(formatPercent(item.margem)) + "</td>" +
        "<td><span class=\"crescimento-categorias " + classeCrescimento + "\"><i class=\"bi " + iconeCrescimento + "\"></i>" + escapeHtml(formatPercent(crescimento)) + "</span></td>" +
        "</tr>";
    });

    tbody.innerHTML = linhas.join("");
  }

  function heatmapStyleAzul(valor) {
    const n = Math.max(0, Math.min(100, Number(valor || 0)));
    const intensidade = Math.max(0.14, Math.min(0.48, 0.14 + (n / 100) * 0.34));
    return "background: rgba(66, 153, 225, " + intensidade.toFixed(3) + "); color: #12365f; font-weight: 850;";
  }

  function alternarOrdenacaoCategoriasDetalhe(campo) {
    if (!campo) return;
    const atual = estado.categorias.detalheSort || { campo: "", direcao: "" };
    if (atual.campo !== campo) {
      estado.categorias.detalheSort = { campo: campo, direcao: "desc" };
    } else if (atual.direcao === "desc") {
      estado.categorias.detalheSort = { campo: campo, direcao: "asc" };
    } else {
      estado.categorias.detalheSort = { campo: "", direcao: "" };
    }
    renderizarTabelaCategoriasDetalhe();
  }

  function ordenarDadosCategoriasDetalhe(dados) {
    const sort = estado.categorias.detalheSort || { campo: "", direcao: "" };
    const campo = sort.campo || "";
    const direcao = sort.direcao || "";

    dados.sort(function(a, b) {
      if (!campo || !direcao) return Number(b.volume || 0) - Number(a.volume || 0);

      const va = a[campo];
      const vb = b[campo];
      let comp;
      if (typeof va === "string" || typeof vb === "string") {
        comp = String(va || "").localeCompare(String(vb || ""), "pt-BR");
      } else {
        comp = Number(va || 0) - Number(vb || 0);
      }
      return direcao === "desc" ? -comp : comp;
    });
  }

  function dataZoomVerticalCategorias(total) {
    if (Number(total || 0) <= 10) return [];
    return [{
      type: "slider",
      yAxisIndex: 0,
      right: 2,
      width: 10,
      startValue: 0,
      endValue: 9,
      zoomLock: true,
      brushSelect: false,
      showDetail: false,
      filterMode: "empty"
    }];
  }

  function configurarScrollMouseCategorias(alvo, chart, total) {
    const totalItens = Number(total || 0);
    if (alvo._categoriasWheelHandler) {
      alvo.removeEventListener("wheel", alvo._categoriasWheelHandler);
      alvo._categoriasWheelHandler = null;
    }
    if (chart._categoriasDataZoomHandler) {
      chart.off("datazoom", chart._categoriasDataZoomHandler);
      chart._categoriasDataZoomHandler = null;
    }
    alvo._categoriasZoomInicio = 0;
    if (totalItens <= 10) return;

    const maxInicio = Math.max(0, totalItens - 10);
    const moverJanela = function(inicio) {
      const novoInicio = Math.max(0, Math.min(maxInicio, Number(inicio || 0)));
      alvo._categoriasZoomInicio = novoInicio;
      chart.dispatchAction({
        type: "dataZoom",
        dataZoomIndex: 0,
        startValue: novoInicio,
        endValue: novoInicio + 9
      });
    };

    alvo._categoriasWheelHandler = function(evento) {
      evento.preventDefault();
      const passo = evento.deltaY > 0 ? 1 : -1;
      const atual = Number(alvo._categoriasZoomInicio || 0);
      moverJanela(atual + passo);
    };

    chart._categoriasDataZoomHandler = function() {
      const opcoes = chart.getOption();
      const zoom = Array.isArray(opcoes.dataZoom) ? opcoes.dataZoom[0] : null;
      if (zoom && zoom.startValue !== undefined) {
        alvo._categoriasZoomInicio = Number(zoom.startValue || 0);
      }
    };

    alvo.addEventListener("wheel", alvo._categoriasWheelHandler, { passive: false });
    chart.on("datazoom", chart._categoriasDataZoomHandler);
  }

  function filtroCategoriaAtivo(dimensao, item) {
    if (!item) return false;
    if (dimensao === "subcategoria") return String(estado.filtros.subcategoria || "") === String(item.id || "");
    return String(estado.filtros.categoria || "") === String(item.id || "");
  }

  function selecionarDimensaoCategorias(dimensao, item) {
    if (!item) return;
    const id = String(item.id || "").trim();
    const nome = String(item.nome || "").trim();
    if (!id) return;

    if (dimensao === "subcategoria") {
      const jaSelecionado = String(estado.filtros.subcategoria || "") === id;
      estado.filtros.subcategoria = jaSelecionado ? "" : id;
      estado.filtros.subcategoriaNome = jaSelecionado ? "" : nome;
      if (!jaSelecionado) {
        estado.filtros.categoria = "";
        estado.filtros.categoriaNome = "";
      }
    } else {
      const jaSelecionado = String(estado.filtros.categoria || "") === id;
      estado.filtros.categoria = jaSelecionado ? "" : id;
      estado.filtros.categoriaNome = jaSelecionado ? "" : nome;
      if (!jaSelecionado) {
        estado.filtros.subcategoria = "";
        estado.filtros.subcategoriaNome = "";
      }
    }

    if (pacote.modoAgregado) {
      pacote.categoriasResumo = null;
      carregarResumoCategoriasDashboard(true);
    } else {
      calcularResumoCategoriasLocal();
      renderizarResumoCategoriasDashboard();
    }
    preencherFiltros();
  }

  function renderizarGraficoCategoriasParticipacao() {
    const alvo = document.getElementById("graficoCategoriasParticipacao");
    if (!alvo || !alvo.offsetParent) return;

    const dimensao = estado.categorias.participacaoDimensao === "subcategoria" ? "subcategoria" : "categoria";
    const metrica = estado.categorias.participacaoMetrica || "volume";
    const lista = listaCategoriasPorDimensao(dimensao).sort(function(a, b) {
      return Number(b[metrica] || 0) - Number(a[metrica] || 0);
    });
    const total = lista.reduce(function(acc, item) {
      return acc + Math.max(0, Number(item[metrica] || 0));
    }, 0);

    alvo.style.height = "100%";

    if (!estado.categorias.chartParticipacao) {
      estado.categorias.chartParticipacao = echarts.init(alvo);
    }
    estado.categorias.chartParticipacao.off("click");
    estado.categorias.chartParticipacao.on("click", function(params) {
      const item = lista[params.dataIndex];
      if (!item) return;
      selecionarDimensaoCategorias(dimensao, item);
    });
    estado.categorias.chartParticipacao.resize();

    if (!lista.length) {
