<script>
(function() {
  let pacote = window.DASHBOARD_OPERACIONAL_INICIAL || {};
  const estado = {
    visao: "vendas",
    periodo: "mes",
    metrica: "volume",
    metricas: ["volume"],
    janelaInicio: null,
    periodoSelecionado: "",
    itemSelecionado: "",
    sort: { campo: "", direcao: "" },
    estoque: {
      periodo: "mes",
      metricas: ["volume"],
      tipos: ["entrada"],
      janelaInicio: null,
      periodoSelecionado: "",
      itemSelecionado: "",
      sort: { campo: "", direcao: "" },
      chart: null,
      periodosVisiveis: [],
      tabelaItens: []
    },
    clientes: {
      pagina: "pagina1",
      metricaAbc: "volume",
      classeSelecionada: "",
      regiaoDimensao: "municipio",
      regiaoMetrica: "volume",
      aniversariantesTodos: false,
      chartRegiao: null,
      sort: { campo: "qtdCompras", direcao: "desc" },
      tabela: []
    },
    categorias: {
      pagina: "pagina1",
      participacaoDimensao: "categoria",
      participacaoMetrica: "volume",
      tornadoDimensao: "categoria",
      detalheDimensao: "categoria",
      detalheSort: { campo: "", direcao: "" },
      chartParticipacao: null,
      chartTornado: null
    },
    filtros: {
      produto: "",
      produtoNome: "",
      fornecedor: "",
      fornecedorNome: "",
      categoria: "",
      categoriaNome: "",
      subcategoria: "",
      subcategoriaNome: "",
      filial: "",
      filialNome: "",
      periodo: ""
    },
    filtrosClientes: {
      cliente: "",
      clienteNome: "",
      cidade: "",
      cidadeNome: "",
      bairro: "",
      bairroNome: "",
      classe: "",
      classeNome: "",
      periodo: ""
    },
    mapaProdutos: new Map(),
    mapaVendas: new Map(),
    dadosBrutos: {
      pacote: null,
      carregando: false,
      pronto: false,
      erro: false,
      progresso: 0,
      timer: null
    },
    chart: null,
    periodosVisiveis: [],
    tabelaItens: []
  };

  document.addEventListener("DOMContentLoaded", iniciarDashboard);

  function iniciarDashboard() {
    configurarToasts();
    if (!pacote.modoAgregado) montarIndices();
    preencherFiltros();
    configurarCalendarioPeriodo();
    configurarEventos();

    if (!pacote.sucesso && pacote.mensagem) {
      toastErr(pacote.mensagem);
    }

    document.getElementById("dashboardAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
    document.getElementById("dashboardEstoqueAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
    document.getElementById("dashboardClientesAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
    document.getElementById("dashboardCategoriasAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
    atualizarDashboard();
    setTimeout(function() {
      document.getElementById("loadingDashboard")?.classList.remove("ativo");
      redimensionarGrafico();
      iniciarCargaDadosBrutosDashboard(false);
    }, 250);
  }

  function configurarToasts() {
    if (!window.toastr) return;
    toastr.options = {
      closeButton: true,
      debug: false,
      newestOnTop: true,
      progressBar: true,
      preventDuplicates: true,
      onclick: null,
      showDuration: "300",
      hideDuration: "1000",
      timeOut: "3000",
      extendedTimeOut: "0",
      showEasing: "swing",
      hideEasing: "linear",
      showMethod: "fadeIn",
      hideMethod: "fadeOut",
      positionClass: "toast-top-center"
    };
  }

  function montarIndices() {
    estado.mapaProdutos.clear();
    estado.mapaVendas.clear();

    (pacote.produtos || []).forEach(function(produto) {
      estado.mapaProdutos.set(String(produto.idProduto), produto);
    });

    (pacote.vendas || []).forEach(function(venda) {
      estado.mapaVendas.set(String(venda.idCarrinho), venda);
    });
  }

  function configurarEventos() {
    document.querySelectorAll(".dashboard-nav-btn").forEach(function(btn) {
      btn.addEventListener("click", function() {
        trocarVisao(btn.dataset.visao);
      });
    });

    document.querySelectorAll("[data-periodo]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.periodo = btn.dataset.periodo;
        estado.janelaInicio = null;
        estado.periodoSelecionado = "";
        marcarAtivo("[data-periodo]", btn);
        if (pacote.modoAgregado) carregarResumoVendasDashboard(true);
        else atualizarDashboard();
      });
    });

    document.querySelectorAll("[data-metrica]").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        alternarSelecaoMetricasVendas(btn, e.ctrlKey || e.metaKey);
      });
    });

    document.querySelectorAll("[data-estoque-periodo]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.estoque.periodo = btn.dataset.estoquePeriodo;
        estado.estoque.janelaInicio = null;
        estado.estoque.periodoSelecionado = "";
        marcarAtivo("[data-estoque-periodo]", btn);
        if (pacote.modoAgregado) carregarResumoEstoqueDashboard(true);
        else atualizarDashboard();
      });
    });

    document.querySelectorAll("[data-estoque-metrica]").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        alternarSelecaoMultipla(btn, "metricas", e.ctrlKey || e.metaKey);
      });
    });

    document.querySelectorAll("[data-estoque-tipo]").forEach(function(btn) {
      btn.addEventListener("click", function(e) {
        alternarSelecaoMultipla(btn, "tipos", e.ctrlKey || e.metaKey);
      });
    });

    document.getElementById("btnJanelaAnterior")?.addEventListener("click", function() {
      moverJanela(-1);
    });

    document.getElementById("btnJanelaProxima")?.addEventListener("click", function() {
      moverJanela(1);
    });

    document.getElementById("btnLimparSelecaoGrafico")?.addEventListener("click", function() {
      estado.periodoSelecionado = "";
      if (pacote.modoAgregado) carregarResumoVendasDashboard(true);
      else atualizarDashboard();
    });

    document.getElementById("btnLimparSelecaoItem")?.addEventListener("click", function() {
      estado.itemSelecionado = "";
      if (pacote.modoAgregado) carregarResumoVendasDashboard(true);
      else atualizarDashboard();
    });

    document.getElementById("btnAbrirFiltrosDashboard")?.addEventListener("click", abrirFiltros);
    document.getElementById("btnAtualizarDashboard")?.addEventListener("click", atualizarDadosDashboard);
    document.getElementById("btnLimparFiltrosTopoDashboard")?.addEventListener("click", limparFiltros);
    document.getElementById("btnAbrirFiltrosEstoqueDashboard")?.addEventListener("click", abrirFiltros);
    document.getElementById("btnAtualizarEstoqueDashboard")?.addEventListener("click", atualizarDadosDashboard);
    document.getElementById("btnLimparFiltrosEstoqueDashboard")?.addEventListener("click", limparFiltros);
    document.getElementById("btnAbrirFiltrosClientesDashboard")?.addEventListener("click", abrirFiltros);
    document.getElementById("btnAtualizarClientesDashboard")?.addEventListener("click", atualizarDadosDashboard);
    document.getElementById("btnLimparFiltrosClientesDashboard")?.addEventListener("click", limparFiltros);
    document.getElementById("btnAbrirFiltrosCategoriasDashboard")?.addEventListener("click", abrirFiltros);
    document.getElementById("btnAtualizarCategoriasDashboard")?.addEventListener("click", atualizarDadosDashboard);
    document.getElementById("btnLimparFiltrosCategoriasDashboard")?.addEventListener("click", limparFiltros);
    document.getElementById("btnFecharFiltrosDashboard")?.addEventListener("click", fecharFiltros);
    document.getElementById("btnAplicarFiltrosDashboard")?.addEventListener("click", aplicarFiltros);
    document.getElementById("btnCancelarFiltrosDashboard")?.addEventListener("click", fecharFiltros);
    document.getElementById("modalFiltrosDashboard")?.addEventListener("click", function(e) {
      if (e.target.id === "modalFiltrosDashboard") fecharFiltros();
    });

    document.querySelectorAll(".tabela-dashboard th[data-sort]").forEach(function(th) {
      th.addEventListener("click", function() {
        alternarOrdenacao(th.dataset.sort);
      });
    });

    document.querySelectorAll(".tabela-dashboard th[data-sort-estoque]").forEach(function(th) {
      th.addEventListener("click", function() {
        alternarOrdenacaoEstoque(th.dataset.sortEstoque);
      });
    });

    document.querySelectorAll("[data-clientes-pagina]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        trocarPaginaClientes(btn.dataset.clientesPagina);
      });
    });

    document.querySelectorAll(".tabela-dashboard th[data-sort-clientes]").forEach(function(th) {
      th.addEventListener("click", function() {
        alternarOrdenacaoClientes(th.dataset.sortClientes);
      });
    });

    document.querySelectorAll("[data-clientes-metrica]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.clientes.metricaAbc = btn.dataset.clientesMetrica || "volume";
        estado.clientes.classeSelecionada = "";
        estado.clientes.sort = { campo: campoMetricaClientes(estado.clientes.metricaAbc), direcao: "desc" };
        marcarAtivo("[data-clientes-metrica]", btn);
        aplicarMetricaClientesLocal();
      });
    });

    document.querySelectorAll("[data-classe-clientes]").forEach(function(card) {
      card.addEventListener("click", function() {
        const classe = card.dataset.classeClientes || "";
        estado.clientes.classeSelecionada = estado.clientes.classeSelecionada === classe ? "" : classe;
        atualizarCardsClasseSelecionada();
        renderizarTabelaClientesResumo();
      });
    });

    document.getElementById("btnLimparClasseClientes")?.addEventListener("click", function() {
      estado.clientes.classeSelecionada = "";
      atualizarCardsClasseSelecionada();
      renderizarTabelaClientesResumo();
    });

    document.querySelectorAll("[data-clientes-regiao-dimensao]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.clientes.regiaoDimensao = btn.dataset.clientesRegiaoDimensao || "municipio";
        marcarAtivo("[data-clientes-regiao-dimensao]", btn);
        renderizarGraficoClientesRegiao();
      });
    });

    document.querySelectorAll("[data-clientes-regiao-metrica]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.clientes.regiaoMetrica = btn.dataset.clientesRegiaoMetrica || "volume";
        marcarAtivo("[data-clientes-regiao-metrica]", btn);
        renderizarGraficoClientesRegiao();
      });
    });

    document.getElementById("btnVerTodosAniversariantes")?.addEventListener("click", function() {
      estado.clientes.aniversariantesTodos = !estado.clientes.aniversariantesTodos;
      renderizarTabelaClientesAniversariantes();
    });

    document.querySelectorAll("[data-categorias-pagina]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        trocarPaginaCategorias(btn.dataset.categoriasPagina);
      });
    });

    document.querySelectorAll("[data-cat-part-dimensao]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.categorias.participacaoDimensao = btn.dataset.catPartDimensao || "categoria";
        marcarAtivo("[data-cat-part-dimensao]", btn);
        renderizarGraficoCategoriasParticipacao();
      });
    });

    document.querySelectorAll("[data-cat-part-metrica]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.categorias.participacaoMetrica = btn.dataset.catPartMetrica || "volume";
        marcarAtivo("[data-cat-part-metrica]", btn);
        renderizarGraficoCategoriasParticipacao();
      });
    });

    document.querySelectorAll("[data-cat-tornado-dimensao]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.categorias.tornadoDimensao = btn.dataset.catTornadoDimensao || "categoria";
        marcarAtivo("[data-cat-tornado-dimensao]", btn);
        renderizarGraficoCategoriasTornado();
      });
    });

    document.querySelectorAll("[data-cat-detalhe-dimensao]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        estado.categorias.detalheDimensao = btn.dataset.catDetalheDimensao || "categoria";
        estado.categorias.detalheSort = { campo: "", direcao: "" };
        marcarAtivo("[data-cat-detalhe-dimensao]", btn);
        renderizarTabelaCategoriasDetalhe();
      });
    });

    document.getElementById("theadCategoriasDetalhe")?.addEventListener("click", function(e) {
      const th = e.target.closest("th[data-sort-categorias]");
      if (!th) return;
      alternarOrdenacaoCategoriasDetalhe(th.dataset.sortCategorias || "");
    });

    document.getElementById("btnEstoqueJanelaAnterior")?.addEventListener("click", function() {
      moverJanelaEstoque(-1);
    });
    document.getElementById("btnEstoqueJanelaProxima")?.addEventListener("click", function() {
      moverJanelaEstoque(1);
    });
    document.getElementById("btnLimparSelecaoGraficoEstoque")?.addEventListener("click", function() {
      estado.estoque.periodoSelecionado = "";
      if (pacote.modoAgregado) carregarResumoEstoqueDashboard(true);
      else atualizarDashboard();
    });
    document.getElementById("btnLimparSelecaoItemEstoque")?.addEventListener("click", function() {
      estado.estoque.itemSelecionado = "";
      if (pacote.modoAgregado) carregarResumoEstoqueDashboard(true);
      else atualizarDashboard();
    });
    document.getElementById("btnInfoEstoque")?.addEventListener("click", abrirInfoEstoque);
    document.getElementById("btnFecharInfoEstoque")?.addEventListener("click", fecharInfoEstoque);
    document.getElementById("modalInfoEstoque")?.addEventListener("click", function(e) {
      if (e.target.id === "modalInfoEstoque") fecharInfoEstoque();
    });
    document.getElementById("btnInfoVendas")?.addEventListener("click", abrirInfoVendas);
    document.getElementById("btnFecharInfoVendas")?.addEventListener("click", fecharInfoVendas);
    document.getElementById("modalInfoVendas")?.addEventListener("click", function(e) {
      if (e.target.id === "modalInfoVendas") fecharInfoVendas();
    });

    document.getElementById("btnExportarDashboard")?.addEventListener("click", exportarPDF);
    window.addEventListener("resize", redimensionarGrafico);
  }

  function alternarSelecaoMultipla(btn, campo, manter) {
    const valorBtn = campo === "metricas" ? btn.dataset.estoqueMetrica : btn.dataset.estoqueTipo;
    if (!valorBtn) return;

    let lista = estado.estoque[campo].slice();
    if (manter) {
      if (lista.includes(valorBtn)) {
        lista = lista.filter(function(valor) { return valor !== valorBtn; });
      } else {
        lista.push(valorBtn);
      }
      if (!lista.length) lista = [valorBtn];
    } else {
      lista = [valorBtn];
    }

    estado.estoque[campo] = lista;
    estado.estoque.janelaInicio = null;
    estado.estoque.periodoSelecionado = "";

    const selector = campo === "metricas" ? "[data-estoque-metrica]" : "[data-estoque-tipo]";
    document.querySelectorAll(selector).forEach(function(item) {
      const valorItem = campo === "metricas" ? item.dataset.estoqueMetrica : item.dataset.estoqueTipo;
      item.classList.toggle("ativo", lista.includes(valorItem));
    });

    if (pacote.modoAgregado) renderizarResumoEstoqueDashboard();
    else atualizarDashboard();
  }

  function alternarSelecaoMetricasVendas(btn, manter) {
    const valorBtn = btn.dataset.metrica;
    if (!valorBtn) return;

    let lista = (estado.metricas || [estado.metrica || "volume"]).slice();
    if (manter) {
      if (lista.includes(valorBtn)) {
        lista = lista.filter(function(valor) { return valor !== valorBtn; });
      } else {
        lista.push(valorBtn);
      }
      if (!lista.length) lista = [valorBtn];
    } else {
      lista = [valorBtn];
    }

    estado.metricas = lista;
    estado.metrica = lista[0] || "volume";

    document.querySelectorAll("[data-metrica]").forEach(function(item) {
      item.classList.toggle("ativo", lista.includes(item.dataset.metrica));
    });

    if (pacote.modoAgregado) renderizarResumoVendasDashboard();
    else atualizarDashboard();
  }

  function marcarAtivo(selector, alvo) {
    document.querySelectorAll(selector).forEach(function(btn) {
      btn.classList.toggle("ativo", btn === alvo);
    });
  }

  function trocarVisao(visao) {
    if (!visao) return;
    estado.visao = visao;

    document.querySelectorAll(".dashboard-nav-btn").forEach(function(btn) {
      btn.classList.toggle("ativo", btn.dataset.visao === visao);
    });

    document.querySelectorAll(".dashboard-visao").forEach(function(painel) {
      painel.classList.toggle("ativo", painel.dataset.painel === visao);
    });

    redimensionarGrafico();
    if (visao === "vendas" && pacote.modoAgregado && !pacote.vendasResumo) {
      carregarResumoVendasDashboard(true);
    }
    if (visao === "estoque" && pacote.modoAgregado && !pacote.estoqueResumo) {
      carregarResumoEstoqueDashboard(true);
    }
    if (visao === "clientes" && !pacote.modoAgregado && !pacote.clientesResumo) {
      calcularResumoClientesLocal();
      renderizarResumoClientesDashboard();
    } else if (visao === "clientes" && !pacote.clientesResumo) {
      carregarResumoClientesDashboard(true);
    }
    if (visao === "clientes" && pacote.clientesResumo) {
      renderizarResumoClientesDashboard();
    }
    if (visao === "categorias" && !pacote.modoAgregado && !pacote.categoriasResumo) {
      calcularResumoCategoriasLocal();
      renderizarResumoCategoriasDashboard();
    } else if (visao === "categorias" && !pacote.categoriasResumo) {
      carregarResumoCategoriasDashboard(true);
    }
    if (visao === "categorias" && pacote.categoriasResumo) {
      renderizarResumoCategoriasDashboard();
    }
  }

  function trocarPaginaClientes(pagina) {
    if (!pagina) return;
    estado.clientes.pagina = pagina;

    document.querySelectorAll("[data-clientes-pagina]").forEach(function(btn) {
      btn.classList.toggle("ativo", btn.dataset.clientesPagina === pagina);
    });

    document.querySelectorAll("[data-clientes-painel]").forEach(function(painel) {
      painel.classList.toggle("ativo", painel.dataset.clientesPainel === pagina);
    });

    if (pagina === "pagina2") {
      setTimeout(function() {
        renderizarPagina2Clientes();
        if (estado.clientes.chartRegiao) estado.clientes.chartRegiao.resize();
      }, 60);
    }
  }

  function trocarPaginaCategorias(pagina) {
    if (!pagina) return;
    estado.categorias.pagina = pagina;

    document.querySelectorAll("[data-categorias-pagina]").forEach(function(btn) {
      btn.classList.toggle("ativo", btn.dataset.categoriasPagina === pagina);
    });

    document.querySelectorAll("[data-categorias-painel]").forEach(function(painel) {
      painel.classList.toggle("ativo", painel.dataset.categoriasPainel === pagina);
    });

    if (pagina === "pagina1") {
      setTimeout(function() {
        renderizarResumoCategoriasDashboard();
        if (estado.categorias.chartParticipacao) estado.categorias.chartParticipacao.resize();
        if (estado.categorias.chartTornado) estado.categorias.chartTornado.resize();
      }, 60);
    } else if (pagina === "pagina2") {
      setTimeout(renderizarTabelaCategoriasDetalhe, 60);
    }
  }

  function preencherFiltros() {
    configurarDropdownFiltro("filtroProdutoDash", "listaFiltroProdutoDash", opcoesProdutosFiltro());
    configurarDropdownFiltro("filtroFornecedorDash", "listaFiltroFornecedorDash", pacote.filtros?.fornecedores || []);
    configurarDropdownFiltro("filtroCategoriaDash", "listaFiltroCategoriaDash", pacote.filtros?.categorias || []);
    configurarDropdownFiltro("filtroSubcategoriaDash", "listaFiltroSubcategoriaDash", pacote.filtros?.subcategorias || []);
    configurarDropdownFiltro("filtroFilialDash", "listaFiltroFilialDash", pacote.filtros?.filiais || []);
    configurarDropdownFiltro("filtroClienteDash", "listaFiltroClienteDash", pacote.filtros?.clientes || []);
    configurarDropdownFiltro("filtroCidadeClienteDash", "listaFiltroCidadeClienteDash", pacote.filtros?.cidadesClientes || []);
    configurarDropdownFiltro("filtroBairroClienteDash", "listaFiltroBairroClienteDash", pacote.filtros?.bairrosClientes || []);
    configurarDropdownFiltro("filtroClasseClienteDash", "listaFiltroClasseClienteDash", pacote.filtros?.classesClientes || [
      { id: "A", nome: "Clientes A" },
      { id: "B", nome: "Clientes B" },
      { id: "C", nome: "Clientes C" }
    ]);

    setValueCampo("filtroProdutoDash", estado.filtros.produtoNome);
    setValueCampo("filtroFornecedorDash", estado.filtros.fornecedorNome);
    setValueCampo("filtroCategoriaDash", estado.filtros.categoriaNome);
    setValueCampo("filtroSubcategoriaDash", estado.filtros.subcategoriaNome);
    setValueCampo("filtroFilialDash", estado.filtros.filialNome);
    setValueCampo("filtroClienteDash", estado.filtrosClientes.clienteNome);
    setValueCampo("filtroCidadeClienteDash", estado.filtrosClientes.cidadeNome);
    setValueCampo("filtroBairroClienteDash", estado.filtrosClientes.bairroNome);
    setValueCampo("filtroClasseClienteDash", estado.filtrosClientes.classeNome);
    setValueCampo("filtroPeriodoDash", estado.visao === "clientes" ? estado.filtrosClientes.periodo : estado.filtros.periodo);
  }

  function opcoesProdutosFiltro() {
    const produtos = pacote.modoAgregado ? (pacote.filtros?.produtos || []) : (pacote.produtos || []);
    return produtos
      .map(function(produto) {
        return {
          id: String(produto.id || produto.idProduto || ""),
          nome: String(produto.nome || produto.idProduto || produto.id || "")
        };
      })
      .filter(function(item) {
        return item.id && item.nome;
      })
      .sort(function(a, b) {
        return a.nome.localeCompare(b.nome, "pt-BR");
      });
  }

  function configurarDropdownFiltro(inputId, listaId, opcoes) {
    const input = document.getElementById(inputId);
    const lista = document.getElementById(listaId);
    if (!input || !lista) return;

    input._opcoesFiltroDashboard = opcoes || [];

    if (input.dataset.dropdownConfigurado === "S") {
      renderizarDropdownFiltro(input, lista);
      return;
    }

    input.dataset.dropdownConfigurado = "S";
    input.addEventListener("focus", function() {
      renderizarDropdownFiltro(input, lista);
    });
    input.addEventListener("click", function() {
      renderizarDropdownFiltro(input, lista);
    });
    input.addEventListener("input", function() {
      input.dataset.valorSelecionado = "";
      renderizarDropdownFiltro(input, lista);
    });
  }

  function renderizarDropdownFiltro(input, lista) {
    const termo = normalizarTexto(input.value);
    const opcoes = (input._opcoesFiltroDashboard || []).filter(function(opcao) {
      return !termo || normalizarTexto(opcao.nome).includes(termo);
    }).slice(0, 80);

    lista.innerHTML = "";
    if (!opcoes.length) {
      lista.style.display = "none";
      return;
    }

    opcoes.forEach(function(opcao) {
      const li = document.createElement("li");
      li.textContent = opcao.nome;
      li.addEventListener("mousedown", function(e) {
        e.preventDefault();
        input.value = opcao.nome;
        input.dataset.valorSelecionado = opcao.id;
        lista.style.display = "none";
      });
      lista.appendChild(li);
    });

    lista.style.display = "block";
  }

  function resolverOpcaoFiltro(opcoes, texto) {
    const nome = String(texto || "").trim();
    if (!nome) return { id: "", nome: "" };

    const nomeNormalizado = normalizarTexto(nome);
    const encontrada = (opcoes || []).find(function(opcao) {
      return normalizarTexto(opcao.nome) === nomeNormalizado;
    });

    return encontrada ? { id: String(encontrada.id || ""), nome: encontrada.nome || nome } : { id: "__SEM_RESULTADO__", nome: nome };
  }

  function normalizarTexto(texto) {
    return String(texto || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .trim()
      .toLowerCase();
  }

  function configurarFechamentoDropdowns() {
    if (document.body.dataset.dropdownDashboardConfigurado === "S") return;
    document.body.dataset.dropdownDashboardConfigurado = "S";

    document.addEventListener("click", function(e) {
      if (e.target.closest("#modalFiltrosDashboard .dropdown-container")) return;
      document.querySelectorAll("#modalFiltrosDashboard .sugestoes").forEach(function(lista) {
        lista.style.display = "none";
      });
    });
  }

  function configurarCalendarioPeriodo() {
    configurarFechamentoDropdowns();

    const input = document.getElementById("filtroPeriodoDash");
    if (!input || !window.M || !M.Datepicker || input.dataset.datepickerConfigurado === "S") return;

    input.dataset.datepickerConfigurado = "S";
    const i18nBR = {
      cancel: "Cancelar",
      clear: "Limpar",
      done: "OK",
      months: ["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"],
      monthsShort: ["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"],
      weekdays: ["Domingo","Segunda","Terca","Quarta","Quinta","Sexta","Sabado"],
      weekdaysShort: ["Dom","Seg","Ter","Qua","Qui","Sex","Sab"],
      weekdaysAbbrev: ["D","S","T","Q","Q","S","S"]
    };

    initDatepickerRangeDashboard(input, i18nBR);
  }

  function initDatepickerRangeDashboard(input, i18nBR) {
    const fmt = function(d) {
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      return dd + "/" + mm + "/" + d.getFullYear();
    };

    let start = null;
    let end = null;
    const instance = M.Datepicker.init(input, {
      format: "dd/mm/yyyy",
      maxDate: new Date(),
      autoClose: false,
      showClearBtn: true,
      yearRange: 100,
      i18n: i18nBR,
      onOpen: function() {
        const rangeAtual = datasPeriodoAnalise(input.value);
        start = rangeAtual.start;
        end = rangeAtual.end;
        setTimeout(function() {
          highlightRangeDashboard(instance, start, end);
        }, 0);
      },
      onSelect: function(date) {
        if (!start || (start && end)) {
          start = new Date(date.getFullYear(), date.getMonth(), date.getDate());
          end = null;
          input.value = fmt(start) + " - ";
          setTimeout(function() {
            highlightRangeDashboard(instance, start, end);
          }, 0);
          return;
        }

        const picked = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        if (picked.getTime() < start.getTime()) {
          end = start;
          start = picked;
        } else {
          end = picked;
        }

        input.value = fmt(start) + " - " + fmt(end);
        setTimeout(function() {
          highlightRangeDashboard(instance, start, end);
        }, 0);
        instance.close();
      }
    });

    input.addEventListener("input", function() {
      if (!input.value.trim()) {
        start = null;
        end = null;
        setTimeout(function() {
          highlightRangeDashboard(instance, start, end);
        }, 0);
      }
    });
  }

  function datasPeriodoAnalise(texto) {
    const bruto = String(texto || "").trim();
    if (!bruto) return { start: null, end: null };

    const partes = bruto.split(/\s+-\s+/).filter(Boolean);
    return {
      start: parseDataBR(partes[0]),
      end: parseDataBR(partes[1])
    };
  }

  function highlightRangeDashboard(instance, start, end) {
    if (!instance || !instance.datepickerEl) return;

    const tds = instance.datepickerEl.querySelectorAll(".datepicker-table td");
    tds.forEach(function(td) {
      td.classList.remove("range-start", "range-end", "range-between");
    });
    if (!start) return;

    const startT = start.getTime();
    const endT = end ? end.getTime() : null;

    tds.forEach(function(td) {
      const btn = td.querySelector(".datepicker-day-button");
      if (!btn) return;

      const day = parseInt(btn.getAttribute("data-day"), 10);
      const month = parseInt(btn.getAttribute("data-month"), 10);
      const year = parseInt(btn.getAttribute("data-year"), 10);
      if (Number.isNaN(day) || Number.isNaN(month) || Number.isNaN(year)) return;

      const cellT = new Date(year, month, day).getTime();
      if (!endT && cellT === startT) td.classList.add("range-start");
      if (endT && cellT === startT) td.classList.add("range-start");
      if (endT && cellT === endT) td.classList.add("range-end");
      if (endT && cellT > startT && cellT < endT) td.classList.add("range-between");
    });
  }

  function abrirFiltros() {
    if (!podeUsarFiltrosDashboard()) return;
    atualizarCamposFiltroDashboard();
    preencherFiltros();
    document.getElementById("modalFiltrosDashboard")?.classList.add("ativo");
  }

  function fecharFiltros() {
    document.getElementById("modalFiltrosDashboard")?.classList.remove("ativo");
  }

  function atualizarCamposFiltroDashboard() {
    document.querySelectorAll("#modalFiltrosDashboard [data-filtro-grupo]").forEach(function(campo) {
      const grupos = String(campo.dataset.filtroGrupo || "").split(/\s+/).filter(Boolean);
      campo.style.display = grupos.includes(estado.visao) ? "flex" : "none";
    });
    setValueCampo("filtroPeriodoDash", estado.visao === "clientes" ? estado.filtrosClientes.periodo : estado.filtros.periodo);
  }

  function aplicarFiltros() {
    if (!podeUsarFiltrosDashboard()) return;

    if (estado.visao === "clientes") {
      aplicarFiltrosClientes();
      return;
    }

    const visao = estado.visao;
    const produto = campoFiltroPermitido("produto", visao) ? resolverOpcaoFiltro(opcoesProdutosFiltro(), valor("filtroProdutoDash")) : { id: "", nome: "" };
    const fornecedor = campoFiltroPermitido("fornecedor", visao) ? resolverOpcaoFiltro(pacote.filtros?.fornecedores || [], valor("filtroFornecedorDash")) : { id: "", nome: "" };
    const categoria = campoFiltroPermitido("categoria", visao) ? resolverOpcaoFiltro(pacote.filtros?.categorias || [], valor("filtroCategoriaDash")) : { id: "", nome: "" };
    const subcategoria = campoFiltroPermitido("subcategoria", visao) ? resolverOpcaoFiltro(pacote.filtros?.subcategorias || [], valor("filtroSubcategoriaDash")) : { id: "", nome: "" };
    const filial = campoFiltroPermitido("filial", visao) ? resolverOpcaoFiltro(pacote.filtros?.filiais || [], valor("filtroFilialDash")) : { id: "", nome: "" };

    estado.filtros = {
      produto: produto.id,
      produtoNome: produto.nome,
      fornecedor: fornecedor.id,
      fornecedorNome: fornecedor.nome,
      categoria: categoria.id,
      categoriaNome: categoria.nome,
      subcategoria: subcategoria.id,
      subcategoriaNome: subcategoria.nome,
      filial: filial.id,
      filialNome: filial.nome,
      periodo: valor("filtroPeriodoDash")
    };
    estado.periodoSelecionado = "";
    estado.itemSelecionado = "";
    estado.janelaInicio = null;
    estado.estoque.periodoSelecionado = "";
    estado.estoque.itemSelecionado = "";
    estado.estoque.janelaInicio = null;
    fecharFiltros();
    if (!pacote.modoAgregado && estado.visao === "categorias") {
      calcularResumoCategoriasLocal();
      renderizarResumoCategoriasDashboard();
      return;
    }
    if (pacote.modoAgregado) {
      pacote.vendasResumo = null;
      pacote.estoqueResumo = null;
      if (estado.visao === "estoque") carregarResumoEstoqueDashboard(true);
      else if (estado.visao === "categorias") carregarResumoCategoriasDashboard(true);
      else carregarResumoVendasDashboard(true);
      return;
    }
    atualizarDashboard();
  }

  function aplicarFiltrosClientes() {
    if (!podeUsarFiltrosDashboard()) return;

    const cliente = resolverOpcaoFiltro(pacote.filtros?.clientes || [], valor("filtroClienteDash"));
    const cidade = resolverOpcaoFiltro(pacote.filtros?.cidadesClientes || [], valor("filtroCidadeClienteDash"));
    const bairro = resolverOpcaoFiltro(pacote.filtros?.bairrosClientes || [], valor("filtroBairroClienteDash"));
    const classe = resolverOpcaoFiltro(pacote.filtros?.classesClientes || [], valor("filtroClasseClienteDash"));

    estado.filtrosClientes = {
      cliente: cliente.id,
      clienteNome: cliente.nome,
      cidade: cidade.id,
      cidadeNome: cidade.nome,
      bairro: bairro.id,
      bairroNome: bairro.nome,
      classe: classe.id,
      classeNome: classe.nome,
      periodo: valor("filtroPeriodoDash")
    };
    estado.clientes.classeSelecionada = classe.id && classe.id !== "__SEM_RESULTADO__" ? classe.id : "";

    fecharFiltros();
    if (pacote.modoAgregado) {
      pacote.clientesResumo = null;
      carregarResumoClientesDashboard(true);
      return;
    }
    calcularResumoClientesLocal();
    renderizarResumoClientesDashboard();
  }

  function limparFiltros() {
    if (!podeUsarFiltrosDashboard()) return;

    const campos = camposFiltroPorVisao(estado.visao).map(function(campo) {
      return campo.id;
    });
    campos.forEach(function(id) {
      const el = document.getElementById(id);
      if (el) el.value = "";
    });
    aplicarFiltros();
  }

  function camposFiltroPorVisao(visao) {
    const todos = {
      produto: { id: "filtroProdutoDash" },
      categoria: { id: "filtroCategoriaDash" },
      subcategoria: { id: "filtroSubcategoriaDash" },
      fornecedor: { id: "filtroFornecedorDash" },
      filial: { id: "filtroFilialDash" },
      cliente: { id: "filtroClienteDash" },
      classe: { id: "filtroClasseClienteDash" },
      cidade: { id: "filtroCidadeClienteDash" },
      bairro: { id: "filtroBairroClienteDash" },
      periodo: { id: "filtroPeriodoDash" }
    };

    const mapa = {
      vendas: ["produto", "categoria", "filial", "subcategoria", "periodo"],
      estoque: ["produto", "categoria", "subcategoria", "fornecedor", "filial", "periodo"],
      clientes: ["cliente", "classe", "cidade", "bairro", "periodo"],
      categorias: ["categoria", "subcategoria", "filial", "periodo"]
    };

    return (mapa[visao] || mapa.vendas).map(function(chave) {
      return todos[chave];
    });
  }

  function campoFiltroPermitido(campo, visao) {
    return camposFiltroPorVisao(visao).some(function(item) {
      if (campo === "produto") return item.id === "filtroProdutoDash";
      if (campo === "categoria") return item.id === "filtroCategoriaDash";
      if (campo === "subcategoria") return item.id === "filtroSubcategoriaDash";
      if (campo === "fornecedor") return item.id === "filtroFornecedorDash";
      if (campo === "filial") return item.id === "filtroFilialDash";
      return false;
    });
  }

  function podeUsarFiltrosDashboard() {
    if (estado.dadosBrutos.pronto) return true;
    if (estado.dadosBrutos.erro) return true;

    if (estado.dadosBrutos.carregando) {
      toastWarn("Aguarde a conclusao da carga completa dos dados para usar os filtros.");
      return false;
    }

    iniciarCargaDadosBrutosDashboard(false);
    toastWarn("Os filtros serao liberados quando a carga completa dos dados terminar.");
    return false;
  }

  function atualizarDadosDashboard() {
    document.getElementById("loadingDashboard")?.classList.add("ativo");

    if (pacote.modoAgregado || estado.dadosBrutos.pronto) {
      carregarResumosRapidosTodasVisoes(function() {
        document.getElementById("loadingDashboard")?.classList.remove("ativo");
        pacote.modoAgregado = true;
        atualizarDashboard();
        toastOk("Atualização concluída");
        iniciarCargaDadosBrutosDashboard(true);
      });
      return;
    }

    if (pacote.modoAgregado) {
      const finalizar = function() {
        document.getElementById("loadingDashboard")?.classList.remove("ativo");
        toastOk("AtualizaÃ§Ã£o concluÃ­da");
      };

      if (estado.visao === "estoque") carregarResumoEstoqueDashboard(false, finalizar);
      else if (estado.visao === "clientes") carregarResumoClientesDashboard(false, finalizar);
      else if (estado.visao === "categorias") carregarResumoCategoriasDashboard(false, finalizar);
      else carregarResumoVendasDashboard(false, finalizar);
      return;
    }

    google.script.run
      .withSuccessHandler(function(resp) {
        document.getElementById("loadingDashboard")?.classList.remove("ativo");

        if (!resp || !resp.sucesso) {
          toastErr(resp?.mensagem || "Erro ao atualizar dados do dashboard.");
          return;
        }

        pacote = resp;
        estado.periodoSelecionado = "";
        estado.itemSelecionado = "";
        estado.janelaInicio = null;
        estado.estoque.periodoSelecionado = "";
        estado.estoque.itemSelecionado = "";
        estado.estoque.janelaInicio = null;
        montarIndices();
        preencherFiltros();
        document.getElementById("dashboardAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
        document.getElementById("dashboardEstoqueAtualizacao").textContent = "Ultima atualizacao: " + (pacote.atualizadoEm || "-");
        atualizarDashboard();
        toastOk("Atualização concluída");
      })
      .withFailureHandler(function(erro) {
        document.getElementById("loadingDashboard")?.classList.remove("ativo");
        console.error(erro);
        toastErr("Erro no Apps Script ao atualizar dashboard.");
      })
      .buscarPacoteDashboardOperacional();
  }

  function carregarResumosRapidosTodasVisoes(callback) {
    const tarefas = [
      ["VENDAS", opcoesResumoVendas()],
      ["ESTOQUE", opcoesResumoEstoque()],
      ["CLIENTES", opcoesResumoClientes()],
      ["CATEGORIAS", opcoesResumoCategorias()]
    ];
    let pendentes = tarefas.length;
    let houveErro = false;

    tarefas.forEach(function(tarefa) {
      google.script.run
        .withSuccessHandler(function(resp) {
          if (!resp || !resp.sucesso) {
            houveErro = true;
          } else {
            receberResumoRapidoDashboard(tarefa[0], resp);
          }
          finalizarTarefa();
        })
        .withFailureHandler(function(erro) {
          houveErro = true;
          console.error(erro);
          finalizarTarefa();
        })
        .buscarPacoteDashboardOperacional(tarefa[0], tarefa[1]);
    });

    function finalizarTarefa() {
      pendentes--;
      if (pendentes > 0) return;
      if (houveErro) toastWarn("Alguns resumos nao puderam ser atualizados agora.");
      if (callback) callback(!houveErro);
    }
  }

  function receberResumoRapidoDashboard(modo, resp) {
    if (modo === "VENDAS") {
      pacote.vendasResumo = resp;
      document.getElementById("dashboardAtualizacao").textContent = "Ultima atualizacao: " + (resp.atualizadoEm || "-");
    }
    if (modo === "ESTOQUE") {
      pacote.estoqueResumo = resp;
      document.getElementById("dashboardEstoqueAtualizacao").textContent = "Ultima atualizacao: " + (resp.atualizadoEm || "-");
    }
    if (modo === "CLIENTES") {
      pacote.clientesResumo = resp;
      document.getElementById("dashboardClientesAtualizacao").textContent = "Ultima atualizacao: " + (resp.atualizadoEm || "-");
      if (resp.filtros) pacote.filtros = Object.assign({}, pacote.filtros || {}, resp.filtros);
    }
    if (modo === "CATEGORIAS") {
      pacote.categoriasResumo = resp;
      document.getElementById("dashboardCategoriasAtualizacao").textContent = "Ultima atualizacao: " + (resp.atualizadoEm || "-");
    }
  }

  function iniciarCargaDadosBrutosDashboard(forcar) {
    if (estado.dadosBrutos.carregando) return;
    if (estado.dadosBrutos.pronto && !forcar) return;

    estado.dadosBrutos.carregando = true;
    estado.dadosBrutos.pronto = false;
    estado.dadosBrutos.erro = false;
    if (!forcar) estado.dadosBrutos.pacote = null;
    atualizarProgressoDadosBrutos(10);
    alternarFiltrosDashboardBloqueados(true);
    document.getElementById("dashboardCargaBruta")?.classList.add("ativo");

    if (estado.dadosBrutos.timer) clearInterval(estado.dadosBrutos.timer);
    estado.dadosBrutos.timer = setInterval(function() {
      const atual = Number(estado.dadosBrutos.progresso || 10);
      const proximo = atual < 70 ? atual + 9 : atual < 90 ? atual + 3 : 92;
      atualizarProgressoDadosBrutos(proximo);
    }, 900);

    google.script.run
      .withSuccessHandler(function(resp) {
        finalizarCargaDadosBrutosDashboard();

        if (!resp || !resp.sucesso) {
          estado.dadosBrutos.erro = true;
          document.getElementById("dashboardCargaBruta")?.classList.remove("ativo");
          alternarFiltrosDashboardBloqueados(false);
          toastWarn(resp?.mensagem || "Nao foi possivel carregar os dados completos. Os resumos continuam disponiveis.");
          return;
        }

        estado.dadosBrutos.pacote = resp;
        estado.dadosBrutos.pronto = true;
        ativarDadosBrutosDashboard(resp);
        atualizarProgressoDadosBrutos(100);
        setTimeout(function() {
          document.getElementById("dashboardCargaBruta")?.classList.remove("ativo");
        }, 450);
        alternarFiltrosDashboardBloqueados(false);
      })
      .withFailureHandler(function(erro) {
        finalizarCargaDadosBrutosDashboard();
        estado.dadosBrutos.erro = true;
        document.getElementById("dashboardCargaBruta")?.classList.remove("ativo");
        alternarFiltrosDashboardBloqueados(false);
        console.error(erro);
        toastWarn("Nao foi possivel carregar os dados completos. Os resumos continuam disponiveis.");
      })
      .buscarPacoteDashboardOperacional("BRUTO", {});
  }

  function ativarDadosBrutosDashboard(resp) {
    const resumos = {
      vendasResumo: pacote.vendasResumo || null,
      estoqueResumo: pacote.estoqueResumo || null,
      clientesResumo: pacote.clientesResumo || null,
      categoriasResumo: pacote.categoriasResumo || null
    };
    const filtros = Object.assign({}, pacote.filtros || {}, resp.filtros || {});

    pacote = Object.assign({}, pacote, resp, resumos, {
      modoAgregado: false,
      filtros: filtros
    });

    montarIndices();
    preencherFiltros();
    atualizarDashboard();
  }

  function finalizarCargaDadosBrutosDashboard() {
    estado.dadosBrutos.carregando = false;
    if (estado.dadosBrutos.timer) {
      clearInterval(estado.dadosBrutos.timer);
      estado.dadosBrutos.timer = null;
    }
  }

  function atualizarProgressoDadosBrutos(valor) {
    estado.dadosBrutos.progresso = Math.max(0, Math.min(100, Number(valor || 0)));
    const barra = document.getElementById("dashboardCargaBrutaBarra");
    if (barra) barra.style.width = estado.dadosBrutos.progresso + "%";
  }

  function alternarFiltrosDashboardBloqueados(bloqueado) {
    [
      "btnAbrirFiltrosDashboard",
      "btnLimparFiltrosTopoDashboard",
      "btnAbrirFiltrosEstoqueDashboard",
      "btnLimparFiltrosEstoqueDashboard",
      "btnAbrirFiltrosClientesDashboard",
      "btnLimparFiltrosClientesDashboard",
      "btnAbrirFiltrosCategoriasDashboard",
      "btnLimparFiltrosCategoriasDashboard",
      "btnAplicarFiltrosDashboard"
    ].forEach(function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.toggle("dashboard-controle-bloqueado", bloqueado);
      el.disabled = !!bloqueado;
    });
  }

  function valor(id) {
    return String(document.getElementById(id)?.value || "").trim();
  }

  function setValueCampo(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value || "";
  }

      sort: estado.sort
    };

  function opcoesResumoEstoque() {
    return {
      filtros: estado.filtros,
      periodoGrafico: estado.estoque.periodo,
      periodoSelecionado: estado.estoque.periodoSelecionado,
      itemSelecionado: estado.estoque.itemSelecionado,
      sort: estado.estoque.sort
    };
  }

  function opcoesResumoClientes() {
    const filtros = Object.assign({}, estado.filtrosClientes, { classe: "" });
    return {
      filtros: filtros,
      metricaAbc: estado.clientes.metricaAbc,
      sort: estado.clientes.sort

  function opcoesResumoCategorias() {
    return {
      filtros: {
        categoria: estado.filtros.categoria,
        categoriaNome: estado.filtros.categoriaNome,
        subcategoria: estado.filtros.subcategoria,
        subcategoriaNome: estado.filtros.subcategoriaNome,

  function renderizarGraficoVendasResumo() {
    const resumo = pacote.vendasResumo || {};
    const agregados = Array.isArray(resumo.grafico) ? resumo.grafico : [];
    const limite = estado.periodo === "mes" ? 12 : 14;
    const maxInicio = Math.max(0, agregados.length - limite);
    if (estado.janelaInicio === null || estado.janelaInicio === undefined) estado.janelaInicio = maxInicio;
    if (estado.janelaInicio > maxInicio) estado.janelaInicio = maxInicio;
    if (estado.janelaInicio < 0) estado.janelaInicio = 0;

    const visiveis = agregados.slice(estado.janelaInicio, estado.janelaInicio + limite);
    estado.periodosVisiveis = visiveis;
    setText("tituloGrafico", tituloMetricasVendas() + (estado.periodo === "mes" ? " por mes" : " por dia"));
    document.getElementById("legendaMediaMensal")?.classList.toggle("oculta", estado.periodo !== "mes");

    if (!estado.chart) {
      estado.chart = echarts.init(document.getElementById("graficoVendas"));
      estado.chart.on("click", function(params) {
        const item = estado.periodosVisiveis[params.dataIndex];
        if (!item) return;
        estado.periodoSelecionado = estado.periodoSelecionado === item.key ? "" : item.key;
        carregarResumoVendasDashboard(true);
      });
    }

    estado.chart.setOption({
      legend: {
        show: metricasVendasSelecionadas().length > 1,
        top: 0,
        right: 0,
        textStyle: { color: "#64748b", fontSize: 10 }
      },
      grid: { left: 48, right: temVolumeSecundarioVendas() ? 48 : 20, top: metricasVendasSelecionadas().length > 1 ? 38 : 30, bottom: 48 },
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "shadow" },
        formatter: function(params) {
          const lista = Array.isArray(params) ? params : [];
          if (!lista.length) return "";
          const dado = visiveis[lista[0].dataIndex];
          let html = "<strong>" + escapeHtml(dado.label) + "</strong>";
          lista.forEach(function(p) {
            const metrica = p.seriesId || metricaPorNomeSerieVendas(p.seriesName);
            html += "<br>" + escapeHtml(p.seriesName) + ": " + formatValorMetrica(p.value, metrica);
          });
          return html;
        }
      },
      xAxis: {
        type: "category",
        data: visiveis.map(function(item) { return item.label; }),
        axisTick: { show: false },
        axisLine: { lineStyle: { color: "#e2e8f0" } },
        axisLabel: { color: "#334155", fontSize: 10 }
      },
      yAxis: montarEixosVendas(),
      series: montarSeriesVendas(visiveis, agregados)
    }, true);
  }

  function metricasVendasSelecionadas() {
    const lista = Array.isArray(estado.metricas) && estado.metricas.length ? estado.metricas : [estado.metrica || "volume"];
    return lista.filter(function(metrica, index) {
      return ["volume", "faturamento", "lucro"].includes(metrica) && lista.indexOf(metrica) === index;
    });
  }

  function tituloMetricasVendas() {
    const lista = metricasVendasSelecionadas();
    if (lista.length === 1) return rotuloMetrica(lista[0]);
    return lista.map(rotuloMetrica).join(" / ");
  }

  function temVolumeSecundarioVendas() {
    const lista = metricasVendasSelecionadas();
    return lista.includes("volume") && lista.some(function(metrica) { return metrica !== "volume"; });
  }

  function indiceEixoMetricaVendas(metrica) {
    return temVolumeSecundarioVendas() && metrica === "volume" ? 1 : 0;
  }

  function montarEixosVendas() {
    const volumeSecundario = temVolumeSecundarioVendas();
    const apenasVolume = metricasVendasSelecionadas().every(function(metrica) { return metrica === "volume"; });
    const eixoPrincipal = {
      type: "value",
      axisLine: { show: false },
      splitLine: { lineStyle: { color: "#edf2f7" } },
      axisLabel: {
        color: "#64748b",
        formatter: function(value) {
          return apenasVolume ? abreviarNumero(value) : abreviarMoeda(value);
        }
      }
    };

    if (!volumeSecundario) return eixoPrincipal;

    return [
      eixoPrincipal,
      {
        type: "value",
        axisLine: { show: false },
        splitLine: { show: false },
        axisLabel: {
          color: "#64748b",
          formatter: function(value) { return abreviarNumero(value); }
        }
      }
    ];
  }

  function montarSeriesVendas(visiveis, agregados) {
    const cores = {
      volume: "#b9ddff",
      faturamento: "#b8f2b0",
      lucro: "#c8d7ff"
    };

    return metricasVendasSelecionadas().map(function(metrica) {
      return {
        id: metrica,
        name: rotuloMetrica(metrica),
        type: "bar",
        yAxisIndex: indiceEixoMetricaVendas(metrica),
        data: visiveis.map(function(item) {
          return {
            value: item[metrica] || 0,
            itemStyle: {
              color: estado.periodoSelecionado === item.key ? "#1d4ed8" : cores[metrica],
              borderRadius: [7, 7, 0, 0]
            }
          };
        }),
        barCategoryGap: visiveis.length <= 2 ? "34%" : "24%",
        barGap: "18%",
        emphasis: { itemStyle: { color: "#42DCFA" } },
        label: {
          show: true,
          position: "top",
          color: "#334155",
          fontSize: 9,
          formatter: function(params) {
            return metrica === "volume" ? abreviarNumero(params.value) : abreviarMoeda(params.value);
          }
        },
        markLine: montarLinhaMediaMensalVendas(agregados, metrica)
      };
    });
  }

  function calcularMediaMensalVendas(agregados, metrica) {
    if (estado.periodo !== "mes" || !agregados.length) return null;
    return agregados.reduce(function(acc, item) {
      return acc + Number(item[metrica] || 0);
    }, 0) / agregados.length;
  }

  function montarLinhaMediaMensalVendas(agregados, metrica) {
    const media = calcularMediaMensalVendas(agregados, metrica);
    if (media === null) return undefined;
    return {
      silent: true,
      symbol: "none",
      lineStyle: { color: metrica === "volume" ? "#87c9ff" : "#8af084", width: 2, type: "solid" },
      label: {
        show: true,
        position: "insideEndTop",
        distance: [0, 8],
        formatter: function() { return formatValorMetrica(media, metrica); },
        color: metrica === "volume" ? "#1d4ed8" : "#249b20",
        fontWeight: 800,
        fontSize: 10
      },
      data: [{ yAxis: media }]
    };
  }

  function preencherCardClasseCliente(classe, dados) {
    setText("cardClasse" + classe + "Qtd", formatQtd(dados.clientes));
    setText("cardClasse" + classe + "Base", formatPercent(dados.percentBase) + " da base");
    setText("cardClasse" + classe + "Fat", formatPercent(dados.percentMetrica) + " do " + rotuloMetricaClientes(estado.clientes.metricaAbc).toLowerCase());

  function aplicarMetricaClientesLocal() {
    aplicarClassesClientesPorMetrica();
    const abc = obterAbcClientesAtual();
    preencherCardClasseCliente("A", abc.A || {});
    preencherCardClasseCliente("B", abc.B || {});
    preencherCardClasseCliente("C", abc.C || {});
    atualizarCardsClasseSelecionada();
    renderizarTabelaClientesResumo();
    atualizarIndicadoresOrdenacaoClientes();

  function obterAbcClientesAtual() {
    const resumo = pacote.clientesResumo || {};
    const porMetrica = resumo.abcPorMetrica || {};
    return porMetrica[estado.clientes.metricaAbc] || resumo.abc || {};
  }

  function aplicarClassesClientesPorMetrica() {
    const metrica = estado.clientes.metricaAbc || "volume";
    (estado.clientes.tabela || []).forEach(function(item) {
      const classes = item.classesPorMetrica || {};
      item.classe = classes[metrica] || item.classe || "C";
      item.valorMetricaAbc = valorMetricaClienteLocal(item, metrica);
    });
  }

  function valorMetricaClienteLocal(item, metrica) {
    if (metrica === "faturamento") return Number(item.faturamento || 0);
    if (metrica === "lucro") return Number(item.lucro || 0);
    return Number(item.qtdCompras || 0);
  }

    document.querySelectorAll("[data-classe-clientes]").forEach(function(card) {
      card.classList.toggle("selecionado", card.dataset.classeClientes === estado.clientes.classeSelecionada);

  function renderizarRodapeClientesResumo(lista) {
    const tr = document.getElementById("tfootClientesABC");
    if (!tr) return;

    const total = (lista || []).reduce(function(acc, item) {
      acc.qtdCompras += Number(item.qtdCompras || 0);
      acc.faturamento += Number(item.faturamento || 0);
      acc.lucro += Number(item.lucro || 0);
      acc.ticketMedio += Number(item.ticketMedio || 0);
      acc.frequenciaMensal += Number(item.frequenciaMensal || 0);
      return acc;
    }, { qtdCompras: 0, faturamento: 0, lucro: 0, ticketMedio: 0, frequenciaMensal: 0 });

    const valores = [
      qtd ? "Total (" + formatQtd(qtd) + ")" : "Total",
      "",
      formatQtd(total.qtdCompras),
      formatBRL(total.faturamento),
      formatBRL(total.lucro),
      formatBRL(qtd ? total.ticketMedio / qtd : 0),
      formatDecimal(qtd ? total.frequenciaMensal / qtd : 0),
      ""
    ];

      return "<td>" + escapeHtml(valor) + "</td>";
