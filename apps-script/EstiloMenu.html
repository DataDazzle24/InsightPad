/*
 * O bloco da esquerda, com o fundo preto.
 * flex: 1; faz com que ele ocupe uma porção igual de espaço.
 * display: flex; e os alinhamentos centram o conteúdo interno (a imagem).
 */
#Esquerda {
    position: relative;
    flex: 1; /* Ocupa metade do espaço disponível */
    background-color: black;
    display: flex;
    flex-direction: column;
    justify-content: center; /* Centraliza a imagem verticalmente */
    align-items: center; /* Centraliza a imagem horizontalmente */
}

/*
 * A imagem da logo.
 * max-width: 90%; garante que a imagem não ultrapasse 90% da largura do seu container.
 */
#imagem {
    flex-grow: 1;        /* faz a imagem crescer para ocupar o container */
    width: auto;
    height: auto;
    max-height: 70%;     /* limite máximo da altura */
    max-width: 90%;      /* limite máximo da largura */
}

#Rodape{
  position: absolute;
  bottom: 3%;

  display: flex;
  flex-direction: row; /* Alinha os botões em uma coluna (verticalmente) */
  justify-content: flex-start; 
  align-items: center; /* Centraliza os botões horizontalmente */
  bottom: 0px;
  left: 0px
}

#logo_dd{

}

#texto_logo{

  margin-top: 0.5em; /* espaço entre ícone e texto */
  text-align: center;
}

/*
 * O bloco da direita, com o fundo branco.
 * flex: 1; faz com que ele ocupe a outra metade do espaço.
 * display: flex; e os alinhamentos centram os botões.
 */
#divBtn {
    flex: 1; /* Ocupa a outra metade do espaço disponível */

    flex-direction: column; /* Alinha os botões em uma coluna (verticalmente) */
    justify-content: center; /* Centraliza os botões verticalmente */
    align-items: center; /* Centraliza os botões horizontalmente */

}

#Bloco{
  width: 100%;
  height: 33.3%;

}

#Btn{

}

#BtnB{

}

/* a barra azul inicial */
#Btn::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 1%;                        /* começa com 0 de largura */
  height: 100%;
  background-color: #42DCFA;       /* azul Materialize */
  transition: width 0.4s ease;     /* animação suave */
  z-index: 0;                      /* fica atrás do conteúdo */
}

/* quando o mouse passar */
#Btn:hover::before {
  width: 10%;                      /* cresce até 10% da largura do botão */
}

#Btn:hover #icone {
  color: #42DCFA;
}

#Btn.clicked #icone {
  color: white;
}

#Btn:hover #texto_btn {
  color: #42DCFA;
}

#Btn.clicked #texto_btn {
  color: white;
}

#Btn.clicked::before {
  width: 100%;
  background-color: #36DB2E; /* verde */
  transition: width 0.5s ease, background-color 0.5s ease;
}

#Btn > * {
  position: relative;
  z-index: 1;
}
