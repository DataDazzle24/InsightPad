  ean: String @col(dataType: "varchar(32)")
  brand: String @col(dataType: "varchar(100)")
  sizeType: String @col(name: "size_type", dataType: "varchar(40)")
  size: String @col(dataType: "varchar(40)")
  color: String @col(dataType: "varchar(60)")
  maximumStock: Float @col(name: "maximum_stock", dataType: "numeric(18,3)")
  minimumStock: Float @col(name: "minimum_stock", dataType: "numeric(18,3)")
  salePriceCents: Int64! @default(value: 0) @col(name: "sale_price_cents")
  costPriceCents: Int64! @default(value: 0) @col(name: "cost_price_cents")
  weightedProduct: Boolean! @default(value: false) @col(name: "weighted_product")
  bundleProduct: Boolean! @default(value: false) @col(name: "bundle_product")
  allowNegativeStock: Boolean! @default(value: false) @col(name: "allow_negative_stock")
