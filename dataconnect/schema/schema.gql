type User @table(name: "users", key: "id") {
  id: String! @default(expr: "auth.uid") @col(dataType: "varchar(128)")
  tenant: Tenant! @ref(fields: "tenantId", references: "id")
  tenantId: UUID! @col(name: "tenant_id")
  role: Role! @ref(fields: "roleId", references: "id")
  roleId: UUID! @col(name: "role_id")
  legacyId: String @col(name: "legacy_id", dataType: "varchar(64)")
  name: String! @col(dataType: "varchar(160)")
  email: String! @col(dataType: "varchar(254)")
  login: String @col(dataType: "varchar(100)")
  onboardingPending: Boolean! @default(value: false) @col(name: "onboarding_pending")
  failedLoginAttempts: Int! @default(value: 0) @col(name: "failed_login_attempts")
  blockedUntil: Timestamp @col(name: "blocked_until")
  lastLoginAt: Timestamp @col(name: "last_login_at")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
  deletedAt: Timestamp @col(name: "deleted_at")
}

