# Insight Pad - PostgreSQL schema v1
# Source of truth for Firebase SQL Connect.
#
# Design principles:
# - UUID primary keys for business entities.
# - Firebase Auth UID as the user primary key.
# - Explicit tenantId on every tenant-owned table.
# - Money stored as Int64 cents.
# - Quantities stored as numeric(18,3).
# - UTC timestamps (timestamptz).
# - Soft deletion through active/deletedAt.
# - legacyId preserves traceability to Google Sheets.

type Tenant @table(name: "tenants", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  legacyId: String @col(name: "legacy_id", dataType: "varchar(64)")
  legalName: String! @col(name: "legal_name", dataType: "varchar(160)")
  tradeName: String @col(name: "trade_name", dataType: "varchar(160)")
  document: String @col(dataType: "varchar(20)")
  email: String @col(dataType: "varchar(254)")
  phone: String @col(dataType: "varchar(24)")
  planCode: String @col(name: "plan_code", dataType: "varchar(40)")
  startsOn: Date @col(name: "starts_on")
  expiresOn: Date @col(name: "expires_on")
  timezone: String! @default(value: "America/Sao_Paulo") @col(dataType: "varchar(64)")
  currencyCode: String! @default(value: "BRL") @col(name: "currency_code", dataType: "char(3)")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type Role @table(name: "roles", key: "id") {
  id: UUID! @default(expr: "uuidV4()")
  tenant: Tenant! @ref(fields: "tenantId", references: "id")
  tenantId: UUID! @col(name: "tenant_id")
  legacyId: String @col(name: "legacy_id", dataType: "varchar(64)")
  name: String! @col(dataType: "varchar(80)")
  description: String @col(dataType: "varchar(255)")
  hierarchyLevel: Int! @default(value: 100) @col(name: "hierarchy_level")
  systemRole: Boolean! @default(value: false) @col(name: "system_role")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time") @col(name: "created_at")
  updatedAt: Timestamp! @default(expr: "request.time") @col(name: "updated_at")
  deletedAt: Timestamp @col(name: "deleted_at")
}

type AppPage @table(name: "app_pages", key: "id") {
