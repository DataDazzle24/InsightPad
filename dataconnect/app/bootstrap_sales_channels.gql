# Compatibility operation kept for existing administrative callers.
# Use bootstrap_sales_channels_v2.gql for new environment setup.
mutation BootstrapSalesChannelsNavigation(
  $tenantId: UUID!
  $platformAdminRoleId: UUID!
) @auth(level: NO_ACCESS) @transaction {
  page: appPage_upsert(data: {
    id: "10000000-0000-4000-8000-00000000000e"
    pageKey: "CANAIS_VENDA"
    displayName: "Canais de Venda"
    module: "Integrações"
    route: "/integracoes/canais"
    icon: "hub"
    displayOrder: 140
    requiresLogin: true
    active: true
  })
  permission: rolePagePermission_upsert(data: {
    roleId: $platformAdminRoleId
    pageId: "10000000-0000-4000-8000-00000000000e"
    tenantId: $tenantId
    canAccess: true
    canCreate: true
    canUpdate: true
    canDelete: true
    canExport: true
    canManage: true
  })
}
