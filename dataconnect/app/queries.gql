# Insight Pad client queries.
# Every authenticated query derives tenant, role and user from auth.uid.
# Client-supplied tenant or role identifiers must not define authorization scope.

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    name
    email
    active
    onboardingPending
    tenant {
      id
      legalName
      tradeName
      active
      timezone
      currencyCode
    }
    role {
      id
      name
      hierarchyLevel
      systemRole
      active
    }
  }
}

query GetCurrentUserAccess @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    tenant {
      id
    }
    role {
      id
      rolePagePermissions_on_role {
        canAccess
        canCreate
        canUpdate
        canDelete
        canExport
        canManage
        page {
          id
          pageKey
          displayName
          module
          route
          icon
          displayOrder
          requiresLogin
          active
        }
      }
    }
    userPagePermissions_on_user {
      canAccess
      canCreate
      canUpdate
      canDelete
      canExport
      canManage
      page {
        id
        pageKey
        displayName
        module
        route
        icon
        displayOrder
        requiresLogin
        active
      }
    }
  }
}

query ValidateDeviceSession($sessionToken: String!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    SELECT EXISTS(
      SELECT 1 FROM user_device_sessions s
      JOIN users u ON u.id=s.user_id AND u.tenant_id=s.tenant_id AND u.active AND u.deleted_at IS NULL
      WHERE s.user_id=$1 AND s.session_token=$2 AND $3<>''
    ) AS valid
  """,params:[{_expr:"auth.uid"},$sessionToken,$requestKey])
}

query SalesChannelWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id, u.tenant_id
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id WHERE b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'connections',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'provider',c.provider,'displayName',c.display_name,'externalStoreId',c.external_store_id,'branchId',c.branch_id,'branchName',b.name,'status',c.status,'enabled',c.enabled,'lastSyncedAt',c.last_synced_at,'lastError',c.last_error,'active',c.active,'createdAt',c.created_at,'updatedAt',c.updated_at) ORDER BY lower(c.provider),lower(c.display_name)) FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id WHERE c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL),'[]'::jsonb),
      'mappings',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',m.id,'connectionId',m.connection_id,'productId',m.product_id,'productName',p.name,'internalCode',p.internal_code,'externalProductId',m.external_product_id,'externalProductName',m.external_product_name,'syncPrice',m.sync_price,'syncStock',m.sync_stock,'enabled',m.enabled,'status',m.status) ORDER BY lower(p.name)) FROM sales_channel_product_mappings m JOIN actor a ON a.tenant_id=m.tenant_id JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id WHERE m.active AND m.deleted_at IS NULL),'[]'::jsonb)
    ) AS data
    FROM actor
    WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query SalesChannelOrders($term: String!, $status: String!, $provider: String!, $branchId: UUID, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), eligible AS (
      SELECT o.*,c.provider,b.name branch_name FROM sales_channel_orders o
      JOIN actor a ON a.tenant_id=o.tenant_id
      JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id
      JOIN branches b ON b.id=o.branch_id AND b.tenant_id=o.tenant_id
      WHERE ($2='' OR o.display_code ILIKE '%'||$2||'%' OR COALESCE(o.customer_name,'') ILIKE '%'||$2||'%')
        AND ($3='' OR o.status=$3) AND ($4='' OR c.provider=$4) AND ($5::uuid IS NULL OR o.branch_id=$5)
    ), page AS (SELECT * FROM eligible ORDER BY received_at DESC,id DESC LIMIT LEAST(GREATEST($6,1),100) OFFSET GREATEST($7,0))
    SELECT jsonb_build_object(
      'rows',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',o.id,'providerOrderId',o.provider_order_id,'displayCode',o.display_code,'provider',o.provider,'branchId',o.branch_id,'branchName',o.branch_name,'customerName',o.customer_name,'orderType',o.order_type,'paymentMethod',o.payment_method,'deliveryAddress',o.delivery_address,'notes',o.notes,'subtotalCents',o.subtotal_cents::text,'deliveryFeeCents',o.delivery_fee_cents::text,'discountCents',o.discount_cents::text,'totalCents',o.total_cents::text,'status',o.status,'receivedAt',o.received_at,'acceptedAt',o.accepted_at,'rejectedAt',o.rejected_at,'completedAt',o.completed_at,'rejectionReason',o.rejection_reason,'version',o.version,'items',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',i.id,'name',i.name,'quantity',i.quantity,'unitPriceCents',i.unit_price_cents::text,'totalCents',i.total_cents::text,'observation',i.observation) ORDER BY i.created_at) FROM sales_channel_order_items i WHERE i.order_id=o.id AND i.tenant_id=o.tenant_id),'[]'::jsonb)) ORDER BY o.received_at DESC,o.id DESC) FROM page o),'[]'::jsonb),
      'total',(SELECT count(*) FROM eligible),
      'pending',(SELECT count(*) FROM eligible WHERE status='PENDING')
    ) data FROM actor WHERE $8<>''
  """,params:[{_expr:"auth.uid"},$term,$status,$provider,$branchId,$limit,$offset,$requestKey])
}

query LatestPendingSalesChannelOrder($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.tenant_id FROM users u JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)), latest AS (SELECT o.*,c.provider,b.name branch_name FROM sales_channel_orders o JOIN actor a ON a.tenant_id=o.tenant_id JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id JOIN branches b ON b.id=o.branch_id AND b.tenant_id=o.tenant_id WHERE o.status='PENDING' ORDER BY o.received_at DESC LIMIT 1)
    SELECT jsonb_build_object('id',o.id,'displayCode',o.display_code,'provider',o.provider,'branchName',o.branch_name,'customerName',o.customer_name,'totalCents',o.total_cents::text,'receivedAt',o.received_at,'version',o.version,'items',COALESCE((SELECT jsonb_agg(jsonb_build_object('name',i.name,'quantity',i.quantity,'observation',i.observation) ORDER BY i.created_at) FROM sales_channel_order_items i WHERE i.order_id=o.id AND i.tenant_id=o.tenant_id),'[]'::jsonb)) data FROM latest o WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

# Sales workstation bootstrap. Authorization and tenant scope are derived from auth.uid.
query SalesWorkspace($branchId: UUID, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'tenant',(SELECT jsonb_build_object('legalName',t.legal_name,'tradeName',t.trade_name,'document',t.document,'email',t.email,'phone',t.phone) FROM tenants t,actor a WHERE t.id=a.tenant_id LIMIT 1),
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name,'internalCode',b.internal_code,'postalCode',b.postal_code,'stateCode',b.state_code,'city',b.city,'district',b.district,'street',b.street,'streetNumber',b.street_number,'addressComplement',b.address_complement,'phone',b.phone) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'customers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name,'cpf',c.cpf,'email',c.email,'phone',c.phone_primary) ORDER BY lower(c.name)) FROM customers c,actor a WHERE c.tenant_id=a.tenant_id AND c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'paymentMethods',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'code',p.code,'name',p.name,'requiresChange',p.requires_change) ORDER BY lower(p.name)) FROM payment_methods p,actor a WHERE p.tenant_id=a.tenant_id AND p.active),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean,'weightedProduct',p.weighted_product,'bundleProduct',p.bundle_product,'allowNegativeStock',p.allow_negative_stock,'listPriceCents',p.sale_price_cents,'effectivePriceCents',COALESCE(pr.promotional_price_cents,p.sale_price_cents),'costPriceCents',p.cost_price_cents,'stock',COALESCE(sb.quantity,0),'stockByBranches',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',br.id,'branchName',br.name,'quantity',COALESCE(all_sb.quantity,0)) ORDER BY lower(br.name)) FROM branches br LEFT JOIN stock_balances all_sb ON all_sb.tenant_id=br.tenant_id AND all_sb.branch_id=br.id AND all_sb.product_id=p.id WHERE br.tenant_id=p.tenant_id AND br.active AND br.deleted_at IS NULL),'[]'::jsonb)) ORDER BY lower(p.name))
        FROM products p CROSS JOIN actor a
        LEFT JOIN LATERAL (SELECT x.promotional_price_cents FROM promotions x WHERE x.tenant_id=p.tenant_id AND x.product_id=p.id AND x.active AND x.deleted_at IS NULL AND now()>=x.starts_at AND now()<x.ends_at ORDER BY x.promotional_price_cents,x.id LIMIT 1) pr ON true
        LEFT JOIN stock_balances sb ON sb.tenant_id=p.tenant_id AND sb.product_id=p.id AND sb.branch_id=$2
        WHERE p.tenant_id=a.tenant_id AND p.active AND p.deleted_at IS NULL),'[]'::jsonb),
      'openSession',COALESCE((SELECT jsonb_build_object('id',cs.id,'openedAt',cs.opened_at,'openingAmountCents',cs.opening_amount_cents,'expectedAmountCents',cs.opening_amount_cents+COALESCE((SELECT sum(cm.amount_cents) FROM cash_movements cm WHERE cm.session_id=cs.id AND cm.movement_type<>'OPENING'),0),'movementCount',(SELECT count(*) FROM cash_movements cm WHERE cm.session_id=cs.id AND cm.movement_type<>'OPENING')) FROM cash_sessions cs,actor a WHERE cs.tenant_id=a.tenant_id AND cs.branch_id=$2 AND cs.status='OPEN' ORDER BY cs.opened_at DESC LIMIT 1),'null'::jsonb)
    ) AS data
    WHERE $3<>''
  """,params:[{_expr:"auth.uid"},$branchId,$requestKey])
}

query ListSales($filters: Any!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='GESTAO_VENDAS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ),f AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j)
    SELECT s.id,s.client_operation_id AS "clientOperationId",s.status,s.subtotal_cents AS "subtotalCents",s.discount_cents AS "discountCents",s.surcharge_cents AS "surchargeCents",s.total_cents AS "totalCents",s.change_cents AS "changeCents",s.sold_at AS "soldAt",s.cancelled_at AS "cancelledAt",s.cancellation_reason AS "cancellationReason",s.created_by_uid AS "createdByUid",b.id AS "branchId",b.name AS "branchName",c.id AS "customerId",COALESCE(c.name,'CONSUMIDOR FINAL') AS "customerName",COUNT(DISTINCT si.id) FILTER(WHERE si.status='ACTIVE') AS "itemCount",COALESCE(string_agg(DISTINCT pm.name,', '),'') AS "paymentMethods"
    FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN branches b ON b.id=s.branch_id AND b.tenant_id=s.tenant_id
    CROSS JOIN f LEFT JOIN customers c ON c.id=s.customer_id AND c.tenant_id=s.tenant_id
    LEFT JOIN sale_items si ON si.sale_id=s.id AND si.tenant_id=s.tenant_id LEFT JOIN sale_payments sp ON sp.sale_id=s.id AND sp.tenant_id=s.tenant_id AND sp.status='CONFIRMED' LEFT JOIN payment_methods pm ON pm.id=sp.payment_method_id
    WHERE ($5<>'' )
      AND (COALESCE(f.j->>'search','')='' OR s.id::text ILIKE '%'||(f.j->>'search')||'%' OR COALESCE(c.name,'') ILIKE '%'||(f.j->>'search')||'%')
      AND (NOT(f.j?'branchIds') OR s.branch_id IN(SELECT value::uuid FROM jsonb_array_elements_text(f.j->'branchIds')))
      AND (NOT(f.j?'customerIds') OR s.customer_id IN(SELECT value::uuid FROM jsonb_array_elements_text(f.j->'customerIds')))
      AND (NOT(f.j?'statuses') OR s.status IN(SELECT value FROM jsonb_array_elements_text(f.j->'statuses')))
      AND (COALESCE(f.j->>'dateFrom','')='' OR s.sold_at >= (f.j->>'dateFrom')::date)
      AND (COALESCE(f.j->>'dateTo','')='' OR s.sold_at < (f.j->>'dateTo')::date + interval '1 day')
      AND (COALESCE(f.j->>'minCents','')='' OR s.total_cents >= (f.j->>'minCents')::bigint)
      AND (COALESCE(f.j->>'maxCents','')='' OR s.total_cents <= (f.j->>'maxCents')::bigint)
    GROUP BY s.id,b.id,c.id ORDER BY s.sold_at DESC,s.id DESC LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$filters,$limit,$offset,$requestKey])
}

query SaleDetails($saleId: UUID!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='GESTAO_VENDAS' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false))
    SELECT jsonb_build_object('sale',to_jsonb(s),'branch',to_jsonb(b),'customer',to_jsonb(c),
      'items',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',i.id,'productId',i.product_id,'productName',p.name,'quantity',i.quantity,'unitListPriceCents',i.unit_list_price_cents,'unitSalePriceCents',i.unit_sale_price_cents,'unitCostCents',i.unit_cost_cents,'discountCents',i.discount_cents,'totalCents',i.total_cents) ORDER BY i.created_at) FROM sale_items i JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id WHERE i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE'),'[]'::jsonb),
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',sp.id,'paymentMethodId',sp.payment_method_id,'paymentMethodName',pm.name,'amountCents',sp.amount_cents,'sequence',sp.sequence,'externalReference',sp.external_reference) ORDER BY sp.sequence) FROM sale_payments sp JOIN payment_methods pm ON pm.id=sp.payment_method_id WHERE sp.sale_id=s.id AND sp.tenant_id=s.tenant_id AND sp.status='CONFIRMED'),'[]'::jsonb)) AS data
    FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN branches b ON b.id=s.branch_id LEFT JOIN customers c ON c.id=s.customer_id WHERE s.id=$2 AND $3<>''
  """,params:[{_expr:"auth.uid"},$saleId,$requestKey])
}


# Phase 1 operational catalogs.
# Tenant scope is always derived through auth.uid; the client cannot select it.
query ListCategories($search: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      WITH base AS (SELECT
        c.id,
        c.name,
        c.active,
        c.created_at AS "createdAt",
        c.updated_at AS "updatedAt",
        COUNT(s.id) FILTER (WHERE s.active AND s.deleted_at IS NULL) AS "subcategoryCount"
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_CATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      LEFT JOIN subcategories s
        ON s.category_id = c.id
       AND s.tenant_id = c.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR c.name ILIKE '%' || $2 || '%')
        AND ($7 IS NULL OR $7 <> '')
      GROUP BY c.id
      )
      SELECT * FROM base
      ORDER BY
        CASE WHEN $4='asc' AND $3='subcategoryCount' THEN "subcategoryCount" END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='subcategoryCount' THEN "subcategoryCount" END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3<>'subcategoryCount' THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3<>'subcategoryCount' THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
        CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,
        "updatedAt" DESC,id
      LIMIT $5 OFFSET $6
    """,
    params: [{_expr: "auth.uid"}, $search, $sortField, $sortDirection, $limit, $offset, $requestKey]
  )
}

query ListSubcategories($search: String!, $categoryId: UUID, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      WITH base AS (SELECT
        s.id,
        s.name,
        s.category_id AS "categoryId",
        c.name AS "categoryName",
        s.active,
        s.created_at AS "createdAt",
        s.updated_at AS "updatedAt"
      FROM subcategories s
      JOIN categories c
        ON c.id = s.category_id
       AND c.tenant_id = s.tenant_id
      JOIN users u
        ON u.tenant_id = s.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR s.name ILIKE '%' || $2 || '%' OR c.name ILIKE '%' || $2 || '%')
        AND ($3::uuid IS NULL OR s.category_id = $3)
        AND ($8 IS NULL OR $8 <> '')
      )
      SELECT * FROM base
      ORDER BY
        CASE WHEN $5='asc' THEN lower(to_jsonb(base)->>$4) END ASC NULLS LAST,
        CASE WHEN $5='desc' THEN lower(to_jsonb(base)->>$4) END DESC NULLS LAST,
        CASE WHEN $4='' OR $5='' THEN "updatedAt" END DESC,
        "updatedAt" DESC,id
      LIMIT $6 OFFSET $7
    """,
    params: [{_expr: "auth.uid"}, $search, $categoryId, $sortField, $sortDirection, $limit, $offset, $requestKey]
  )
}

query CategoryOptions($requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      SELECT c.id, c.name
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND c.active
        AND c.deleted_at IS NULL
        AND ($2 IS NULL OR $2<>'')
      ORDER BY lower(c.name), c.id
    """,
    params: [{_expr: "auth.uid"}, $requestKey]
  )
}


query ListBranches($search: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT b.id,b.name,b.internal_code AS "internalCode",b.postal_code AS "postalCode",b.state_code AS "stateCode",
      b.city,b.district,b.street,b.street_number AS "streetNumber",b.address_complement AS "addressComplement",
      b.phone,b.active,b.created_at AS "createdAt",b.updated_at AS "updatedAt"
    FROM branches b JOIN users u ON u.tenant_id=b.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FILIAL' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',b.name,b.internal_code,b.city) ILIKE '%'||$2||'%') AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query ListSuppliers($search: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT s.id,s.legal_name AS "legalName",s.trade_name AS "tradeName",s.internal_code AS "internalCode",s.cpf,s.cnpj,
      s.postal_code AS "postalCode",s.state_code AS "stateCode",s.city,s.district,s.street,s.street_number AS "streetNumber",
      s.address_complement AS "addressComplement",s.contact_name AS "contactName",s.phone_primary AS "phonePrimary",
      s.phone_secondary AS "phoneSecondary",s.email,s.segment,s.payment_terms AS "paymentTerms",
      s.payment_term_days AS "paymentTermDays",s.average_delivery_days AS "averageDeliveryDays",s.notes,s.active,s.created_at AS "createdAt",s.updated_at AS "updatedAt"
    FROM suppliers s JOIN users u ON u.tenant_id=s.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FORNECEDOR' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',s.legal_name,s.trade_name,s.internal_code,s.cpf,s.cnpj,s.segment) ILIKE '%'||$2||'%')
      AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' AND $3 IN ('paymentTermDays','averageDeliveryDays') THEN (to_jsonb(base)->>$3)::numeric END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 IN ('paymentTermDays','averageDeliveryDays') THEN (to_jsonb(base)->>$3)::numeric END DESC NULLS LAST,
      CASE WHEN $4='asc' AND $3 NOT IN ('paymentTermDays','averageDeliveryDays') THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 NOT IN ('paymentTermDays','averageDeliveryDays') THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query ListCustomers($search: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
