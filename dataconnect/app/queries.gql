# Insight Pad client queries.
# Every authenticated query derives tenant, role and user from auth.uid.
# Client-supplied tenant or role identifiers must not define authorization scope.

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    name
    email
    active
    onboardingPending
    tenant {
      id
      legalName
      tradeName
      active
      timezone
      currencyCode
    }
    role {
      id
      name
      hierarchyLevel
      active
    }
  }
}

query GetCurrentUserAccess @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    tenant {
      id
    }
    role {
      id
      rolePagePermissions_on_role {
        canAccess
        canCreate
        canUpdate
        canDelete
        canExport
        canManage
        page {
          id
          pageKey
          displayName
          module
          route
          icon
          displayOrder
          requiresLogin
          active
        }
      }
    }
    userPagePermissions_on_user {
      canAccess
      canCreate
      canUpdate
      canDelete
      canExport
      canManage
      page {
        id
        pageKey
        displayName
        module
        route
        icon
        displayOrder
        requiresLogin
        active
      }
    }
  }
}


# Phase 1 operational catalogs.
# Tenant scope is always derived through auth.uid; the client cannot select it.
query ListCategories($search: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      SELECT
        c.id,
        c.name,
        c.active,
        c.created_at AS "createdAt",
        c.updated_at AS "updatedAt",
        COUNT(s.id) FILTER (WHERE s.active AND s.deleted_at IS NULL) AS "subcategoryCount"
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_CATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      LEFT JOIN subcategories s
        ON s.category_id = c.id
       AND s.tenant_id = c.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR c.name ILIKE '%' || $2 || '%')
        AND ($5 IS NULL OR $5 <> '')
      GROUP BY c.id
      ORDER BY lower(c.name), c.id
      LIMIT $3 OFFSET $4
    """,
    params: [{_expr: "auth.uid"}, $search, $limit, $offset, $requestKey]
  )
}

query ListSubcategories($search: String!, $categoryId: UUID, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      SELECT
        s.id,
        s.name,
        s.category_id AS "categoryId",
        c.name AS "categoryName",
        s.active,
        s.created_at AS "createdAt",
        s.updated_at AS "updatedAt"
      FROM subcategories s
      JOIN categories c
        ON c.id = s.category_id
       AND c.tenant_id = s.tenant_id
      JOIN users u
        ON u.tenant_id = s.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR s.name ILIKE '%' || $2 || '%' OR c.name ILIKE '%' || $2 || '%')
        AND ($3::uuid IS NULL OR s.category_id = $3)
        AND ($6 IS NULL OR $6 <> '')
      ORDER BY lower(c.name), lower(s.name), s.id
      LIMIT $4 OFFSET $5
    """,
    params: [{_expr: "auth.uid"}, $search, $categoryId, $limit, $offset, $requestKey]
  )
}

query CategoryOptions($requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      SELECT c.id, c.name
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND c.active
        AND c.deleted_at IS NULL
        AND ($2 IS NULL OR $2<>'')
      ORDER BY lower(c.name), c.id
    """,
    params: [{_expr: "auth.uid"}, $requestKey]
  )
}


query ListBranches($search: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT b.id,b.name,b.internal_code AS "internalCode",b.postal_code AS "postalCode",b.state_code AS "stateCode",
      b.city,b.district,b.street,b.street_number AS "streetNumber",b.address_complement AS "addressComplement",
      b.phone,b.active,b.created_at AS "createdAt",b.updated_at AS "updatedAt"
    FROM branches b JOIN users u ON u.tenant_id=b.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FILIAL' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',b.name,b.internal_code,b.city) ILIKE '%'||$2||'%') AND ($5 IS NULL OR $5<>'')
    ORDER BY b.active DESC,lower(b.name),b.id LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$search,$limit,$offset,$requestKey])
}

query ListSuppliers($search: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT s.id,s.legal_name AS "legalName",s.trade_name AS "tradeName",s.internal_code AS "internalCode",s.cpf,s.cnpj,
      s.postal_code AS "postalCode",s.state_code AS "stateCode",s.city,s.district,s.street,s.street_number AS "streetNumber",
      s.address_complement AS "addressComplement",s.contact_name AS "contactName",s.phone_primary AS "phonePrimary",
      s.phone_secondary AS "phoneSecondary",s.email,s.segment,s.payment_terms AS "paymentTerms",
      s.payment_term_days AS "paymentTermDays",s.average_delivery_days AS "averageDeliveryDays",s.notes,s.active,s.created_at AS "createdAt",s.updated_at AS "updatedAt"
    FROM suppliers s JOIN users u ON u.tenant_id=s.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FORNECEDOR' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',s.legal_name,s.trade_name,s.internal_code,s.cpf,s.cnpj,s.segment) ILIKE '%'||$2||'%')
      AND ($5 IS NULL OR $5<>'') ORDER BY s.active DESC,lower(s.legal_name),s.id LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$search,$limit,$offset,$requestKey])
}

query ListCustomers($search: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT c.id,c.name,c.birth_date AS "birthDate",c.gender,c.cpf,c.cnpj,c.marketing_opt_in AS "marketingOptIn",
      c.email,c.phone_primary AS "phonePrimary",c.phone_secondary AS "phoneSecondary",c.postal_code AS "postalCode",
      c.state_code AS "stateCode",c.city,c.district,c.street,c.street_number AS "streetNumber",
      c.address_complement AS "addressComplement",c.preferences,
      c.preferences->>'lowerClothingType' AS "lowerClothingType",c.preferences->>'lowerClothingSize' AS "lowerClothingSize",
      c.preferences->>'upperClothingType' AS "upperClothingType",c.preferences->>'upperClothingSize' AS "upperClothingSize",
      c.preferences->>'shoeSize' AS "shoeSize",c.notes,c.active,c.created_at AS "createdAt",c.updated_at AS "updatedAt"
    FROM customers c JOIN users u ON u.tenant_id=c.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_CLIENTE' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',c.name,c.cpf,c.cnpj,c.email,c.phone_primary) ILIKE '%'||$2||'%')
      AND ($5 IS NULL OR $5<>'') ORDER BY c.active DESC,lower(c.name),c.id LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$search,$limit,$offset,$requestKey])
}

query ListProducts($search: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT p.id,p.name,p.internal_code AS "internalCode",p.ean,p.brand,p.size_type AS "sizeType",p.size,p.color,
      p.maximum_stock AS "maximumStock",p.minimum_stock AS "minimumStock",p.sale_price_cents::text AS "salePriceCents",
      p.cost_price_cents::text AS "costPriceCents",p.weighted_product AS "weightedProduct",p.bundle_product AS "bundleProduct",
      p.allow_negative_stock AS "allowNegativeStock",p.notes,p.active,p.category_id AS "categoryId",c.name AS "categoryName",
      p.subcategory_id AS "subcategoryId",sc.name AS "subcategoryName",p.supplier_id AS "supplierId",
      COALESCE(s.trade_name,s.legal_name) AS "supplierName",p.created_at AS "createdAt",p.updated_at AS "updatedAt",
      EXISTS(SELECT 1 FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id AND pr.active
        AND pr.deleted_at IS NULL AND now() BETWEEN pr.starts_at AND pr.ends_at) AS "onPromotion",
      COALESCE((SELECT pr.promotional_price_cents::text FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id
        AND pr.active AND pr.deleted_at IS NULL AND now() BETWEEN pr.starts_at AND pr.ends_at ORDER BY pr.starts_at DESC LIMIT 1),
        p.sale_price_cents::text) AS "effectivePriceCents"
    FROM products p JOIN users u ON u.tenant_id=p.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id
    LEFT JOIN subcategories sc ON sc.id=p.subcategory_id AND sc.tenant_id=p.tenant_id
    LEFT JOIN suppliers s ON s.id=p.supplier_id AND s.tenant_id=p.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false)
      AND ($2='' OR concat_ws(' ',p.name,p.internal_code,p.ean,p.brand,c.name,sc.name) ILIKE '%'||$2||'%')
      AND ($5 IS NULL OR $5<>'') ORDER BY p.active DESC,lower(p.name),p.id LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$search,$limit,$offset,$requestKey])
}

query RegistrationOptions($requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT jsonb_build_object(
      'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name) ORDER BY lower(c.name))
        FROM categories c WHERE c.tenant_id=u.tenant_id AND c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'subcategories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',s.name,'categoryId',s.category_id) ORDER BY lower(s.name))
        FROM subcategories s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name)))
        FROM suppliers s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'costPriceCents',p.cost_price_cents::text) ORDER BY lower(p.name))
        FROM products p WHERE p.tenant_id=u.tenant_id AND p.active AND p.deleted_at IS NULL AND NOT p.bundle_product),'[]'::jsonb)
    ) AS data FROM users u
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND COALESCE(up.can_access,rp.can_access,false) AND ($2 IS NULL OR $2<>'')
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query ProductComponents($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pc.component_product_id AS "productId",p.name,pc.quantity,pc.allocated_unit_price_cents::text AS "allocatedUnitPriceCents"
    FROM product_components pc JOIN users u ON u.tenant_id=pc.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN products p ON p.id=pc.component_product_id AND p.tenant_id=pc.tenant_id
    WHERE pc.parent_product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY lower(p.name)
  """,params:[{_expr:"auth.uid"},$productId])
}

query ProductPromotions($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pr.id,pr.promotional_price_cents::text AS "promotionalPriceCents",pr.starts_at AS "startsAt",
      pr.ends_at AS "endsAt",pr.active,pr.created_at AS "createdAt",pr.updated_at AS "updatedAt",
      CASE WHEN NOT pr.active THEN 'INACTIVE' WHEN now()<pr.starts_at THEN 'SCHEDULED'
        WHEN now()>pr.ends_at THEN 'ENDED' ELSE 'ACTIVE' END AS status
    FROM promotions pr JOIN users u ON u.tenant_id=pr.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE pr.product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY pr.starts_at DESC
  """,params:[{_expr:"auth.uid"},$productId])
}
