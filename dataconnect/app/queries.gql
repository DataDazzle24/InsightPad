# Insight Pad client queries.
# Every authenticated query derives tenant, role and user from auth.uid.
# Client-supplied tenant or role identifiers must not define authorization scope.

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    name
    email
    active
    onboardingPending
    tenant {
      id
      legalName
      tradeName
      active
      timezone
      currencyCode
    }
    role {
      id
      name
      hierarchyLevel
      active
    }
  }
}

query GetCurrentUserAccess @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    tenant {
      id
    }
    role {
      id
      rolePagePermissions_on_role {
        canAccess
        canCreate
        canUpdate
        canDelete
        canExport
        canManage
        page {
          id
          pageKey
          displayName
          module
          route
          icon
          displayOrder
          requiresLogin
          active
        }
      }
    }
    userPagePermissions_on_user {
      canAccess
      canCreate
      canUpdate
      canDelete
      canExport
      canManage
      page {
        id
        pageKey
        displayName
        module
        route
        icon
        displayOrder
        requiresLogin
        active
      }
    }
  }
}
