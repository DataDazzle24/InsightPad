query ListProducts($search: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT p.id,p.name,p.internal_code AS "internalCode",p.ean,p.brand,p.size_type AS "sizeType",p.size,p.color,
      p.maximum_stock AS "maximumStock",p.minimum_stock AS "minimumStock",p.sale_price_cents::text AS "salePriceCents",
      p.cost_price_cents::text AS "costPriceCents",p.weighted_product AS "weightedProduct",p.bundle_product AS "bundleProduct",
      p.allow_negative_stock AS "allowNegativeStock",p.notes,p.active,p.category_id AS "categoryId",c.name AS "categoryName",
      p.subcategory_id AS "subcategoryId",sc.name AS "subcategoryName",p.supplier_id AS "supplierId",
      COALESCE(s.trade_name,s.legal_name) AS "supplierName",p.created_at AS "createdAt",p.updated_at AS "updatedAt",
      EXISTS(SELECT 1 FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id AND pr.active
        AND pr.deleted_at IS NULL AND now()>=pr.starts_at AND now()<pr.ends_at) AS "onPromotion",
      COALESCE((SELECT pr.promotional_price_cents::text FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id
        AND pr.active AND pr.deleted_at IS NULL AND now()>=pr.starts_at AND now()<pr.ends_at ORDER BY pr.starts_at DESC LIMIT 1),
        p.sale_price_cents::text) AS "effectivePriceCents"
    FROM products p JOIN users u ON u.tenant_id=p.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id
    LEFT JOIN subcategories sc ON sc.id=p.subcategory_id AND sc.tenant_id=p.tenant_id
    LEFT JOIN suppliers s ON s.id=p.supplier_id AND s.tenant_id=p.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false)
      AND ($2='' OR concat_ws(' ',p.name,p.internal_code,p.ean,p.brand,c.name,sc.name) ILIKE '%'||$2||'%')
      AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' AND $3 IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN (to_jsonb(base)->>$3)::numeric END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN (to_jsonb(base)->>$3)::numeric END DESC NULLS LAST,
      CASE WHEN $4='asc' AND $3 NOT IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 NOT IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query RegistrationOptions($requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT jsonb_build_object(
      'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name) ORDER BY lower(c.name))
        FROM categories c WHERE c.tenant_id=u.tenant_id AND c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'subcategories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',s.name,'categoryId',s.category_id) ORDER BY lower(s.name))
        FROM subcategories s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name)))
        FROM suppliers s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'costPriceCents',p.cost_price_cents::text) ORDER BY lower(p.name))
        FROM products p WHERE p.tenant_id=u.tenant_id AND p.active AND p.deleted_at IS NULL AND NOT p.bundle_product),'[]'::jsonb)
    ) AS data FROM users u
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND COALESCE(up.can_access,rp.can_access,false) AND ($2 IS NULL OR $2<>'')
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query ProductComponents($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pc.component_product_id AS "productId",p.name,pc.quantity,pc.allocated_unit_price_cents::text AS "allocatedUnitPriceCents"
    FROM product_components pc JOIN users u ON u.tenant_id=pc.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN products p ON p.id=pc.component_product_id AND p.tenant_id=pc.tenant_id
    WHERE pc.parent_product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY lower(p.name)
  """,params:[{_expr:"auth.uid"},$productId])
}

query ProductPromotions($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pr.id,pr.promotional_price_cents::text AS "promotionalPriceCents",pr.starts_at AS "startsAt",
      pr.ends_at AS "endsAt",pr.active,pr.created_at AS "createdAt",pr.updated_at AS "updatedAt",
      CASE WHEN NOT pr.active THEN 'INACTIVE' WHEN now()<pr.starts_at THEN 'SCHEDULED'
        WHEN now()>=pr.ends_at THEN 'ENDED' ELSE 'ACTIVE' END AS status
    FROM promotions pr JOIN users u ON u.tenant_id=pr.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE pr.product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY pr.starts_at DESC
  """,params:[{_expr:"auth.uid"},$productId])
}

# Data Dazzle control plane. Access is restricted server-side to the platform system role.
query PlatformAdminWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,true AS is_platform FROM users u JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND r.active AND r.deleted_at IS NULL
        AND r.system_role AND r.name='Administrador da Plataforma'
    )
    SELECT jsonb_build_object(
      'tenants',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',t.id,'legalName',t.legal_name,'tradeName',t.trade_name,'document',t.document,'email',t.email,'phone',t.phone,'planCode',t.plan_code,'startsOn',t.starts_on,'expiresOn',t.expires_on,'active',t.active,'userCount',(SELECT count(*) FROM users u WHERE u.tenant_id=t.id AND u.deleted_at IS NULL),'branchCount',(SELECT count(*) FROM branches b WHERE b.tenant_id=t.id AND b.deleted_at IS NULL)) ORDER BY lower(COALESCE(t.trade_name,t.legal_name))) FROM tenants t,actor a WHERE t.deleted_at IS NULL AND (a.is_platform OR t.id=a.tenant_id)),'[]'::jsonb),
      'roles',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',r.id,'tenantId',r.tenant_id,'name',r.name,'active',r.active) ORDER BY lower(r.name)) FROM roles r,actor a WHERE r.deleted_at IS NULL AND (a.is_platform OR r.tenant_id=a.tenant_id)),'[]'::jsonb),
      'users',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',u.id,'tenantId',u.tenant_id,'tenantName',COALESCE(t.trade_name,t.legal_name),'roleId',u.role_id,'roleName',r.name,'name',u.name,'email',u.email,'active',u.active,'onboardingPending',u.onboarding_pending,'lastLoginAt',u.last_login_at) ORDER BY lower(u.name)) FROM users u JOIN tenants t ON t.id=u.tenant_id JOIN roles r ON r.id=u.role_id CROSS JOIN actor a WHERE u.deleted_at IS NULL AND (a.is_platform OR u.tenant_id=a.tenant_id)),'[]'::jsonb),
      'pages',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'pageKey',p.page_key,'displayName',p.display_name,'module',p.module) ORDER BY p.module,p.display_order) FROM app_pages p WHERE p.active),'[]'::jsonb),
      'permissions',COALESCE((SELECT jsonb_agg(jsonb_build_object('roleId',rp.role_id,'pageId',rp.page_id,'canAccess',rp.can_access,'canCreate',rp.can_create,'canUpdate',rp.can_update,'canDelete',rp.can_delete,'canExport',rp.can_export,'canManage',rp.can_manage)) FROM role_page_permissions rp CROSS JOIN actor a WHERE a.is_platform OR rp.tenant_id=a.tenant_id),'[]'::jsonb)
    ) AS data FROM actor WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

# Complete stock workspace. Tenant scope and page access are enforced in SQL.
query StockWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name))) FROM suppliers s,actor a WHERE s.tenant_id=a.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean,'categoryName',c.name,'minimumStock',p.minimum_stock,'maximumStock',p.maximum_stock,'allowNegativeStock',p.allow_negative_stock,'costPriceCents',p.cost_price_cents::text,'balances',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',b.id,'branchName',b.name,'quantity',COALESCE((SELECT sum(CASE WHEN smt.direction='IN' THEN sm.quantity ELSE -sm.quantity END) FROM stock_movements sm JOIN stock_movement_types smt ON smt.id=sm.movement_type_id AND smt.tenant_id=sm.tenant_id WHERE sm.tenant_id=p.tenant_id AND sm.branch_id=b.id AND sm.product_id=p.id AND sm.status='POSTED'),0),'averageCostCents',COALESCE(sb.average_cost_cents,p.cost_price_cents)::text,'updatedAt',sb.updated_at) ORDER BY lower(b.name)) FROM branches b LEFT JOIN stock_balances sb ON sb.tenant_id=b.tenant_id AND sb.branch_id=b.id AND sb.product_id=p.id WHERE b.tenant_id=p.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb)) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id LEFT JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL AND NOT p.bundle_product),'[]'::jsonb),
      'movements',COALESCE((SELECT jsonb_agg(x ORDER BY x."occurredAt" DESC) FROM (SELECT m.id,m.client_operation_id AS "operationId",m.occurred_at AS "occurredAt",m.quantity,m.unit_cost_cents::text AS "unitCostCents",m.status,mt.code AS "typeCode",mt.name AS "typeName",mt.direction,p.id AS "productId",p.name AS "productName",b.id AS "branchId",b.name AS "branchName",m.created_by_uid AS "createdByUid" FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id AND mt.tenant_id=m.tenant_id JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id JOIN branches b ON b.id=m.branch_id AND b.tenant_id=m.tenant_id ORDER BY m.occurred_at DESC LIMIT 300) x),'[]'::jsonb),
      'transfers',COALESCE((SELECT jsonb_agg(x ORDER BY x."requestedAt" DESC) FROM (SELECT tr.id,tr.client_operation_id AS "operationId",tr.status,tr.requested_at AS "requestedAt",tr.completed_at AS "completedAt",tr.notes,s.name AS "sourceBranch",d.name AS "destinationBranch",COALESCE((SELECT sum(i.quantity) FROM stock_transfer_items i WHERE i.transfer_id=tr.id),0) AS "totalQuantity",COALESCE((SELECT count(*) FROM stock_transfer_items i WHERE i.transfer_id=tr.id),0) AS "itemCount" FROM stock_transfers tr JOIN actor a ON a.tenant_id=tr.tenant_id JOIN branches s ON s.id=tr.source_branch_id JOIN branches d ON d.id=tr.destination_branch_id ORDER BY tr.requested_at DESC LIMIT 100) x),'[]'::jsonb)
    ) AS data FROM actor WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query DailyProfitDashboard($from: Date!, $to: Date!, $branchId: UUID, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,t.timezone FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ),eligible_sales AS (
      SELECT s.*,(s.sold_at AT TIME ZONE a.timezone)::date sale_day FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2 AND $3 AND ($4 IS NULL OR s.branch_id=$4)
    ),item_cost AS (SELECT i.sale_id,COALESCE(sum(round(i.quantity*i.unit_cost_cents)),0)::bigint cost FROM sale_items i JOIN eligible_sales s ON s.id=i.sale_id WHERE i.status='ACTIVE' GROUP BY i.sale_id),
    days AS (SELECT d::date AS day FROM generate_series($2::date,$3::date,'1 day'::interval)d),daily AS (SELECT d.day,COALESCE(sum(s.total_cents),0)::bigint revenue,COALESCE(sum(c.cost),0)::bigint cost,count(s.id)::int sales FROM days d LEFT JOIN eligible_sales s ON s.sale_day=d.day LEFT JOIN item_cost c ON c.sale_id=s.id GROUP BY d.day ORDER BY d.day),
    totals AS (SELECT COALESCE(sum(s.total_cents),0)::bigint revenue,COALESCE(sum(c.cost),0)::bigint cost,count(s.id)::int sales,COALESCE(avg(s.total_cents),0)::bigint ticket FROM eligible_sales s LEFT JOIN item_cost c ON c.sale_id=s.id),
    previous AS (SELECT COALESCE(sum(s.total_cents),0)::bigint revenue FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN ($2::date-($3::date-$2::date)-1) AND ($2::date-1) AND ($4 IS NULL OR s.branch_id=$4))
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'summary',(SELECT jsonb_build_object('revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2) END,'salesCount',sales,'averageTicketCents',ticket::text,'previousRevenueCents',(SELECT revenue::text FROM previous)) FROM totals),
      'daily',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',day,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'salesCount',sales) ORDER BY day) FROM daily),'[]'::jsonb),
      'byBranch',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',b.id,'branchName',b.name,'revenueCents',sum(s.total_cents)::text,'profitCents',(sum(s.total_cents)-sum(COALESCE(c.cost,0)))::text,'salesCount',count(s.id)) ORDER BY sum(s.total_cents) DESC) FROM eligible_sales s JOIN branches b ON b.id=s.branch_id LEFT JOIN item_cost c ON c.sale_id=s.id GROUP BY b.id,b.name),'[]'::jsonb),
      'topProducts',COALESCE((SELECT jsonb_agg(x ORDER BY x."revenueCents"::bigint DESC) FROM (SELECT p.id,p.name,sum(i.quantity) AS quantity,sum(i.total_cents)::text AS "revenueCents",(sum(i.total_cents)-sum(round(i.quantity*i.unit_cost_cents)))::text AS "profitCents" FROM sale_items i JOIN eligible_sales s ON s.id=i.sale_id JOIN products p ON p.id=i.product_id WHERE i.status='ACTIVE' GROUP BY p.id,p.name ORDER BY sum(i.total_cents) DESC LIMIT 10)x),'[]'::jsonb),
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('name',pm.name,'amountCents',sum(sp.amount_cents)::text) ORDER BY sum(sp.amount_cents) DESC) FROM sale_payments sp JOIN eligible_sales s ON s.id=sp.sale_id JOIN payment_methods pm ON pm.id=sp.payment_method_id WHERE sp.status='CONFIRMED' GROUP BY pm.id,pm.name),'[]'::jsonb)
    ) AS data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$branchId,$requestKey])
}

query StockOperationDetails($operationId: String!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)),mov AS (SELECT m.*,mt.code,mt.name type_name,mt.direction,p.name product_name,b.name branch_name FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id JOIN products p ON p.id=m.product_id JOIN branches b ON b.id=m.branch_id WHERE m.client_operation_id=$2)
    SELECT jsonb_build_object('movements',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',m.id,'productId',m.product_id,'productName',m.product_name,'branchId',m.branch_id,'branchName',m.branch_name,'quantity',m.quantity,'unitGrossCents',m.unit_gross_cents::text,'unitCostCents',m.unit_cost_cents::text,'occurredAt',m.occurred_at,'status',m.status,'typeCode',m.code,'typeName',m.type_name,'direction',m.direction,'fiscalDocumentId',m.fiscal_document_id) ORDER BY m.created_at) FROM mov m),'[]'::jsonb),'fiscalDocument',(SELECT jsonb_build_object('id',f.id,'documentType',f.document_type,'documentNumber',f.document_number,'accessKey',f.access_key,'issuedAt',f.issued_at,'totalCents',f.total_cents::text,'freightCents',f.freight_cents::text,'insuranceCents',f.insurance_cents::text,'icmsCents',f.icms_cents::text,'icmsStCents',f.icms_st_cents::text,'ipiCents',f.ipi_cents::text,'issuerCpf',f.issuer_cpf,'issuerCnpj',f.issuer_cnpj,'stateCode',f.state_code,'supplierId',f.supplier_id,'status',f.status) FROM fiscal_documents f JOIN mov m ON m.fiscal_document_id=f.id LIMIT 1)) data FROM actor WHERE $3<>''
  """,params:[{_expr:"auth.uid"},$operationId,$requestKey])
}

query FinancialIndicatorsDashboard($from: Date!, $to: Date!, $filters: Any!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(NULLIF(t.timezone,''),'America/Sao_Paulo') AS timezone
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), filter_input AS (
      SELECT COALESCE($4::jsonb,'{}'::jsonb) AS value
    ), filtered_items AS (
      SELECT i.sale_id,i.product_id,i.quantity,i.total_cents,i.unit_cost_cents,
             s.branch_id,(s.sold_at AT TIME ZONE a.timezone)::date AS sale_day,
             p.name AS product_name,c.name AS category_name,sc.name AS subcategory_name
      FROM sale_items i
      JOIN sales s ON s.id=i.sale_id AND s.tenant_id=i.tenant_id
      JOIN actor a ON a.tenant_id=s.tenant_id
      JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
      LEFT JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id
      LEFT JOIN subcategories sc ON sc.id=p.subcategory_id AND sc.tenant_id=p.tenant_id
      CROSS JOIN filter_input f
      WHERE s.status='COMPLETED' AND i.status='ACTIVE'
        AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR EXISTS(SELECT 1 FROM jsonb_array_elements_text(COALESCE(f.value->'branches','[]'::jsonb)) x WHERE x.value=s.branch_id::text))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR EXISTS(SELECT 1 FROM jsonb_array_elements_text(COALESCE(f.value->'products','[]'::jsonb)) x WHERE x.value=p.id::text))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR EXISTS(SELECT 1 FROM jsonb_array_elements_text(COALESCE(f.value->'categories','[]'::jsonb)) x WHERE x.value=p.category_id::text))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR EXISTS(SELECT 1 FROM jsonb_array_elements_text(COALESCE(f.value->'subcategories','[]'::jsonb)) x WHERE x.value=p.subcategory_id::text))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR EXISTS(SELECT 1 FROM jsonb_array_elements_text(COALESCE(f.value->'suppliers','[]'::jsonb)) x WHERE x.value=p.supplier_id::text))
    ), eligible_sales AS (
      SELECT s.id,s.total_cents,(s.sold_at AT TIME ZONE a.timezone)::date AS sale_day
      FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id
      WHERE s.status='COMPLETED' AND EXISTS(SELECT 1 FROM filtered_items i WHERE i.sale_id=s.id)
    ), cost_by_sale AS (
      SELECT sale_id,COALESCE(sum(round(quantity*unit_cost_cents)),0)::bigint AS cost FROM filtered_items GROUP BY sale_id
    ), calendar_days AS (
      SELECT generate_series($2::date,$3::date,interval '1 day')::date AS day
    ), daily_values AS (
      SELECT d.day,count(s.id)::int AS volume,COALESCE(sum(s.total_cents),0)::bigint AS revenue,COALESCE(sum(c.cost),0)::bigint AS cost
      FROM calendar_days d LEFT JOIN eligible_sales s ON s.sale_day=d.day LEFT JOIN cost_by_sale c ON c.sale_id=s.id GROUP BY d.day
    ), totals AS (
      SELECT count(s.id)::int AS volume,COALESCE(sum(s.total_cents),0)::bigint AS revenue,COALESCE(sum(c.cost),0)::bigint AS cost
      FROM eligible_sales s LEFT JOIN cost_by_sale c ON c.sale_id=s.id
    ), historical_sale_cost AS (
      SELECT i.sale_id,COALESCE(sum(round(i.quantity*i.unit_cost_cents)),0)::bigint AS cost
      FROM sale_items i JOIN actor a ON a.tenant_id=i.tenant_id WHERE i.status='ACTIVE' GROUP BY i.sale_id
    ), closed_months AS (
      SELECT date_trunc('month',s.sold_at AT TIME ZONE a.timezone)::date AS month,count(s.id)::int AS volume,
             COALESCE(sum(s.total_cents),0)::bigint AS revenue,COALESCE(sum(c.cost),0)::bigint AS cost
      FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id LEFT JOIN historical_sale_cost c ON c.sale_id=s.id
      WHERE s.status='COMPLETED' AND date_trunc('month',s.sold_at AT TIME ZONE a.timezone)<date_trunc('month',current_timestamp AT TIME ZONE a.timezone)
      GROUP BY date_trunc('month',s.sold_at AT TIME ZONE a.timezone)::date ORDER BY month DESC LIMIT 12
    ), monthly_stats AS (
      SELECT COALESCE((SELECT volume FROM closed_months ORDER BY month DESC LIMIT 1),0) AS last_volume,
             COALESCE((SELECT revenue-cost FROM closed_months ORDER BY month DESC LIMIT 1),0)::bigint AS last_profit,
             COALESCE(avg(volume),0) AS avg_volume,COALESCE(avg(revenue-cost),0)::bigint AS avg_profit,count(*)::int AS months
      FROM closed_months
    ), product_values AS (
      SELECT product_id AS id,product_name AS name,category_name AS category,subcategory_name AS subcategory,
             sum(quantity) AS quantity,sum(total_cents)::bigint AS revenue,sum(round(quantity*unit_cost_cents))::bigint AS cost,count(*)::int AS line_count
      FROM filtered_items GROUP BY product_id,product_name,category_name,subcategory_name
    )
    SELECT jsonb_build_object(
      'options',jsonb_build_object(
        'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id WHERE b.active AND b.deleted_at IS NULL),'[]'::jsonb),
        'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL),'[]'::jsonb),
        'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name) ORDER BY lower(c.name)) FROM categories c JOIN actor a ON a.tenant_id=c.tenant_id WHERE c.active AND c.deleted_at IS NULL),'[]'::jsonb),
        'subcategories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',s.name) ORDER BY lower(s.name)) FROM subcategories s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.active AND s.deleted_at IS NULL),'[]'::jsonb),
        'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name))) FROM suppliers s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.active AND s.deleted_at IS NULL),'[]'::jsonb)
      ),
      'cards',(SELECT jsonb_build_object('volume',volume,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2) END,'ticketCents',CASE WHEN volume=0 THEN '0' ELSE round(revenue::numeric/volume)::bigint::text END) FROM totals),
      'monthly',(SELECT jsonb_build_object('lastVolume',last_volume,'averageVolume',avg_volume,'volumeGrowth',CASE WHEN avg_volume=0 THEN 0 ELSE round((last_volume-avg_volume)*100.0/avg_volume,2) END,'lastProfitCents',last_profit::text,'averageProfitCents',avg_profit::text,'profitGrowth',CASE WHEN avg_profit=0 THEN 0 ELSE round((last_profit-avg_profit)*100.0/avg_profit,2) END,'months',months) FROM monthly_stats),
      'daily',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',day,'volume',volume,'revenueCents',revenue::text,'profitCents',(revenue-cost)::text) ORDER BY day) FROM daily_values),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'category',category,'subcategory',subcategory,'quantity',quantity,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2) END,'lineCount',line_count) ORDER BY revenue DESC) FROM product_values),'[]'::jsonb)
    ) AS data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$filters,$requestKey])
}

query OperationalAnalyticsDashboard($from: Date!, $to: Date!, $filters: Any!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(NULLIF(t.timezone,''),'America/Sao_Paulo') timezone
      FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), f AS (SELECT COALESCE($4::jsonb,'{}') value), bounds AS (SELECT ($2::date-($3::date-$2::date+1))::date previous_from,($2::date-1)::date previous_to), sale_lines AS (
      SELECT s.id sale_id,s.customer_id,s.branch_id,(s.sold_at AT TIME ZONE a.timezone)::date AS day,i.product_id,i.quantity,i.total_cents,round(i.quantity*i.unit_cost_cents)::bigint cost,p.category_id,p.subcategory_id,p.supplier_id
      FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN sale_items i ON i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE'
      JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id CROSS JOIN f
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR s.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), previous_lines AS (
      SELECT p.category_id,p.subcategory_id,i.total_cents FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN sale_items i ON i.sale_id=s.id AND i.status='ACTIVE' JOIN products p ON p.id=i.product_id CROSS JOIN bounds b CROSS JOIN f
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN b.previous_from AND b.previous_to
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR s.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), previous_values AS (SELECT category_id id,'Categoria' level,sum(total_cents)::bigint revenue FROM previous_lines GROUP BY category_id UNION ALL SELECT subcategory_id,'Subcategoria',sum(total_cents)::bigint FROM previous_lines WHERE subcategory_id IS NOT NULL GROUP BY subcategory_id), sale_totals AS (SELECT sale_id,customer_id,branch_id,day,sum(total_cents)::bigint revenue,sum(cost)::bigint cost,sum(quantity) quantity FROM sale_lines GROUP BY sale_id,customer_id,branch_id,day), stock_lines AS (
      SELECT m.id,m.product_id,m.branch_id,(m.occurred_at AT TIME ZONE a.timezone)::date AS day,m.quantity,m.unit_cost_cents,mt.code,mt.direction,m.fiscal_document_id
      FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id
      JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id CROSS JOIN f
      WHERE m.status='POSTED' AND (m.occurred_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR m.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), stock_monthly AS (
      SELECT date_trunc('month',day)::date AS month,
        sum(quantity) FILTER(WHERE direction='IN') inbound_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE direction='IN'))::bigint inbound_value,
        sum(quantity) FILTER(WHERE code='SALE') sale_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE code='SALE'))::bigint sale_cost,
        sum(quantity) FILTER(WHERE direction='OUT' AND code<>'SALE') loss_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE direction='OUT' AND code<>'SALE'))::bigint loss_value
      FROM stock_lines GROUP BY date_trunc('month',day)::date
    ), customer_values AS (
      SELECT c.id,c.name,c.city,c.state_code,c.birth_date,count(st.sale_id)::int purchases,COALESCE(sum(st.revenue),0)::bigint revenue,max(st.day) last_purchase
      FROM customers c JOIN actor a ON a.tenant_id=c.tenant_id LEFT JOIN sale_totals st ON st.customer_id=c.id
      WHERE c.active AND c.deleted_at IS NULL GROUP BY c.id
    ), customer_rank AS (
      SELECT cv.*,sum(revenue) OVER() total_revenue,sum(revenue) OVER(ORDER BY revenue DESC,id)/NULLIF(sum(revenue) OVER(),0)::numeric cumulative
      FROM customer_values cv
    ), category_values AS (
      SELECT c.id,c.name,'Categoria' level,sum(sl.quantity) quantity,sum(sl.total_cents)::bigint revenue,sum(sl.cost)::bigint cost,COALESCE(pv.revenue,0)::bigint previous_revenue
      FROM sale_lines sl JOIN categories c ON c.id=sl.category_id LEFT JOIN previous_values pv ON pv.id=c.id AND pv.level='Categoria' GROUP BY c.id,c.name,pv.revenue
      UNION ALL
      SELECT sc.id,sc.name,'Subcategoria',sum(sl.quantity),sum(sl.total_cents)::bigint,sum(sl.cost)::bigint,COALESCE(pv.revenue,0)::bigint
      FROM sale_lines sl JOIN subcategories sc ON sc.id=sl.subcategory_id LEFT JOIN previous_values pv ON pv.id=sc.id AND pv.level='Subcategoria' GROUP BY sc.id,sc.name,pv.revenue
    ), fiscal_docs AS (
      SELECT DISTINCT fd.id,fd.freight_cents,fd.insurance_cents,fd.icms_cents,fd.icms_st_cents,fd.ipi_cents FROM stock_lines sl JOIN fiscal_documents fd ON fd.id=sl.fiscal_document_id
    ), fiscal_totals AS (
      SELECT COALESCE(sum(freight_cents),0)::bigint freight,COALESCE(sum(insurance_cents+icms_cents+icms_st_cents+ipi_cents),0)::bigint extras FROM fiscal_docs
    )
    SELECT jsonb_build_object(
      'stock',jsonb_build_object(
        'cards',jsonb_build_object(
          'inboundQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE direction='IN'),0),'inboundValueCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE direction='IN'),0)::text,
          'freightCents',(SELECT freight::text FROM fiscal_totals),'extraCostsCents',(SELECT extras::text FROM fiscal_totals),
          'saleQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE code='SALE'),0),'saleCostCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE code='SALE'),0)::text,
          'saleProfitCents',(COALESCE((SELECT sum(revenue-cost) FROM sale_totals),0))::text,'lossQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE direction='OUT' AND code<>'SALE'),0),'lossValueCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE direction='OUT' AND code<>'SALE'),0)::text),
        'monthly',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',month,'inboundQuantity',COALESCE(inbound_quantity,0),'inboundValueCents',COALESCE(inbound_value,0)::text,'saleQuantity',COALESCE(sale_quantity,0),'saleCostCents',COALESCE(sale_cost,0)::text,'lossQuantity',COALESCE(loss_quantity,0),'lossValueCents',COALESCE(loss_value,0)::text) ORDER BY month) FROM stock_monthly),'[]'),
        'products',COALESCE((SELECT jsonb_agg(x ORDER BY abs((x->>'netQuantity')::numeric) DESC) FROM(SELECT jsonb_build_object('id',p.id,'name',p.name,'inQuantity',COALESCE(sum(sl.quantity)FILTER(WHERE sl.direction='IN'),0),'outQuantity',COALESCE(sum(sl.quantity)FILTER(WHERE sl.direction='OUT'),0),'netQuantity',COALESCE(sum(CASE WHEN sl.direction='IN'THEN sl.quantity ELSE -sl.quantity END),0),'valueCents',COALESCE(sum(sl.quantity*sl.unit_cost_cents),0)::bigint::text)x FROM stock_lines sl JOIN products p ON p.id=sl.product_id GROUP BY p.id,p.name LIMIT 100)q),'[]')),
      'customers',jsonb_build_object(
        'cards',jsonb_build_object('active',COALESCE((SELECT count(*) FROM customer_values),0),'new',COALESCE((SELECT count(*) FROM customers c JOIN actor a ON a.tenant_id=c.tenant_id WHERE c.active AND c.created_at::date BETWEEN $2::date AND $3::date),0),'withoutPurchase',COALESCE((SELECT count(*) FROM customer_values WHERE purchases=0),0),'ticketCents',COALESCE((SELECT round(sum(revenue)::numeric/NULLIF(sum(purchases),0)) FROM customer_values),0)::bigint::text,'frequency',COALESCE((SELECT round(avg(purchases),2) FROM customer_values),0)),
        'abc',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'purchases',purchases,'revenueCents',revenue::text,'lastPurchase',last_purchase,'class',CASE WHEN cumulative<=.8 THEN'A'WHEN cumulative<=.95 THEN'B'ELSE'C'END) ORDER BY revenue DESC) FROM customer_rank),'[]'),
        'regions',COALESCE((SELECT jsonb_agg(jsonb_build_object('region',concat_ws(' / ',NULLIF(city,''),NULLIF(state_code,'')),'customers',count(*),'revenueCents',sum(revenue)::text) ORDER BY sum(revenue) DESC) FROM customer_values GROUP BY city,state_code),'[]'),
        'birthdays',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'birthDate',birth_date) ORDER BY extract(month from birth_date),extract(day from birth_date)) FROM customer_values WHERE birth_date IS NOT NULL),'[]'),
        'dormant',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'lastPurchase',last_purchase,'revenueCents',revenue::text) ORDER BY last_purchase NULLS FIRST) FROM customer_values WHERE last_purchase IS NULL OR last_purchase<$2::date),'[]')),
      'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'level',level,'quantity',quantity,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2)END,'growthPercent',CASE WHEN previous_revenue=0 THEN 0 ELSE round((revenue-previous_revenue)*100.0/previous_revenue,2)END) ORDER BY level,revenue DESC) FROM category_values),'[]')
    ) data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$filters,$requestKey])
}
