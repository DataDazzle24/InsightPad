# Insight Pad client queries.
# Every authenticated query derives tenant, role and user from auth.uid.
# Client-supplied tenant or role identifiers must not define authorization scope.

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    name
    email
    active
    onboardingPending
    tenant {
      id
      legalName
      tradeName
      active
      timezone
      currencyCode
    }
    role {
      id
      name
      hierarchyLevel
      systemRole
      active
    }
  }
}

query GetCurrentUserAccess @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    tenant {
      id
    }
    role {
      id
      rolePagePermissions_on_role {
        canAccess
        canCreate
        canUpdate
        canDelete
        canExport
        canManage
        page {
          id
          pageKey
          displayName
          module
          route
          icon
          displayOrder
          requiresLogin
          active
        }
      }
    }
    userPagePermissions_on_user {
      canAccess
      canCreate
      canUpdate
      canDelete
      canExport
      canManage
      page {
        id
        pageKey
        displayName
        module
        route
        icon
        displayOrder
        requiresLogin
        active
      }
    }
  }
}

query ValidateDeviceSession($sessionToken: String!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    SELECT EXISTS(
      SELECT 1 FROM user_device_sessions s
      JOIN users u ON u.id=s.user_id AND u.tenant_id=s.tenant_id AND u.active AND u.deleted_at IS NULL
      WHERE s.user_id=$1 AND s.session_token=$2 AND $3<>''
    ) AS valid
  """,params:[{_expr:"auth.uid"},$sessionToken,$requestKey])
}

# Lightweight options used by every sales-channel screen. It intentionally
# avoids loading the full product catalog and mapping workspace.
query SalesChannelOptions($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=b.tenant_id AND ub.branch_id=b.id AND ub.active)) WHERE b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'connections',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'provider',c.provider,'displayName',c.display_name,'branchId',c.branch_id,'branchName',b.name,'status',c.status,'catalogProfile',c.catalog_profile,'authorizationStatus',c.authorization_status,'enabled',c.enabled) ORDER BY lower(c.display_name)) FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id WHERE c.active AND c.deleted_at IS NULL),'[]'::jsonb)
    ) data FROM actor WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query SalesChannelConnectionsV2($term: String!, $provider: String!, $status: String!, $branchId: UUID, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), base AS (
      SELECT c.*,b.name branch_name,
        (SELECT count(*) FROM sales_channel_product_mappings m WHERE m.tenant_id=c.tenant_id AND m.connection_id=c.id AND m.active AND m.deleted_at IS NULL) mapping_count,
        (SELECT count(*) FROM sales_channel_orders o WHERE o.tenant_id=c.tenant_id AND o.connection_id=c.id AND o.status='PENDING') pending_orders
      FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
      JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id
      WHERE c.active AND c.deleted_at IS NULL
    ), scoped AS (
      SELECT * FROM base WHERE
        ($2='' OR provider ILIKE '%'||$2||'%' OR display_name ILIKE '%'||$2||'%' OR branch_name ILIKE '%'||$2||'%' OR COALESCE(external_store_id,'') ILIKE '%'||$2||'%')
        AND ($3='' OR provider=$3) AND ($5::uuid IS NULL OR branch_id=$5)
    ), eligible AS (
      SELECT * FROM scoped WHERE ($4=''
          OR ($4='ATTENTION' AND (status IN ('ERROR','SUSPENDED') OR authorization_status IN ('EXPIRED','REVOKED','ERROR') OR consecutive_failures>0))
          OR ($4='PREPARING' AND authorization_status IN ('NOT_CONNECTED','PENDING','PENDING_APPROVAL'))
          OR status=$4 OR authorization_status=$4)
    ), page AS (
      SELECT * FROM eligible ORDER BY
        CASE WHEN $7='asc' AND $6='provider' THEN lower(provider) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='provider' THEN lower(provider) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='displayName' THEN lower(display_name) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='displayName' THEN lower(display_name) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='branchName' THEN lower(branch_name) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='branchName' THEN lower(branch_name) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='status' THEN lower(status) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='status' THEN lower(status) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='lastSyncedAt' THEN last_synced_at END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='lastSyncedAt' THEN last_synced_at END DESC NULLS LAST,
        CASE WHEN $6='' OR $7='' THEN updated_at END DESC,id
      LIMIT LEAST(GREATEST($8,1),100) OFFSET GREATEST($9,0)
    )
    SELECT jsonb_build_object(
      'rows',COALESCE((SELECT jsonb_agg(jsonb_build_object(
        'id',id,'provider',provider,'displayName',display_name,'externalStoreId',external_store_id,
        'branchId',branch_id,'branchName',branch_name,'status',status,'catalogProfile',catalog_profile,'authorizationStatus',authorization_status,
        'integrationMode',integration_mode,'webhookStatus',webhook_status,'enabled',enabled,'tokenExpiresAt',token_expires_at,
        'lastHealthCheckAt',last_health_check_at,'lastSuccessAt',last_success_at,'lastSyncedAt',last_synced_at,'lastPollingAt',last_polling_at,'lastFinancialSyncAt',last_financial_sync_at,'merchantSnapshot',merchant_snapshot,'capabilities',capabilities,
        'lastRequestId',last_request_id,'lastError',last_error,'consecutiveFailures',consecutive_failures,
        'mappingCount',mapping_count,'pendingOrders',pending_orders,'createdAt',created_at,'updatedAt',updated_at
      ) ORDER BY array_position(ARRAY(SELECT id FROM page),id)) FROM page),'[]'::jsonb),
      'total',(SELECT count(*) FROM eligible),
      'summary',jsonb_build_object(
        'total',(SELECT count(*) FROM scoped),
        'authorized',(SELECT count(*) FROM scoped WHERE authorization_status='AUTHORIZED' AND enabled),
        'attention',(SELECT count(*) FROM scoped WHERE status IN ('ERROR','SUSPENDED') OR authorization_status IN ('EXPIRED','REVOKED','ERROR') OR consecutive_failures>0),
        'preparing',(SELECT count(*) FROM scoped WHERE authorization_status IN ('NOT_CONNECTED','PENDING','PENDING_APPROVAL'))
      )
    ) data FROM actor WHERE $10<>''
  """,params:[{_expr:"auth.uid"},$term,$provider,$status,$branchId,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query SalesChannelProductMappingsV2($term: String!, $provider: String!, $connectionId: UUID, $status: String!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CANAIS_VENDA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), base AS (
      SELECT m.*,p.name product_name,p.internal_code,p.ean,p.sale_price_cents,p.bundle_product,c.provider,c.catalog_profile,c.display_name connection_name,b.name branch_name
      FROM sales_channel_product_mappings m JOIN actor a ON a.tenant_id=m.tenant_id
      JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id AND p.active AND p.deleted_at IS NULL
      JOIN sales_channel_connections c ON c.id=m.connection_id AND c.tenant_id=m.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) AND c.active AND c.deleted_at IS NULL
      JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id
      WHERE m.active AND m.deleted_at IS NULL
    ), scoped AS (
      SELECT * FROM base WHERE
        ($2='' OR product_name ILIKE '%'||$2||'%' OR internal_code ILIKE '%'||$2||'%' OR COALESCE(ean,'') ILIKE '%'||$2||'%' OR external_product_id ILIKE '%'||$2||'%' OR COALESCE(external_product_name,'') ILIKE '%'||$2||'%')
        AND ($3='' OR provider=$3) AND ($4::uuid IS NULL OR connection_id=$4)
    ), eligible AS (
      SELECT * FROM scoped WHERE ($5='' OR sync_status=$5 OR ($5='ENABLED' AND enabled) OR ($5='PAUSED' AND NOT enabled)
          OR ($5='AUTOMATIC' AND enabled AND (sync_price OR sync_stock))
          OR ($5='PENDING' AND sync_status IN ('PENDING','QUEUED')))
    ), page AS (
      SELECT * FROM eligible ORDER BY
        CASE WHEN $7='asc' AND $6='productName' THEN lower(product_name) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='productName' THEN lower(product_name) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='provider' THEN lower(provider) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='provider' THEN lower(provider) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='externalProductId' THEN lower(external_product_id) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='externalProductId' THEN lower(external_product_id) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='syncStatus' THEN lower(sync_status) END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='syncStatus' THEN lower(sync_status) END DESC NULLS LAST,
        CASE WHEN $7='asc' AND $6='lastSyncedAt' THEN last_synced_at END ASC NULLS LAST,
        CASE WHEN $7='desc' AND $6='lastSyncedAt' THEN last_synced_at END DESC NULLS LAST,
        CASE WHEN $6='' OR $7='' THEN updated_at END DESC,id
      LIMIT LEAST(GREATEST($8,1),100) OFFSET GREATEST($9,0)
    )
    SELECT jsonb_build_object(
      'rows',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'connectionId',connection_id,'connectionName',connection_name,'provider',provider,'catalogProfile',catalog_profile,'branchName',branch_name,'productId',product_id,'productName',product_name,'internalCode',internal_code,'ean',ean,'salePriceCents',sale_price_cents::text,'bundleProduct',bundle_product,'externalProductId',external_product_id,'externalProductName',external_product_name,'syncPrice',sync_price,'syncStock',sync_stock,'priceMode',price_mode,'customPriceCents',custom_price_cents::text,'effectivePriceCents',(CASE WHEN price_mode='CUSTOM' THEN custom_price_cents ELSE sale_price_cents END)::text,'remoteProductState',remote_product_state,'enabled',enabled,'status',status,'publicationStatus',publication_status,'partnerOperationId',partner_operation_id,'partnerAcceptedAt',partner_accepted_at,'partnerConfirmedAt',partner_confirmed_at,'partnerConfirmationDueAt',partner_confirmation_due_at,'needsFullPublication',needs_full_publication,'syncStatus',sync_status,'lastSyncedAt',last_synced_at,'nextPromotionChangeAt',next_promotion_change_at,'lastError',last_error,'version',version,'updatedAt',updated_at) ORDER BY array_position(ARRAY(SELECT id FROM page),id)) FROM page),'[]'::jsonb),
      'total',(SELECT count(*) FROM eligible),
      'summary',jsonb_build_object('total',(SELECT count(*) FROM scoped),'automatic',(SELECT count(*) FROM scoped WHERE enabled AND (sync_price OR sync_stock)),'pending',(SELECT count(*) FROM scoped WHERE sync_status IN ('PENDING','QUEUED')),'errors',(SELECT count(*) FROM scoped WHERE sync_status='ERROR'))
    ) data FROM actor WHERE $10<>''
  """,params:[{_expr:"auth.uid"},$term,$provider,$connectionId,$status,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

# One bounded database read replaces up to fifty browser round trips during a
# CSV export. The same tenant, branch and explicit export permission gates used
# by the paged screens are applied server-side.
query ExportSalesChannelManagement($section: String!, $term: String!, $provider: String!, $status: String!, $branchId: UUID, $connectionId: UUID, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CANAIS_VENDA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND COALESCE(up.can_export,rp.can_export,false)
        AND upper($2) IN ('CONNECTIONS','PRODUCTS') AND length(btrim($8)) BETWEEN 8 AND 150
    ), connections AS (
      SELECT c.*,b.name branch_name FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id
      WHERE upper($2)='CONNECTIONS' AND c.active AND c.deleted_at IS NULL
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
        AND ($3='' OR c.display_name ILIKE '%'||$3||'%' OR COALESCE(c.external_store_id,'') ILIKE '%'||$3||'%' OR b.name ILIKE '%'||$3||'%')
        AND ($4='' OR c.provider=$4) AND ($5=''
          OR ($5='ATTENTION' AND (c.status IN ('ERROR','SUSPENDED') OR c.authorization_status IN ('EXPIRED','REVOKED','ERROR') OR c.consecutive_failures>0))
          OR ($5='PREPARING' AND c.authorization_status IN ('NOT_CONNECTED','PENDING','PENDING_APPROVAL'))
          OR c.status=$5 OR c.authorization_status=$5) AND ($6::uuid IS NULL OR c.branch_id=$6)
      ORDER BY c.updated_at DESC,c.id LIMIT 5000
    ), mappings AS (
      SELECT m.*,p.name product_name,p.internal_code,p.ean,p.sale_price_cents,p.bundle_product,c.provider,c.catalog_profile,c.display_name connection_name,b.name branch_name
      FROM sales_channel_product_mappings m JOIN actor a ON a.tenant_id=m.tenant_id JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id AND p.active AND p.deleted_at IS NULL
      JOIN sales_channel_connections c ON c.id=m.connection_id AND c.tenant_id=m.tenant_id AND c.active AND c.deleted_at IS NULL JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id
      WHERE upper($2)='PRODUCTS' AND m.active AND m.deleted_at IS NULL
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
        AND ($3='' OR p.name ILIKE '%'||$3||'%' OR p.internal_code ILIKE '%'||$3||'%' OR COALESCE(p.ean,'') ILIKE '%'||$3||'%' OR m.external_product_id ILIKE '%'||$3||'%')
        AND ($4='' OR c.provider=$4) AND ($5='' OR m.sync_status=$5 OR ($5='ENABLED' AND m.enabled) OR ($5='PAUSED' AND NOT m.enabled)
          OR ($5='AUTOMATIC' AND m.enabled AND (m.sync_price OR m.sync_stock)) OR ($5='PENDING' AND m.sync_status IN ('PENDING','QUEUED'))) AND ($7::uuid IS NULL OR m.connection_id=$7)
      ORDER BY m.updated_at DESC,m.id LIMIT 5000
    ) SELECT jsonb_build_object(
      'connections',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'provider',provider,'displayName',display_name,'branchName',branch_name,'externalStoreId',external_store_id,'authorizationStatus',authorization_status,'enabled',enabled,'status',status,'consecutiveFailures',consecutive_failures,'lastSyncedAt',last_synced_at) ORDER BY updated_at DESC,id) FROM connections),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'provider',provider,'connectionName',connection_name,'branchName',branch_name,'catalogProfile',catalog_profile,'productName',product_name,'internalCode',internal_code,'ean',ean,'salePriceCents',sale_price_cents::text,'bundleProduct',bundle_product,'externalProductId',external_product_id,'syncPrice',sync_price,'syncStock',sync_stock,'priceMode',price_mode,'customPriceCents',custom_price_cents::text,'effectivePriceCents',(CASE WHEN price_mode='CUSTOM' THEN custom_price_cents ELSE sale_price_cents END)::text,'publicationStatus',publication_status,'needsFullPublication',needs_full_publication,'syncStatus',sync_status) ORDER BY updated_at DESC,id) FROM mappings),'[]'::jsonb)
    ) data FROM actor
  """,params:[{_expr:"auth.uid"},$section,$term,$provider,$status,$branchId,$connectionId,$requestKey])
}

query SalesChannelProductOptions($term: String!, $connectionId: UUID, $productId: UUID, $limit: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CANAIS_VENDA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), selected_connection AS (
      SELECT c.branch_id,c.tenant_id FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id
      WHERE c.id=$3 AND c.active AND c.deleted_at IS NULL
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
    )
    SELECT p.id,p.name,p.internal_code AS "internalCode",p.ean,p.scale_code AS "scaleCode",p.sale_price_cents AS "salePriceCents",p.weighted_product AS "weightedProduct",p.bundle_product AS "bundleProduct",p.active,
      CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.physical,0) ELSE COALESCE(sb.quantity,0) END AS "physicalStock",
      CASE WHEN p.bundle_product THEN GREATEST(COALESCE(bundle_stock.physical,0)-COALESCE(bundle_stock.available,0),0) ELSE COALESCE(reserved.quantity,0) END AS "reservedStock",
      CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.available,0) ELSE COALESCE(sb.quantity,0)-COALESCE(reserved.quantity,0) END AS "availableStock",
      COALESCE(bundle_stock.component_count,0) AS "componentCount",COALESCE(bundle_stock.components,'[]'::jsonb) AS components
    FROM products p JOIN actor a ON a.tenant_id=p.tenant_id
    LEFT JOIN selected_connection c ON c.tenant_id=p.tenant_id
    LEFT JOIN stock_balances sb ON sb.tenant_id=p.tenant_id AND sb.branch_id=c.branch_id AND sb.product_id=p.id
    LEFT JOIN LATERAL (
      SELECT COALESCE(sum(r.quantity),0) quantity FROM sales_channel_stock_reservations r
      WHERE r.tenant_id=p.tenant_id AND r.branch_id=c.branch_id AND r.product_id=p.id AND r.status='RESERVED'
    ) reserved ON true
    LEFT JOIN LATERAL (
      SELECT floor(min(GREATEST(COALESCE(component_balance.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) physical,
        floor(min(GREATEST(COALESCE(component_balance.quantity,0)-COALESCE(component_reserved.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) available,
        count(*)::int component_count,jsonb_agg(jsonb_build_object('id',component.id,'name',component.name,'quantity',pc.quantity) ORDER BY lower(component.name)) components
      FROM product_components pc JOIN products component ON component.id=pc.component_product_id AND component.tenant_id=pc.tenant_id AND component.active AND component.deleted_at IS NULL
      LEFT JOIN stock_balances component_balance ON component_balance.tenant_id=pc.tenant_id AND component_balance.branch_id=c.branch_id AND component_balance.product_id=pc.component_product_id
      LEFT JOIN LATERAL (SELECT COALESCE(sum(r.quantity),0) quantity FROM sales_channel_stock_reservations r WHERE r.tenant_id=pc.tenant_id AND r.branch_id=c.branch_id AND r.product_id=pc.component_product_id AND r.status='RESERVED') component_reserved ON true
      WHERE pc.tenant_id=p.tenant_id AND pc.parent_product_id=p.id AND pc.quantity>0
    ) bundle_stock ON p.bundle_product
    WHERE (p.active OR p.id=$4) AND (p.deleted_at IS NULL OR p.id=$4) AND (NOT p.bundle_product OR COALESCE(bundle_stock.component_count,0)>0) AND $6<>''
      AND ($4::uuid IS NULL OR p.id=$4)
      AND ($3::uuid IS NULL OR c.branch_id IS NOT NULL)
      AND ($4::uuid IS NOT NULL OR $2='' OR p.name ILIKE '%'||$2||'%' OR p.internal_code ILIKE '%'||$2||'%' OR COALESCE(p.ean,'') ILIKE '%'||$2||'%' OR COALESCE(p.scale_code,'') ILIKE '%'||$2||'%')
    ORDER BY lower(p.name),p.id LIMIT LEAST(GREATEST($5,1),50)
  """,params:[{_expr:"auth.uid"},$term,$connectionId,$productId,$limit,$requestKey])
}

query SalesChannelOperations($connectionId: UUID, $limit: Int! = 50, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CANAIS_VENDA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL
        AND r.system_role AND r.name='Administrador da Plataforma'
        AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'events',COALESCE((SELECT jsonb_agg(x ORDER BY x."receivedAt" DESC) FROM (SELECT e.id,e.connection_id AS "connectionId",c.display_name AS "connectionName",e.provider,e.provider_event_id AS "providerEventId",e.event_type AS "eventType",e.source,e.request_id AS "requestId",e.status,e.attempts,e.received_at AS "receivedAt",e.processed_at AS "processedAt",e.acknowledged_at AS "acknowledgedAt",e.last_error AS "lastError" FROM sales_channel_event_inbox e JOIN actor a ON a.tenant_id=e.tenant_id JOIN sales_channel_connections c ON c.id=e.connection_id AND c.tenant_id=e.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE ($2::uuid IS NULL OR e.connection_id=$2) ORDER BY e.received_at DESC LIMIT LEAST(GREATEST($3,1),500))x),'[]'::jsonb),
      'commands',COALESCE((SELECT jsonb_agg(x ORDER BY x."createdAt" DESC) FROM (SELECT q.id,q.connection_id AS "connectionId",c.display_name AS "connectionName",q.order_id AS "orderId",q.provider,q.action,q.status,q.attempts,q.outcome_unknown AS "outcomeUnknown",q.reconciliation_due_at AS "reconciliationDueAt",q.partner_request_id AS "partnerRequestId",q.response_code AS "responseCode",q.last_error AS "lastError",q.created_at AS "createdAt",q.processed_at AS "processedAt" FROM sales_channel_commands q JOIN actor a ON a.tenant_id=q.tenant_id JOIN sales_channel_connections c ON c.id=q.connection_id AND c.tenant_id=q.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE ($2::uuid IS NULL OR q.connection_id=$2) ORDER BY q.created_at DESC LIMIT LEAST(GREATEST($3,1),500))x),'[]'::jsonb),
      'jobs',COALESCE((SELECT jsonb_agg(x ORDER BY x."createdAt" DESC) FROM (SELECT j.id,j.connection_id AS "connectionId",c.display_name AS "connectionName",j.provider,j.job_type AS "jobType",j.status,j.total_items AS "totalItems",j.processed_items AS "processedItems",j.failed_items AS "failedItems",j.attempts,j.last_error AS "lastError",j.created_at AS "createdAt",j.finished_at AS "finishedAt" FROM sales_channel_sync_jobs j JOIN actor a ON a.tenant_id=j.tenant_id JOIN sales_channel_connections c ON c.id=j.connection_id AND c.tenant_id=j.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE ($2::uuid IS NULL OR j.connection_id=$2) ORDER BY j.created_at DESC LIMIT LEAST(GREATEST($3,1),500))x),'[]'::jsonb),
      'summary',jsonb_build_object(
        'eventFailures',(SELECT count(*) FROM sales_channel_event_inbox e JOIN actor a ON a.tenant_id=e.tenant_id JOIN sales_channel_connections c ON c.id=e.connection_id AND c.tenant_id=e.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE e.status='ERROR' AND ($2::uuid IS NULL OR e.connection_id=$2)),
        'queuedCommands',(SELECT count(*) FROM sales_channel_commands q JOIN actor a ON a.tenant_id=q.tenant_id JOIN sales_channel_connections c ON c.id=q.connection_id AND c.tenant_id=q.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE q.status IN ('QUEUED','PROCESSING','RETRY','AWAITING_PARTNER') AND ($2::uuid IS NULL OR q.connection_id=$2)),
        'syncFailures',(SELECT count(*) FROM (SELECT DISTINCT ON (j.tenant_id,j.connection_id,j.job_type) j.status FROM sales_channel_sync_jobs j JOIN actor a ON a.tenant_id=j.tenant_id JOIN sales_channel_connections c ON c.id=j.connection_id AND c.tenant_id=j.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE ($2::uuid IS NULL OR j.connection_id=$2) ORDER BY j.tenant_id,j.connection_id,j.job_type,j.created_at DESC,j.id DESC) current_jobs WHERE current_jobs.status='ERROR')
      )
    ) data FROM actor WHERE $4<>''
  """,params:[{_expr:"auth.uid"},$connectionId,$limit,$requestKey])
}

# Claimed payloads are visible only to the trusted adapter service. The secret
# value itself remains in Secret Manager; this operation returns only its name.
query SystemSalesChannelWorkQueue($workerId: String!, $requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT jsonb_build_object(
      'commands',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',q.id,'tenantId',q.tenant_id,'connectionId',q.connection_id,'orderId',q.order_id,'providerOrderId',o.provider_order_id,'orderType',o.order_type,'deliveryProvider',o.delivery_provider,'partnerStatus',o.partner_status,'provider',q.provider,'catalogProfile',c.catalog_profile,'action',q.action,'payload',q.payload,'sourceAction',source.action,'sourcePayload',source.payload,'sourceOutcomeUnknown',source.outcome_unknown,'attempts',q.attempts,'leaseUntil',q.lease_until,'secretReference',c.secret_reference,'externalStoreId',c.external_store_id) ORDER BY q.scheduled_at,q.id) FROM sales_channel_commands q JOIN sales_channel_connections c ON c.id=q.connection_id AND c.tenant_id=q.tenant_id LEFT JOIN sales_channel_orders o ON o.id=q.order_id AND o.tenant_id=q.tenant_id LEFT JOIN sales_channel_commands source ON source.tenant_id=q.tenant_id AND source.id::text=q.payload->>'sourceCommandId' WHERE c.active AND c.enabled AND c.deleted_at IS NULL AND (c.status='ACTIVE' OR (c.status='DECOMMISSIONING' AND q.action='DEACTIVATE_PRODUCT')) AND c.authorization_status='AUTHORIZED' AND q.status='PROCESSING' AND q.locked_by=left(btrim($1),180) AND q.lease_until>now()),'[]'::jsonb),
      'events',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',e.id,'tenantId',e.tenant_id,'connectionId',e.connection_id,'provider',e.provider,'providerEventId',e.provider_event_id,'eventType',e.event_type,'requestId',e.request_id,'payloadHash',e.payload_hash,'payload',e.payload,'attempts',e.attempts,'leaseUntil',e.lease_until,'secretReference',c.secret_reference,'externalStoreId',c.external_store_id,'catalogProfile',c.catalog_profile) ORDER BY e.received_at,e.id) FROM sales_channel_event_inbox e JOIN sales_channel_connections c ON c.id=e.connection_id AND c.tenant_id=e.tenant_id WHERE c.active AND c.enabled AND c.deleted_at IS NULL AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED' AND e.status='PROCESSING' AND e.locked_by=left(btrim($1),180) AND e.lease_until>now()),'[]'::jsonb),
      'jobs',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',j.id,'tenantId',j.tenant_id,'connectionId',j.connection_id,'provider',j.provider,'jobType',j.job_type,'processedItems',j.processed_items,'cursor',j.cursor,'checkpoint',j.checkpoint,'catalogProfile',c.catalog_profile,'attempts',j.attempts,'leaseUntil',j.lease_until,'secretReference',c.secret_reference,'externalStoreId',c.external_store_id,'lastFinancialSyncAt',c.last_financial_sync_at) ORDER BY j.scheduled_at,j.id) FROM sales_channel_sync_jobs j JOIN sales_channel_connections c ON c.id=j.connection_id AND c.tenant_id=j.tenant_id WHERE c.active AND c.enabled AND c.deleted_at IS NULL AND j.status='PROCESSING' AND j.locked_by=left(btrim($1),180) AND j.lease_until>now()),'[]'::jsonb)
    ) data WHERE length(btrim($1)) BETWEEN 8 AND 180 AND $2<>''
  """,params:[$workerId,$requestKey])
}

# Read-only adapter lookups. These operations are unavailable to browser
# clients and return no credential values.
query SystemIfoodConnectionsForPolling($requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT c.id AS "connectionId",c.tenant_id AS "tenantId",c.external_store_id AS "externalStoreId",c.integration_mode AS "integrationMode",c.webhook_status AS "webhookStatus"
    FROM sales_channel_connections c
    WHERE c.provider='IFOOD' AND EXISTS(SELECT 1 FROM tenants t WHERE t.id=c.tenant_id AND t.active AND t.deleted_at IS NULL) AND EXISTS(SELECT 1 FROM branches b WHERE b.id=c.branch_id AND b.tenant_id=c.tenant_id AND b.active AND b.deleted_at IS NULL) AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      AND c.external_store_id IS NOT NULL AND length(btrim($1)) BETWEEN 8 AND 150
      AND (c.integration_mode='POLLING' OR (c.integration_mode='HYBRID' AND (c.webhook_status<>'ACTIVE' OR c.last_polling_at IS NULL OR c.last_polling_at<=now()-interval '5 minutes')))
    ORDER BY c.id
  """,params:[$requestKey])
}

query SystemSalesChannelHealthMetrics($requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT jsonb_build_object(
      'activeConnections',(SELECT count(*) FROM sales_channel_connections c WHERE c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'),
      'unhealthyConnections',(SELECT count(*) FROM sales_channel_connections c WHERE c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL AND (c.status IN ('ERROR','SUSPENDED') OR c.authorization_status IN ('EXPIRED','REVOKED','ERROR') OR c.consecutive_failures>0)),
      'eventErrors',(SELECT count(*) FROM sales_channel_event_inbox e WHERE e.status='ERROR'),
      'eventBacklog',(SELECT count(*) FROM sales_channel_event_inbox e WHERE e.status IN ('RECEIVED','RETRY','PROCESSING') AND e.received_at<now()-interval '5 minutes'),
      'commandErrors',(SELECT count(*) FROM sales_channel_commands q WHERE q.status='ERROR'),
      'commandBacklog',(SELECT count(*) FROM sales_channel_commands q WHERE (q.status IN ('QUEUED','RETRY','PROCESSING') AND q.scheduled_at<now()-interval '5 minutes') OR (q.status='AWAITING_PARTNER' AND q.processed_at<now()-interval '15 minutes')),
      'syncErrors',(SELECT count(*) FROM sales_channel_sync_jobs j WHERE j.status='ERROR'),
      'syncBacklog',(SELECT count(*) FROM sales_channel_sync_jobs j WHERE j.status IN ('QUEUED','RETRY','PROCESSING') AND j.scheduled_at<now()-interval '10 minutes'),
      'catalogReceiptsToVerify',(SELECT count(*) FROM sales_channel_product_mappings m WHERE m.active AND m.deleted_at IS NULL AND m.publication_status='RECEIVED' AND m.partner_confirmation_due_at<now()),
      'commerceBlocked',(SELECT count(*) FROM sales_channel_orders o WHERE o.status='COMPLETED' AND o.commerce_status IN ('BLOCKED_MAPPING','BLOCKED_PAYMENT','POSTING_PENDING','POSTED_WITH_ATTENTION')),
      'financialPending',(SELECT count(*) FROM sales_channel_orders o WHERE o.status='COMPLETED' AND o.sale_id IS NOT NULL AND o.net_amount_cents IS NULL AND o.completed_at<now()-interval '24 hours'),
      'capturedAt',now()
    ) data WHERE length(btrim($1)) BETWEEN 8 AND 150
  """,params:[$requestKey])
}

query SystemIfoodConnectionByMerchant($merchantId: String!, $requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT c.id AS "connectionId",c.tenant_id AS "tenantId",c.external_store_id AS "externalStoreId",c.integration_mode AS "integrationMode",c.webhook_status AS "webhookStatus"
    FROM sales_channel_connections c
    WHERE c.provider='IFOOD' AND EXISTS(SELECT 1 FROM tenants t WHERE t.id=c.tenant_id AND t.active AND t.deleted_at IS NULL) AND EXISTS(SELECT 1 FROM branches b WHERE b.id=c.branch_id AND b.tenant_id=c.tenant_id AND b.active AND b.deleted_at IS NULL) AND c.provider_store_key=concat('IFOOD:',left(btrim($1),160))
      AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      AND length(btrim($1)) BETWEEN 1 AND 160 AND length(btrim($2)) BETWEEN 8 AND 150
    LIMIT 2
  """,params:[$merchantId,$requestKey])
}

# Resolves a webhook/polling batch in one round trip. The global provider key
# still guarantees that a merchant cannot be routed to two tenants.
query SystemIfoodConnectionsByMerchants($merchantIds: Any!, $requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    WITH input AS (
      SELECT DISTINCT left(btrim(value),160) merchant_id FROM jsonb_array_elements_text(COALESCE($1::jsonb,'[]'::jsonb))
      WHERE length(btrim(value)) BETWEEN 1 AND 160
    )
    SELECT c.id AS "connectionId",c.tenant_id AS "tenantId",c.external_store_id AS "externalStoreId",c.integration_mode AS "integrationMode",c.webhook_status AS "webhookStatus"
    FROM sales_channel_connections c JOIN input i ON c.provider_store_key=concat('IFOOD:',i.merchant_id)
    WHERE jsonb_array_length(COALESCE($1::jsonb,'[]'::jsonb)) BETWEEN 1 AND 100 AND length(btrim($2)) BETWEEN 8 AND 150
      AND c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      AND EXISTS(SELECT 1 FROM tenants t WHERE t.id=c.tenant_id AND t.active AND t.deleted_at IS NULL)
      AND EXISTS(SELECT 1 FROM branches b WHERE b.id=c.branch_id AND b.tenant_id=c.tenant_id AND b.active AND b.deleted_at IS NULL)
  """,params:[$merchantIds,$requestKey])
}

query SystemSalesChannelMappingsForSync($jobId: UUID!, $workerId: String!, $requestKey: String!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT m.id AS "mappingId",count(*) OVER()::text AS remaining,m.version,now() AS "snapshotAt",m.external_product_id AS "externalProductId",m.external_product_name AS "externalProductName",m.sync_price AS "syncPrice",m.sync_stock AS "syncStock",m.price_mode AS "priceMode",m.custom_price_cents::text AS "customPriceCents",m.remote_product_state AS "remoteProductState",m.last_synced_at AS "lastSyncedAt",m.publication_status AS "publicationStatus",m.partner_operation_id AS "partnerOperationId",m.partner_confirmation_due_at AS "partnerConfirmationDueAt",m.needs_full_publication AS "needsFullPublication",CASE WHEN m.price_mode='CUSTOM' THEN NULL ELSE promotion_boundary.next_at END AS "nextPromotionChangeAt",
      p.name AS "productName",p.internal_code AS "internalCode",p.image_url AS "imageUrl",p.brand,p.size,p.size_type AS "sizeType",p.bundle_product AS "bundleProduct",left(p.notes,1000) AS description,category.name AS "categoryName",subcategory.name AS "subcategoryName",
      CASE WHEN m.price_mode='CUSTOM' THEN m.custom_price_cents ELSE COALESCE(pr.promotional_price_cents,p.sale_price_cents) END::text AS "priceCents",
      CASE WHEN m.price_mode='CUSTOM' THEN m.custom_price_cents ELSE p.sale_price_cents END::text AS "basePriceCents",
      CASE WHEN m.price_mode='CUSTOM' THEN NULL ELSE pr.promotional_price_cents END::text AS "promotionPriceCents",
      CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.available,0) ELSE GREATEST(COALESCE(sb.quantity,0)-COALESCE(reserved.quantity,0),0) END::text AS "stockQuantity"
    FROM sales_channel_sync_jobs j
    JOIN sales_channel_connections c ON c.id=j.connection_id AND c.tenant_id=j.tenant_id
    JOIN sales_channel_product_mappings m ON m.connection_id=c.id AND m.tenant_id=c.tenant_id AND m.active AND m.deleted_at IS NULL AND m.enabled
    JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id AND p.active AND p.deleted_at IS NULL
    JOIN categories category ON category.id=p.category_id AND category.tenant_id=p.tenant_id AND category.active AND category.deleted_at IS NULL
    LEFT JOIN subcategories subcategory ON subcategory.id=p.subcategory_id AND subcategory.tenant_id=p.tenant_id AND subcategory.active AND subcategory.deleted_at IS NULL
    LEFT JOIN stock_balances sb ON sb.tenant_id=m.tenant_id AND sb.branch_id=c.branch_id AND sb.product_id=m.product_id
    LEFT JOIN LATERAL (SELECT sum(r.quantity) quantity FROM sales_channel_stock_reservations r WHERE r.tenant_id=m.tenant_id AND r.branch_id=c.branch_id AND r.product_id=m.product_id AND r.status='RESERVED') reserved ON true
    LEFT JOIN LATERAL (
      SELECT floor(min(GREATEST(COALESCE(component_balance.quantity,0)-COALESCE(component_reserved.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) available,count(*) component_count
      FROM product_components pc JOIN products component ON component.id=pc.component_product_id AND component.tenant_id=pc.tenant_id AND component.active AND component.deleted_at IS NULL
      LEFT JOIN stock_balances component_balance ON component_balance.tenant_id=pc.tenant_id AND component_balance.branch_id=c.branch_id AND component_balance.product_id=pc.component_product_id
      LEFT JOIN LATERAL (SELECT COALESCE(sum(r.quantity),0) quantity FROM sales_channel_stock_reservations r WHERE r.tenant_id=pc.tenant_id AND r.branch_id=c.branch_id AND r.product_id=pc.component_product_id AND r.status='RESERVED') component_reserved ON true
      WHERE pc.tenant_id=p.tenant_id AND pc.parent_product_id=p.id AND pc.quantity>0
    ) bundle_stock ON p.bundle_product
    LEFT JOIN LATERAL (
      SELECT x.promotional_price_cents FROM promotions x WHERE x.tenant_id=p.tenant_id AND x.product_id=p.id AND x.active AND x.deleted_at IS NULL
        AND now()>=x.starts_at AND now()<x.ends_at ORDER BY x.promotional_price_cents,x.id LIMIT 1
    ) pr ON true
    LEFT JOIN LATERAL (
      SELECT min(boundary) next_at FROM (
        SELECT x.starts_at boundary FROM promotions x WHERE x.tenant_id=p.tenant_id AND x.product_id=p.id AND x.active AND x.deleted_at IS NULL AND x.starts_at>now()
        UNION ALL SELECT x.ends_at FROM promotions x WHERE x.tenant_id=p.tenant_id AND x.product_id=p.id AND x.active AND x.deleted_at IS NULL AND x.ends_at>now()
      ) boundaries
    ) promotion_boundary ON true
    WHERE j.id=$1 AND j.status='PROCESSING' AND j.provider='IFOOD' AND j.job_type IN ('CATALOG','PRICE','STOCK','FULL','CATALOG_CONFIRMATION')
      AND j.locked_by=$2 AND j.lease_until>now() AND c.active AND c.enabled AND c.deleted_at IS NULL AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      AND (j.cursor IS NULL OR m.id>j.cursor) AND length(btrim($3)) BETWEEN 8 AND 150
      AND ((j.job_type='CATALOG_CONFIRMATION' AND c.catalog_profile='RESTAURANT' AND m.publication_status='RECEIVED' AND m.partner_operation_id IS NOT NULL AND m.partner_confirmation_due_at<=now()) OR (j.job_type<>'CATALOG_CONFIRMATION' AND ((c.catalog_profile='GROCERY' AND j.job_type IN ('CATALOG','FULL')) OR (j.job_type IN ('PRICE','FULL','CATALOG') AND m.sync_price) OR (j.job_type IN ('STOCK','FULL','CATALOG') AND m.sync_stock))))
      AND (NOT p.bundle_product OR COALESCE(bundle_stock.component_count,0)>0)
    ORDER BY m.id LIMIT 101
  """,params:[$jobId,$workerId,$requestKey])
}

query SalesChannelOrdersV2($filters: Any!, $sortField: String!, $sortDirection: String!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), f AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) value), base AS (
      SELECT o.*,c.provider,c.catalog_profile,c.display_name connection_name,c.authorization_status,b.name branch_name
      FROM sales_channel_orders o JOIN actor a ON a.tenant_id=o.tenant_id CROSS JOIN f
      JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
      JOIN branches b ON b.id=o.branch_id AND b.tenant_id=o.tenant_id
      WHERE (COALESCE(f.value->>'term','')='' OR o.display_code ILIKE '%'||(f.value->>'term')||'%' OR o.provider_order_id ILIKE '%'||(f.value->>'term')||'%' OR COALESCE(o.customer_name,'') ILIKE '%'||(f.value->>'term')||'%')
        AND (COALESCE(f.value->>'provider','')='' OR c.provider=f.value->>'provider')
        AND (COALESCE(f.value->>'branchId','')='' OR o.branch_id=(f.value->>'branchId')::uuid)
        AND (COALESCE(f.value->>'dateFrom','')='' OR o.received_at >= (f.value->>'dateFrom')::date)
        AND (COALESCE(f.value->>'dateTo','')='' OR o.received_at < (f.value->>'dateTo')::date+interval '1 day')
    ), eligible AS (SELECT * FROM base,f WHERE COALESCE(f.value->>'status','')=''
      OR base.status=f.value->>'status'
      OR (f.value->>'status'='ATTENTION' AND (attention_type IS NOT NULL OR command_status IN ('ERROR','RECONCILIATION_REQUIRED') OR commerce_status IN ('BLOCKED_MAPPING','BLOCKED_PAYMENT','RESERVED_WITH_SHORTAGE') OR base.status IN ('REJECTED','CANCELLED')))), page AS (
      SELECT * FROM eligible ORDER BY
        CASE WHEN $4='asc' AND $3='displayCode' THEN lower(display_code) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='displayCode' THEN lower(display_code) END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='provider' THEN lower(provider) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='provider' THEN lower(provider) END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='receivedAt' THEN received_at END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='receivedAt' THEN received_at END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='customerName' THEN lower(customer_name) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='customerName' THEN lower(customer_name) END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='branchName' THEN lower(branch_name) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='branchName' THEN lower(branch_name) END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='totalCents' THEN total_cents END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='totalCents' THEN total_cents END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3='status' THEN lower(status) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='status' THEN lower(status) END DESC NULLS LAST,
        CASE WHEN $3='' OR $4='' THEN received_at END DESC,id DESC
      LIMIT LEAST(GREATEST($5,1),100) OFFSET GREATEST($6,0)
    )
    SELECT jsonb_build_object(
      'rows',COALESCE((SELECT jsonb_agg(jsonb_build_object(
        'id',o.id,'providerOrderId',o.provider_order_id,'displayCode',o.display_code,'provider',o.provider,'catalogProfile',o.catalog_profile,'connectionId',o.connection_id,'connectionName',o.connection_name,'authorizationStatus',o.authorization_status,
        'branchId',o.branch_id,'branchName',o.branch_name,'customerName',o.customer_name,'orderType',o.order_type,'paymentMethod',o.payment_method,'deliveryProvider',o.delivery_provider,'deliveryAddress',o.delivery_address,'notes',o.notes,
        'subtotalCents',o.subtotal_cents::text,'deliveryFeeCents',o.delivery_fee_cents::text,'discountCents',o.discount_cents::text,'additionalFeeCents',o.additional_fee_cents::text,'prepaidCents',o.prepaid_cents::text,'pendingPaymentCents',o.pending_payment_cents::text,'merchantDiscountCents',o.merchant_discount_cents::text,'ifoodDiscountCents',o.ifood_discount_cents::text,'providerFeeCents',o.provider_fee_cents::text,'netAmountCents',o.net_amount_cents::text,'paymentIntegrityStatus',o.payment_integrity_status,'totalCents',o.total_cents::text,'status',o.status,'partnerStatus',o.partner_status,'attentionType',o.attention_type,'attentionDeadlineAt',o.attention_deadline_at,
        'pendingAction',o.pending_action,'commandStatus',o.command_status,'commerceStatus',o.commerce_status,'commerceError',o.commerce_error,'stockReservationStatus',o.stock_reservation_status,'saleId',o.sale_id,
        'grocerySeparationStarted',EXISTS(SELECT 1 FROM sales_channel_commands started WHERE started.order_id=o.id AND started.tenant_id=o.tenant_id AND started.action='ACCEPT' AND started.status='CONFIRMED'),
        'lastPartnerRequestId',o.last_partner_request_id,'receivedAt',o.received_at,'scheduledAt',o.scheduled_at,'preparationStartAt',o.preparation_start_at,'acceptedAt',o.accepted_at,'rejectedAt',o.rejected_at,'completedAt',o.completed_at,'statusUpdatedAt',o.status_updated_at,'rejectionReason',o.rejection_reason,'version',o.version) || jsonb_build_object(
        'items',COALESCE((SELECT jsonb_agg(jsonb_build_object(
          'id',i.id,'productId',i.product_id,'productName',p.name,'bundleProduct',COALESCE(p.bundle_product,false),'productUsable',COALESCE(p.active AND p.deleted_at IS NULL AND (NOT p.bundle_product OR (COALESCE(bundle_stock.component_count,0)>0 AND NOT bundle_stock.invalid_component)),false),'mappingStatus',i.mapping_status,'externalItemId',i.external_item_id,'externalProductId',i.external_product_id,'ean',i.ean,'name',i.name,'quantity',i.quantity,
          'unitPriceCents',i.unit_price_cents::text,'totalCents',i.total_cents::text,'observation',i.observation,'allowNegativeStock',COALESCE(p.allow_negative_stock,false),
          'physicalStock',CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.physical,0) ELSE COALESCE(sb.quantity,0) END,
          'reservedStock',CASE WHEN p.bundle_product THEN GREATEST(COALESCE(bundle_stock.physical,0)-COALESCE(bundle_stock.available,0),0) ELSE COALESCE(r.quantity,0) END,
          'availableStock',CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.available,0) ELSE COALESCE(sb.quantity,0)-COALESCE(r.quantity,0) END
        ) ORDER BY i.created_at)
        FROM sales_channel_order_items i
        LEFT JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
        LEFT JOIN stock_balances sb ON sb.tenant_id=i.tenant_id AND sb.branch_id=o.branch_id AND sb.product_id=i.product_id
        LEFT JOIN LATERAL (SELECT COALESCE(sum(res.quantity),0) quantity FROM sales_channel_stock_reservations res WHERE res.tenant_id=i.tenant_id AND res.branch_id=o.branch_id AND res.product_id=i.product_id AND res.status='RESERVED') r ON true
        LEFT JOIN LATERAL (
          SELECT count(*) FILTER(WHERE pc.quantity>0 AND component.active AND component.deleted_at IS NULL)::int component_count,
            bool_or(pc.quantity<=0 OR component.id IS NULL OR NOT COALESCE(component.active,false) OR component.deleted_at IS NOT NULL) invalid_component,
            floor(min(GREATEST(COALESCE(component_balance.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) physical,
            floor(min(GREATEST(COALESCE(component_balance.quantity,0)-COALESCE(component_reserved.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) available
          FROM product_components pc LEFT JOIN products component ON component.id=pc.component_product_id AND component.tenant_id=pc.tenant_id
          LEFT JOIN stock_balances component_balance ON component_balance.tenant_id=pc.tenant_id AND component_balance.branch_id=o.branch_id AND component_balance.product_id=pc.component_product_id
          LEFT JOIN LATERAL (SELECT COALESCE(sum(res.quantity),0) quantity FROM sales_channel_stock_reservations res WHERE res.tenant_id=pc.tenant_id AND res.branch_id=o.branch_id AND res.product_id=pc.component_product_id AND res.status='RESERVED') component_reserved ON true
          WHERE pc.tenant_id=p.tenant_id AND pc.parent_product_id=p.id
        ) bundle_stock ON p.bundle_product
        WHERE i.order_id=o.id AND i.tenant_id=o.tenant_id),'[]'::jsonb),
        'payments','[]'::jsonb,'adjustments','[]'::jsonb,'financialEntries','[]'::jsonb,'history','[]'::jsonb,'detailsLoaded',false
      ) ORDER BY array_position(ARRAY(SELECT id FROM page),o.id)) FROM page o),'[]'::jsonb),
      'total',(SELECT count(*) FROM eligible),
      'summary',jsonb_build_object('pending',(SELECT count(*) FROM base WHERE status='PENDING'),'accepted',(SELECT count(*) FROM base WHERE status='ACCEPTED'),'completed',(SELECT count(*) FROM base WHERE status='COMPLETED'),'attention',(SELECT count(*) FROM base WHERE attention_type IS NOT NULL OR command_status IN ('ERROR','RECONCILIATION_REQUIRED') OR commerce_status IN ('BLOCKED_MAPPING','BLOCKED_PAYMENT','RESERVED_WITH_SHORTAGE') OR status IN ('REJECTED','CANCELLED')))
    ) data FROM actor WHERE $7<>''
  """,params:[{_expr:"auth.uid"},$filters,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query SalesChannelOrderDetails($id: UUID!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND COALESCE(up.can_access,rp.can_access,false)
    ), target AS (
      SELECT o.* FROM sales_channel_orders o JOIN actor a ON a.tenant_id=o.tenant_id
      WHERE o.id=$2 AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=o.tenant_id AND ub.branch_id=o.branch_id AND ub.active))
    )
    SELECT jsonb_build_object('id',o.id,'detailsLoaded',true,
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',payment.id,'method',payment.method,'paymentType',payment.payment_type,'cardBrand',payment.card_brand,'walletName',payment.wallet_name,'currency',payment.currency,'prepaid',payment.prepaid,'amountCents',payment.amount_cents::text,'changeForCents',payment.change_for_cents::text,'sequence',payment.sequence) ORDER BY payment.sequence,payment.id) FROM sales_channel_order_payments payment WHERE payment.order_id=o.id AND payment.tenant_id=o.tenant_id),'[]'::jsonb),
      'adjustments',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',adjustment.id,'kind',adjustment.kind,'target',adjustment.target,'targetId',adjustment.target_id,'liableParty',adjustment.liable_party,'description',adjustment.description,'amountCents',adjustment.amount_cents::text) ORDER BY adjustment.created_at,adjustment.id) FROM sales_channel_order_adjustments adjustment WHERE adjustment.order_id=o.id AND adjustment.tenant_id=o.tenant_id),'[]'::jsonb),
      'financialEntries',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',financial.id,'name',financial.name,'description',financial.description,'classification',financial.classification,'amountCents',financial.amount_cents::text,'hasTransferImpact',financial.has_transfer_impact,'competence',financial.competence,'occurredAt',financial.occurred_at) ORDER BY financial.occurred_at DESC,financial.id) FROM (SELECT entry.* FROM sales_channel_financial_entries entry WHERE entry.order_id=o.id AND entry.tenant_id=o.tenant_id ORDER BY entry.occurred_at DESC,entry.id LIMIT 100) financial),'[]'::jsonb),
      'history',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',history.id,'fromStatus',history.from_status,'toStatus',history.to_status,'providerStatus',history.provider_status,'origin',history.origin,'reason',history.reason,'createdAt',history.created_at) ORDER BY history.created_at DESC) FROM (SELECT h.* FROM sales_channel_status_history h WHERE h.order_id=o.id AND h.tenant_id=o.tenant_id ORDER BY h.created_at DESC LIMIT 100) history),'[]'::jsonb)
    ) data FROM target o WHERE $3<>''
  """,params:[{_expr:"auth.uid"},$id,$requestKey])
}

query SalesChannelWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id, u.tenant_id
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL
        AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=b.tenant_id AND ub.branch_id=b.id AND ub.active)) WHERE b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'connections',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'provider',c.provider,'displayName',c.display_name,'externalStoreId',c.external_store_id,'branchId',c.branch_id,'branchName',b.name,'status',c.status,'enabled',c.enabled,'lastSyncedAt',c.last_synced_at,'lastError',c.last_error,'active',c.active,'createdAt',c.created_at,'updatedAt',c.updated_at) ORDER BY lower(c.provider),lower(c.display_name)) FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id WHERE c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL),'[]'::jsonb),
      'mappings',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',m.id,'connectionId',m.connection_id,'productId',m.product_id,'productName',p.name,'internalCode',p.internal_code,'externalProductId',m.external_product_id,'externalProductName',m.external_product_name,'syncPrice',m.sync_price,'syncStock',m.sync_stock,'enabled',m.enabled,'status',m.status) ORDER BY lower(p.name)) FROM sales_channel_product_mappings m JOIN actor a ON a.tenant_id=m.tenant_id JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id JOIN sales_channel_connections c ON c.id=m.connection_id AND c.tenant_id=m.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) WHERE m.active AND m.deleted_at IS NULL),'[]'::jsonb)
    ) AS data
    FROM actor
    WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query SalesChannelOrders($term: String!, $status: String!, $provider: String!, $branchId: UUID, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), eligible AS (
      SELECT o.*,c.provider,b.name branch_name FROM sales_channel_orders o
      JOIN actor a ON a.tenant_id=o.tenant_id
      JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
      JOIN branches b ON b.id=o.branch_id AND b.tenant_id=o.tenant_id
      WHERE ($2='' OR o.display_code ILIKE '%'||$2||'%' OR COALESCE(o.customer_name,'') ILIKE '%'||$2||'%')
        AND ($3='' OR o.status=$3) AND ($4='' OR c.provider=$4) AND ($5::uuid IS NULL OR o.branch_id=$5)
    ), page AS (SELECT * FROM eligible ORDER BY received_at DESC,id DESC LIMIT LEAST(GREATEST($6,1),100) OFFSET GREATEST($7,0))
    SELECT jsonb_build_object(
      'rows',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',o.id,'providerOrderId',o.provider_order_id,'displayCode',o.display_code,'provider',o.provider,'branchId',o.branch_id,'branchName',o.branch_name,'customerName',o.customer_name,'orderType',o.order_type,'paymentMethod',o.payment_method,'deliveryAddress',o.delivery_address,'notes',o.notes,'subtotalCents',o.subtotal_cents::text,'deliveryFeeCents',o.delivery_fee_cents::text,'discountCents',o.discount_cents::text,'totalCents',o.total_cents::text,'status',o.status,'receivedAt',o.received_at,'acceptedAt',o.accepted_at,'rejectedAt',o.rejected_at,'completedAt',o.completed_at,'rejectionReason',o.rejection_reason,'version',o.version,'items',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',i.id,'name',i.name,'quantity',i.quantity,'unitPriceCents',i.unit_price_cents::text,'totalCents',i.total_cents::text,'observation',i.observation) ORDER BY i.created_at) FROM sales_channel_order_items i WHERE i.order_id=o.id AND i.tenant_id=o.tenant_id),'[]'::jsonb)) ORDER BY o.received_at DESC,o.id DESC) FROM page o),'[]'::jsonb),
      'total',(SELECT count(*) FROM eligible),
      'pending',(SELECT count(*) FROM eligible WHERE status='PENDING')
    ) data FROM actor WHERE $8<>''
  """,params:[{_expr:"auth.uid"},$term,$status,$provider,$branchId,$limit,$offset,$requestKey])
}

query LatestPendingSalesChannelOrder($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_update,rp.can_update,false)), eligible AS (
      SELECT o.*,c.provider,c.catalog_profile,c.authorization_status,b.name branch_name,a.id actor_id
      FROM sales_channel_orders o JOIN actor a ON a.tenant_id=o.tenant_id JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED' JOIN branches b ON b.id=o.branch_id AND b.tenant_id=o.tenant_id
    ), pending AS (
      SELECT e.*,'RECEPTION' alert_kind,0 alert_priority FROM eligible e
      WHERE e.status='PENDING' AND e.command_status='IDLE' AND NOT EXISTS(SELECT 1 FROM sales_channel_order_alert_acknowledgments ack WHERE ack.order_id=e.id AND ack.user_id=e.actor_id AND ack.tenant_id=e.tenant_id AND ack.order_version=e.version AND ack.reception_acknowledged_at IS NOT NULL)
      UNION ALL
      SELECT e.*,'PREPARATION' alert_kind,1 alert_priority FROM eligible e
      WHERE e.status='ACCEPTED' AND e.scheduled_at IS NOT NULL AND e.preparation_start_at IS NOT NULL AND e.preparation_start_at<=now() AND NOT EXISTS(SELECT 1 FROM sales_channel_order_alert_acknowledgments ack WHERE ack.order_id=e.id AND ack.user_id=e.actor_id AND ack.tenant_id=e.tenant_id AND ack.order_version=e.version AND ack.preparation_acknowledged_at IS NOT NULL)
      ORDER BY alert_priority,received_at,id LIMIT 5
    )
    SELECT jsonb_build_object('orders',COALESCE(jsonb_agg(jsonb_build_object('id',o.id,'alertKind',o.alert_kind,'displayCode',o.display_code,'provider',o.provider,'catalogProfile',o.catalog_profile,'authorizationStatus',o.authorization_status,'branchName',o.branch_name,'customerName',o.customer_name,'totalCents',o.total_cents::text,'receivedAt',o.received_at,'scheduledAt',o.scheduled_at,'preparationStartAt',o.preparation_start_at,'version',o.version,'items',COALESCE((SELECT jsonb_agg(jsonb_build_object(
      'name',i.name,'quantity',i.quantity,'observation',i.observation,'productId',i.product_id,'productName',p.name,
      'bundleProduct',COALESCE(p.bundle_product,false),'productUsable',COALESCE(p.active AND p.deleted_at IS NULL AND (NOT p.bundle_product OR (COALESCE(bundle_stock.component_count,0)>0 AND NOT bundle_stock.invalid_component)),false),'allowNegativeStock',COALESCE(p.allow_negative_stock,false),
      'availableStock',CASE WHEN p.bundle_product THEN COALESCE(bundle_stock.available,0) ELSE COALESCE(sb.quantity,0)-COALESCE(r.quantity,0) END
    ) ORDER BY i.created_at)
    FROM sales_channel_order_items i
    LEFT JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
    LEFT JOIN stock_balances sb ON sb.tenant_id=i.tenant_id AND sb.branch_id=o.branch_id AND sb.product_id=i.product_id
    LEFT JOIN LATERAL (SELECT COALESCE(sum(res.quantity),0) quantity FROM sales_channel_stock_reservations res WHERE res.tenant_id=i.tenant_id AND res.branch_id=o.branch_id AND res.product_id=i.product_id AND res.status='RESERVED') r ON true
    LEFT JOIN LATERAL (
      SELECT count(*) FILTER(WHERE pc.quantity>0 AND component.active AND component.deleted_at IS NULL)::int component_count,
        bool_or(pc.quantity<=0 OR component.id IS NULL OR NOT COALESCE(component.active,false) OR component.deleted_at IS NOT NULL) invalid_component,
        floor(min(GREATEST(COALESCE(component_balance.quantity,0)-COALESCE(component_reserved.quantity,0),0)/NULLIF(pc.quantity,0)))::numeric(18,3) available
      FROM product_components pc LEFT JOIN products component ON component.id=pc.component_product_id AND component.tenant_id=pc.tenant_id
      LEFT JOIN stock_balances component_balance ON component_balance.tenant_id=pc.tenant_id AND component_balance.branch_id=o.branch_id AND component_balance.product_id=pc.component_product_id
      LEFT JOIN LATERAL (SELECT COALESCE(sum(res.quantity),0) quantity FROM sales_channel_stock_reservations res WHERE res.tenant_id=pc.tenant_id AND res.branch_id=o.branch_id AND res.product_id=pc.component_product_id AND res.status='RESERVED') component_reserved ON true
      WHERE pc.tenant_id=p.tenant_id AND pc.parent_product_id=p.id
    ) bundle_stock ON p.bundle_product
    WHERE i.order_id=o.id AND i.tenant_id=o.tenant_id),'[]'::jsonb)) ORDER BY o.alert_priority,o.received_at,o.id),'[]'::jsonb)) data FROM pending o WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

# Sales workstation bootstrap. Authorization and tenant scope are derived from auth.uid.
query SalesWorkspace($branchId: UUID, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), reserved_stock AS (
      SELECT r.tenant_id,r.branch_id,r.product_id,sum(r.quantity)::numeric(18,3) quantity
      FROM sales_channel_stock_reservations r JOIN actor a ON a.tenant_id=r.tenant_id
      WHERE r.status='RESERVED' GROUP BY r.tenant_id,r.branch_id,r.product_id
    )
    SELECT jsonb_build_object(
      'tenant',(SELECT jsonb_build_object('legalName',t.legal_name,'tradeName',t.trade_name,'document',t.document,'email',t.email,'phone',t.phone) FROM tenants t,actor a WHERE t.id=a.tenant_id LIMIT 1),
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name,'internalCode',b.internal_code,'postalCode',b.postal_code,'stateCode',b.state_code,'city',b.city,'district',b.district,'street',b.street,'streetNumber',b.street_number,'addressComplement',b.address_complement,'phone',b.phone) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'customers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name,'cpf',c.cpf,'email',c.email,'phone',c.phone_primary) ORDER BY lower(c.name)) FROM customers c,actor a WHERE c.tenant_id=a.tenant_id AND c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'paymentMethods',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'code',p.code,'name',p.name,'requiresChange',p.requires_change) ORDER BY lower(p.name)) FROM payment_methods p,actor a WHERE p.tenant_id=a.tenant_id AND p.active AND p.code<>'IFOOD_CHANNEL'),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean,'weightedProduct',p.weighted_product,'bundleProduct',p.bundle_product,'allowNegativeStock',p.allow_negative_stock,'listPriceCents',p.sale_price_cents,'effectivePriceCents',COALESCE(pr.promotional_price_cents,p.sale_price_cents),'costPriceCents',p.cost_price_cents,'physicalStock',COALESCE(sb.quantity,0),'reservedStock',COALESCE(rs.quantity,0),'stock',GREATEST(COALESCE(sb.quantity,0)-COALESCE(rs.quantity,0),0),'stockByBranches',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',br.id,'branchName',br.name,'physicalQuantity',COALESCE(all_sb.quantity,0),'reservedQuantity',COALESCE(all_rs.quantity,0),'quantity',GREATEST(COALESCE(all_sb.quantity,0)-COALESCE(all_rs.quantity,0),0)) ORDER BY lower(br.name)) FROM branches br LEFT JOIN stock_balances all_sb ON all_sb.tenant_id=br.tenant_id AND all_sb.branch_id=br.id AND all_sb.product_id=p.id LEFT JOIN reserved_stock all_rs ON all_rs.tenant_id=br.tenant_id AND all_rs.branch_id=br.id AND all_rs.product_id=p.id WHERE br.tenant_id=p.tenant_id AND br.active AND br.deleted_at IS NULL),'[]'::jsonb)) ORDER BY lower(p.name))
        FROM products p CROSS JOIN actor a
        LEFT JOIN LATERAL (SELECT x.promotional_price_cents FROM promotions x WHERE x.tenant_id=p.tenant_id AND x.product_id=p.id AND x.active AND x.deleted_at IS NULL AND now()>=x.starts_at AND now()<x.ends_at ORDER BY x.promotional_price_cents,x.id LIMIT 1) pr ON true
        LEFT JOIN stock_balances sb ON sb.tenant_id=p.tenant_id AND sb.product_id=p.id AND sb.branch_id=$2
        LEFT JOIN reserved_stock rs ON rs.tenant_id=p.tenant_id AND rs.product_id=p.id AND rs.branch_id=$2
        WHERE p.tenant_id=a.tenant_id AND p.active AND p.deleted_at IS NULL),'[]'::jsonb),
      'openSession',COALESCE((SELECT jsonb_build_object('id',cs.id,'openedAt',cs.opened_at,'openingAmountCents',cs.opening_amount_cents,'expectedAmountCents',cs.opening_amount_cents+COALESCE((SELECT sum(cm.amount_cents) FROM cash_movements cm WHERE cm.session_id=cs.id AND cm.movement_type<>'OPENING'),0),'movementCount',(SELECT count(*) FROM cash_movements cm WHERE cm.session_id=cs.id AND cm.movement_type<>'OPENING')) FROM cash_sessions cs,actor a WHERE cs.tenant_id=a.tenant_id AND cs.branch_id=$2 AND cs.status='OPEN' ORDER BY cs.opened_at DESC LIMIT 1),'null'::jsonb)
    ) AS data
    WHERE $3<>''
  """,params:[{_expr:"auth.uid"},$branchId,$requestKey])
}

query ListSales($filters: Any!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='GESTAO_VENDAS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ),f AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j)
    SELECT s.id,s.client_operation_id AS "clientOperationId",COALESCE(s.source,'POS') AS source,s.external_reference AS "externalReference",channel_order.id AS "channelOrderId",s.status,s.subtotal_cents AS "subtotalCents",s.discount_cents AS "discountCents",s.surcharge_cents AS "surchargeCents",s.total_cents AS "totalCents",s.change_cents AS "changeCents",s.sold_at AS "soldAt",s.cancelled_at AS "cancelledAt",s.cancellation_reason AS "cancellationReason",s.created_by_uid AS "createdByUid",b.id AS "branchId",b.name AS "branchName",c.id AS "customerId",COALESCE(c.name,'CONSUMIDOR FINAL') AS "customerName",COUNT(DISTINCT si.id) FILTER(WHERE si.status='ACTIVE') AS "itemCount",COALESCE(string_agg(DISTINCT pm.name,', '),'') AS "paymentMethods"
    FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN branches b ON b.id=s.branch_id AND b.tenant_id=s.tenant_id
    CROSS JOIN f LEFT JOIN customers c ON c.id=s.customer_id AND c.tenant_id=s.tenant_id
    LEFT JOIN sales_channel_orders channel_order ON channel_order.sale_id=s.id AND channel_order.tenant_id=s.tenant_id
    LEFT JOIN sale_items si ON si.sale_id=s.id AND si.tenant_id=s.tenant_id LEFT JOIN sale_payments sp ON sp.sale_id=s.id AND sp.tenant_id=s.tenant_id AND sp.status='CONFIRMED' LEFT JOIN payment_methods pm ON pm.id=sp.payment_method_id
    WHERE ($5<>'' )
      AND (COALESCE(f.j->>'search','')='' OR s.id::text ILIKE '%'||(f.j->>'search')||'%' OR COALESCE(c.name,'') ILIKE '%'||(f.j->>'search')||'%' OR COALESCE(s.external_reference,'') ILIKE '%'||(f.j->>'search')||'%')
      AND (NOT(f.j?'branchIds') OR s.branch_id IN(SELECT value::uuid FROM jsonb_array_elements_text(f.j->'branchIds')))
      AND (NOT(f.j?'customerIds') OR s.customer_id IN(SELECT value::uuid FROM jsonb_array_elements_text(f.j->'customerIds')))
      AND (NOT(f.j?'statuses') OR s.status IN(SELECT value FROM jsonb_array_elements_text(f.j->'statuses')))
      AND (COALESCE(f.j->>'source','')='' OR COALESCE(s.source,'POS')=upper(f.j->>'source'))
      AND (COALESCE(f.j->>'dateFrom','')='' OR s.sold_at >= (f.j->>'dateFrom')::date)
      AND (COALESCE(f.j->>'dateTo','')='' OR s.sold_at < (f.j->>'dateTo')::date + interval '1 day')
      AND (COALESCE(f.j->>'minCents','')='' OR s.total_cents >= (f.j->>'minCents')::bigint)
      AND (COALESCE(f.j->>'maxCents','')='' OR s.total_cents <= (f.j->>'maxCents')::bigint)
    GROUP BY s.id,b.id,c.id,channel_order.id ORDER BY s.sold_at DESC,s.id DESC LIMIT $3 OFFSET $4
  """,params:[{_expr:"auth.uid"},$filters,$limit,$offset,$requestKey])
}

query SaleDetails($saleId: UUID!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='GESTAO_VENDAS' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false))
    SELECT jsonb_build_object('sale',to_jsonb(s),'branch',to_jsonb(b),'customer',to_jsonb(c),
      'items',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',i.id,'productId',i.product_id,'productName',p.name,'quantity',i.quantity,'unitListPriceCents',i.unit_list_price_cents,'unitSalePriceCents',i.unit_sale_price_cents,'unitCostCents',i.unit_cost_cents,'discountCents',i.discount_cents,'totalCents',i.total_cents) ORDER BY i.created_at) FROM sale_items i JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id WHERE i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE'),'[]'::jsonb),
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',sp.id,'paymentMethodId',sp.payment_method_id,'paymentMethodName',pm.name,'amountCents',sp.amount_cents,'sequence',sp.sequence,'externalReference',sp.external_reference) ORDER BY sp.sequence) FROM sale_payments sp JOIN payment_methods pm ON pm.id=sp.payment_method_id WHERE sp.sale_id=s.id AND sp.tenant_id=s.tenant_id AND sp.status='CONFIRMED'),'[]'::jsonb)) AS data
    FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN branches b ON b.id=s.branch_id LEFT JOIN customers c ON c.id=s.customer_id WHERE s.id=$2 AND $3<>''
  """,params:[{_expr:"auth.uid"},$saleId,$requestKey])
}


# Phase 1 operational catalogs.
# Tenant scope is always derived through auth.uid; the client cannot select it.
query ListCategories($search: String!, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      WITH base AS (SELECT
        c.id,
        c.name,
        c.active,
        c.created_at AS "createdAt",
        c.updated_at AS "updatedAt",
        COUNT(s.id) FILTER (WHERE s.active AND s.deleted_at IS NULL) AS "subcategoryCount"
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_CATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      LEFT JOIN subcategories s
        ON s.category_id = c.id
       AND s.tenant_id = c.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR c.name ILIKE '%' || $2 || '%')
        AND ($7 IS NULL OR $7 <> '')
      GROUP BY c.id
      )
      SELECT * FROM base
      ORDER BY
        CASE WHEN $4='asc' AND $3='subcategoryCount' THEN "subcategoryCount" END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3='subcategoryCount' THEN "subcategoryCount" END DESC NULLS LAST,
        CASE WHEN $4='asc' AND $3<>'subcategoryCount' THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
        CASE WHEN $4='desc' AND $3<>'subcategoryCount' THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
        CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,
        "updatedAt" DESC,id
      LIMIT $5 OFFSET $6
    """,
    params: [{_expr: "auth.uid"}, $search, $sortField, $sortDirection, $limit, $offset, $requestKey]
  )
}

query ListSubcategories($search: String!, $categoryId: UUID, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      WITH base AS (SELECT
        s.id,
        s.name,
        s.category_id AS "categoryId",
        c.name AS "categoryName",
        s.active,
        s.created_at AS "createdAt",
        s.updated_at AS "updatedAt"
      FROM subcategories s
      JOIN categories c
        ON c.id = s.category_id
       AND c.tenant_id = s.tenant_id
      JOIN users u
        ON u.tenant_id = s.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND ($2 = '' OR s.name ILIKE '%' || $2 || '%' OR c.name ILIKE '%' || $2 || '%')
        AND ($3::uuid IS NULL OR s.category_id = $3)
        AND ($8 IS NULL OR $8 <> '')
      )
      SELECT * FROM base
      ORDER BY
        CASE WHEN $5='asc' THEN lower(to_jsonb(base)->>$4) END ASC NULLS LAST,
        CASE WHEN $5='desc' THEN lower(to_jsonb(base)->>$4) END DESC NULLS LAST,
        CASE WHEN $4='' OR $5='' THEN "updatedAt" END DESC,
        "updatedAt" DESC,id
      LIMIT $6 OFFSET $7
    """,
    params: [{_expr: "auth.uid"}, $search, $categoryId, $sortField, $sortDirection, $limit, $offset, $requestKey]
  )
}

query CategoryOptions($requestKey: String) @auth(level: USER) {
  _select(
    sql: """
      SELECT c.id, c.name
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE COALESCE(up.can_access,rp.can_access,false)
        AND c.active
        AND c.deleted_at IS NULL
        AND ($2 IS NULL OR $2<>'')
      ORDER BY lower(c.name), c.id
    """,
    params: [{_expr: "auth.uid"}, $requestKey]
  )
}


query ListBranches($search: String!, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT b.id,b.name,b.internal_code AS "internalCode",b.postal_code AS "postalCode",b.state_code AS "stateCode",
      b.city,b.district,b.street,b.street_number AS "streetNumber",b.address_complement AS "addressComplement",
      b.phone,b.active,b.created_at AS "createdAt",b.updated_at AS "updatedAt"
    FROM branches b JOIN users u ON u.tenant_id=b.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FILIAL' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',b.name,b.internal_code,b.city) ILIKE '%'||$2||'%') AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query ListSuppliers($search: String!, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT s.id,s.legal_name AS "legalName",s.trade_name AS "tradeName",s.internal_code AS "internalCode",s.cpf,s.cnpj,
      s.postal_code AS "postalCode",s.state_code AS "stateCode",s.city,s.district,s.street,s.street_number AS "streetNumber",
      s.address_complement AS "addressComplement",s.contact_name AS "contactName",s.phone_primary AS "phonePrimary",
      s.phone_secondary AS "phoneSecondary",s.email,s.segment,s.payment_terms AS "paymentTerms",
      s.payment_term_days AS "paymentTermDays",s.average_delivery_days AS "averageDeliveryDays",s.notes,s.active,s.created_at AS "createdAt",s.updated_at AS "updatedAt"
    FROM suppliers s JOIN users u ON u.tenant_id=s.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_FORNECEDOR' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',s.legal_name,s.trade_name,s.internal_code,s.cpf,s.cnpj,s.segment) ILIKE '%'||$2||'%')
      AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' AND $3 IN ('paymentTermDays','averageDeliveryDays') THEN (to_jsonb(base)->>$3)::numeric END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 IN ('paymentTermDays','averageDeliveryDays') THEN (to_jsonb(base)->>$3)::numeric END DESC NULLS LAST,
      CASE WHEN $4='asc' AND $3 NOT IN ('paymentTermDays','averageDeliveryDays') THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 NOT IN ('paymentTermDays','averageDeliveryDays') THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query ListCustomers($search: String!, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT c.id,c.name,c.birth_date AS "birthDate",c.gender,c.cpf,c.cnpj,c.marketing_opt_in AS "marketingOptIn",
      c.email,c.phone_primary AS "phonePrimary",c.phone_secondary AS "phoneSecondary",c.postal_code AS "postalCode",
      c.state_code AS "stateCode",c.city,c.district,c.street,c.street_number AS "streetNumber",
      c.address_complement AS "addressComplement",c.preferences,
      c.preferences->>'lowerClothingType' AS "lowerClothingType",c.preferences->>'lowerClothingSize' AS "lowerClothingSize",
      c.preferences->>'upperClothingType' AS "upperClothingType",c.preferences->>'upperClothingSize' AS "upperClothingSize",
      c.preferences->>'shoeSize' AS "shoeSize",c.notes,c.active,c.created_at AS "createdAt",c.updated_at AS "updatedAt"
    FROM customers c JOIN users u ON u.tenant_id=c.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_CLIENTE' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false) AND ($2='' OR concat_ws(' ',c.name,c.cpf,c.cnpj,c.email,c.phone_primary) ILIKE '%'||$2||'%')
      AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query ListProducts($search: String!, $sortField: String, $sortDirection: String, $limit: Int!, $offset: Int!, $requestKey: String) @auth(level: USER) {
  _select(sql: """
    WITH base AS (SELECT p.id,p.name,p.internal_code AS "internalCode",p.ean,p.scale_code AS "scaleCode",p.image_url AS "imageUrl",p.brand,p.size_type AS "sizeType",p.size,p.color,
      p.maximum_stock AS "maximumStock",p.minimum_stock AS "minimumStock",p.sale_price_cents::text AS "salePriceCents",
      p.cost_price_cents::text AS "costPriceCents",p.weighted_product AS "weightedProduct",p.bundle_product AS "bundleProduct",
      p.allow_negative_stock AS "allowNegativeStock",p.notes,p.active,p.category_id AS "categoryId",c.name AS "categoryName",
      p.subcategory_id AS "subcategoryId",sc.name AS "subcategoryName",p.supplier_id AS "supplierId",
      COALESCE(s.trade_name,s.legal_name) AS "supplierName",p.created_at AS "createdAt",p.updated_at AS "updatedAt",
      EXISTS(SELECT 1 FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id AND pr.active
        AND pr.deleted_at IS NULL AND now()>=pr.starts_at AND now()<pr.ends_at) AS "onPromotion",
      COALESCE((SELECT pr.promotional_price_cents::text FROM promotions pr WHERE pr.product_id=p.id AND pr.tenant_id=p.tenant_id
        AND pr.active AND pr.deleted_at IS NULL AND now()>=pr.starts_at AND now()<pr.ends_at ORDER BY pr.starts_at DESC LIMIT 1),
        p.sale_price_cents::text) AS "effectivePriceCents"
    FROM products p JOIN users u ON u.tenant_id=p.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id
    LEFT JOIN subcategories sc ON sc.id=p.subcategory_id AND sc.tenant_id=p.tenant_id
    LEFT JOIN suppliers s ON s.id=p.supplier_id AND s.tenant_id=p.tenant_id
    WHERE COALESCE(up.can_access,rp.can_access,false)
      AND ($2='' OR concat_ws(' ',p.name,p.internal_code,p.ean,p.scale_code,p.brand,c.name,sc.name) ILIKE '%'||$2||'%')
      AND ($7 IS NULL OR $7<>'')
    ) SELECT * FROM base ORDER BY
      CASE WHEN $4='asc' AND $3 IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN (to_jsonb(base)->>$3)::numeric END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN (to_jsonb(base)->>$3)::numeric END DESC NULLS LAST,
      CASE WHEN $4='asc' AND $3 NOT IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN lower(to_jsonb(base)->>$3) END ASC NULLS LAST,
      CASE WHEN $4='desc' AND $3 NOT IN ('maximumStock','minimumStock','salePriceCents','costPriceCents','effectivePriceCents') THEN lower(to_jsonb(base)->>$3) END DESC NULLS LAST,
      CASE WHEN $3='' OR $4='' THEN "updatedAt" END DESC,"updatedAt" DESC,id
    LIMIT $5 OFFSET $6
  """,params:[{_expr:"auth.uid"},$search,$sortField,$sortDirection,$limit,$offset,$requestKey])
}

query RegistrationOptions($requestKey: String) @auth(level: USER) {
  _select(sql: """
    SELECT jsonb_build_object(
      'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name) ORDER BY lower(c.name))
        FROM categories c WHERE c.tenant_id=u.tenant_id AND c.active AND c.deleted_at IS NULL),'[]'::jsonb),
      'subcategories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',s.name,'categoryId',s.category_id) ORDER BY lower(s.name))
        FROM subcategories s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name)))
        FROM suppliers s WHERE s.tenant_id=u.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'costPriceCents',p.cost_price_cents::text) ORDER BY lower(p.name))
        FROM products p WHERE p.tenant_id=u.tenant_id AND p.active AND p.deleted_at IS NULL AND NOT p.bundle_product),'[]'::jsonb)
    ) AS data FROM users u
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND COALESCE(up.can_access,rp.can_access,false) AND ($2 IS NULL OR $2<>'')
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query ProductComponents($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pc.component_product_id AS "productId",p.name,pc.quantity,pc.allocated_unit_price_cents::text AS "allocatedUnitPriceCents"
    FROM product_components pc JOIN users u ON u.tenant_id=pc.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    JOIN products p ON p.id=pc.component_product_id AND p.tenant_id=pc.tenant_id
    WHERE pc.parent_product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY lower(p.name)
  """,params:[{_expr:"auth.uid"},$productId])
}

query ProductPromotions($productId: UUID!) @auth(level: USER) {
  _select(sql: """
    SELECT pr.id,pr.promotional_price_cents::text AS "promotionalPriceCents",pr.starts_at AS "startsAt",
      pr.ends_at AS "endsAt",pr.active,pr.created_at AS "createdAt",pr.updated_at AS "updatedAt",
      CASE WHEN NOT pr.active THEN 'INACTIVE' WHEN now()<pr.starts_at THEN 'SCHEDULED'
        WHEN now()>=pr.ends_at THEN 'ENDED' ELSE 'ACTIVE' END AS status
    FROM promotions pr JOIN users u ON u.tenant_id=pr.tenant_id AND u.id=$1 AND u.active AND u.deleted_at IS NULL
    JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
    WHERE pr.product_id=$2 AND COALESCE(up.can_access,rp.can_access,false) ORDER BY pr.starts_at DESC
  """,params:[{_expr:"auth.uid"},$productId])
}

# Data Dazzle control plane. Every dataset requires the active platform system role.
query PlatformAdminWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants own_tenant ON own_tenant.id=u.tenant_id AND own_tenant.active AND own_tenant.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND r.active AND r.deleted_at IS NULL AND r.system_role
        AND r.name='Administrador da Plataforma'
    )
    SELECT jsonb_build_object(
      'tenants',COALESCE((
        SELECT jsonb_agg(jsonb_build_object(
          'id',t.id,'legalName',t.legal_name,'tradeName',t.trade_name,
          'document',t.document,'email',t.email,'phone',t.phone,
          'planCode',t.plan_code,'startsOn',t.starts_on,'expiresOn',t.expires_on,
          'active',t.active,
          'userCount',(SELECT count(*) FROM users u WHERE u.tenant_id=t.id AND u.deleted_at IS NULL),
          'branchCount',(SELECT count(*) FROM branches b WHERE b.tenant_id=t.id AND b.deleted_at IS NULL),
          'billingProfileConfigured',(bp.tenant_id IS NOT NULL),
          'responsibleName',bp.responsible_name,'responsibleRole',bp.responsible_role,
          'responsibleEmail',bp.responsible_email,'responsiblePhone',bp.responsible_phone,
          'billingEmail',bp.billing_email,'billingPhone',bp.billing_phone,
          'communicationChannel',bp.communication_channel,
          'allowEmailBilling',COALESCE(bp.allow_email_billing,true),
          'allowWhatsappBilling',COALESCE(bp.allow_whatsapp_billing,false),
          'communicationConsentSource',bp.communication_consent_source,
          'communicationConsentAt',bp.communication_consent_at,
          'monthlyAmountCents',COALESCE(bp.monthly_amount_cents,0)::text,
          'billingDay',COALESCE(bp.billing_day,10),
          'graceDays',COALESCE(bp.grace_days,3),
          'suspendAfterDays',COALESCE(bp.suspend_after_days,7),
          'preferredPaymentMethod',COALESCE(bp.preferred_payment_method,'PIX'),
          'nextDueDate',bp.next_due_date,'billingNotes',bp.notes,
          'openBalanceCents',COALESCE((SELECT sum(GREATEST(i.total_cents-i.paid_cents,0)) FROM tenant_invoices i WHERE i.tenant_id=t.id AND i.deleted_at IS NULL AND i.status<>'VOID'),0)::text,
          'overdueCount',(SELECT count(*) FROM tenant_invoices i WHERE i.tenant_id=t.id AND i.deleted_at IS NULL AND i.status<>'VOID' AND i.paid_cents<i.total_cents AND i.due_date<current_date)
        ) ORDER BY lower(COALESCE(t.trade_name,t.legal_name)))
        FROM tenants t
        LEFT JOIN tenant_billing_profiles bp ON bp.tenant_id=t.id
        CROSS JOIN actor a
        WHERE t.deleted_at IS NULL
      ),'[]'::jsonb),
      'roles',COALESCE((
        SELECT jsonb_agg(jsonb_build_object('id',r.id,'tenantId',r.tenant_id,
          'tenantName',COALESCE(t.trade_name,t.legal_name),'name',r.name,'active',r.active)
          ORDER BY lower(COALESCE(t.trade_name,t.legal_name)),lower(r.name))
        FROM roles r JOIN tenants t ON t.id=r.tenant_id CROSS JOIN actor a
        WHERE r.deleted_at IS NULL
      ),'[]'::jsonb),
      'users',COALESCE((
        SELECT jsonb_agg(jsonb_build_object('id',u.id,'tenantId',u.tenant_id,
          'tenantName',COALESCE(t.trade_name,t.legal_name),'roleId',u.role_id,
          'roleName',r.name,'name',u.name,'email',u.email,'active',u.active,
          'onboardingPending',u.onboarding_pending,'lastLoginAt',u.last_login_at)
          ORDER BY lower(u.name))
        FROM users u JOIN tenants t ON t.id=u.tenant_id JOIN roles r ON r.id=u.role_id
        CROSS JOIN actor a WHERE u.deleted_at IS NULL
      ),'[]'::jsonb),
      'pages',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'pageKey',p.page_key,
        'displayName',p.display_name,'module',p.module) ORDER BY p.module,p.display_order)
        FROM app_pages p WHERE p.active),'[]'::jsonb),
      'permissions',COALESCE((SELECT jsonb_agg(jsonb_build_object('roleId',rp.role_id,
        'pageId',rp.page_id,'canAccess',rp.can_access,'canCreate',rp.can_create,
        'canUpdate',rp.can_update,'canDelete',rp.can_delete,'canExport',rp.can_export,
        'canManage',rp.can_manage)) FROM role_page_permissions rp CROSS JOIN actor a),'[]'::jsonb)
    ) AS data FROM actor WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

# Compatibility operation for clients published before server-side sorting.
query PlatformBillingWorkspace(
  $term: String!
  $status: String!
  $tenantId: UUID
  $dueFrom: Date
  $dueTo: Date
  $limit: Int!
  $offset: Int!
  $requestKey: String!
) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id FROM users u
      JOIN tenants own_tenant ON own_tenant.id=u.tenant_id AND own_tenant.active AND own_tenant.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND r.active AND r.deleted_at IS NULL AND r.system_role
        AND r.name='Administrador da Plataforma'
    ), base AS (
      SELECT i.*,COALESCE(t.trade_name,t.legal_name) tenant_name,
        CASE WHEN i.status='VOID' THEN 'VOID'
             WHEN i.paid_cents>=i.total_cents THEN 'PAID'
             WHEN i.due_date<current_date THEN 'OVERDUE'
             WHEN i.paid_cents>0 THEN 'PARTIALLY_PAID'
             ELSE 'OPEN' END effective_status
      FROM tenant_invoices i JOIN tenants t ON t.id=i.tenant_id
      CROSS JOIN actor a WHERE i.deleted_at IS NULL
    ), filtered AS (
      SELECT * FROM base b WHERE
        ($2='' OR lower(concat_ws(' ',b.tenant_name,b.description,b.billing_key,b.external_charge_id)) LIKE '%'||lower($2)||'%')
        AND ($3='' OR b.effective_status=$3)
        AND ($4 IS NULL OR b.tenant_id=$4)
        AND ($5 IS NULL OR b.due_date>=$5)
        AND ($6 IS NULL OR b.due_date<=$6)
    ), paged AS (
      SELECT * FROM filtered ORDER BY due_date DESC,created_at DESC LIMIT LEAST(GREATEST($7,1),100) OFFSET GREATEST($8,0)
    ), summary AS (
      SELECT
        COALESCE(sum(GREATEST(total_cents-paid_cents,0)) FILTER(WHERE status<>'VOID'),0)::bigint receivable,
        COALESCE(sum(GREATEST(total_cents-paid_cents,0)) FILTER(WHERE status<>'VOID' AND paid_cents<total_cents AND due_date<current_date),0)::bigint overdue,
        (count(DISTINCT tenant_id) FILTER(WHERE status<>'VOID' AND paid_cents<total_cents AND due_date<current_date))::int overdue_tenants
      FROM base
    ), received AS (
      SELECT COALESCE(sum(p.amount_cents),0)::bigint amount FROM tenant_payments p CROSS JOIN actor a
      WHERE p.status='CONFIRMED' AND p.paid_at>=date_trunc('month',current_timestamp)
    )
    SELECT jsonb_build_object(
      'summary',(SELECT jsonb_build_object('receivableCents',receivable::text,
        'overdueCents',overdue::text,'overdueTenants',overdue_tenants,
        'receivedMonthCents',(SELECT amount::text FROM received)) FROM summary),
      'total',(SELECT count(*) FROM filtered),
      'invoices',COALESCE((SELECT jsonb_agg(jsonb_build_object(
        'id',p.id,'tenantId',p.tenant_id,'tenantName',p.tenant_name,
        'billingKey',p.billing_key,'referenceMonth',p.reference_month,
        'description',p.description,'issuedOn',p.issued_on,'dueDate',p.due_date,
        'originalAmountCents',p.original_amount_cents::text,
        'discountCents',p.discount_cents::text,'additionCents',p.addition_cents::text,
        'totalCents',p.total_cents::text,'paidCents',p.paid_cents::text,
        'remainingCents',GREATEST(p.total_cents-p.paid_cents,0)::text,
        'status',p.effective_status,'storedStatus',p.status,'provider',p.provider,
        'externalChargeId',p.external_charge_id,'paymentUrl',p.payment_url,
        'notes',p.notes,'version',p.version::text,'createdAt',p.created_at,
        'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object(
          'id',pay.id,'amountCents',pay.amount_cents::text,'paidAt',pay.paid_at,
          'method',pay.method,'provider',pay.provider,
          'transactionReference',pay.transaction_reference,'notes',pay.notes,
          'status',pay.status,'reversedAt',pay.reversed_at,
          'reversalReason',pay.reversal_reason,'createdByUid',pay.created_by_uid)
          ORDER BY pay.paid_at DESC) FROM tenant_payments pay WHERE pay.invoice_id=p.id),'[]'::jsonb)
      ) ORDER BY p.due_date DESC,p.created_at DESC) FROM paged p),'[]'::jsonb)
    ) AS data FROM actor WHERE $9<>''
  """,params:[{_expr:"auth.uid"},$term,$status,$tenantId,$dueFrom,$dueTo,$limit,$offset,$requestKey])
}

# Paginated platform receivables with safe, server-side sorting.
query PlatformBillingWorkspaceV2(
  $term: String!
  $status: String!
  $tenantId: UUID
  $dueFrom: Date
  $dueTo: Date
  $sortKey: String!
  $sortDirection: String!
  $limit: Int!
  $offset: Int!
  $requestKey: String!
) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id FROM users u
      JOIN tenants own_tenant ON own_tenant.id=u.tenant_id AND own_tenant.active AND own_tenant.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND r.active AND r.deleted_at IS NULL AND r.system_role
        AND r.name='Administrador da Plataforma'
    ), base AS (
      SELECT i.*,COALESCE(t.trade_name,t.legal_name) tenant_name,
        CASE WHEN i.status='VOID' THEN 'VOID'
             WHEN i.paid_cents>=i.total_cents THEN 'PAID'
             WHEN i.due_date<current_date THEN 'OVERDUE'
             WHEN i.paid_cents>0 THEN 'PARTIALLY_PAID'
             ELSE 'OPEN' END effective_status
      FROM tenant_invoices i JOIN tenants t ON t.id=i.tenant_id
      CROSS JOIN actor a WHERE i.deleted_at IS NULL
    ), filtered AS (
      SELECT * FROM base b WHERE
        ($2='' OR lower(concat_ws(' ',b.tenant_name,b.description,b.billing_key,b.external_charge_id)) LIKE '%'||lower($2)||'%')
        AND ($3='' OR b.effective_status=$3)
        AND ($4 IS NULL OR b.tenant_id=$4)
        AND ($5 IS NULL OR b.due_date>=$5)
        AND ($6 IS NULL OR b.due_date<=$6)
    ), ranked AS (
      SELECT filtered.*,row_number() OVER(ORDER BY
        CASE WHEN $7='tenantName' AND $8='asc' THEN lower(tenant_name) END ASC,
        CASE WHEN $7='tenantName' AND $8='desc' THEN lower(tenant_name) END DESC,
        CASE WHEN $7='referenceMonth' AND $8='asc' THEN reference_month END ASC,
        CASE WHEN $7='referenceMonth' AND $8='desc' THEN reference_month END DESC,
        CASE WHEN $7='dueDate' AND $8='asc' THEN due_date END ASC,
        CASE WHEN $7='dueDate' AND $8='desc' THEN due_date END DESC,
        CASE WHEN $7='totalCents' AND $8='asc' THEN total_cents END ASC,
        CASE WHEN $7='totalCents' AND $8='desc' THEN total_cents END DESC,
        CASE WHEN $7='paidCents' AND $8='asc' THEN paid_cents END ASC,
        CASE WHEN $7='paidCents' AND $8='desc' THEN paid_cents END DESC,
        CASE WHEN $7='remainingCents' AND $8='asc' THEN GREATEST(total_cents-paid_cents,0) END ASC,
        CASE WHEN $7='remainingCents' AND $8='desc' THEN GREATEST(total_cents-paid_cents,0) END DESC,
        CASE WHEN $7='status' AND $8='asc' THEN effective_status END ASC,
        CASE WHEN $7='status' AND $8='desc' THEN effective_status END DESC,
        due_date DESC,created_at DESC,id
      ) sort_position FROM filtered
    ), paged AS (
      SELECT * FROM ranked
      WHERE sort_position>GREATEST($10,0)
        AND sort_position<=GREATEST($10,0)+LEAST(GREATEST($9,1),100)
    ), summary AS (
      SELECT
        COALESCE(sum(GREATEST(total_cents-paid_cents,0)) FILTER(WHERE status<>'VOID'),0)::bigint receivable,
        COALESCE(sum(GREATEST(total_cents-paid_cents,0)) FILTER(WHERE status<>'VOID' AND paid_cents<total_cents AND due_date<current_date),0)::bigint overdue,
        (count(DISTINCT tenant_id) FILTER(WHERE status<>'VOID' AND paid_cents<total_cents AND due_date<current_date))::int overdue_tenants
      FROM base
    ), received AS (
      SELECT COALESCE(sum(p.amount_cents),0)::bigint amount FROM tenant_payments p CROSS JOIN actor a
      WHERE p.status='CONFIRMED' AND p.paid_at>=date_trunc('month',current_timestamp)
    )
    SELECT jsonb_build_object(
      'summary',(SELECT jsonb_build_object('receivableCents',receivable::text,
        'overdueCents',overdue::text,'overdueTenants',overdue_tenants,
        'receivedMonthCents',(SELECT amount::text FROM received)) FROM summary),
      'total',(SELECT count(*) FROM filtered),
      'invoices',COALESCE((SELECT jsonb_agg(jsonb_build_object(
        'id',p.id,'tenantId',p.tenant_id,'tenantName',p.tenant_name,
        'billingKey',p.billing_key,'referenceMonth',p.reference_month,
        'description',p.description,'issuedOn',p.issued_on,'dueDate',p.due_date,
        'originalAmountCents',p.original_amount_cents::text,
        'discountCents',p.discount_cents::text,'additionCents',p.addition_cents::text,
        'totalCents',p.total_cents::text,'paidCents',p.paid_cents::text,
        'remainingCents',GREATEST(p.total_cents-p.paid_cents,0)::text,
        'status',p.effective_status,'storedStatus',p.status,'provider',p.provider,
        'externalChargeId',p.external_charge_id,'paymentUrl',p.payment_url,
        'notes',p.notes,'version',p.version::text,'createdAt',p.created_at,
        'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object(
          'id',pay.id,'amountCents',pay.amount_cents::text,'paidAt',pay.paid_at,
          'method',pay.method,'provider',pay.provider,
          'transactionReference',pay.transaction_reference,'notes',pay.notes,
          'status',pay.status,'reversedAt',pay.reversed_at,
          'reversalReason',pay.reversal_reason,'createdByUid',pay.created_by_uid)
          ORDER BY pay.paid_at DESC) FROM tenant_payments pay WHERE pay.invoice_id=p.id),'[]'::jsonb)
      ) ORDER BY p.sort_position) FROM paged p),'[]'::jsonb)
    ) AS data FROM actor WHERE $11<>''
  """,params:[{_expr:"auth.uid"},$term,$status,$tenantId,$dueFrom,$dueTo,$sortKey,$sortDirection,$limit,$offset,$requestKey])
}

# Complete stock workspace. Tenant scope and page access are enforced in SQL.
query StockWorkspace($requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    )
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name))) FROM suppliers s,actor a WHERE s.tenant_id=a.tenant_id AND s.active AND s.deleted_at IS NULL),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name,'internalCode',p.internal_code,'ean',p.ean,'categoryName',c.name,'minimumStock',p.minimum_stock,'maximumStock',p.maximum_stock,'allowNegativeStock',p.allow_negative_stock,'costPriceCents',p.cost_price_cents::text,'balances',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',b.id,'branchName',b.name,'quantity',physical.quantity,'reservedQuantity',reserved.quantity,'availableQuantity',GREATEST(physical.quantity-reserved.quantity,0),'averageCostCents',COALESCE(sb.average_cost_cents,p.cost_price_cents)::text,'updatedAt',GREATEST(sb.updated_at,reserved.updated_at)) ORDER BY lower(b.name)) FROM branches b LEFT JOIN stock_balances sb ON sb.tenant_id=b.tenant_id AND sb.branch_id=b.id AND sb.product_id=p.id LEFT JOIN LATERAL (SELECT COALESCE(sum(CASE WHEN smt.direction='IN' THEN sm.quantity ELSE -sm.quantity END),0)::numeric(18,3) quantity FROM stock_movements sm JOIN stock_movement_types smt ON smt.id=sm.movement_type_id AND smt.tenant_id=sm.tenant_id WHERE sm.tenant_id=p.tenant_id AND sm.branch_id=b.id AND sm.product_id=p.id AND sm.status='POSTED') physical ON true LEFT JOIN LATERAL (SELECT COALESCE(sum(r.quantity),0)::numeric(18,3) quantity,max(r.updated_at) updated_at FROM sales_channel_stock_reservations r WHERE r.tenant_id=p.tenant_id AND r.branch_id=b.id AND r.product_id=p.id AND r.status='RESERVED') reserved ON true WHERE b.tenant_id=p.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb)) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id LEFT JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL AND NOT p.bundle_product),'[]'::jsonb),
      'movements',COALESCE((SELECT jsonb_agg(x ORDER BY x."occurredAt" DESC) FROM (SELECT m.id,m.client_operation_id AS "operationId",m.occurred_at AS "occurredAt",m.quantity,m.unit_cost_cents::text AS "unitCostCents",m.status,mt.code AS "typeCode",mt.name AS "typeName",mt.direction,p.id AS "productId",p.name AS "productName",b.id AS "branchId",b.name AS "branchName",m.created_by_uid AS "createdByUid" FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id AND mt.tenant_id=m.tenant_id JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id JOIN branches b ON b.id=m.branch_id AND b.tenant_id=m.tenant_id ORDER BY m.occurred_at DESC LIMIT 300) x),'[]'::jsonb),
      'transfers',COALESCE((SELECT jsonb_agg(x ORDER BY x."requestedAt" DESC) FROM (SELECT tr.id,tr.client_operation_id AS "operationId",tr.status,tr.requested_at AS "requestedAt",tr.completed_at AS "completedAt",tr.notes,s.name AS "sourceBranch",d.name AS "destinationBranch",COALESCE((SELECT sum(i.quantity) FROM stock_transfer_items i WHERE i.transfer_id=tr.id),0) AS "totalQuantity",COALESCE((SELECT count(*) FROM stock_transfer_items i WHERE i.transfer_id=tr.id),0) AS "itemCount" FROM stock_transfers tr JOIN actor a ON a.tenant_id=tr.tenant_id JOIN branches s ON s.id=tr.source_branch_id JOIN branches d ON d.id=tr.destination_branch_id ORDER BY tr.requested_at DESC LIMIT 100) x),'[]'::jsonb)
    ) AS data FROM actor WHERE $2<>''
  """,params:[{_expr:"auth.uid"},$requestKey])
}

query DailyProfitDashboard($from: Date!, $to: Date!, $branchId: UUID, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,t.timezone FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ),eligible_sales AS (
      SELECT s.*,(s.sold_at AT TIME ZONE a.timezone)::date sale_day FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2 AND $3 AND ($4 IS NULL OR s.branch_id=$4)
    ),item_cost AS (SELECT i.sale_id,COALESCE(sum(round(i.quantity*i.unit_cost_cents)),0)::bigint cost FROM sale_items i JOIN eligible_sales s ON s.id=i.sale_id WHERE i.status='ACTIVE' GROUP BY i.sale_id),
    days AS (SELECT d::date AS day FROM generate_series($2::date,$3::date,'1 day'::interval)d),daily AS (SELECT d.day,COALESCE(sum(s.total_cents),0)::bigint revenue,COALESCE(sum(c.cost),0)::bigint cost,count(s.id)::int sales FROM days d LEFT JOIN eligible_sales s ON s.sale_day=d.day LEFT JOIN item_cost c ON c.sale_id=s.id GROUP BY d.day ORDER BY d.day),
    totals AS (SELECT COALESCE(sum(s.total_cents),0)::bigint revenue,COALESCE(sum(c.cost),0)::bigint cost,count(s.id)::int sales,COALESCE(avg(s.total_cents),0)::bigint ticket FROM eligible_sales s LEFT JOIN item_cost c ON c.sale_id=s.id),
    previous AS (SELECT COALESCE(sum(s.total_cents),0)::bigint revenue FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN ($2::date-($3::date-$2::date)-1) AND ($2::date-1) AND ($4 IS NULL OR s.branch_id=$4))
    SELECT jsonb_build_object(
      'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b,actor a WHERE b.tenant_id=a.tenant_id AND b.active AND b.deleted_at IS NULL),'[]'::jsonb),
      'summary',(SELECT jsonb_build_object('revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2) END,'salesCount',sales,'averageTicketCents',ticket::text,'previousRevenueCents',(SELECT revenue::text FROM previous)) FROM totals),
      'daily',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',day,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'salesCount',sales) ORDER BY day) FROM daily),'[]'::jsonb),
      'byBranch',COALESCE((SELECT jsonb_agg(jsonb_build_object('branchId',b.id,'branchName',b.name,'revenueCents',sum(s.total_cents)::text,'profitCents',(sum(s.total_cents)-sum(COALESCE(c.cost,0)))::text,'salesCount',count(s.id)) ORDER BY sum(s.total_cents) DESC) FROM eligible_sales s JOIN branches b ON b.id=s.branch_id LEFT JOIN item_cost c ON c.sale_id=s.id GROUP BY b.id,b.name),'[]'::jsonb),
      'topProducts',COALESCE((SELECT jsonb_agg(x ORDER BY x."revenueCents"::bigint DESC) FROM (SELECT p.id,p.name,sum(i.quantity) AS quantity,sum(i.total_cents)::text AS "revenueCents",(sum(i.total_cents)-sum(round(i.quantity*i.unit_cost_cents)))::text AS "profitCents" FROM sale_items i JOIN eligible_sales s ON s.id=i.sale_id JOIN products p ON p.id=i.product_id WHERE i.status='ACTIVE' GROUP BY p.id,p.name ORDER BY sum(i.total_cents) DESC LIMIT 10)x),'[]'::jsonb),
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('name',pm.name,'amountCents',sum(sp.amount_cents)::text) ORDER BY sum(sp.amount_cents) DESC) FROM sale_payments sp JOIN eligible_sales s ON s.id=sp.sale_id JOIN payment_methods pm ON pm.id=sp.payment_method_id WHERE sp.status='CONFIRMED' GROUP BY pm.id,pm.name),'[]'::jsonb)
    ) AS data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$branchId,$requestKey])
}

query StockOperationDetails($operationId: String!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)),mov AS (SELECT m.*,mt.code,mt.name type_name,mt.direction,p.name product_name,b.name branch_name FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id JOIN products p ON p.id=m.product_id JOIN branches b ON b.id=m.branch_id WHERE m.client_operation_id=$2)
    SELECT jsonb_build_object('movements',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',m.id,'productId',m.product_id,'productName',m.product_name,'branchId',m.branch_id,'branchName',m.branch_name,'quantity',m.quantity,'unitGrossCents',m.unit_gross_cents::text,'unitCostCents',m.unit_cost_cents::text,'occurredAt',m.occurred_at,'status',m.status,'typeCode',m.code,'typeName',m.type_name,'direction',m.direction,'fiscalDocumentId',m.fiscal_document_id) ORDER BY m.created_at) FROM mov m),'[]'::jsonb),'fiscalDocument',(SELECT jsonb_build_object('id',f.id,'documentType',f.document_type,'documentNumber',f.document_number,'accessKey',f.access_key,'issuedAt',f.issued_at,'totalCents',f.total_cents::text,'freightCents',f.freight_cents::text,'insuranceCents',f.insurance_cents::text,'icmsCents',f.icms_cents::text,'icmsStCents',f.icms_st_cents::text,'ipiCents',f.ipi_cents::text,'issuerCpf',f.issuer_cpf,'issuerCnpj',f.issuer_cnpj,'stateCode',f.state_code,'supplierId',f.supplier_id,'status',f.status) FROM fiscal_documents f JOIN mov m ON m.fiscal_document_id=f.id LIMIT 1)) data FROM actor WHERE $3<>''
  """,params:[{_expr:"auth.uid"},$operationId,$requestKey])
}

query FinancialIndicatorsDashboard($from: Date!, $to: Date!, $filters: Any!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(NULLIF(t.timezone,''),'America/Sao_Paulo') AS timezone
      FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), filter_input AS (
      SELECT COALESCE($4::jsonb,'{}'::jsonb) AS value
    ), base_items AS (
      SELECT i.sale_id,i.product_id,i.quantity,i.total_cents AS line_revenue,i.unit_cost_cents,
             s.total_cents AS sale_total,s.branch_id,s.source AS sale_source,
             (s.sold_at AT TIME ZONE a.timezone)::date AS sale_day,
             p.name AS product_name,c.name AS category_name,sc.name AS subcategory_name,
             p.category_id,p.subcategory_id,p.supplier_id,
             COALESCE(o.provider_fee_cents,0)::bigint AS sale_provider_fee,
             CASE WHEN s.source='IFOOD' THEN COALESCE(o.net_amount_cents,s.total_cents-COALESCE(o.provider_fee_cents,0)) ELSE s.total_cents END::bigint AS sale_net_revenue,
             (s.source='IFOOD' AND o.net_amount_cents IS NULL) AS financial_pending,
             sum(i.total_cents) OVER(PARTITION BY i.sale_id)::bigint AS all_item_revenue
      FROM sale_items i
      JOIN sales s ON s.id=i.sale_id AND s.tenant_id=i.tenant_id
      JOIN actor a ON a.tenant_id=s.tenant_id
      JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
      LEFT JOIN categories c ON c.id=p.category_id AND c.tenant_id=p.tenant_id
      LEFT JOIN subcategories sc ON sc.id=p.subcategory_id AND sc.tenant_id=p.tenant_id
      LEFT JOIN sales_channel_orders o ON o.sale_id=s.id AND o.tenant_id=s.tenant_id
      WHERE s.status='COMPLETED' AND i.status='ACTIVE'
        AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
    ), filtered_items AS (
      SELECT b.* FROM base_items b
      CROSS JOIN filter_input f
      WHERE (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR b.branch_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'branches','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR b.product_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'products','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR b.category_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'categories','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR b.subcategory_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'subcategories','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR b.supplier_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'suppliers','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'sources'),0)=0 OR b.sale_source IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'sources','[]'::jsonb))))
    ), eligible_sales AS (
      SELECT sale_id AS id,min(branch_id::text)::uuid AS branch_id,max(sale_day) AS sale_day,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_total)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS revenue,
             sum(round(quantity*unit_cost_cents))::bigint AS cost,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_provider_fee)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS provider_fee,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_net_revenue)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS net_revenue,
             bool_or(financial_pending) AS financial_pending
      FROM filtered_items GROUP BY sale_id
    ), calendar_days AS (
      SELECT generate_series($2::date,$3::date,interval '1 day')::date AS day
    ), daily_values AS (
      SELECT d.day,count(s.id)::int AS volume,COALESCE(sum(s.revenue),0)::bigint AS revenue,
             COALESCE(sum(s.cost),0)::bigint AS cost,COALESCE(sum(s.provider_fee),0)::bigint AS provider_fee,COALESCE(sum(s.net_revenue),0)::bigint AS net_revenue
      FROM calendar_days d LEFT JOIN eligible_sales s ON s.sale_day=d.day GROUP BY d.day
    ), totals AS (
      SELECT count(*)::int AS volume,COALESCE(sum(revenue),0)::bigint AS revenue,
             COALESCE(sum(cost),0)::bigint AS cost,COALESCE(sum(provider_fee),0)::bigint AS provider_fee,COALESCE(sum(net_revenue),0)::bigint AS net_revenue,
             count(*) FILTER(WHERE financial_pending)::int AS financial_pending_sales
      FROM eligible_sales
    ), historical_base_items AS (
      SELECT i.sale_id,i.product_id,i.quantity,i.total_cents AS line_revenue,i.unit_cost_cents,
             s.total_cents AS sale_total,s.branch_id,s.source AS sale_source,
             date_trunc('month',s.sold_at AT TIME ZONE a.timezone)::date AS sale_month,
             p.category_id,p.subcategory_id,p.supplier_id,
             COALESCE(o.provider_fee_cents,0)::bigint AS sale_provider_fee,
             CASE WHEN s.source='IFOOD' THEN COALESCE(o.net_amount_cents,s.total_cents-COALESCE(o.provider_fee_cents,0)) ELSE s.total_cents END::bigint AS sale_net_revenue,
             sum(i.total_cents) OVER(PARTITION BY i.sale_id)::bigint AS all_item_revenue
      FROM sale_items i JOIN sales s ON s.id=i.sale_id AND s.tenant_id=i.tenant_id
      JOIN actor a ON a.tenant_id=s.tenant_id JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
      LEFT JOIN sales_channel_orders o ON o.sale_id=s.id AND o.tenant_id=s.tenant_id
      WHERE s.status='COMPLETED' AND i.status='ACTIVE'
        AND s.sold_at AT TIME ZONE a.timezone>=date_trunc('month',current_timestamp AT TIME ZONE a.timezone)-interval '12 months'
        AND s.sold_at AT TIME ZONE a.timezone<date_trunc('month',current_timestamp AT TIME ZONE a.timezone)
    ), historical_filtered_items AS (
      SELECT b.* FROM historical_base_items b CROSS JOIN filter_input f
      WHERE (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR b.branch_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'branches','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR b.product_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'products','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR b.category_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'categories','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR b.subcategory_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'subcategories','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR b.supplier_id::text IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'suppliers','[]'::jsonb))))
        AND (COALESCE(jsonb_array_length(f.value->'sources'),0)=0 OR b.sale_source IN(SELECT jsonb_array_elements_text(COALESCE(f.value->'sources','[]'::jsonb))))
    ), historical_sales AS (
      SELECT sale_id,max(sale_month) AS month,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_total)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS revenue,
             sum(round(quantity*unit_cost_cents))::bigint AS cost,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_provider_fee)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS provider_fee,
             CASE WHEN max(all_item_revenue)>0 THEN round(max(sale_net_revenue)::numeric*sum(line_revenue)/max(all_item_revenue)) ELSE 0 END::bigint AS net_revenue
      FROM historical_filtered_items GROUP BY sale_id
    ), closed_months AS (
      SELECT month,count(*)::int AS volume,COALESCE(sum(revenue),0)::bigint AS revenue,
             COALESCE(sum(cost),0)::bigint AS cost,COALESCE(sum(provider_fee),0)::bigint AS provider_fee,COALESCE(sum(net_revenue),0)::bigint AS net_revenue
      FROM historical_sales GROUP BY month ORDER BY month DESC LIMIT 12
    ), monthly_stats AS (
      SELECT COALESCE((SELECT volume FROM closed_months ORDER BY month DESC LIMIT 1),0) AS last_volume,
             COALESCE((SELECT net_revenue-cost FROM closed_months ORDER BY month DESC LIMIT 1),0)::bigint AS last_profit,
             COALESCE(avg(volume),0) AS avg_volume,COALESCE(avg(net_revenue-cost),0)::bigint AS avg_profit,count(*)::int AS months
      FROM closed_months
    ), product_values AS (
      SELECT product_id AS id,product_name AS name,category_name AS category,subcategory_name AS subcategory,
             sum(quantity) AS quantity,
             sum(CASE WHEN all_item_revenue>0 THEN round(sale_total::numeric*line_revenue/all_item_revenue) ELSE 0 END)::bigint AS revenue,
             sum(round(quantity*unit_cost_cents))::bigint AS cost,
             sum(CASE WHEN all_item_revenue>0 THEN round(sale_provider_fee::numeric*line_revenue/all_item_revenue) ELSE 0 END)::bigint AS provider_fee,
             sum(CASE WHEN all_item_revenue>0 THEN round(sale_net_revenue::numeric*line_revenue/all_item_revenue) ELSE 0 END)::bigint AS net_revenue,
             count(*)::int AS line_count
      FROM filtered_items GROUP BY product_id,product_name,category_name,subcategory_name
    )
    SELECT jsonb_build_object(
      'options',jsonb_build_object(
        'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',b.id,'name',b.name) ORDER BY lower(b.name)) FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id WHERE b.active AND b.deleted_at IS NULL),'[]'::jsonb),
        'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',p.id,'name',p.name) ORDER BY lower(p.name)) FROM products p JOIN actor a ON a.tenant_id=p.tenant_id WHERE p.active AND p.deleted_at IS NULL),'[]'::jsonb),
        'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.name) ORDER BY lower(c.name)) FROM categories c JOIN actor a ON a.tenant_id=c.tenant_id WHERE c.active AND c.deleted_at IS NULL),'[]'::jsonb),
        'subcategories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',s.name) ORDER BY lower(s.name)) FROM subcategories s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.active AND s.deleted_at IS NULL),'[]'::jsonb),
        'suppliers',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',s.id,'name',COALESCE(s.trade_name,s.legal_name)) ORDER BY lower(COALESCE(s.trade_name,s.legal_name))) FROM suppliers s JOIN actor a ON a.tenant_id=s.tenant_id WHERE s.active AND s.deleted_at IS NULL),'[]'::jsonb),
        'sources',jsonb_build_array(jsonb_build_object('id','POS','name','Balcão / PDV'),jsonb_build_object('id','IFOOD','name','iFood'))
      ),
      'cards',(SELECT jsonb_build_object('volume',volume,'revenueCents',revenue::text,'providerFeeCents',provider_fee::text,'financialAdjustmentsCents',(net_revenue-(revenue-provider_fee))::text,'netRevenueCents',net_revenue::text,'costCents',cost::text,'grossProfitCents',(revenue-cost)::text,'profitCents',(net_revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((net_revenue-cost)*100.0/revenue,2) END,'ticketCents',CASE WHEN volume=0 THEN '0' ELSE round(revenue::numeric/volume)::bigint::text END,'financialPendingSales',financial_pending_sales) FROM totals),
      'monthly',(SELECT jsonb_build_object('lastVolume',last_volume,'averageVolume',avg_volume,'volumeGrowth',CASE WHEN avg_volume=0 THEN 0 ELSE round((last_volume-avg_volume)*100.0/avg_volume,2) END,'lastProfitCents',last_profit::text,'averageProfitCents',avg_profit::text,'profitGrowth',CASE WHEN avg_profit=0 THEN 0 ELSE round((last_profit-avg_profit)*100.0/avg_profit,2) END,'months',months) FROM monthly_stats),
      'daily',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',day,'volume',volume,'revenueCents',revenue::text,'providerFeeCents',provider_fee::text,'financialAdjustmentsCents',(net_revenue-(revenue-provider_fee))::text,'netRevenueCents',net_revenue::text,'profitCents',(net_revenue-cost)::text) ORDER BY day) FROM daily_values),'[]'::jsonb),
      'products',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'category',category,'subcategory',subcategory,'quantity',quantity,'revenueCents',revenue::text,'providerFeeCents',provider_fee::text,'financialAdjustmentsCents',(net_revenue-(revenue-provider_fee))::text,'netRevenueCents',net_revenue::text,'costCents',cost::text,'grossProfitCents',(revenue-cost)::text,'profitCents',(net_revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((net_revenue-cost)*100.0/revenue,2) END,'lineCount',line_count) ORDER BY revenue DESC) FROM product_values),'[]'::jsonb)
    ) AS data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$filters,$requestKey])
}

query SalesChannelAnalyticsDashboard($from: Date!, $to: Date!, $filters: Any!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(NULLIF(t.timezone,''),'America/Sao_Paulo') timezone
      FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND (u.blocked_until IS NULL OR u.blocked_until<=now())
        AND COALESCE(up.can_access,rp.can_access,false) AND $2::date<=$3::date AND ($3::date-$2::date) BETWEEN 0 AND 366
    ), f AS (SELECT COALESCE($4::jsonb,'{}'::jsonb) value), accessible_connections AS (
      SELECT c.*,b.name branch_name FROM sales_channel_connections c JOIN actor a ON a.tenant_id=c.tenant_id
      JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id
      WHERE c.active AND c.deleted_at IS NULL
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
    ), connections AS (
      SELECT c.* FROM accessible_connections c CROSS JOIN f
      WHERE (COALESCE(f.value->>'branchId','')='' OR c.branch_id=(f.value->>'branchId')::uuid)
        AND (COALESCE(f.value->>'connectionId','')='' OR c.id=(f.value->>'connectionId')::uuid)
    ), orders AS (
      SELECT o.*,c.display_name connection_name,c.provider,c.branch_name,(o.received_at AT TIME ZONE a.timezone)::date received_day,
        (COALESCE(o.completed_at,o.status_updated_at) AT TIME ZONE a.timezone)::date completion_day
      FROM sales_channel_orders o JOIN connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id JOIN actor a ON a.tenant_id=o.tenant_id
      WHERE (o.received_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
         OR (o.status='COMPLETED' AND (COALESCE(o.completed_at,o.status_updated_at) AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date)
    ), completed AS (
      SELECT o.*,s.total_cents sale_total,COALESCE(o.net_amount_cents,s.total_cents-COALESCE(o.provider_fee_cents,0))::bigint effective_net_cents,COALESCE(cost.value,0)::bigint cost_cents
      FROM orders o JOIN sales s ON s.id=o.sale_id AND s.tenant_id=o.tenant_id AND s.status='COMPLETED'
      LEFT JOIN LATERAL (SELECT COALESCE(sum(round(i.quantity*i.unit_cost_cents)),0)::bigint value FROM sale_items i WHERE i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE') cost ON true
      WHERE o.status='COMPLETED' AND o.completion_day BETWEEN $2::date AND $3::date
    ), days AS (SELECT generate_series($2::date,$3::date,interval '1 day')::date AS day), daily_orders AS (
      SELECT received_day AS day,count(*)::int orders FROM orders WHERE received_day BETWEEN $2::date AND $3::date GROUP BY received_day
    ), daily_completed AS (
      SELECT completion_day AS day,count(*)::int sales,COALESCE(sum(sale_total),0)::bigint gross,
        COALESCE(sum(provider_fee_cents),0)::bigint fees,COALESCE(sum(effective_net_cents),0)::bigint net,COALESCE(sum(cost_cents),0)::bigint cost,
        COALESCE(sum(ifood_discount_cents),0)::bigint subsidy FROM completed GROUP BY completion_day
    ), daily AS (
      SELECT d.day,COALESCE(o.orders,0) orders,COALESCE(c.sales,0) sales,COALESCE(c.gross,0)::bigint gross,
        COALESCE(c.fees,0)::bigint fees,COALESCE(c.net,0)::bigint net,COALESCE(c.cost,0)::bigint cost,COALESCE(c.subsidy,0)::bigint subsidy
      FROM days d LEFT JOIN daily_orders o ON o.day=d.day LEFT JOIN daily_completed c ON c.day=d.day ORDER BY d.day
    ), channel_values AS (
      SELECT c.id,c.display_name,c.provider,c.branch_name,count(DISTINCT o.id) FILTER(WHERE o.received_day BETWEEN $2::date AND $3::date)::int orders,
        count(DISTINCT o.id) FILTER(WHERE o.status='CANCELLED' AND o.received_day BETWEEN $2::date AND $3::date)::int cancelled,
        count(DISTINCT co.id)::int sales,COALESCE(sum(co.sale_total),0)::bigint gross,
        COALESCE(sum(co.merchant_discount_cents),0)::bigint merchant_discount,
        COALESCE(sum(co.ifood_discount_cents),0)::bigint subsidy,COALESCE(sum(co.provider_fee_cents),0)::bigint fees,
        COALESCE(sum(co.effective_net_cents),0)::bigint net,COALESCE(sum(co.cost_cents),0)::bigint cost,count(co.id) FILTER(WHERE co.net_amount_cents IS NULL)::int financial_pending
      FROM connections c LEFT JOIN orders o ON o.connection_id=c.id LEFT JOIN completed co ON co.id=o.id
      GROUP BY c.id,c.display_name,c.provider,c.branch_name
    ), fee_values AS (
      SELECT e.name,COALESCE(NULLIF(e.description,''),e.name) description,abs(sum(e.amount_cents))::bigint amount,count(*)::int entries
      FROM sales_channel_financial_entries e JOIN completed o ON o.id=e.order_id AND o.tenant_id=e.tenant_id
      WHERE e.classification='PROVIDER_FEE' AND e.has_transfer_impact
      GROUP BY e.name,e.description
    ), payment_values AS (
      SELECT p.method,p.payment_type,p.card_brand,p.wallet_name,sum(p.amount_cents)::bigint amount,count(DISTINCT p.order_id)::int orders
      FROM sales_channel_order_payments p JOIN completed o ON o.id=p.order_id AND o.tenant_id=p.tenant_id
      GROUP BY p.method,p.payment_type,p.card_brand,p.wallet_name
    ), product_values AS (
      SELECT p.id,p.name,sum(i.quantity) quantity,sum(i.total_cents)::bigint revenue,
        sum(CASE WHEN line_totals.value>0 THEN round(o.effective_net_cents::numeric*i.total_cents/line_totals.value) ELSE 0 END)::bigint net,
        sum(round(i.quantity*i.unit_cost_cents))::bigint cost,count(DISTINCT o.id)::int orders
      FROM completed o JOIN sale_items i ON i.sale_id=o.sale_id AND i.tenant_id=o.tenant_id AND i.status='ACTIVE'
      JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id
      LEFT JOIN LATERAL (SELECT COALESCE(sum(all_items.total_cents),0)::bigint value FROM sale_items all_items WHERE all_items.sale_id=o.sale_id AND all_items.tenant_id=o.tenant_id AND all_items.status='ACTIVE') line_totals ON true
      GROUP BY p.id,p.name ORDER BY sum(i.total_cents) DESC LIMIT 10
    ), totals AS (
      SELECT count(*)::int sales,COALESCE(sum(sale_total),0)::bigint gross,COALESCE(sum(total_cents),0)::bigint customer_paid,
        COALESCE(sum(merchant_discount_cents),0)::bigint merchant_discount,COALESCE(sum(ifood_discount_cents),0)::bigint subsidy,
        COALESCE(sum(provider_fee_cents),0)::bigint fees,COALESCE(sum(effective_net_cents),0)::bigint net,COALESCE(sum(cost_cents),0)::bigint cost,
        count(*) FILTER(WHERE net_amount_cents IS NULL)::int financial_pending FROM completed
    )
    SELECT jsonb_build_object(
      'options',jsonb_build_object(
        'branches',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.branch_id,'name',c.branch_name) ORDER BY lower(c.branch_name)) FROM (SELECT DISTINCT branch_id,branch_name FROM accessible_connections) c),'[]'::jsonb),
        'connections',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',c.id,'name',c.display_name,'provider',c.provider,'branchId',c.branch_id,'branchName',c.branch_name) ORDER BY lower(c.display_name)) FROM accessible_connections c),'[]'::jsonb)),
      'cards',(SELECT jsonb_build_object('orders',COALESCE((SELECT count(*) FROM orders WHERE received_day BETWEEN $2::date AND $3::date),0),'sales',sales,
        'grossRevenueCents',gross::text,'customerPaidCents',customer_paid::text,'merchantDiscountCents',merchant_discount::text,
        'partnerSubsidyCents',subsidy::text,'providerFeeCents',fees::text,'financialAdjustmentsCents',(net-(gross-fees))::text,'netRevenueCents',net::text,
        'costCents',cost::text,'profitCents',(net-cost)::text,'averageTicketCents',CASE WHEN sales=0 THEN '0' ELSE round(gross::numeric/sales)::bigint::text END,
        'financialPendingSales',financial_pending,'cancelledOrders',COALESCE((SELECT count(*) FROM orders WHERE received_day BETWEEN $2::date AND $3::date AND status='CANCELLED'),0)) FROM totals),
      'daily',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',day,'orders',orders,'sales',sales,'grossRevenueCents',gross::text,'providerFeeCents',fees::text,'financialAdjustmentsCents',(net-(gross-fees))::text,'netRevenueCents',net::text,'costCents',cost::text,'profitCents',(net-cost)::text,'partnerSubsidyCents',subsidy::text) ORDER BY day) FROM daily),'[]'::jsonb),
      'byChannel',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',display_name,'provider',provider,'branchName',branch_name,'orders',orders,'cancelledOrders',cancelled,'sales',sales,'grossRevenueCents',gross::text,'merchantDiscountCents',merchant_discount::text,'partnerSubsidyCents',subsidy::text,'providerFeeCents',fees::text,'financialAdjustmentsCents',(net-(gross-fees))::text,'netRevenueCents',net::text,'costCents',cost::text,'profitCents',(net-cost)::text,'financialPendingSales',financial_pending) ORDER BY gross DESC) FROM channel_values),'[]'::jsonb),
      'fees',COALESCE((SELECT jsonb_agg(jsonb_build_object('name',name,'description',description,'amountCents',amount::text,'entries',entries) ORDER BY amount DESC) FROM fee_values),'[]'::jsonb),
      'payments',COALESCE((SELECT jsonb_agg(jsonb_build_object('method',method,'paymentType',payment_type,'cardBrand',card_brand,'walletName',wallet_name,'amountCents',amount::text,'orders',orders) ORDER BY amount DESC) FROM payment_values),'[]'::jsonb),
      'topProducts',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'quantity',quantity,'revenueCents',revenue::text,'netRevenueCents',net::text,'costCents',cost::text,'profitCents',(net-cost)::text,'orders',orders) ORDER BY revenue DESC) FROM product_values),'[]'::jsonb)
    ) data FROM actor WHERE length(btrim($5)) BETWEEN 8 AND 150
  """,params:[{_expr:"auth.uid"},$from,$to,$filters,$requestKey])
}

query OperationalAnalyticsDashboard($from: Date!, $to: Date!, $filters: Any!, $requestKey: String!) @auth(level: USER) {
  _select(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(NULLIF(t.timezone,''),'America/Sao_Paulo') timezone
      FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='RELATORIOS_OPERACIONAIS' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ), f AS (SELECT COALESCE($4::jsonb,'{}') value), bounds AS (SELECT ($2::date-($3::date-$2::date+1))::date previous_from,($2::date-1)::date previous_to), sale_lines AS (
      SELECT s.id sale_id,s.customer_id,s.branch_id,(s.sold_at AT TIME ZONE a.timezone)::date AS day,i.product_id,i.quantity,i.total_cents,round(i.quantity*i.unit_cost_cents)::bigint cost,p.category_id,p.subcategory_id,p.supplier_id
      FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN sale_items i ON i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE'
      JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id CROSS JOIN f
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR s.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), previous_lines AS (
      SELECT p.category_id,p.subcategory_id,i.total_cents FROM sales s JOIN actor a ON a.tenant_id=s.tenant_id JOIN sale_items i ON i.sale_id=s.id AND i.status='ACTIVE' JOIN products p ON p.id=i.product_id CROSS JOIN bounds b CROSS JOIN f
      WHERE s.status='COMPLETED' AND (s.sold_at AT TIME ZONE a.timezone)::date BETWEEN b.previous_from AND b.previous_to
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR s.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), previous_values AS (SELECT category_id id,'Categoria' level,sum(total_cents)::bigint revenue FROM previous_lines GROUP BY category_id UNION ALL SELECT subcategory_id,'Subcategoria',sum(total_cents)::bigint FROM previous_lines WHERE subcategory_id IS NOT NULL GROUP BY subcategory_id), sale_totals AS (SELECT sale_id,customer_id,branch_id,day,sum(total_cents)::bigint revenue,sum(cost)::bigint cost,sum(quantity) quantity FROM sale_lines GROUP BY sale_id,customer_id,branch_id,day), stock_lines AS (
      SELECT m.id,m.product_id,m.branch_id,(m.occurred_at AT TIME ZONE a.timezone)::date AS day,m.quantity,m.unit_cost_cents,mt.code,mt.direction,m.fiscal_document_id
      FROM stock_movements m JOIN actor a ON a.tenant_id=m.tenant_id JOIN stock_movement_types mt ON mt.id=m.movement_type_id
      JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id CROSS JOIN f
      WHERE m.status='POSTED' AND (m.occurred_at AT TIME ZONE a.timezone)::date BETWEEN $2::date AND $3::date
        AND (COALESCE(jsonb_array_length(f.value->'branches'),0)=0 OR m.branch_id::text IN(SELECT jsonb_array_elements_text(f.value->'branches')))
        AND (COALESCE(jsonb_array_length(f.value->'products'),0)=0 OR p.id::text IN(SELECT jsonb_array_elements_text(f.value->'products')))
        AND (COALESCE(jsonb_array_length(f.value->'categories'),0)=0 OR p.category_id::text IN(SELECT jsonb_array_elements_text(f.value->'categories')))
        AND (COALESCE(jsonb_array_length(f.value->'subcategories'),0)=0 OR p.subcategory_id::text IN(SELECT jsonb_array_elements_text(f.value->'subcategories')))
        AND (COALESCE(jsonb_array_length(f.value->'suppliers'),0)=0 OR p.supplier_id::text IN(SELECT jsonb_array_elements_text(f.value->'suppliers')))
    ), stock_monthly AS (
      SELECT date_trunc('month',day)::date AS month,
        sum(quantity) FILTER(WHERE direction='IN') inbound_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE direction='IN'))::bigint inbound_value,
        sum(quantity) FILTER(WHERE code='SALE') sale_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE code='SALE'))::bigint sale_cost,
        sum(quantity) FILTER(WHERE direction='OUT' AND code<>'SALE') loss_quantity,(sum(quantity*unit_cost_cents) FILTER(WHERE direction='OUT' AND code<>'SALE'))::bigint loss_value
      FROM stock_lines GROUP BY date_trunc('month',day)::date
    ), customer_values AS (
      SELECT c.id,c.name,c.city,c.state_code,c.birth_date,count(st.sale_id)::int purchases,COALESCE(sum(st.revenue),0)::bigint revenue,max(st.day) last_purchase
      FROM customers c JOIN actor a ON a.tenant_id=c.tenant_id LEFT JOIN sale_totals st ON st.customer_id=c.id
      WHERE c.active AND c.deleted_at IS NULL GROUP BY c.id
    ), customer_rank AS (
      SELECT cv.*,sum(revenue) OVER() total_revenue,sum(revenue) OVER(ORDER BY revenue DESC,id)/NULLIF(sum(revenue) OVER(),0)::numeric cumulative
      FROM customer_values cv
    ), category_values AS (
      SELECT c.id,c.name,'Categoria' level,sum(sl.quantity) quantity,sum(sl.total_cents)::bigint revenue,sum(sl.cost)::bigint cost,COALESCE(pv.revenue,0)::bigint previous_revenue
      FROM sale_lines sl JOIN categories c ON c.id=sl.category_id LEFT JOIN previous_values pv ON pv.id=c.id AND pv.level='Categoria' GROUP BY c.id,c.name,pv.revenue
      UNION ALL
      SELECT sc.id,sc.name,'Subcategoria',sum(sl.quantity),sum(sl.total_cents)::bigint,sum(sl.cost)::bigint,COALESCE(pv.revenue,0)::bigint
      FROM sale_lines sl JOIN subcategories sc ON sc.id=sl.subcategory_id LEFT JOIN previous_values pv ON pv.id=sc.id AND pv.level='Subcategoria' GROUP BY sc.id,sc.name,pv.revenue
    ), fiscal_docs AS (
      SELECT DISTINCT fd.id,fd.freight_cents,fd.insurance_cents,fd.icms_cents,fd.icms_st_cents,fd.ipi_cents FROM stock_lines sl JOIN fiscal_documents fd ON fd.id=sl.fiscal_document_id
    ), fiscal_totals AS (
      SELECT COALESCE(sum(freight_cents),0)::bigint freight,COALESCE(sum(insurance_cents+icms_cents+icms_st_cents+ipi_cents),0)::bigint extras FROM fiscal_docs
    )
    SELECT jsonb_build_object(
      'stock',jsonb_build_object(
        'cards',jsonb_build_object(
          'inboundQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE direction='IN'),0),'inboundValueCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE direction='IN'),0)::text,
          'freightCents',(SELECT freight::text FROM fiscal_totals),'extraCostsCents',(SELECT extras::text FROM fiscal_totals),
          'saleQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE code='SALE'),0),'saleCostCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE code='SALE'),0)::text,
          'saleProfitCents',(COALESCE((SELECT sum(revenue-cost) FROM sale_totals),0))::text,'lossQuantity',COALESCE((SELECT sum(quantity) FROM stock_lines WHERE direction='OUT' AND code<>'SALE'),0),'lossValueCents',COALESCE((SELECT sum(quantity*unit_cost_cents)::bigint FROM stock_lines WHERE direction='OUT' AND code<>'SALE'),0)::text),
        'monthly',COALESCE((SELECT jsonb_agg(jsonb_build_object('date',month,'inboundQuantity',COALESCE(inbound_quantity,0),'inboundValueCents',COALESCE(inbound_value,0)::text,'saleQuantity',COALESCE(sale_quantity,0),'saleCostCents',COALESCE(sale_cost,0)::text,'lossQuantity',COALESCE(loss_quantity,0),'lossValueCents',COALESCE(loss_value,0)::text) ORDER BY month) FROM stock_monthly),'[]'),
        'products',COALESCE((SELECT jsonb_agg(x ORDER BY abs((x->>'netQuantity')::numeric) DESC) FROM(SELECT jsonb_build_object('id',p.id,'name',p.name,'inQuantity',COALESCE(sum(sl.quantity)FILTER(WHERE sl.direction='IN'),0),'outQuantity',COALESCE(sum(sl.quantity)FILTER(WHERE sl.direction='OUT'),0),'netQuantity',COALESCE(sum(CASE WHEN sl.direction='IN'THEN sl.quantity ELSE -sl.quantity END),0),'valueCents',COALESCE(sum(sl.quantity*sl.unit_cost_cents),0)::bigint::text)x FROM stock_lines sl JOIN products p ON p.id=sl.product_id GROUP BY p.id,p.name LIMIT 100)q),'[]')),
      'customers',jsonb_build_object(
        'cards',jsonb_build_object('active',COALESCE((SELECT count(*) FROM customer_values),0),'new',COALESCE((SELECT count(*) FROM customers c JOIN actor a ON a.tenant_id=c.tenant_id WHERE c.active AND c.created_at::date BETWEEN $2::date AND $3::date),0),'withoutPurchase',COALESCE((SELECT count(*) FROM customer_values WHERE purchases=0),0),'ticketCents',COALESCE((SELECT round(sum(revenue)::numeric/NULLIF(sum(purchases),0)) FROM customer_values),0)::bigint::text,'frequency',COALESCE((SELECT round(avg(purchases),2) FROM customer_values),0)),
        'abc',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'purchases',purchases,'revenueCents',revenue::text,'lastPurchase',last_purchase,'class',CASE WHEN cumulative<=.8 THEN'A'WHEN cumulative<=.95 THEN'B'ELSE'C'END) ORDER BY revenue DESC) FROM customer_rank),'[]'),
        'regions',COALESCE((SELECT jsonb_agg(jsonb_build_object('region',concat_ws(' / ',NULLIF(city,''),NULLIF(state_code,'')),'customers',count(*),'revenueCents',sum(revenue)::text) ORDER BY sum(revenue) DESC) FROM customer_values GROUP BY city,state_code),'[]'),
        'birthdays',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'birthDate',birth_date) ORDER BY extract(month from birth_date),extract(day from birth_date)) FROM customer_values WHERE birth_date IS NOT NULL),'[]'),
        'dormant',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'lastPurchase',last_purchase,'revenueCents',revenue::text) ORDER BY last_purchase NULLS FIRST) FROM customer_values WHERE last_purchase IS NULL OR last_purchase<$2::date),'[]')),
      'categories',COALESCE((SELECT jsonb_agg(jsonb_build_object('id',id,'name',name,'level',level,'quantity',quantity,'revenueCents',revenue::text,'costCents',cost::text,'profitCents',(revenue-cost)::text,'marginPercent',CASE WHEN revenue=0 THEN 0 ELSE round((revenue-cost)*100.0/revenue,2)END,'growthPercent',CASE WHEN previous_revenue=0 THEN 0 ELSE round((revenue-previous_revenue)*100.0/previous_revenue,2)END) ORDER BY level,revenue DESC) FROM category_values),'[]')
    ) data FROM actor WHERE $5<>''
  """,params:[{_expr:"auth.uid"},$from,$to,$filters,$requestKey])
}

# Only a trusted callable passes the Firebase UID; tenant/branch come from SQL.
query SystemSalesChannelOrderForActor($userId: String!, $orderId: UUID!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT o.provider_order_id AS "orderId",c.external_store_id AS "merchantId"
    FROM users u
    JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
    JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
    JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
    JOIN sales_channel_orders o ON o.id=$2 AND o.tenant_id=u.tenant_id
    JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND c.provider='IFOOD'
    JOIN branches b ON b.id=c.branch_id AND b.tenant_id=c.tenant_id AND b.active AND b.deleted_at IS NULL
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND (u.blocked_until IS NULL OR u.blocked_until<=now())
      AND COALESCE(up.can_update,rp.can_update,false)
      AND c.active AND c.enabled AND c.deleted_at IS NULL AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      AND o.status IN ('PENDING','ACCEPTED')
      AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=u.id)
        OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=u.id AND ub.tenant_id=u.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
  """,params:[$userId,$orderId])
}

query SystemSalesChannelConnectionForActor($userId: String!, $connectionId: UUID!) @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT c.id AS "connectionId",c.external_store_id AS "merchantId",c.catalog_profile AS "catalogProfile",c.status,c.authorization_status AS "authorizationStatus",
      COALESCE(up.can_access,rp.can_access,false) AS "canAccess",COALESCE(up.can_manage,rp.can_manage,false) AS "canManage"
    FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
    JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
    JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
    LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
    LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
    JOIN sales_channel_connections c ON c.id=$2 AND c.tenant_id=u.tenant_id AND c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND (u.blocked_until IS NULL OR u.blocked_until<=now())
      AND COALESCE(up.can_access,rp.can_access,false)
      AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=u.id) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=u.id AND ub.tenant_id=u.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
  """,params:[$userId,$connectionId])
}
