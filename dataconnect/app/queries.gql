# Insight Pad client queries.
# Every authenticated query derives tenant, role and user from auth.uid.
# Client-supplied tenant or role identifiers must not define authorization scope.

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    name
    email
    active
    onboardingPending
    tenant {
      id
      legalName
      tradeName
      active
      timezone
      currencyCode
    }
    role {
      id
      name
      hierarchyLevel
      active
    }
  }
}

query GetCurrentUserAccess @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    id
    tenant {
      id
    }
    role {
      id
      rolePagePermissions_on_role {
        canAccess
        canCreate
        canUpdate
        canDelete
        canExport
        canManage
        page {
          id
          pageKey
          displayName
          module
          route
          icon
          displayOrder
          requiresLogin
          active
        }
      }
    }
    userPagePermissions_on_user {
      canAccess
      canCreate
      canUpdate
      canDelete
      canExport
      canManage
      page {
        id
        pageKey
        displayName
        module
        route
        icon
        displayOrder
        requiresLogin
        active
      }
    }
  }
}


# Phase 1 operational catalogs.
# Tenant scope is always derived through auth.uid; the client cannot select it.
query ListCategories($search: String!, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(
    sql: """
      SELECT
        c.id,
        c.name,
        c.active,
        c.created_at AS "createdAt",
        c.updated_at AS "updatedAt",
        COUNT(s.id) FILTER (WHERE s.active AND s.deleted_at IS NULL) AS "subcategoryCount"
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      LEFT JOIN subcategories s
        ON s.category_id = c.id
       AND s.tenant_id = c.tenant_id
      WHERE ($2 = '' OR c.name ILIKE '%' || $2 || '%')
        AND $5 <> ''
      GROUP BY c.id
      ORDER BY lower(c.name), c.id
      LIMIT $3 OFFSET $4
    """,
    params: [{_expr: "auth.uid"}, $search, $limit, $offset, $requestKey]
  )
}

query ListSubcategories($search: String!, $categoryId: UUID, $limit: Int!, $offset: Int!, $requestKey: String!) @auth(level: USER) {
  _select(
    sql: """
      SELECT
        s.id,
        s.name,
        s.category_id AS "categoryId",
        c.name AS "categoryName",
        s.active,
        s.created_at AS "createdAt",
        s.updated_at AS "updatedAt"
      FROM subcategories s
      JOIN categories c
        ON c.id = s.category_id
       AND c.tenant_id = s.tenant_id
      JOIN users u
        ON u.tenant_id = s.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      JOIN tenants t
        ON t.id = u.tenant_id
       AND t.active
       AND t.deleted_at IS NULL
      WHERE ($2 = '' OR s.name ILIKE '%' || $2 || '%' OR c.name ILIKE '%' || $2 || '%')
        AND ($3::uuid IS NULL OR s.category_id = $3)
        AND $6 <> ''
      ORDER BY lower(c.name), lower(s.name), s.id
      LIMIT $4 OFFSET $5
    """,
    params: [{_expr: "auth.uid"}, $search, $categoryId, $limit, $offset, $requestKey]
  )
}

query CategoryOptions @auth(level: USER) {
  _select(
    sql: """
      SELECT c.id, c.name
      FROM categories c
      JOIN users u
        ON u.tenant_id = c.tenant_id
       AND u.id = $1
       AND u.active
       AND u.deleted_at IS NULL
      WHERE c.active
        AND c.deleted_at IS NULL
      ORDER BY lower(c.name), c.id
    """,
    params: [{_expr: "auth.uid"}]
  )
}
