        FROM actor a
        JOIN categories c
          ON c.id = $3 AND c.tenant_id = a.tenant_id
         AND c.active AND c.deleted_at IS NULL
        WHERE s.id = $2
          AND s.tenant_id = a.tenant_id
          AND s.active AND s.deleted_at IS NULL
          AND btrim($4) <> ''
          AND NOT EXISTS (
            SELECT 1 FROM subcategories duplicate
            WHERE duplicate.tenant_id = a.tenant_id
              AND duplicate.category_id = c.id
              AND duplicate.id <> s.id
              AND duplicate.active AND duplicate.deleted_at IS NULL
              AND lower(btrim(duplicate.name)) = lower(btrim($4))
          )
        RETURNING s.id, s.tenant_id, s.category_id, s.name
      )
      INSERT INTO audit_logs
        (tenant_id, user_id, module, page_key, action, entity_name, entity_id,
         summary, success, origin, after_data, created_at)
      SELECT s.tenant_id, $1, 'Cadastros', 'CAD_SUBCATEGORIA', 'UPDATE',
             'Subcategory', s.id::text, 'Subcategoria atualizada', true, 'SQL_CONNECT',
             jsonb_build_object('id', s.id, 'categoryId', s.category_id, 'name', s.name), now()
      FROM changed s
    """,
    params: [{_expr: "auth.uid"}, $id, $categoryId, $name]
  )
}

