mutation TransitionSalesChannelOrder($id: UUID!, $action: String!, $reason: String!, $expectedVersion: Int!) @auth(level: USER) @retired @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_update,rp.can_update,false)
    ), input AS (SELECT a.*,upper(btrim($3)) action,btrim($4) reason FROM actor a WHERE upper(btrim($3)) IN ('ACCEPT','REJECT','COMPLETE')),
    candidate AS (
      SELECT o.*,c.provider FROM sales_channel_orders o JOIN input i ON i.tenant_id=o.tenant_id
      JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
      WHERE o.id=$2 AND o.version=$5 AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND (c.catalog_profile<>'GROCERY' OR i.action='REJECT')
        AND o.command_status NOT IN ('QUEUED','RETRY','PROCESSING','AWAITING_PARTNER')
        AND ((i.action IN ('ACCEPT','REJECT') AND o.status='PENDING') OR (i.action='COMPLETE' AND o.status='ACCEPTED'))
        AND (i.action<>'REJECT' OR length(i.reason)>=5)
    ), queued AS (
      INSERT INTO sales_channel_commands(id,tenant_id,connection_id,order_id,command_key,provider,action,payload,status,attempts,scheduled_at,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),o.tenant_id,o.connection_id,o.id,concat(o.tenant_id,':ORDER:',o.id,':',o.version,':',i.action),o.provider,i.action,jsonb_build_object('reason',NULLIF(left(i.reason,500),''),'orderVersion',o.version,'orderStatus',o.status),'QUEUED',0,now(),i.id,now(),now()
      FROM candidate o JOIN input i ON i.tenant_id=o.tenant_id ON CONFLICT(command_key) DO NOTHING RETURNING *
    ),
    changed AS (
      UPDATE sales_channel_orders o SET
        pending_action=q.action,command_status='QUEUED',processed_by_uid=$1,status_updated_at=now(),version=o.version+1,updated_at=now()
      FROM queued q WHERE o.id=q.order_id AND o.tenant_id=q.tenant_id
      RETURNING o.id,o.tenant_id,o.connection_id,o.display_code,o.status,o.partner_status,o.pending_action,o.command_status,o.version,q.id command_id
    ), history AS (
      INSERT INTO sales_channel_status_history(id,tenant_id,connection_id,order_id,command_id,from_status,to_status,provider_status,origin,reason,actor_uid,correlation_id,created_at)
      SELECT gen_random_uuid(),c.tenant_id,c.connection_id,c.id,c.command_id,c.status,c.status,c.partner_status,'LEGACY_USER_COMMAND',NULLIF(left(i.reason,500),''),$1,c.command_id::text,now()
      FROM changed c JOIN input i ON i.tenant_id=c.tenant_id RETURNING id
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT c.tenant_id,$1,'Integrações','CANAIS_VENDA','QUEUE_'||c.pending_action,'SalesChannelOrder',c.id::text,'Cliente legado convertido para fila segura',true,'SQL_CONNECT',jsonb_build_object('displayCode',c.display_code,'pendingAction',c.pending_action,'commandStatus',c.command_status,'version',c.version,'historyId',(SELECT id FROM history LIMIT 1)),now() FROM changed c
  """,params:[{_expr:"auth.uid"},$id,$action,$reason,$expectedVersion])
}

# Customer actions are written to a durable outbox. The visible order only
# reaches its final state after the trusted partner worker confirms the API call.
mutation QueueSalesChannelOrderAction($id: UUID!, $action: String!, $reason: String!, $expectedVersion: Int!, $cancellationCode: String = "") @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_update,rp.can_update,false)
    ), input AS (
      SELECT a.*,upper(btrim($3)) action,btrim($4) reason FROM actor a
      WHERE upper(btrim($3)) IN ('ACCEPT','REJECT','COMPLETE','CANCEL')
    ), candidate AS (
      SELECT o.*,c.provider FROM sales_channel_orders o JOIN input i ON i.tenant_id=o.tenant_id
      JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
      WHERE o.id=$2 AND o.version=$5 AND c.active AND c.deleted_at IS NULL AND c.enabled
        AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND (c.catalog_profile<>'GROCERY' OR i.action IN ('REJECT','CANCEL'))
        AND o.command_status NOT IN ('QUEUED','RETRY','PROCESSING','AWAITING_PARTNER')
        AND ((i.action IN ('ACCEPT','REJECT') AND o.status='PENDING') OR (i.action='COMPLETE' AND o.status='ACCEPTED') OR (i.action='CANCEL' AND o.status IN ('PENDING','ACCEPTED')))
        AND (i.action NOT IN ('REJECT','CANCEL') OR length(i.reason)>=5)
    ), queued AS (
      INSERT INTO sales_channel_commands(id,tenant_id,connection_id,order_id,command_key,provider,action,payload,status,attempts,scheduled_at,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),o.tenant_id,o.connection_id,o.id,concat(o.tenant_id,':ORDER:',o.id,':',o.version,':',i.action),o.provider,i.action,
        jsonb_build_object('reason',NULLIF(left(i.reason,500),''),'cancellationCode',NULLIF(left(btrim($6),80),''),'orderVersion',o.version,'orderStatus',o.status),'QUEUED',0,now(),i.id,now(),now()
      FROM candidate o JOIN input i ON i.tenant_id=o.tenant_id
      ON CONFLICT(command_key) DO NOTHING RETURNING *
    ), changed AS (
      UPDATE sales_channel_orders o SET pending_action=q.action,command_status='QUEUED',processed_by_uid=$1,status_updated_at=now(),version=o.version+1,updated_at=now()
      FROM queued q WHERE o.id=q.order_id AND o.tenant_id=q.tenant_id
      RETURNING o.*,q.id command_id
    ), history AS (
      INSERT INTO sales_channel_status_history(id,tenant_id,connection_id,order_id,command_id,from_status,to_status,provider_status,origin,reason,actor_uid,correlation_id,created_at)
      SELECT gen_random_uuid(),c.tenant_id,c.connection_id,c.id,c.command_id,c.status,c.status,c.partner_status,'USER_COMMAND',NULLIF(left(i.reason,500),''),$1,c.command_id::text,now()
      FROM changed c JOIN input i ON i.tenant_id=c.tenant_id RETURNING id
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT c.tenant_id,$1,'Integrações','CANAIS_VENDA','QUEUE_'||c.pending_action,'SalesChannelOrder',c.id::text,'Ação do pedido enviada para processamento seguro',true,'SQL_CONNECT',jsonb_build_object('displayCode',c.display_code,'pendingAction',c.pending_action,'commandStatus',c.command_status,'version',c.version,'historyId',(SELECT id FROM history LIMIT 1)),now() FROM changed c
  """,params:[{_expr:"auth.uid"},$id,$action,$reason,$expectedVersion,$cancellationCode])
}

mutation RetrySalesChannelCommand($id: UUID!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_update,rp.can_update,false)
    ), changed AS (
      UPDATE sales_channel_commands q SET status='RETRY',scheduled_at=now(),locked_at=NULL,processed_at=NULL,last_error=NULL,updated_at=now()
      FROM actor a JOIN sales_channel_connections c ON c.tenant_id=a.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
      WHERE q.id=$2 AND q.tenant_id=a.tenant_id AND q.connection_id=c.id AND q.status='ERROR' AND q.attempts<8
      RETURNING q.*
    ), order_changed AS (
      UPDATE sales_channel_orders o SET command_status='QUEUED',updated_at=now() FROM changed q
      WHERE o.id=q.order_id AND o.tenant_id=q.tenant_id RETURNING o.id
