mutation CreateSubcategoriesBatch($items: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)
    ),input AS (
      SELECT (item->>'categoryId')::uuid category_id,upper(btrim(item->>'name')) name
      FROM jsonb_array_elements(COALESCE($2::jsonb,'[]'::jsonb)) item
    ),validated AS (
      SELECT category_id,name FROM input WHERE length(name)>=2 GROUP BY category_id,name
    ),guard AS (
      SELECT count(*) input_count,count(DISTINCT category_id::text||'|'||name) distinct_count FROM input
    ),inserted AS (
      INSERT INTO subcategories(tenant_id,category_id,name,active,created_at,updated_at)
      SELECT a.tenant_id,v.category_id,v.name,true,now(),now() FROM actor a CROSS JOIN validated v
      JOIN categories c ON c.id=v.category_id AND c.tenant_id=a.tenant_id AND c.active AND c.deleted_at IS NULL
      CROSS JOIN guard g
      WHERE g.input_count BETWEEN 1 AND 20 AND g.input_count=g.distinct_count
        AND NOT EXISTS(
          SELECT 1 FROM validated invalid
          LEFT JOIN categories valid_category
            ON valid_category.id=invalid.category_id AND valid_category.tenant_id=a.tenant_id
           AND valid_category.active AND valid_category.deleted_at IS NULL
          WHERE valid_category.id IS NULL
        )
        AND NOT EXISTS(SELECT 1 FROM validated candidate JOIN subcategories existing
          ON existing.tenant_id=a.tenant_id AND existing.category_id=candidate.category_id
         AND existing.active AND existing.deleted_at IS NULL
          AND lower(btrim(existing.name))=lower(candidate.name))
      RETURNING id,tenant_id,category_id,name
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Cadastros','CAD_SUBCATEGORIA','CREATE_BATCH','Subcategory',id::text,'Subcategoria cadastrada em lote',true,
      'SQL_CONNECT',jsonb_build_object('id',id,'categoryId',category_id,'name',name),now() FROM inserted
  """,params:[{_expr:"auth.uid"},$items])
}

