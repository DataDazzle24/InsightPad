mutation UpdateSubcategory($id: UUID!, $categoryId: UUID!, $name: String!) @auth(level: USER) @transaction {
  _execute(
    sql: """
      WITH actor AS (
        SELECT u.id, u.tenant_id
        FROM users u
        JOIN tenants t ON t.id = u.tenant_id AND t.active AND t.deleted_at IS NULL
        JOIN roles r ON r.id = u.role_id AND r.active AND r.deleted_at IS NULL
        JOIN app_pages p ON p.page_key = 'CAD_SUBCATEGORIA' AND p.active
