    ), archived AS (
      UPDATE sales_channel_connections c SET connection_key=CASE WHEN c.connection_key IS NULL THEN NULL ELSE concat(c.connection_key,':archived:',c.id) END,
        external_store_key=CASE WHEN c.external_store_key IS NULL THEN NULL ELSE concat(c.external_store_key,':archived:',c.id) END,
        provider_store_key=NULL,
