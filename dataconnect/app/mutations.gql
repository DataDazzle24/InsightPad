        LEFT JOIN role_page_permissions rp ON rp.role_id = u.role_id AND rp.page_id = p.id
        WHERE u.id = $1 AND u.active AND u.deleted_at IS NULL
          AND COALESCE(up.can_update, rp.can_update, false)
      ),
      restored AS (
        UPDATE subcategories s
        SET active = true, deleted_at = NULL, updated_at = now()
        FROM actor a
        JOIN categories c ON c.id = s.category_id AND c.tenant_id = a.tenant_id
          AND c.active AND c.deleted_at IS NULL
        WHERE s.id = $2 AND s.tenant_id = a.tenant_id AND NOT s.active
          AND NOT EXISTS (
            SELECT 1 FROM subcategories duplicate
            WHERE duplicate.tenant_id = a.tenant_id
              AND duplicate.category_id = s.category_id AND duplicate.id <> s.id
              AND duplicate.active AND duplicate.deleted_at IS NULL
              AND lower(btrim(duplicate.name)) = lower(btrim(s.name))
          )
        RETURNING s.id, s.tenant_id, s.category_id, s.name
      )
      INSERT INTO audit_logs
        (tenant_id, user_id, module, page_key, action, entity_name, entity_id,
         summary, success, origin, after_data, created_at)
      SELECT s.tenant_id, $1, 'Cadastros', 'CAD_SUBCATEGORIA', 'RESTORE',
             'Subcategory', s.id::text, 'Subcategoria reativada', true, 'SQL_CONNECT',
             jsonb_build_object('id', s.id, 'categoryId', s.category_id, 'name', s.name), now()
      FROM restored s
    """,
    params: [{_expr: "auth.uid"}, $id]
  )
}



mutation CreateCategoriesBatch($names: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL JOIN app_pages pg ON pg.page_key='CAD_CATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)
    ),input AS (
      SELECT upper(btrim(value)) name FROM jsonb_array_elements_text(COALESCE($2::jsonb,'[]'::jsonb))
    ),validated AS (
      SELECT name FROM input WHERE length(name)>=2 GROUP BY name
    ),guard AS (
      SELECT count(*) input_count,count(DISTINCT name) distinct_count FROM input
    ),inserted AS (
      INSERT INTO categories(tenant_id,name,active,created_at,updated_at)
      SELECT a.tenant_id,v.name,true,now(),now() FROM actor a CROSS JOIN validated v CROSS JOIN guard g
      WHERE g.input_count BETWEEN 1 AND 20 AND g.input_count=g.distinct_count
        AND NOT EXISTS(SELECT 1 FROM categories c WHERE c.tenant_id=a.tenant_id AND c.active AND lower(btrim(c.name))=lower(v.name))
        AND NOT EXISTS(SELECT 1 FROM validated candidate JOIN categories c ON c.tenant_id=a.tenant_id AND c.active
          AND lower(btrim(c.name))=lower(candidate.name))
      RETURNING id,tenant_id,name
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Cadastros','CAD_CATEGORIA','CREATE_BATCH','Category',id::text,'Categoria cadastrada em lote',true,
      'SQL_CONNECT',jsonb_build_object('id',id,'name',name),now() FROM inserted
  """,params:[{_expr:"auth.uid"},$names])
}

