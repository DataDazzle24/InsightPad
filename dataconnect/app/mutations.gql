        external_mapping_key=CASE WHEN m.external_mapping_key IS NULL THEN NULL ELSE concat(m.external_mapping_key,':archived:',m.id) END,
        active=false,enabled=false,status='ARCHIVED',sync_status='CANCELLED',deleted_at=now(),updated_at=now()
      FROM archived c WHERE m.connection_id=c.id AND m.tenant_id=c.tenant_id AND m.active RETURNING m.id
    ), cancelled_commands AS (
      UPDATE sales_channel_commands q SET status='CANCELLED',last_error='Conexão removida pelo usuário.',processed_at=now(),updated_at=now()
      FROM archived c WHERE q.connection_id=c.id AND q.tenant_id=c.tenant_id AND q.status IN ('QUEUED','RETRY','PROCESSING') RETURNING q.id
    ), cancelled_events AS (
      UPDATE sales_channel_event_inbox e SET status='CANCELLED',last_error='Conexão removida pelo usuário.',lease_until=NULL,locked_by=NULL,updated_at=now()
      FROM archived c WHERE e.connection_id=c.id AND e.tenant_id=c.tenant_id AND e.status IN ('RECEIVED','ERROR','PROCESSING') RETURNING e.id
    ), cancelled_jobs AS (
      UPDATE sales_channel_sync_jobs j SET status='CANCELLED',last_error='Conexão removida pelo usuário.',finished_at=now(),updated_at=now()
      FROM archived c WHERE j.connection_id=c.id AND j.tenant_id=c.tenant_id AND j.status IN ('QUEUED','RETRY','PROCESSING') RETURNING j.id
    )
