mutation SetPlatformRolePermission($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles own_role ON own_role.id=u.role_id AND own_role.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND own_role.active AND own_role.deleted_at IS NULL AND own_role.system_role AND own_role.name='Administrador da Plataforma'),
    i AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j,a.id actor_id FROM actor a),
    valid AS (SELECT r.id role_id,r.tenant_id,(i.j->>'pageId')::uuid page_id,i.j,i.actor_id FROM roles r CROSS JOIN i
      JOIN app_pages p ON p.id=(i.j->>'pageId')::uuid AND p.active WHERE r.id=(i.j->>'roleId')::uuid AND r.active AND r.deleted_at IS NULL),
    changed AS (INSERT INTO role_page_permissions(role_id,page_id,tenant_id,can_access,can_create,can_update,can_delete,can_export,can_manage,created_at,updated_at)
      SELECT role_id,page_id,tenant_id,COALESCE((j->>'canAccess')::boolean,false),COALESCE((j->>'canCreate')::boolean,false),
        COALESCE((j->>'canUpdate')::boolean,false),COALESCE((j->>'canDelete')::boolean,false),COALESCE((j->>'canExport')::boolean,false),
        COALESCE((j->>'canManage')::boolean,false),now(),now() FROM valid
      ON CONFLICT(role_id,page_id) DO UPDATE SET can_access=EXCLUDED.can_access,can_create=EXCLUDED.can_create,
        can_update=EXCLUDED.can_update,can_delete=EXCLUDED.can_delete,can_export=EXCLUDED.can_export,
        can_manage=EXCLUDED.can_manage,updated_at=now() RETURNING role_id,page_id,tenant_id,can_access,can_create,can_update,can_delete,can_export,can_manage)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT c.tenant_id,v.actor_id,'Plataforma','PLATFORM_ADMIN','UPDATE_PERMISSION','Role',c.role_id::text,'Permissão do perfil atualizada',true,'SQL_CONNECT',
      jsonb_build_object('pageId',c.page_id,'canAccess',c.can_access,'canCreate',c.can_create,'canUpdate',c.can_update,
        'canDelete',c.can_delete,'canExport',c.can_export,'canManage',c.can_manage),now() FROM changed c JOIN valid v ON v.role_id=c.role_id AND v.page_id=c.page_id
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation CreatePlatformInvoice($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants own_tenant ON own_tenant.id=u.tenant_id AND own_tenant.active AND own_tenant.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND r.active AND r.deleted_at IS NULL AND r.system_role AND r.name='Administrador da Plataforma'),
    input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j,a.id actor_id FROM actor a),
    parsed AS (SELECT i.*,(j->>'tenantId')::uuid tenant_id,NULLIF(j->>'referenceMonth','')::date reference_month,
      COALESCE(NULLIF(j->>'issuedOn','')::date,current_date) issued_on,NULLIF(j->>'dueDate','')::date due_date,
      COALESCE((j->>'originalAmountCents')::bigint,0) original_amount,COALESCE((j->>'discountCents')::bigint,0) discount,
      COALESCE((j->>'additionCents')::bigint,0) addition,btrim(j->>'clientOperationId') operation_id FROM input i),
    valid AS (SELECT p.* FROM parsed p JOIN tenants t ON t.id=p.tenant_id AND t.deleted_at IS NULL WHERE p.reference_month IS NOT NULL
      AND p.due_date IS NOT NULL AND p.due_date>=p.issued_on AND length(btrim(p.j->>'description')) BETWEEN 2 AND 180
      AND p.original_amount>0 AND p.discount>=0 AND p.addition>=0 AND p.original_amount-p.discount+p.addition>0
      AND length(p.operation_id) BETWEEN 8 AND 100
      AND NOT EXISTS(SELECT 1 FROM tenant_invoices old WHERE old.billing_key=p.tenant_id::text||':'||p.operation_id)),
    inserted AS (INSERT INTO tenant_invoices(id,tenant_id,billing_key,reference_month,description,issued_on,due_date,
      original_amount_cents,discount_cents,addition_cents,total_cents,paid_cents,status,provider,notes,version,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),tenant_id,tenant_id::text||':'||operation_id,date_trunc('month',reference_month)::date,
        left(btrim(j->>'description'),180),issued_on,due_date,original_amount,discount,addition,original_amount-discount+addition,
        0,'OPEN','MANUAL',NULLIF(left(btrim(j->>'notes'),1000),''),1,actor_id,now(),now() FROM valid
      RETURNING id,tenant_id,description,due_date,total_cents)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT i.tenant_id,v.actor_id,'Plataforma','PLATFORM_BILLING','CREATE','TenantInvoice',i.id::text,'Cobrança criada',true,'SQL_CONNECT',
      jsonb_build_object('description',i.description,'dueDate',i.due_date,'totalCents',i.total_cents),now() FROM inserted i CROSS JOIN valid v
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation UpdatePlatformInvoice($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants own_tenant ON own_tenant.id=u.tenant_id AND own_tenant.active AND own_tenant.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND r.active AND r.deleted_at IS NULL AND r.system_role AND r.name='Administrador da Plataforma'),
    input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j,a.id actor_id FROM actor a),
    locked AS (SELECT inv.* FROM tenant_invoices inv CROSS JOIN input i WHERE inv.id=(i.j->>'invoiceId')::uuid AND inv.deleted_at IS NULL FOR UPDATE OF inv),
    valid AS (SELECT l.*,i.j,i.actor_id,NULLIF(i.j->>'referenceMonth','')::date new_reference_month,
      COALESCE(NULLIF(i.j->>'issuedOn','')::date,current_date) new_issued_on,NULLIF(i.j->>'dueDate','')::date new_due_date,
      COALESCE((i.j->>'originalAmountCents')::bigint,0) original_amount,COALESCE((i.j->>'discountCents')::bigint,0) discount,
      COALESCE((i.j->>'additionCents')::bigint,0) addition FROM locked l CROSS JOIN input i
      WHERE l.status='OPEN' AND l.paid_cents=0 AND l.version=COALESCE((i.j->>'expectedVersion')::bigint,-1)
        AND NULLIF(i.j->>'referenceMonth','') IS NOT NULL AND NULLIF(i.j->>'dueDate','') IS NOT NULL
        AND length(btrim(i.j->>'description')) BETWEEN 2 AND 180
        AND COALESCE((i.j->>'originalAmountCents')::bigint,0)>0 AND COALESCE((i.j->>'discountCents')::bigint,0)>=0
        AND COALESCE((i.j->>'additionCents')::bigint,0)>=0
        AND COALESCE((i.j->>'originalAmountCents')::bigint,0)-COALESCE((i.j->>'discountCents')::bigint,0)+COALESCE((i.j->>'additionCents')::bigint,0)>0),
    changed AS (UPDATE tenant_invoices inv SET reference_month=date_trunc('month',v.new_reference_month)::date,
      description=left(btrim(v.j->>'description'),180),issued_on=v.new_issued_on,due_date=v.new_due_date,
      original_amount_cents=v.original_amount,discount_cents=v.discount,addition_cents=v.addition,
      total_cents=v.original_amount-v.discount+v.addition,notes=NULLIF(left(btrim(v.j->>'notes'),1000),''),version=inv.version+1,updated_at=now()
      FROM valid v WHERE inv.id=v.id AND v.new_due_date>=v.new_issued_on RETURNING inv.*)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,before_data,after_data,created_at)
    SELECT c.tenant_id,v.actor_id,'Plataforma','PLATFORM_BILLING','UPDATE','TenantInvoice',c.id::text,'Cobrança atualizada',true,'SQL_CONNECT',
      jsonb_build_object('dueDate',v.due_date,'totalCents',v.total_cents,'version',v.version),
      jsonb_build_object('dueDate',c.due_date,'totalCents',c.total_cents,'version',c.version),now() FROM changed c JOIN valid v ON v.id=c.id
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation VoidPlatformInvoice($invoiceId: UUID!, $reason: String!, $expectedVersion: Int64!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND r.active AND r.deleted_at IS NULL AND r.system_role AND r.name='Administrador da Plataforma'),
    changed AS (UPDATE tenant_invoices inv SET status='VOID',notes=concat_ws(E'\n',inv.notes,'Cancelamento: '||left(btrim($3),500)),
      version=inv.version+1,updated_at=now() FROM actor a WHERE inv.id=$2 AND inv.deleted_at IS NULL AND inv.status<>'VOID'
      AND inv.paid_cents=0 AND inv.version=$4 AND length(btrim($3))>=5 RETURNING inv.id,inv.tenant_id,inv.total_cents,inv.version)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,before_data,created_at)
    SELECT c.tenant_id,a.id,'Plataforma','PLATFORM_BILLING','VOID','TenantInvoice',c.id::text,left(btrim($3),500),true,'SQL_CONNECT',
      jsonb_build_object('totalCents',c.total_cents,'version',c.version-1),now() FROM changed c CROSS JOIN actor a
  """,params:[{_expr:"auth.uid"},$invoiceId,$reason,$expectedVersion])
}

mutation SettlePlatformInvoice($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND r.active AND r.deleted_at IS NULL AND r.system_role AND r.name='Administrador da Plataforma'),
    input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j,a.id actor_id FROM actor a),
    locked AS (SELECT inv.* FROM tenant_invoices inv CROSS JOIN input i WHERE inv.id=(i.j->>'invoiceId')::uuid AND inv.deleted_at IS NULL FOR UPDATE OF inv),
    valid AS (SELECT l.*,i.j,i.actor_id,COALESCE((i.j->>'amountCents')::bigint,0) payment_amount,
      NULLIF(i.j->>'paidAt','')::timestamptz payment_date,upper(btrim(i.j->>'method')) payment_method,
      btrim(i.j->>'idempotencyKey') operation_id FROM locked l CROSS JOIN input i
      WHERE l.status<>'VOID' AND l.paid_cents<l.total_cents
        AND COALESCE((i.j->>'amountCents')::bigint,0)>0
        AND COALESCE((i.j->>'amountCents')::bigint,0)<=l.total_cents-l.paid_cents
        AND NULLIF(i.j->>'paidAt','')::timestamptz<=now()+interval '5 minutes'
        AND upper(btrim(i.j->>'method')) IN ('PIX','BOLETO','TRANSFERENCIA','CARTAO','DINHEIRO','OUTRO')
        AND length(btrim(i.j->>'idempotencyKey')) BETWEEN 8 AND 100
        AND NOT EXISTS(SELECT 1 FROM tenant_payments old WHERE old.idempotency_key=l.tenant_id::text||':'||btrim(i.j->>'idempotencyKey'))),
    inserted AS (INSERT INTO tenant_payments(id,tenant_id,invoice_id,idempotency_key,amount_cents,paid_at,method,provider,
      transaction_reference,notes,status,created_by_uid,created_at)
      SELECT gen_random_uuid(),tenant_id,id,tenant_id::text||':'||operation_id,payment_amount,payment_date,payment_method,'MANUAL',
        NULLIF(left(btrim(j->>'transactionReference'),180),''),NULLIF(left(btrim(j->>'notes'),1000),''),'CONFIRMED',actor_id,now()
      FROM valid RETURNING id,tenant_id,invoice_id,amount_cents,paid_at,method),
    changed AS (UPDATE tenant_invoices inv SET paid_cents=inv.paid_cents+p.amount_cents,
      status=CASE WHEN inv.paid_cents+p.amount_cents>=inv.total_cents THEN 'PAID' ELSE 'PARTIALLY_PAID' END,
      version=inv.version+1,updated_at=now() FROM inserted p WHERE inv.id=p.invoice_id RETURNING inv.id,inv.total_cents,inv.paid_cents,inv.version)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT p.tenant_id,v.actor_id,'Plataforma','PLATFORM_BILLING','SETTLE','TenantPayment',p.id::text,'Baixa financeira registrada',true,'SQL_CONNECT',
      jsonb_build_object('invoiceId',p.invoice_id,'amountCents',p.amount_cents,'paidAt',p.paid_at,'method',p.method,
        'invoicePaidCents',c.paid_cents,'invoiceTotalCents',c.total_cents),now()
    FROM inserted p JOIN changed c ON c.id=p.invoice_id JOIN valid v ON v.id=p.invoice_id
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation ReversePlatformPayment($paymentId: UUID!, $reason: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
      AND r.active AND r.deleted_at IS NULL AND r.system_role AND r.name='Administrador da Plataforma'),
    locked AS (SELECT pay.* FROM tenant_payments pay JOIN tenant_invoices inv ON inv.id=pay.invoice_id CROSS JOIN actor a
      WHERE pay.id=$2 AND pay.status='CONFIRMED' AND inv.deleted_at IS NULL FOR UPDATE OF pay,inv),
    reversed AS (UPDATE tenant_payments pay SET status='REVERSED',reversed_at=now(),reversed_by_uid=a.id,reversal_reason=left(btrim($3),500)
      FROM locked l CROSS JOIN actor a WHERE pay.id=l.id AND length(btrim($3))>=5 RETURNING pay.*),
    changed AS (UPDATE tenant_invoices inv SET paid_cents=GREATEST(inv.paid_cents-r.amount_cents,0),
      status=CASE WHEN GREATEST(inv.paid_cents-r.amount_cents,0)=0 THEN 'OPEN' ELSE 'PARTIALLY_PAID' END,
      version=inv.version+1,updated_at=now() FROM reversed r WHERE inv.id=r.invoice_id RETURNING inv.id,inv.total_cents,inv.paid_cents,inv.version)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,before_data,after_data,created_at)
    SELECT r.tenant_id,a.id,'Plataforma','PLATFORM_BILLING','REVERSE','TenantPayment',r.id::text,left(btrim($3),500),true,'SQL_CONNECT',
      jsonb_build_object('invoiceId',r.invoice_id,'amountCents',r.amount_cents),
      jsonb_build_object('invoicePaidCents',c.paid_cents,'invoiceVersion',c.version),now()
    FROM reversed r JOIN changed c ON c.id=r.invoice_id CROSS JOIN actor a
  """,params:[{_expr:"auth.uid"},$paymentId,$reason])
}

mutation PostStockAdjustment($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)),
    input AS (SELECT a.*,COALESCE($2::jsonb,'{}'::jsonb) j FROM actor a),parsed AS (SELECT i.*,(j->>'branchId')::uuid branch_id,(j->>'productId')::uuid product_id,upper(btrim(j->>'direction')) direction,abs(COALESCE((j->>'quantity')::numeric,0)) quantity,GREATEST(COALESCE((j->>'unitCostCents')::bigint,0),0) unit_cost,left(btrim(COALESCE(j->>'notes','')),240) notes,btrim(j->>'clientOperationId') operation_id FROM input i),
    valid AS (SELECT p.*,pr.allow_negative_stock,pr.cost_price_cents,current_balance.quantity current_quantity FROM parsed p JOIN branches b ON b.id=p.branch_id AND b.tenant_id=p.tenant_id AND b.active AND b.deleted_at IS NULL JOIN products pr ON pr.id=p.product_id AND pr.tenant_id=p.tenant_id AND pr.active AND pr.deleted_at IS NULL LEFT JOIN stock_balances current_balance ON current_balance.branch_id=p.branch_id AND current_balance.product_id=p.product_id WHERE p.direction IN ('IN','OUT') AND p.quantity>0 AND length(p.operation_id) BETWEEN 8 AND 100 AND NOT EXISTS(SELECT 1 FROM stock_movements old WHERE old.tenant_id=p.tenant_id AND old.client_operation_id=p.operation_id) AND (p.direction='IN' OR pr.allow_negative_stock OR COALESCE(current_balance.quantity,0)>=p.quantity)),
    type_upsert AS (INSERT INTO stock_movement_types(id,tenant_id,code,name,direction,active,created_at,updated_at) SELECT gen_random_uuid(),v.tenant_id,CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'MANUAL_OUT' END,CASE WHEN v.direction='IN' THEN 'Entrada manual' ELSE 'Saída manual' END,v.direction,true,now(),now() FROM valid v WHERE NOT EXISTS(SELECT 1 FROM stock_movement_types mt WHERE mt.tenant_id=v.tenant_id AND mt.code=CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'MANUAL_OUT' END) RETURNING id,tenant_id,code),
    selected_type AS (SELECT id,tenant_id,code FROM type_upsert UNION ALL SELECT mt.id,mt.tenant_id,mt.code FROM stock_movement_types mt JOIN valid v ON v.tenant_id=mt.tenant_id WHERE mt.code=CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'MANUAL_OUT' END LIMIT 1),
    movement AS (INSERT INTO stock_movements(id,tenant_id,branch_id,product_id,movement_type_id,client_operation_id,quantity,unit_gross_cents,unit_cost_cents,occurred_at,status,created_by_uid,created_at) SELECT gen_random_uuid(),v.tenant_id,v.branch_id,v.product_id,mt.id,v.operation_id,v.quantity,0,CASE WHEN v.unit_cost>0 THEN v.unit_cost ELSE v.cost_price_cents END,now(),'POSTED',v.id,now() FROM valid v JOIN selected_type mt ON mt.tenant_id=v.tenant_id RETURNING *),
    balance AS (INSERT INTO stock_balances(tenant_id,branch_id,product_id,quantity,average_cost_cents,version,updated_at) SELECT m.tenant_id,m.branch_id,m.product_id,CASE WHEN v.direction='IN' THEN m.quantity ELSE -m.quantity END,CASE WHEN v.direction='IN' THEN m.unit_cost_cents ELSE 0 END,1,now() FROM movement m JOIN valid v ON v.tenant_id=m.tenant_id ON CONFLICT(branch_id,product_id) DO UPDATE SET quantity=stock_balances.quantity+EXCLUDED.quantity,average_cost_cents=CASE WHEN EXCLUDED.quantity>0 AND stock_balances.quantity+EXCLUDED.quantity>0 THEN round(((stock_balances.quantity*stock_balances.average_cost_cents)+(EXCLUDED.quantity*EXCLUDED.average_cost_cents))/(stock_balances.quantity+EXCLUDED.quantity)) ELSE stock_balances.average_cost_cents END,version=stock_balances.version+1,updated_at=now() RETURNING product_id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at) SELECT v.tenant_id,v.id,'Estoque','ESTOQUE',CASE WHEN v.direction='IN' THEN 'STOCK_IN' ELSE 'STOCK_OUT' END,'Product',v.product_id::text,CASE WHEN v.notes='' THEN 'Movimentação manual de estoque' ELSE v.notes END,true,'SQL_CONNECT',jsonb_build_object('branchId',v.branch_id,'quantity',v.quantity,'direction',v.direction,'operationId',v.operation_id),now() FROM valid v
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation PostStockTransfer($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_manage,rp.can_manage,false)),
    input AS (SELECT a.*,COALESCE($2::jsonb,'{}'::jsonb) j FROM actor a),header AS (SELECT i.*,(j->>'sourceBranchId')::uuid source_id,(j->>'destinationBranchId')::uuid destination_id,btrim(j->>'clientOperationId') operation_id,left(btrim(COALESCE(j->>'notes','')),500) notes FROM input i),items AS (SELECT h.*,x.product_id,x.quantity FROM header h CROSS JOIN LATERAL jsonb_to_recordset(COALESCE(h.j->'items','[]'::jsonb))x(product_id uuid,quantity numeric) WHERE x.quantity>0),valid AS (SELECT h.* FROM header h JOIN branches s ON s.id=h.source_id AND s.tenant_id=h.tenant_id AND s.active AND s.deleted_at IS NULL JOIN branches d ON d.id=h.destination_id AND d.tenant_id=h.tenant_id AND d.active AND d.deleted_at IS NULL WHERE h.source_id<>h.destination_id AND length(h.operation_id) BETWEEN 8 AND 100 AND EXISTS(SELECT 1 FROM items i WHERE i.operation_id=h.operation_id) AND NOT EXISTS(SELECT 1 FROM stock_transfers tr WHERE tr.tenant_id=h.tenant_id AND tr.client_operation_id=h.operation_id) AND NOT EXISTS(SELECT 1 FROM items i JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id LEFT JOIN stock_balances sb ON sb.branch_id=i.source_id AND sb.product_id=i.product_id WHERE NOT p.allow_negative_stock AND COALESCE(sb.quantity,0)<i.quantity)),
    transfer AS (INSERT INTO stock_transfers(id,tenant_id,source_branch_id,destination_branch_id,client_operation_id,status,requested_at,completed_at,notes,created_by_uid,created_at,updated_at) SELECT gen_random_uuid(),tenant_id,source_id,destination_id,operation_id,'COMPLETED',now(),now(),NULLIF(notes,''),id,now(),now() FROM valid RETURNING *),
    transfer_items AS (INSERT INTO stock_transfer_items(id,tenant_id,transfer_id,product_id,quantity,created_at) SELECT gen_random_uuid(),t.tenant_id,t.id,i.product_id,i.quantity,now() FROM transfer t JOIN items i ON i.tenant_id=t.tenant_id RETURNING *),
    types(code,name,direction) AS (VALUES('TRANSFER_OUT','Saída por transferência','OUT'),('TRANSFER_IN','Entrada por transferência','IN')),type_upsert AS (INSERT INTO stock_movement_types(id,tenant_id,code,name,direction,active,created_at,updated_at) SELECT gen_random_uuid(),t.tenant_id,x.code,x.name,x.direction,true,now(),now() FROM transfer t CROSS JOIN types x WHERE NOT EXISTS(SELECT 1 FROM stock_movement_types mt WHERE mt.tenant_id=t.tenant_id AND mt.code=x.code) RETURNING id,tenant_id,code,direction),
    selected_types AS (SELECT id,tenant_id,code,direction FROM type_upsert UNION ALL SELECT mt.id,mt.tenant_id,mt.code,mt.direction FROM stock_movement_types mt JOIN transfer t ON t.tenant_id=mt.tenant_id WHERE mt.code IN ('TRANSFER_OUT','TRANSFER_IN')),
    movements AS (INSERT INTO stock_movements(id,tenant_id,branch_id,product_id,movement_type_id,client_operation_id,quantity,unit_gross_cents,unit_cost_cents,occurred_at,status,created_by_uid,created_at) SELECT gen_random_uuid(),t.tenant_id,CASE WHEN mt.direction='OUT' THEN t.source_branch_id ELSE t.destination_branch_id END,i.product_id,mt.id,t.client_operation_id,i.quantity,0,p.cost_price_cents,now(),'POSTED',t.created_by_uid,now() FROM transfer t JOIN transfer_items i ON i.transfer_id=t.id JOIN products p ON p.id=i.product_id JOIN selected_types mt ON mt.tenant_id=t.tenant_id RETURNING *),
    balances AS (INSERT INTO stock_balances(tenant_id,branch_id,product_id,quantity,average_cost_cents,version,updated_at) SELECT m.tenant_id,m.branch_id,m.product_id,CASE WHEN mt.direction='OUT' THEN -m.quantity ELSE m.quantity END,CASE WHEN mt.direction='IN' THEN m.unit_cost_cents ELSE 0 END,1,now() FROM movements m JOIN stock_movement_types mt ON mt.id=m.movement_type_id ON CONFLICT(branch_id,product_id) DO UPDATE SET quantity=stock_balances.quantity+EXCLUDED.quantity,version=stock_balances.version+1,updated_at=now() RETURNING product_id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at) SELECT tenant_id,created_by_uid,'Estoque','ESTOQUE','TRANSFER','StockTransfer',id::text,'Transferência de estoque concluída',true,'SQL_CONNECT',jsonb_build_object('sourceBranchId',source_branch_id,'destinationBranchId',destination_branch_id,'operationId',client_operation_id),now() FROM transfer
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation SaveStockBatch($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id,COALESCE(up.can_create,rp.can_create,false) can_create,COALESCE(up.can_update,rp.can_update,false) can_update FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL),input AS (SELECT a.*,COALESCE($2::jsonb,'{}')j FROM actor a),header AS (SELECT i.*,(j->>'branchId')::uuid branch_id,upper(j->>'direction') direction,btrim(j->>'clientOperationId') operation_id,NULLIF(btrim(j->>'replacesOperationId'),'') replaces_operation_id,COALESCE((j->>'occurredAt')::timestamptz,now()) occurred_at,COALESCE((j->>'fiscalEnabled')::boolean,false) fiscal_enabled,j->'fiscal' fiscal FROM input i WHERE ((NULLIF(btrim(j->>'replacesOperationId'),'') IS NULL AND can_create) OR (NULLIF(btrim(j->>'replacesOperationId'),'') IS NOT NULL AND can_update))),items AS (SELECT h.*,x.product_id,x.quantity,x.unit_gross_cents,x.unit_cost_cents,COALESCE(x.replace_cost,false) replace_cost FROM header h CROSS JOIN LATERAL jsonb_to_recordset(COALESCE(h.j->'items','[]'))x(product_id uuid,quantity numeric,unit_gross_cents bigint,unit_cost_cents bigint,replace_cost boolean) WHERE x.quantity>0),valid AS (SELECT h.* FROM header h JOIN branches b ON b.id=h.branch_id AND b.tenant_id=h.tenant_id AND b.active AND b.deleted_at IS NULL WHERE h.direction IN ('IN','OUT') AND length(h.operation_id) BETWEEN 8 AND 100 AND EXISTS(SELECT 1 FROM items i WHERE i.operation_id=h.operation_id) AND NOT EXISTS(SELECT 1 FROM items i LEFT JOIN products p ON p.id=i.product_id AND p.tenant_id=i.tenant_id AND p.active AND p.deleted_at IS NULL WHERE p.id IS NULL OR p.bundle_product) AND NOT EXISTS(SELECT 1 FROM stock_movements m WHERE m.tenant_id=h.tenant_id AND m.client_operation_id=h.operation_id) AND (h.replaces_operation_id IS NULL OR EXISTS(SELECT 1 FROM stock_movements m WHERE m.tenant_id=h.tenant_id AND m.client_operation_id=h.replaces_operation_id AND m.status='POSTED' AND m.sale_id IS NULL)) AND (h.direction='IN' OR NOT EXISTS(SELECT 1 FROM items i JOIN products p ON p.id=i.product_id LEFT JOIN stock_balances sb ON sb.branch_id=h.branch_id AND sb.product_id=i.product_id WHERE NOT p.allow_negative_stock AND COALESCE(sb.quantity,0)+COALESCE((SELECT sum(old.quantity) FROM stock_movements old JOIN stock_movement_types omt ON omt.id=old.movement_type_id WHERE old.tenant_id=h.tenant_id AND old.client_operation_id=h.replaces_operation_id AND old.branch_id=h.branch_id AND old.product_id=i.product_id AND old.status='POSTED' AND omt.direction='OUT'),0)<i.quantity))),old_rows AS (UPDATE stock_movements m SET status='REVERSED',reversed_at=now() FROM valid v WHERE v.replaces_operation_id IS NOT NULL AND m.tenant_id=v.tenant_id AND m.client_operation_id=v.replaces_operation_id AND m.status='POSTED' AND m.sale_id IS NULL RETURNING m.*),old_balances AS (UPDATE stock_balances sb SET quantity=sb.quantity+x.delta,version=sb.version+1,updated_at=now() FROM (SELECT o.tenant_id,o.branch_id,o.product_id,sum(CASE WHEN mt.direction='OUT' THEN o.quantity ELSE -o.quantity END)delta FROM old_rows o JOIN stock_movement_types mt ON mt.id=o.movement_type_id GROUP BY o.tenant_id,o.branch_id,o.product_id)x WHERE sb.tenant_id=x.tenant_id AND sb.branch_id=x.branch_id AND sb.product_id=x.product_id RETURNING sb.product_id),old_docs AS (UPDATE fiscal_documents f SET status='REPLACED',updated_at=now() WHERE f.id IN(SELECT fiscal_document_id FROM old_rows WHERE fiscal_document_id IS NOT NULL) RETURNING f.id),doc AS (INSERT INTO fiscal_documents(id,tenant_id,branch_id,supplier_id,document_type,document_number,access_key,issued_at,total_cents,freight_cents,insurance_cents,icms_cents,icms_st_cents,ipi_cents,issuer_cpf,issuer_cnpj,state_code,status,created_at,updated_at) SELECT gen_random_uuid(),v.tenant_id,v.branch_id,NULLIF(v.fiscal->>'supplierId','')::uuid,COALESCE(NULLIF(left(btrim(v.fiscal->>'documentType'),20),''),'NF'),left(btrim(v.fiscal->>'documentNumber'),60),NULLIF(left(regexp_replace(v.fiscal->>'accessKey','\D','','g'),60),''),NULLIF(v.fiscal->>'issuedAt','')::timestamptz,GREATEST(COALESCE((v.fiscal->>'totalCents')::bigint,0),0),GREATEST(COALESCE((v.fiscal->>'freightCents')::bigint,0),0),GREATEST(COALESCE((v.fiscal->>'insuranceCents')::bigint,0),0),GREATEST(COALESCE((v.fiscal->>'icmsCents')::bigint,0),0),GREATEST(COALESCE((v.fiscal->>'icmsStCents')::bigint,0),0),GREATEST(COALESCE((v.fiscal->>'ipiCents')::bigint,0),0),NULLIF(regexp_replace(v.fiscal->>'issuerCpf','\D','','g'),''),NULLIF(regexp_replace(v.fiscal->>'issuerCnpj','\D','','g'),''),NULLIF(upper(left(btrim(v.fiscal->>'stateCode'),2)),''),'REGISTERED',now(),now() FROM valid v WHERE v.direction='IN' AND v.fiscal_enabled AND length(btrim(v.fiscal->>'documentNumber'))>0 RETURNING id,tenant_id),type_upsert AS (INSERT INTO stock_movement_types(id,tenant_id,code,name,direction,active,created_at,updated_at) SELECT gen_random_uuid(),v.tenant_id,CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'LOSS' END,CASE WHEN v.direction='IN' THEN 'Entrada' ELSE 'Saída por perda' END,v.direction,true,now(),now() FROM valid v WHERE NOT EXISTS(SELECT 1 FROM stock_movement_types mt WHERE mt.tenant_id=v.tenant_id AND mt.code=CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'LOSS' END) RETURNING id,tenant_id,code,direction),selected_type AS (SELECT * FROM type_upsert UNION ALL SELECT mt.id,mt.tenant_id,mt.code,mt.direction FROM stock_movement_types mt JOIN valid v ON v.tenant_id=mt.tenant_id WHERE mt.code=CASE WHEN v.direction='IN' THEN 'MANUAL_IN' ELSE 'LOSS' END LIMIT 1),movement AS (INSERT INTO stock_movements(id,tenant_id,branch_id,product_id,movement_type_id,fiscal_document_id,client_operation_id,quantity,unit_gross_cents,unit_cost_cents,occurred_at,status,created_by_uid,created_at) SELECT gen_random_uuid(),v.tenant_id,v.branch_id,i.product_id,mt.id,d.id,v.operation_id,i.quantity,GREATEST(COALESCE(i.unit_gross_cents,0),0),GREATEST(COALESCE(i.unit_cost_cents,i.unit_gross_cents,0),0),v.occurred_at,'POSTED',v.id,now() FROM valid v JOIN items i ON i.operation_id=v.operation_id JOIN selected_type mt ON mt.tenant_id=v.tenant_id LEFT JOIN doc d ON d.tenant_id=v.tenant_id RETURNING *),balance AS (INSERT INTO stock_balances(tenant_id,branch_id,product_id,quantity,average_cost_cents,version,updated_at) SELECT m.tenant_id,m.branch_id,m.product_id,CASE WHEN mt.direction='IN' THEN m.quantity ELSE -m.quantity END,CASE WHEN mt.direction='IN' THEN m.unit_cost_cents ELSE 0 END,1,now() FROM movement m JOIN stock_movement_types mt ON mt.id=m.movement_type_id ON CONFLICT(branch_id,product_id) DO UPDATE SET quantity=stock_balances.quantity+EXCLUDED.quantity,average_cost_cents=CASE WHEN EXCLUDED.quantity>0 AND stock_balances.quantity+EXCLUDED.quantity>0 THEN round(((stock_balances.quantity*stock_balances.average_cost_cents)+(EXCLUDED.quantity*EXCLUDED.average_cost_cents))/(stock_balances.quantity+EXCLUDED.quantity)) ELSE stock_balances.average_cost_cents END,version=stock_balances.version+1,updated_at=now() RETURNING product_id),product_cost AS (UPDATE products p SET cost_price_cents=i.unit_cost_cents,updated_at=now() FROM items i JOIN valid v ON v.operation_id=i.operation_id WHERE v.direction='IN' AND i.replace_cost AND p.id=i.product_id AND p.tenant_id=i.tenant_id RETURNING p.id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at) SELECT v.tenant_id,v.id,'Estoque','ESTOQUE',CASE WHEN v.replaces_operation_id IS NULL THEN 'CREATE' ELSE 'CORRECT' END,'StockOperation',v.operation_id,'Movimentação de estoque processada',true,'SQL_CONNECT',jsonb_build_object('branchId',v.branch_id,'direction',v.direction,'items',(SELECT count(*) FROM movement),'replacesOperationId',v.replaces_operation_id),now() FROM valid v WHERE EXISTS(SELECT 1 FROM movement)
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation ReverseStockOperation($operationId: String!, $movementIds: Any!, $reason: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='ESTOQUE' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_delete,rp.can_delete,false)),ids AS (SELECT value::uuid id FROM jsonb_array_elements_text(COALESCE($3::jsonb,'[]'))),reversed AS (UPDATE stock_movements m SET status='REVERSED',reversed_at=now() FROM actor a WHERE m.tenant_id=a.tenant_id AND m.client_operation_id=$2 AND m.status='POSTED' AND m.sale_id IS NULL AND (NOT EXISTS(SELECT 1 FROM ids) OR m.id IN(SELECT id FROM ids)) AND length(btrim($4))>=5 RETURNING m.*),balances AS (UPDATE stock_balances sb SET quantity=sb.quantity+x.delta,version=sb.version+1,updated_at=now() FROM (SELECT r.tenant_id,r.branch_id,r.product_id,sum(CASE WHEN mt.direction='OUT' THEN r.quantity ELSE -r.quantity END)delta FROM reversed r JOIN stock_movement_types mt ON mt.id=r.movement_type_id GROUP BY r.tenant_id,r.branch_id,r.product_id)x WHERE sb.tenant_id=x.tenant_id AND sb.branch_id=x.branch_id AND sb.product_id=x.product_id RETURNING sb.product_id),docs AS (UPDATE fiscal_documents f SET status='CANCELLED',updated_at=now() WHERE f.id IN(SELECT fiscal_document_id FROM reversed WHERE fiscal_document_id IS NOT NULL) AND NOT EXISTS(SELECT 1 FROM stock_movements active WHERE active.fiscal_document_id=f.id AND active.status='POSTED') RETURNING f.id),transfers AS (UPDATE stock_transfers t SET status='CANCELLED',updated_at=now() FROM actor a WHERE t.tenant_id=a.tenant_id AND t.client_operation_id=$2 AND NOT EXISTS(SELECT 1 FROM stock_movements m WHERE m.tenant_id=t.tenant_id AND m.client_operation_id=t.client_operation_id AND m.status='POSTED') RETURNING t.id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at) SELECT tenant_id,$1,'Estoque','ESTOQUE','REVERSE','StockOperation',$2,left(btrim($4),255),true,'SQL_CONNECT',jsonb_build_object('movementCount',count(*),'reason',left(btrim($4),255)),now() FROM reversed GROUP BY tenant_id
  """,params:[{_expr:"auth.uid"},$operationId,$movementIds,$reason])
}

mutation OpenCashSession($branchId: UUID!, $openingAmountCents: Int64!, $notes: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)
    ), branch AS (
      SELECT b.*,a.id actor_id FROM branches b JOIN actor a ON a.tenant_id=b.tenant_id
      WHERE b.id=$2 AND b.active AND b.deleted_at IS NULL
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=a.id AND ub.branch_id=b.id AND ub.active))
    ), locked AS (
      SELECT b.*,pg_advisory_xact_lock(hashtext(b.id::text)) FROM branch b
    ), opened AS (
      INSERT INTO cash_sessions(id,tenant_id,branch_id,opened_by_uid,opened_at,opening_amount_cents,status,notes,created_at,updated_at)
      SELECT gen_random_uuid(),tenant_id,id,$1,now(),GREATEST($3,0),'OPEN',NULLIF(left(btrim($4),500),''),now(),now() FROM locked l
      WHERE NOT EXISTS(SELECT 1 FROM cash_sessions cs WHERE cs.tenant_id=l.tenant_id AND cs.branch_id=l.id AND cs.status='OPEN')
      RETURNING *
    ), movement AS (
      INSERT INTO cash_movements(id,tenant_id,session_id,movement_type,amount_cents,description,created_by_uid,created_at)
      SELECT gen_random_uuid(),tenant_id,id,'OPENING',opening_amount_cents,'Abertura de caixa',$1,now() FROM opened WHERE opening_amount_cents>0 RETURNING id
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Vendas','CAIXA','OPEN','CashSession',id::text,'Caixa aberto',true,'SQL_CONNECT',jsonb_build_object('branchId',branch_id,'openingAmountCents',opening_amount_cents),now() FROM opened
  """,params:[{_expr:"auth.uid"},$branchId,$openingAmountCents,$notes])
}

mutation RegisterCashMovement($sessionId: UUID!, $movementType: String!, $amountCents: Int64!, $description: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_manage,rp.can_manage,false)
    ), input AS (
      SELECT a.*,cs.id session_id,upper(btrim($3)) movement_type,abs($4)::bigint amount,btrim($5) description
      FROM actor a JOIN cash_sessions cs ON cs.id=$2 AND cs.tenant_id=a.tenant_id AND cs.status='OPEN'
    ), inserted AS (
      INSERT INTO cash_movements(id,tenant_id,session_id,movement_type,amount_cents,description,created_by_uid,created_at)
      SELECT gen_random_uuid(),tenant_id,session_id,movement_type,CASE WHEN movement_type='WITHDRAWAL' THEN -amount ELSE amount END,left(description,180),$1,now()
      FROM input WHERE movement_type IN('SUPPLY','WITHDRAWAL') AND amount>0 AND length(description)>=3 RETURNING *
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Vendas','CAIXA',movement_type,'CashMovement',id::text,description,true,'SQL_CONNECT',jsonb_build_object('sessionId',session_id,'amountCents',amount_cents),now() FROM inserted
  """,params:[{_expr:"auth.uid"},$sessionId,$movementType,$amountCents,$description])
}

mutation ClaimDeviceSession($sessionToken: String!, $deviceId: String!, $deviceName: String!) @auth(level: USER) {
  _execute(sql: """
    INSERT INTO user_device_sessions(user_id,tenant_id,session_token,device_id,device_name,claimed_at,last_seen_at)
    SELECT u.id,u.tenant_id,left($2,128),left($3,128),left($4,180),now(),now()
    FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
    WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND length($2)>=32 AND length($3)>=16
    ON CONFLICT(user_id) DO UPDATE SET tenant_id=EXCLUDED.tenant_id,session_token=EXCLUDED.session_token,device_id=EXCLUDED.device_id,device_name=EXCLUDED.device_name,claimed_at=now(),last_seen_at=now()
  """,params:[{_expr:"auth.uid"},$sessionToken,$deviceId,$deviceName])
}

mutation TouchDeviceSession($sessionToken: String!) @auth(level: USER) {
  _execute(sql: """
    UPDATE user_device_sessions SET last_seen_at=now() WHERE user_id=$1 AND session_token=$2
  """,params:[{_expr:"auth.uid"},$sessionToken])
}

mutation ReleaseDeviceSession($sessionToken: String!) @auth(level: USER) {
  _execute(sql: """
    DELETE FROM user_device_sessions WHERE user_id=$1 AND session_token=$2
  """,params:[{_expr:"auth.uid"},$sessionToken])
}

mutation CreateSalesChannelConnection($provider: String!, $branchId: UUID!, $displayName: String!, $externalStoreId: String!, $catalogProfile: String = "UNVERIFIED") @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)
    ), inserted AS (
      INSERT INTO sales_channel_connections(tenant_id,branch_id,connection_key,external_store_key,provider_store_key,catalog_profile,provider,display_name,external_store_id,status,authorization_status,integration_mode,webhook_status,enabled,active,created_at,updated_at)
      SELECT a.tenant_id,b.id,concat(a.tenant_id,':',b.id,':',upper(btrim($2))),
        CASE WHEN btrim($5)='' THEN NULL ELSE concat(a.tenant_id,':',upper(btrim($2)),':',left(btrim($5),160)) END,
        CASE WHEN btrim($5)='' THEN NULL ELSE concat(upper(btrim($2)),':',left(btrim($5),160)) END,
        CASE WHEN $6 IN ('UNVERIFIED','RESTAURANT','GROCERY') THEN $6 ELSE 'UNVERIFIED' END,upper(btrim($2)),left(btrim($4),160),NULLIF(left(btrim($5),160),''),'DRAFT','NOT_CONNECTED',
        CASE WHEN upper(btrim($2))='IFOOD' THEN 'POLLING' WHEN upper(btrim($2))='ZE_DELIVERY' THEN 'HYBRID' ELSE 'WEBHOOK' END,
        'NOT_CONFIGURED',true,true,now(),now()
      FROM actor a JOIN branches b ON b.id=$3 AND b.tenant_id=a.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=b.tenant_id AND ub.branch_id=b.id AND ub.active)) AND b.active AND b.deleted_at IS NULL
      WHERE upper(btrim($2)) IN ('IFOOD','ZE_DELIVERY','NINETYNINE_FOOD') AND length(btrim($4))>=2
        AND NOT EXISTS(SELECT 1 FROM sales_channel_connections c WHERE c.tenant_id=a.tenant_id AND c.branch_id=b.id AND c.provider=upper(btrim($2)) AND c.active AND c.deleted_at IS NULL)
        AND (btrim($5)='' OR NOT EXISTS(SELECT 1 FROM sales_channel_connections c WHERE c.provider=upper(btrim($2)) AND c.external_store_id=btrim($5) AND c.active AND c.deleted_at IS NULL))
      RETURNING id,tenant_id,provider,display_name,branch_id
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT i.tenant_id,$1,'Integrações','CANAIS_VENDA','CREATE','SalesChannelConnection',i.id::text,'Canal de venda preparado',true,'SQL_CONNECT',jsonb_build_object('provider',i.provider,'displayName',i.display_name,'branchId',i.branch_id),now() FROM inserted i
  """,params:[{_expr:"auth.uid"},$provider,$branchId,$displayName,$externalStoreId,$catalogProfile])
}

mutation UpdateSalesChannelConnection($id: UUID!, $displayName: String!, $externalStoreId: String!, $enabled: Boolean!, $catalogProfile: String) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_update,rp.can_update,false)
    ), changed AS (
      UPDATE sales_channel_connections c SET display_name=left(btrim($3),160),external_store_id=NULLIF(left(btrim($4),160),''),
        external_store_key=CASE WHEN btrim($4)='' THEN NULL ELSE concat(c.tenant_id,':',c.provider,':',left(btrim($4),160)) END,
        provider_store_key=CASE WHEN btrim($4)='' THEN NULL ELSE concat(c.provider,':',left(btrim($4),160)) END,
        catalog_profile=CASE WHEN $6 IN ('UNVERIFIED','RESTAURANT','GROCERY') THEN $6 ELSE c.catalog_profile END,
        status=CASE WHEN COALESCE(c.external_store_id,'')<>btrim($4) THEN 'DRAFT' ELSE c.status END,
        authorization_status=CASE WHEN COALESCE(c.external_store_id,'')<>btrim($4) THEN 'NOT_CONNECTED' ELSE c.authorization_status END,
        authorized_at=CASE WHEN COALESCE(c.external_store_id,'')<>btrim($4) THEN NULL ELSE c.authorized_at END,
        capabilities=CASE WHEN COALESCE(c.external_store_id,'')<>btrim($4) THEN NULL ELSE c.capabilities END,
        webhook_status=CASE WHEN COALESCE(c.external_store_id,'')<>btrim($4) THEN 'NOT_CONFIGURED' ELSE c.webhook_status END,
        enabled=$5,updated_at=now() FROM actor a WHERE c.id=$2 AND c.tenant_id=a.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) AND c.active AND c.deleted_at IS NULL AND length(btrim($3))>=2
        AND (COALESCE(c.external_store_id,'')=btrim($4) OR (
          NOT EXISTS(SELECT 1 FROM sales_channel_product_mappings m WHERE m.connection_id=c.id AND m.active AND m.deleted_at IS NULL)
          AND NOT EXISTS(SELECT 1 FROM sales_channel_orders o WHERE o.connection_id=c.id)
          AND NOT EXISTS(SELECT 1 FROM sales_channel_event_inbox e WHERE e.connection_id=c.id)
          AND NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs j WHERE j.connection_id=c.id AND j.status IN ('QUEUED','RETRY','PROCESSING'))))
        AND (COALESCE($6,c.catalog_profile)=c.catalog_profile OR (
          NOT EXISTS(SELECT 1 FROM sales_channel_product_mappings m WHERE m.connection_id=c.id AND m.active AND m.deleted_at IS NULL)
          AND NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs j WHERE j.connection_id=c.id AND j.status IN ('QUEUED','RETRY','PROCESSING'))))
