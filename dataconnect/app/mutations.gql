# Atomic status changes. Every requested record must be eligible or the whole batch is rejected.
mutation SetCategoriesStatusBatch($ids: Any!, $active: Boolean!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_CATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND CASE WHEN $3 THEN COALESCE(up.can_update,rp.can_update,false) ELSE COALESCE(up.can_delete,rp.can_delete,false) END
    ),input AS (
      SELECT DISTINCT value::uuid id FROM jsonb_array_elements_text(COALESCE($2::jsonb,'[]'::jsonb))
    ),eligible AS (
      SELECT c.id,c.tenant_id,c.name FROM categories c JOIN actor a ON a.tenant_id=c.tenant_id JOIN input i ON i.id=c.id
      WHERE ($3 AND NOT EXISTS(SELECT 1 FROM categories x WHERE x.tenant_id=c.tenant_id AND x.id<>c.id AND x.active AND x.deleted_at IS NULL AND lower(btrim(x.name))=lower(btrim(c.name))))
         OR (NOT $3 AND NOT EXISTS(SELECT 1 FROM subcategories s WHERE s.tenant_id=c.tenant_id AND s.category_id=c.id AND s.active AND s.deleted_at IS NULL)
                    AND NOT EXISTS(SELECT 1 FROM products p WHERE p.tenant_id=c.tenant_id AND p.category_id=c.id AND p.active AND p.deleted_at IS NULL))
    ),changed AS (
      UPDATE categories c SET active=$3,deleted_at=CASE WHEN $3 THEN NULL ELSE now() END,updated_at=now()
      FROM eligible e WHERE c.id=e.id
        AND (SELECT count(*) FROM input)>0 AND (SELECT count(*) FROM eligible)=(SELECT count(*) FROM input)
      RETURNING c.id,c.tenant_id,c.name
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Cadastros','CAD_CATEGORIA',CASE WHEN $3 THEN 'RESTORE' ELSE 'ARCHIVE' END,'Category',id::text,
      'Status da categoria alterado em lote',true,'SQL_CONNECT',jsonb_build_object('active',$3,'name',name),now() FROM changed
  """,params:[{_expr:"auth.uid"},$ids,$active])
}

mutation SetSubcategoriesStatusBatch($ids: Any!, $active: Boolean!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u
      JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAD_SUBCATEGORIA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL
        AND CASE WHEN $3 THEN COALESCE(up.can_update,rp.can_update,false) ELSE COALESCE(up.can_delete,rp.can_delete,false) END
    ),input AS (SELECT DISTINCT value::uuid id FROM jsonb_array_elements_text(COALESCE($2::jsonb,'[]'::jsonb))),
    eligible AS (
      SELECT s.id,s.tenant_id,s.name FROM subcategories s JOIN actor a ON a.tenant_id=s.tenant_id JOIN input i ON i.id=s.id
      JOIN categories c ON c.id=s.category_id AND c.tenant_id=s.tenant_id
      WHERE ($3 AND c.active AND c.deleted_at IS NULL AND NOT EXISTS(
              SELECT 1 FROM subcategories x WHERE x.tenant_id=s.tenant_id AND x.id<>s.id AND x.category_id=s.category_id
                AND x.active AND x.deleted_at IS NULL AND lower(btrim(x.name))=lower(btrim(s.name))))
         OR (NOT $3 AND NOT EXISTS(SELECT 1 FROM products p WHERE p.tenant_id=s.tenant_id AND p.subcategory_id=s.id AND p.active AND p.deleted_at IS NULL))
    ),changed AS (
      UPDATE subcategories s SET active=$3,deleted_at=CASE WHEN $3 THEN NULL ELSE now() END,updated_at=now()
      FROM eligible e WHERE s.id=e.id AND (SELECT count(*) FROM input)>0
        AND (SELECT count(*) FROM eligible)=(SELECT count(*) FROM input)
      RETURNING s.id,s.tenant_id,s.name
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Cadastros','CAD_SUBCATEGORIA',CASE WHEN $3 THEN 'RESTORE' ELSE 'ARCHIVE' END,'Subcategory',id::text,
      'Status da subcategoria alterado em lote',true,'SQL_CONNECT',jsonb_build_object('active',$3,'name',name),now() FROM changed
  """,params:[{_expr:"auth.uid"},$ids,$active])
}

