# Atomic and idempotent sale posting. Monetary values and stock requirements are
# recalculated in PostgreSQL; the browser never defines tenant, cost or final totals.
mutation EnsureSalesDefaults @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_access,rp.can_access,false)
    ),defaults(code,name,requires_change) AS (VALUES ('CASH','Dinheiro',true),('PIX','PIX',false),('CREDIT_CARD','Cartão de crédito',false),('DEBIT_CARD','Cartão de débito',false)),
    methods AS (INSERT INTO payment_methods(id,tenant_id,code,name,requires_change,active,created_at,updated_at) SELECT gen_random_uuid(),a.tenant_id,d.code,d.name,d.requires_change,true,now(),now() FROM actor a CROSS JOIN defaults d WHERE NOT EXISTS(SELECT 1 FROM payment_methods p WHERE p.tenant_id=a.tenant_id AND p.code=d.code) RETURNING id),
    movement AS (INSERT INTO stock_movement_types(id,tenant_id,code,name,direction,active,created_at,updated_at) SELECT gen_random_uuid(),a.tenant_id,'SALE','Saída por venda','OUT',true,now(),now() FROM actor a WHERE NOT EXISTS(SELECT 1 FROM stock_movement_types mt WHERE mt.tenant_id=a.tenant_id AND mt.code='SALE') RETURNING id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,summary,success,origin,after_data,created_at)
      SELECT a.tenant_id,a.id,'Vendas','CAIXA','BOOTSTRAP','SalesCatalog','Catálogos de venda inicializados',true,'SQL_CONNECT',jsonb_build_object('paymentMethods',(SELECT count(*) FROM methods),'movementTypes',(SELECT count(*) FROM movement)),now() FROM actor a
      WHERE (SELECT count(*) FROM methods)+(SELECT count(*) FROM movement)>0
  """,params:[{_expr:"auth.uid"}])
}

mutation PostSale($payload: Any!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id,COALESCE(up.can_manage,rp.can_manage,false) can_manage
      FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_create,rp.can_create,false)
    ),input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j),header AS (
      SELECT a.*,i.j,(i.j->>'branchId')::uuid branch_id,NULLIF(i.j->>'customerId','')::uuid customer_id,
        NULLIF(i.j->>'cashSessionId','')::uuid cash_session_id,NULLIF(i.j->>'replacesSaleId','')::uuid replaces_sale_id,btrim(i.j->>'clientOperationId') operation_id,
        GREATEST(COALESCE((i.j->>'discountCents')::bigint,0),0) requested_discount,
        GREATEST(COALESCE((i.j->>'surchargeCents')::bigint,0),0) surcharge
      FROM actor a CROSS JOIN input i
    ),raw_items AS (
      SELECT h.*,x.product_id,x.quantity,x.requested_price
      FROM header h CROSS JOIN LATERAL jsonb_to_recordset(COALESCE(h.j->'items','[]'::jsonb)) AS x(product_id uuid,quantity numeric,requested_price bigint)
      WHERE x.quantity>0
    ),priced AS (
      SELECT r.*,p.name,p.weighted_product,p.bundle_product,p.allow_negative_stock,p.cost_price_cents,
        p.sale_price_cents list_price,COALESCE(pr.promotional_price_cents,p.sale_price_cents) effective_price,
        CASE WHEN r.can_manage AND r.requested_price IS NOT NULL AND r.requested_price>=0 THEN r.requested_price ELSE COALESCE(pr.promotional_price_cents,p.sale_price_cents) END unit_price
      FROM raw_items r JOIN products p ON p.id=r.product_id AND p.tenant_id=r.tenant_id AND p.active AND p.deleted_at IS NULL
      LEFT JOIN LATERAL (SELECT promotional_price_cents FROM promotions q WHERE q.tenant_id=p.tenant_id AND q.product_id=p.id AND q.active AND q.deleted_at IS NULL AND now()>=q.starts_at AND now()<q.ends_at ORDER BY promotional_price_cents,id LIMIT 1) pr ON true
      WHERE (p.weighted_product OR r.quantity=trunc(r.quantity))
    ),totals AS (
      SELECT h.*,COUNT(ri.product_id) raw_count,COUNT(p.product_id) valid_count,COALESCE(SUM(round(p.quantity*p.unit_price)),0)::bigint subtotal
      FROM header h LEFT JOIN raw_items ri ON true LEFT JOIN priced p ON p.product_id=ri.product_id AND p.quantity=ri.quantity
      GROUP BY h.id,h.tenant_id,h.can_manage,h.j,h.branch_id,h.customer_id,h.cash_session_id,h.replaces_sale_id,h.operation_id,h.requested_discount,h.surcharge
    ),payments AS (
      SELECT h.tenant_id,x.payment_method_id,x.amount_cents,x.sequence,x.external_reference,pm.requires_change
      FROM header h CROSS JOIN LATERAL jsonb_to_recordset(COALESCE(h.j->'payments','[]'::jsonb)) AS x(payment_method_id uuid,amount_cents bigint,sequence int,external_reference text)
      JOIN payment_methods pm ON pm.id=x.payment_method_id AND pm.tenant_id=h.tenant_id AND pm.active WHERE x.amount_cents>0
    ),payment_total AS (SELECT COALESCE(SUM(amount_cents),0)::bigint amount,COUNT(*) count,COALESCE(bool_or(requires_change),false) has_change FROM payments),
    required_stock AS (
      SELECT p.tenant_id,p.branch_id,COALESCE(pc.component_product_id,p.product_id) product_id,
        SUM(p.quantity*COALESCE(pc.quantity,1)) quantity
      FROM priced p LEFT JOIN product_components pc ON pc.tenant_id=p.tenant_id AND pc.parent_product_id=p.product_id AND p.bundle_product
      GROUP BY p.tenant_id,p.branch_id,COALESCE(pc.component_product_id,p.product_id)
    ),eligible AS (
      SELECT t.*,pt.amount payment_amount,(pt.amount-(t.subtotal-t.requested_discount+t.surcharge))::bigint change_amount
      FROM totals t CROSS JOIN payment_total pt
      JOIN branches b ON b.id=t.branch_id AND b.tenant_id=t.tenant_id AND b.active AND b.deleted_at IS NULL
      LEFT JOIN customers c ON c.id=t.customer_id AND c.tenant_id=t.tenant_id AND c.active AND c.deleted_at IS NULL
      LEFT JOIN cash_sessions cs ON cs.id=t.cash_session_id AND cs.tenant_id=t.tenant_id AND cs.branch_id=t.branch_id AND cs.status='OPEN'
      WHERE length(t.operation_id) BETWEEN 8 AND 100 AND t.raw_count>0 AND t.raw_count=t.valid_count
        AND t.requested_discount<=t.subtotal AND t.subtotal-t.requested_discount+t.surcharge>=0
        AND pt.count>0 AND pt.amount>=t.subtotal-t.requested_discount+t.surcharge
        AND (pt.amount=t.subtotal-t.requested_discount+t.surcharge OR pt.has_change)
        AND (t.customer_id IS NULL OR c.id IS NOT NULL) AND (t.cash_session_id IS NULL OR cs.id IS NOT NULL)
        AND NOT EXISTS(SELECT 1 FROM sales old WHERE old.tenant_id=t.tenant_id AND old.client_operation_id=t.operation_id)
        AND (t.replaces_sale_id IS NULL OR EXISTS(SELECT 1 FROM sales old WHERE old.id=t.replaces_sale_id AND old.tenant_id=t.tenant_id AND old.status='COMPLETED'))
        AND NOT EXISTS(SELECT 1 FROM required_stock rs JOIN products p ON p.id=rs.product_id AND p.tenant_id=rs.tenant_id LEFT JOIN stock_balances sb ON sb.tenant_id=rs.tenant_id AND sb.branch_id=rs.branch_id AND sb.product_id=rs.product_id WHERE NOT p.allow_negative_stock AND COALESCE(sb.quantity,0)<rs.quantity)
    ),sale AS (
      INSERT INTO sales(id,tenant_id,branch_id,customer_id,cash_session_id,replaces_sale_id,client_operation_id,status,subtotal_cents,discount_cents,surcharge_cents,total_cents,change_cents,sold_at,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),tenant_id,branch_id,customer_id,cash_session_id,replaces_sale_id,operation_id,'COMPLETED',subtotal,requested_discount,surcharge,subtotal-requested_discount+surcharge,change_amount,now(),id,now(),now() FROM eligible RETURNING *
    ),item_base AS (
      SELECT s.id sale_id,p.*,s.discount_cents,ROW_NUMBER() OVER(ORDER BY p.product_id) rn,COUNT(*) OVER() cnt,
        CASE WHEN s.subtotal_cents=0 THEN 0 ELSE floor(s.discount_cents*(round(p.quantity*p.unit_price)::numeric/s.subtotal_cents))::bigint END allocated_discount
      FROM sale s JOIN priced p ON p.tenant_id=s.tenant_id
    ),items AS (
      INSERT INTO sale_items(id,tenant_id,sale_id,product_id,quantity,unit_list_price_cents,unit_sale_price_cents,unit_cost_cents,discount_cents,total_cents,status,created_at,updated_at)
      SELECT gen_random_uuid(),tenant_id,sale_id,product_id,quantity,list_price,unit_price,cost_price_cents,
        CASE WHEN rn=cnt THEN discount_cents-COALESCE(SUM(allocated_discount) OVER(ORDER BY rn ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING),0) ELSE allocated_discount END,
        round(quantity*unit_price)-(CASE WHEN rn=cnt THEN discount_cents-COALESCE(SUM(allocated_discount) OVER(ORDER BY rn ROWS BETWEEN UNBOUNDED PRECEDING AND 1 PRECEDING),0) ELSE allocated_discount END),'ACTIVE',now(),now() FROM item_base RETURNING *
    ),payment_rows AS (
      INSERT INTO sale_payments(id,tenant_id,sale_id,payment_method_id,amount_cents,sequence,external_reference,status,created_at)
      SELECT gen_random_uuid(),s.tenant_id,s.id,p.payment_method_id,p.amount_cents,COALESCE(p.sequence,1),NULLIF(btrim(p.external_reference),''),'CONFIRMED',now() FROM sale s JOIN payments p ON p.tenant_id=s.tenant_id RETURNING id
    ),movement_type AS (
      INSERT INTO stock_movement_types(id,tenant_id,code,name,direction,active,created_at,updated_at)
      SELECT gen_random_uuid(),s.tenant_id,'SALE','Saída por venda','OUT',true,now(),now() FROM sale s
      WHERE NOT EXISTS(SELECT 1 FROM stock_movement_types x WHERE x.tenant_id=s.tenant_id AND x.code='SALE') RETURNING id,tenant_id
    ),movement_type_selected AS (SELECT id,tenant_id FROM movement_type UNION ALL SELECT mt.id,mt.tenant_id FROM stock_movement_types mt JOIN sale s ON s.tenant_id=mt.tenant_id WHERE mt.code='SALE' LIMIT 1),
    movements AS (
      INSERT INTO stock_movements(id,tenant_id,branch_id,product_id,movement_type_id,sale_id,client_operation_id,quantity,unit_gross_cents,unit_cost_cents,occurred_at,status,created_by_uid,created_at)
      SELECT gen_random_uuid(),s.tenant_id,s.branch_id,rs.product_id,mt.id,s.id,s.client_operation_id,rs.quantity,0,p.cost_price_cents,now(),'POSTED',s.created_by_uid,now()
      FROM sale s JOIN required_stock rs ON rs.tenant_id=s.tenant_id AND rs.branch_id=s.branch_id JOIN products p ON p.id=rs.product_id AND p.tenant_id=rs.tenant_id JOIN movement_type_selected mt ON mt.tenant_id=s.tenant_id RETURNING product_id,tenant_id,branch_id,quantity
    ),balances AS (
      INSERT INTO stock_balances(tenant_id,branch_id,product_id,quantity,average_cost_cents,version,updated_at)
      SELECT tenant_id,branch_id,product_id,-quantity,0,1,now() FROM movements
      ON CONFLICT(branch_id,product_id) DO UPDATE SET quantity=stock_balances.quantity+EXCLUDED.quantity,version=stock_balances.version+1,updated_at=now() RETURNING product_id
    ),cash AS (
      INSERT INTO cash_movements(id,tenant_id,session_id,sale_id,movement_type,amount_cents,description,created_by_uid,created_at)
      SELECT gen_random_uuid(),s.tenant_id,s.cash_session_id,s.id,'SALE',cash_payment.amount,'Venda '||s.id::text,s.created_by_uid,now()
      FROM sale s JOIN LATERAL(SELECT GREATEST(COALESCE(sum(sp.amount_cents),0)-s.change_cents,0)::bigint amount FROM sale_payments sp JOIN payment_methods pm ON pm.id=sp.payment_method_id AND pm.tenant_id=sp.tenant_id WHERE sp.sale_id=s.id AND sp.status='CONFIRMED' AND pm.requires_change)cash_payment ON cash_payment.amount>0
      WHERE s.cash_session_id IS NOT NULL RETURNING id
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
      SELECT s.tenant_id,s.created_by_uid,'Vendas','CAIXA','CREATE','Sale',s.id::text,'Venda concluída',true,'SQL_CONNECT',jsonb_build_object('totalCents',s.total_cents,'branchId',s.branch_id,'operationId',s.client_operation_id),now() FROM sale s
  """,params:[{_expr:"auth.uid"},$payload])
}

mutation CancelSale($saleId: UUID!, $reason: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active
      JOIN app_pages pg ON pg.page_key='GESTAO_VENDAS' AND pg.active LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_delete,rp.can_delete,false)
    ),cancelled AS (
      UPDATE sales s SET status='CANCELLED',cancelled_at=now(),cancellation_reason=left(btrim($3),255),updated_at=now() FROM actor a WHERE s.id=$2 AND s.tenant_id=a.tenant_id AND s.status='COMPLETED' AND length(btrim($3))>=5 RETURNING s.*
    ),items AS (UPDATE sale_items i SET status='CANCELLED',updated_at=now() FROM cancelled s WHERE i.sale_id=s.id AND i.tenant_id=s.tenant_id AND i.status='ACTIVE' RETURNING i.id),
    payments AS (UPDATE sale_payments p SET status='CANCELLED' FROM cancelled s WHERE p.sale_id=s.id AND p.tenant_id=s.tenant_id AND p.status='CONFIRMED' RETURNING p.id),
    reversed AS (UPDATE stock_movements m SET status='REVERSED',reversed_at=now() FROM cancelled s WHERE m.sale_id=s.id AND m.tenant_id=s.tenant_id AND m.status='POSTED' RETURNING m.tenant_id,m.branch_id,m.product_id,m.quantity),
    balances AS (UPDATE stock_balances b SET quantity=b.quantity+r.quantity,version=b.version+1,updated_at=now() FROM reversed r WHERE b.tenant_id=r.tenant_id AND b.branch_id=r.branch_id AND b.product_id=r.product_id RETURNING b.product_id),
    cash AS (INSERT INTO cash_movements(id,tenant_id,session_id,sale_id,movement_type,amount_cents,description,created_by_uid,created_at) SELECT gen_random_uuid(),s.tenant_id,s.cash_session_id,s.id,'SALE_REVERSAL',-original.amount,'Cancelamento: '||left(btrim($3),120),$1,now() FROM cancelled s JOIN LATERAL(SELECT COALESCE(sum(cm.amount_cents),0)::bigint amount FROM cash_movements cm WHERE cm.sale_id=s.id AND cm.movement_type='SALE')original ON original.amount>0 WHERE s.cash_session_id IS NOT NULL RETURNING id)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,before_data,after_data,created_at)
      SELECT tenant_id,$1,'Vendas','GESTAO_VENDAS','CANCEL','Sale',id::text,'Venda cancelada',true,'SQL_CONNECT',jsonb_build_object('status','COMPLETED','totalCents',total_cents),jsonb_build_object('status','CANCELLED','reason',cancellation_reason),now() FROM cancelled
  """,params:[{_expr:"auth.uid"},$saleId,$reason])
}

