    id: "10000000-0000-4000-8000-000000000001"
    pageKey: "CAIXA"
    displayName: "Frente de Caixa"
    module: "Vendas"
    route: "/vendas/frente-de-caixa"
    icon: "shopping-cart"
    displayOrder: 10
    requiresLogin: true
    active: true
