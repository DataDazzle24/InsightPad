      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_manage,rp.can_manage,false)
    ), input AS (
      SELECT a.*,upper(btrim($3)) scope,left(btrim($4),150) request_key FROM actor a
      WHERE upper(btrim($3)) IN ('CATALOG','PRICE','STOCK','FULL') AND length(btrim($4)) BETWEEN 8 AND 150
    ), queued AS (
      INSERT INTO sales_channel_sync_jobs(id,tenant_id,connection_id,job_key,provider,job_type,status,scheduled_at,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),c.tenant_id,c.id,concat(c.tenant_id,':SYNC:',c.id,':',i.scope,':',i.request_key),c.provider,i.scope,'QUEUED',now(),i.id,now(),now()
      FROM sales_channel_connections c JOIN input i ON i.tenant_id=c.tenant_id
      WHERE c.id=$2 AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND c.catalog_profile='RESTAURANT'
        AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active))
        AND NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs j WHERE j.connection_id=c.id AND j.status IN ('QUEUED','RETRY','PROCESSING'))
      ON CONFLICT(job_key) DO NOTHING RETURNING *
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT q.tenant_id,$1,'Integrações','CANAIS_VENDA','SYNC_REQUEST','SalesChannelSyncJob',q.id::text,'Sincronização de canal solicitada',true,'SQL_CONNECT',jsonb_build_object('connectionId',q.connection_id,'scope',q.job_type),now() FROM queued q
  """,params:[{_expr:"auth.uid"},$connectionId,$scope,$requestKey])
}

# Starts a server-side credential and merchant ownership check. No credential is
# accepted from the browser; the adapter reads the environment-specific iFood
# application secret directly from Secret Manager.
mutation RequestSalesChannelAuthorization($connectionId: UUID!, $requestKey: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL
      JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL
      JOIN app_pages p ON p.page_key='CANAIS_VENDA' AND p.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=p.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=p.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND (u.blocked_until IS NULL OR u.blocked_until<=now()) AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_manage,rp.can_manage,false)
    ), input AS (
      SELECT a.*,left(btrim($3),150) request_key FROM actor a WHERE length(btrim($3)) BETWEEN 8 AND 150
    ), connection AS (
      UPDATE sales_channel_connections c SET status='PENDING_APPROVAL',authorization_status='PENDING',last_error=NULL,updated_at=now()
      FROM input i WHERE c.id=$2 AND c.tenant_id=i.tenant_id AND (NOT EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1) OR EXISTS(SELECT 1 FROM user_branches ub WHERE ub.user_id=$1 AND ub.tenant_id=c.tenant_id AND ub.branch_id=c.branch_id AND ub.active)) AND c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL AND c.enabled
        AND c.authorization_status NOT IN ('PENDING')
        AND (c.external_store_id IS NULL OR NOT EXISTS(
          SELECT 1 FROM sales_channel_connections other WHERE other.id<>c.id AND other.provider=c.provider
            AND other.external_store_id=c.external_store_id AND other.active AND other.deleted_at IS NULL
        ))
      RETURNING c.*,i.id actor_id,i.request_key
    ), queued AS (
      INSERT INTO sales_channel_sync_jobs(id,tenant_id,connection_id,job_key,provider,job_type,status,scheduled_at,created_by_uid,created_at,updated_at)
      SELECT gen_random_uuid(),c.tenant_id,c.id,concat(c.tenant_id,':AUTH:',c.id,':',c.request_key),c.provider,'AUTHORIZATION','QUEUED',now(),c.actor_id,now(),now()
      FROM connection c WHERE NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs j WHERE j.connection_id=c.id AND j.job_type='AUTHORIZATION' AND j.status IN ('QUEUED','RETRY','PROCESSING'))
      ON CONFLICT(job_key) DO NOTHING RETURNING *
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT q.tenant_id,$1,'Integrações','CANAIS_VENDA','AUTHORIZE_REQUEST','SalesChannelConnection',q.connection_id::text,'Validação segura da conexão iFood solicitada',true,'SQL_CONNECT',jsonb_build_object('jobId',q.id,'provider',q.provider),now() FROM queued q
  """,params:[{_expr:"auth.uid"},$connectionId,$requestKey])
}

# Trusted-server operations below are intentionally unavailable to browser users.
# The future partner adapter authenticates separately and stores tokens only in a
# managed secret vault, passing this database only the secret reference.
mutation SystemClaimSalesChannelWork($provider: String!, $workerId: String!, $limit: Int!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (
      SELECT upper(btrim($1)) provider,left(btrim($2),180) worker_id,LEAST(GREATEST($3,1),50) batch_limit
      WHERE (btrim($1)='' OR upper(btrim($1)) IN ('IFOOD','ZE_DELIVERY','NINETYNINE_FOOD')) AND length(btrim($2)) BETWEEN 8 AND 180
    ), command_candidates AS (
      SELECT q.id FROM sales_channel_commands q JOIN sales_channel_connections c ON c.id=q.connection_id AND c.tenant_id=q.tenant_id CROSS JOIN input i
      WHERE (i.provider='' OR q.provider=i.provider) AND c.active AND c.deleted_at IS NULL AND c.enabled AND EXISTS(SELECT 1 FROM tenants tenant WHERE tenant.id=c.tenant_id AND tenant.active AND tenant.deleted_at IS NULL) AND EXISTS(SELECT 1 FROM branches branch WHERE branch.id=c.branch_id AND branch.tenant_id=c.tenant_id AND branch.active AND branch.deleted_at IS NULL) AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND (q.status IN ('QUEUED','RETRY') OR (q.status='PROCESSING' AND q.lease_until<now())) AND q.attempts<8 AND q.scheduled_at<=now()
      ORDER BY q.scheduled_at,q.id FOR UPDATE OF q SKIP LOCKED LIMIT (SELECT batch_limit FROM input)
    ), claimed_commands AS (
      UPDATE sales_channel_commands q SET status='PROCESSING',locked_at=now(),locked_by=i.worker_id,lease_until=now()+interval '2 minutes',updated_at=now()
      FROM command_candidates x CROSS JOIN input i WHERE q.id=x.id RETURNING q.id
    ), event_candidates AS (
      SELECT e.id FROM sales_channel_event_inbox e JOIN sales_channel_connections c ON c.id=e.connection_id AND c.tenant_id=e.tenant_id CROSS JOIN input i
      WHERE (i.provider='' OR e.provider=i.provider) AND c.active AND c.deleted_at IS NULL AND c.enabled AND EXISTS(SELECT 1 FROM tenants tenant WHERE tenant.id=c.tenant_id AND tenant.active AND tenant.deleted_at IS NULL) AND EXISTS(SELECT 1 FROM branches branch WHERE branch.id=c.branch_id AND branch.tenant_id=c.tenant_id AND branch.active AND branch.deleted_at IS NULL)
        AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED' AND (e.status='RECEIVED' OR (e.status='PROCESSING' AND e.lease_until<now()) OR (e.status='ERROR' AND e.attempts<12 AND e.updated_at<=now()-(interval '5 seconds'*LEAST(180,power(2,e.attempts)::int))))
      ORDER BY e.received_at,e.id FOR UPDATE OF e SKIP LOCKED LIMIT (SELECT batch_limit FROM input)
    ), claimed_events AS (
      UPDATE sales_channel_event_inbox e SET status='PROCESSING',locked_by=i.worker_id,lease_until=now()+interval '2 minutes',updated_at=now()
      FROM event_candidates x CROSS JOIN input i WHERE e.id=x.id RETURNING e.id
    ), job_candidates AS (
      SELECT j.id FROM sales_channel_sync_jobs j JOIN sales_channel_connections c ON c.id=j.connection_id AND c.tenant_id=j.tenant_id CROSS JOIN input i
      WHERE (i.provider='' OR j.provider=i.provider) AND c.active AND c.deleted_at IS NULL AND c.enabled AND EXISTS(SELECT 1 FROM tenants tenant WHERE tenant.id=c.tenant_id AND tenant.active AND tenant.deleted_at IS NULL) AND EXISTS(SELECT 1 FROM branches branch WHERE branch.id=c.branch_id AND branch.tenant_id=c.tenant_id AND branch.active AND branch.deleted_at IS NULL)
        AND ((j.job_type='AUTHORIZATION' AND c.status IN ('DRAFT','PENDING_APPROVAL','ERROR') AND c.authorization_status IN ('NOT_CONNECTED','PENDING','PENDING_APPROVAL','EXPIRED','REVOKED','ERROR'))
          OR (j.job_type<>'AUTHORIZATION' AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'))
        AND (j.status IN ('QUEUED','RETRY') OR (j.status='PROCESSING' AND j.lease_until<now())) AND j.attempts<8 AND j.scheduled_at<=now()
        AND NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs other WHERE other.connection_id=j.connection_id AND other.id<>j.id AND ((other.status='PROCESSING' AND other.lease_until>now()) OR (other.status IN ('QUEUED','RETRY') AND (other.scheduled_at,other.id)<(j.scheduled_at,j.id))))
      ORDER BY j.scheduled_at,j.id FOR UPDATE OF j SKIP LOCKED LIMIT (SELECT batch_limit FROM input)
    ), claimed_jobs AS (
      UPDATE sales_channel_sync_jobs j SET status='PROCESSING',locked_by=i.worker_id,lease_until=now()+interval '5 minutes',started_at=COALESCE(j.started_at,now()),updated_at=now()
      FROM job_candidates x CROSS JOIN input i WHERE j.id=x.id RETURNING j.id
    ) SELECT (SELECT count(*) FROM claimed_commands)+(SELECT count(*) FROM claimed_events)+(SELECT count(*) FROM claimed_jobs)
  """,params:[$provider,$workerId,$limit])
}

mutation SystemUpdateSalesChannelConnection($connectionId: UUID!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j), changed AS (
      UPDATE sales_channel_connections c SET
        external_store_id=COALESCE(NULLIF(left(btrim(i.j->>'externalStoreId'),160),''),c.external_store_id),
        external_store_key=CASE WHEN NULLIF(btrim(i.j->>'externalStoreId'),'') IS NULL THEN c.external_store_key ELSE concat(c.tenant_id,':',c.provider,':',left(btrim(i.j->>'externalStoreId'),160)) END,
        provider_store_key=CASE WHEN NULLIF(btrim(i.j->>'externalStoreId'),'') IS NULL THEN c.provider_store_key ELSE concat(c.provider,':',left(btrim(i.j->>'externalStoreId'),160)) END,
        status=CASE WHEN upper(i.j->>'status') IN ('DRAFT','PENDING_APPROVAL','ACTIVE','ERROR','SUSPENDED') THEN upper(i.j->>'status') ELSE c.status END,
        authorization_status=CASE WHEN upper(i.j->>'authorizationStatus') IN ('NOT_CONNECTED','PENDING','PENDING_APPROVAL','AUTHORIZED','EXPIRED','REVOKED','ERROR') THEN upper(i.j->>'authorizationStatus') ELSE c.authorization_status END,
        secret_reference=COALESCE(NULLIF(left(btrim(i.j->>'secretReference'),500),''),c.secret_reference),
        authorized_at=CASE WHEN upper(i.j->>'authorizationStatus')='AUTHORIZED' THEN COALESCE(c.authorized_at,now()) ELSE c.authorized_at END,
        integration_mode=CASE WHEN upper(i.j->>'integrationMode') IN ('POLLING','WEBHOOK','HYBRID') THEN upper(i.j->>'integrationMode') ELSE c.integration_mode END,
        webhook_status=CASE WHEN upper(i.j->>'webhookStatus') IN ('NOT_CONFIGURED','PENDING','ACTIVE','ERROR','DISABLED') THEN upper(i.j->>'webhookStatus') ELSE c.webhook_status END,
        token_expires_at=CASE WHEN NULLIF(i.j->>'tokenExpiresAt','') IS NULL THEN c.token_expires_at ELSE (i.j->>'tokenExpiresAt')::timestamptz END,
        last_health_check_at=now(),last_success_at=CASE WHEN COALESCE((i.j->>'success')::boolean,true) THEN now() ELSE c.last_success_at END,
        last_request_id=NULLIF(left(btrim(i.j->>'requestId'),180),''),last_error=NULLIF(left(btrim(i.j->>'error'),1000),''),
        consecutive_failures=CASE WHEN COALESCE((i.j->>'success')::boolean,true) THEN 0 ELSE LEAST(c.consecutive_failures+1,100000) END,
        capabilities=COALESCE(i.j->'capabilities',c.capabilities),updated_at=now()
      FROM input i WHERE c.id=$1 AND c.active AND c.enabled AND c.deleted_at IS NULL
        AND (NOT (i.j ? 'jobId') OR (COALESCE(c.external_store_id,'')=COALESCE(i.j->>'expectedExternalStoreId','') AND EXISTS(SELECT 1 FROM sales_channel_sync_jobs j WHERE j.id=(i.j->>'jobId')::uuid AND j.connection_id=c.id AND j.tenant_id=c.tenant_id AND j.status='PROCESSING' AND j.locked_by=i.j->>'workerId' AND j.lease_until>now()))) RETURNING c.id
    ) SELECT count(*) FROM changed
  """,params:[$connectionId,$payload])
}

mutation SystemRegisterSalesChannelEvent($connectionId: UUID!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j), connection AS (
      SELECT c.* FROM sales_channel_connections c,input i WHERE c.id=$1 AND c.active AND c.deleted_at IS NULL AND c.enabled
        AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND length(btrim(i.j->>'eventId')) BETWEEN 1 AND 200 AND length(btrim(i.j->>'eventType')) BETWEEN 1 AND 100
        AND btrim(i.j->>'payloadHash') ~ '^[0-9a-f]{64}$'
        AND octet_length(COALESCE((i.j->'payload')::text,''))<=262144
    ), inserted AS (
      INSERT INTO sales_channel_event_inbox(id,tenant_id,connection_id,event_key,provider,provider_event_id,event_type,request_id,payload_hash,payload,contains_personal_data,status,attempts,received_at,retention_until,created_at,updated_at)
      SELECT gen_random_uuid(),c.tenant_id,c.id,concat(c.tenant_id,':',c.provider,':',left(btrim(i.j->>'eventId'),200)),c.provider,left(btrim(i.j->>'eventId'),200),left(btrim(i.j->>'eventType'),100),NULLIF(left(btrim(i.j->>'requestId'),180),''),left(btrim(i.j->>'payloadHash'),128),i.j->'payload',COALESCE((i.j->>'containsPersonalData')::boolean,false),'RECEIVED',0,now(),CASE WHEN COALESCE((i.j->>'containsPersonalData')::boolean,false) THEN now()+interval '30 days' ELSE now()+interval '90 days' END,now(),now()
      FROM connection c,input i ON CONFLICT(event_key) DO UPDATE
        SET updated_at=sales_channel_event_inbox.updated_at
        WHERE sales_channel_event_inbox.payload_hash=EXCLUDED.payload_hash
      RETURNING id
    ) SELECT count(*) FROM inserted
  """,params:[$connectionId,$payload])
}

mutation SystemRecordSalesChannelEventResult($eventId: UUID!, $workerId: String!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($3::jsonb,'{}'::jsonb) j), event AS (
      UPDATE sales_channel_event_inbox e SET status=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN CASE WHEN COALESCE((i.j->>'acknowledged')::boolean,false) THEN 'ACKNOWLEDGED' ELSE 'PROCESSED' END ELSE 'ERROR' END,
        attempts=CASE WHEN NOT COALESCE((i.j->>'success')::boolean,false) AND NOT COALESCE((i.j->>'retryable')::boolean,false) THEN 12 ELSE e.attempts+1 END,processed_at=now(),acknowledged_at=CASE WHEN COALESCE((i.j->>'acknowledged')::boolean,false) THEN now() ELSE e.acknowledged_at END,
        locked_by=NULL,lease_until=NULL,last_error=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN NULL ELSE COALESCE(NULLIF(left(btrim(i.j->>'error'),1000),''),'Falha não detalhada no processamento do evento.') END,updated_at=now()
      FROM input i WHERE e.id=$1 AND e.status='PROCESSING' AND e.locked_by=left($2,180) AND e.lease_until>now() AND e.attempts<12 RETURNING e.*
    ), connection_health AS (
      UPDATE sales_channel_connections c SET last_health_check_at=now(),last_success_at=CASE WHEN e.status IN ('PROCESSED','ACKNOWLEDGED') THEN now() ELSE c.last_success_at END,last_request_id=e.request_id,last_error=e.last_error,consecutive_failures=CASE WHEN e.status IN ('PROCESSED','ACKNOWLEDGED') THEN 0 ELSE LEAST(c.consecutive_failures+1,100000) END,updated_at=now()
      FROM event e WHERE c.id=e.connection_id AND c.tenant_id=e.tenant_id RETURNING c.id
    ) SELECT count(*)+(SELECT count(*) FROM connection_health) FROM event
  """,params:[$eventId,$workerId,$payload])
}

mutation SystemIngestSalesChannelOrder($connectionId: UUID!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j), connection AS (
      SELECT c.*,i.j FROM sales_channel_connections c CROSS JOIN input i WHERE c.id=$1 AND c.active AND c.deleted_at IS NULL AND c.enabled
        AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED' AND c.external_store_id=i.j->>'merchantId'
        AND EXISTS(SELECT 1 FROM sales_channel_event_inbox e WHERE e.id=(i.j->>'eventId')::uuid AND e.connection_id=c.id AND e.tenant_id=c.tenant_id AND e.locked_by=i.j->>'workerId' AND e.status='PROCESSING' AND e.lease_until>now())
        AND length(btrim(i.j->>'providerOrderId')) BETWEEN 1 AND 160 AND jsonb_typeof(COALESCE(i.j->'items','[]'::jsonb))='array'
        AND jsonb_array_length(COALESCE(i.j->'items','[]'::jsonb)) BETWEEN 1 AND 300
    ), inserted AS (
      INSERT INTO sales_channel_orders(id,tenant_id,branch_id,connection_id,idempotency_key,provider_order_id,display_code,status,partner_status,command_status,customer_name,order_type,payment_method,delivery_address,notes,subtotal_cents,delivery_fee_cents,discount_cents,total_cents,received_at,status_updated_at,version,created_at,updated_at)
      SELECT gen_random_uuid(),c.tenant_id,c.branch_id,c.id,concat(c.tenant_id,':',c.provider,':',left(btrim(c.j->>'providerOrderId'),160)),left(btrim(c.j->>'providerOrderId'),160),left(COALESCE(NULLIF(btrim(c.j->>'displayCode'),''),btrim(c.j->>'providerOrderId')),80),'PENDING',NULLIF(left(btrim(c.j->>'partnerStatus'),80),''),'IDLE',NULLIF(left(btrim(c.j->>'customerName'),160),''),COALESCE(NULLIF(upper(left(btrim(c.j->>'orderType'),32)),''),'DELIVERY'),NULLIF(left(btrim(c.j->>'paymentMethod'),80),''),NULLIF(c.j->>'deliveryAddress',''),NULLIF(c.j->>'notes',''),GREATEST(COALESCE((c.j->>'subtotalCents')::bigint,0),0),GREATEST(COALESCE((c.j->>'deliveryFeeCents')::bigint,0),0),GREATEST(COALESCE((c.j->>'discountCents')::bigint,0),0),GREATEST(COALESCE((c.j->>'totalCents')::bigint,0),0),COALESCE(NULLIF(c.j->>'receivedAt','')::timestamptz,now()),now(),1,now(),now()
      FROM connection c ON CONFLICT(idempotency_key) DO NOTHING RETURNING *
    ), items AS (
      INSERT INTO sales_channel_order_items(id,tenant_id,order_id,external_item_id,name,quantity,unit_price_cents,total_cents,observation,created_at)
      SELECT gen_random_uuid(),o.tenant_id,o.id,NULLIF(left(btrim(x.external_item_id),160),''),left(btrim(x.name),240),x.quantity,GREATEST(COALESCE(x.unit_price_cents,0),0),GREATEST(COALESCE(x.total_cents,0),0),NULLIF(left(btrim(x.observation),500),''),now()
      FROM inserted o CROSS JOIN input i CROSS JOIN LATERAL jsonb_to_recordset(COALESCE(i.j->'items','[]'::jsonb)) AS x(external_item_id text,name text,quantity numeric,unit_price_cents bigint,total_cents bigint,observation text)
      WHERE length(btrim(x.name))>0 AND x.quantity>0 RETURNING id
    ), history AS (
      INSERT INTO sales_channel_status_history(id,tenant_id,connection_id,order_id,event_id,from_status,to_status,provider_status,origin,correlation_id,created_at)
      SELECT gen_random_uuid(),o.tenant_id,o.connection_id,o.id,NULLIF(i.j->>'eventId','')::uuid,NULL,'PENDING',o.partner_status,'PARTNER_EVENT',o.provider_order_id,now() FROM inserted o CROSS JOIN input i RETURNING id
    ) SELECT count(*)+(SELECT count(*) FROM items)+(SELECT count(*) FROM history) FROM inserted
  """,params:[$connectionId,$payload])
}

# Applies partner events without allowing a stale or duplicated event to move an
# order backwards. The internal inbox event id also makes history idempotent.
mutation SystemApplySalesChannelOrderEvent($connectionId: UUID!, $providerOrderId: String!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT $3::jsonb j), candidate AS (
      SELECT o.id,o.status old_status,o.pending_action,i.j,
        CASE WHEN o.status IN ('COMPLETED','CANCELLED','REJECTED') THEN o.status
          WHEN i.j->>'status' IN ('COMPLETED','CANCELLED','REJECTED') THEN i.j->>'status'
          WHEN o.status='ACCEPTED' THEN o.status ELSE i.j->>'status' END next_status
      FROM sales_channel_orders o JOIN sales_channel_connections c ON c.id=o.connection_id AND c.tenant_id=o.tenant_id CROSS JOIN input i
      JOIN sales_channel_event_inbox e ON e.id=(i.j->>'eventId')::uuid AND e.connection_id=c.id AND e.tenant_id=c.tenant_id
      WHERE o.connection_id=$1 AND o.provider_order_id=$2 AND c.external_store_id=i.j->>'merchantId'
        AND c.active AND c.enabled AND c.deleted_at IS NULL AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED'
        AND e.status='PROCESSING' AND e.locked_by=i.j->>'workerId' AND e.lease_until>now()
        AND i.j->>'status' IN ('PENDING','ACCEPTED','REJECTED','COMPLETED','CANCELLED')
        AND (o.partner_event_at IS NULL OR (i.j->>'occurredAt')::timestamptz>=o.partner_event_at)
        AND (i.j->>'occurredAt')::timestamptz<=now()+interval '5 minutes'
        AND NOT EXISTS(SELECT 1 FROM sales_channel_status_history h WHERE h.event_id=e.id AND h.origin='PARTNER_EVENT_APPLIED')
      FOR UPDATE OF o
    ), changed AS (
      UPDATE sales_channel_orders o SET status=x.next_status,
        partner_status=CASE WHEN x.old_status IN ('COMPLETED','CANCELLED','REJECTED') THEN o.partner_status ELSE left(x.j->>'partnerStatus',80) END,
        partner_event_at=(x.j->>'occurredAt')::timestamptz,
        pending_action=CASE WHEN x.next_status IN ('COMPLETED','CANCELLED','REJECTED') OR (x.next_status='ACCEPTED' AND o.pending_action='ACCEPT') OR (o.pending_action='COMPLETE' AND x.j->>'partnerStatus' IN ('READY_TO_PICKUP','RTP','DISPATCHED','DSP')) THEN NULL ELSE o.pending_action END,
        command_status=CASE WHEN x.next_status IN ('COMPLETED','CANCELLED','REJECTED') OR (x.next_status='ACCEPTED' AND o.pending_action='ACCEPT') OR (o.pending_action='COMPLETE' AND x.j->>'partnerStatus' IN ('READY_TO_PICKUP','RTP','DISPATCHED','DSP')) THEN 'CONFIRMED' ELSE o.command_status END,
        accepted_at=CASE WHEN x.next_status='ACCEPTED' THEN COALESCE(o.accepted_at,(x.j->>'occurredAt')::timestamptz) ELSE o.accepted_at END,
        completed_at=CASE WHEN x.next_status='COMPLETED' THEN COALESCE(o.completed_at,(x.j->>'occurredAt')::timestamptz) ELSE o.completed_at END,
        rejected_at=CASE WHEN x.next_status IN ('REJECTED','CANCELLED') THEN COALESCE(o.rejected_at,(x.j->>'occurredAt')::timestamptz) ELSE o.rejected_at END,
        status_updated_at=now(),version=o.version+1,updated_at=now()
      FROM candidate x WHERE o.id=x.id RETURNING o.*,x.old_status,x.j
    ), confirmed AS (
      UPDATE sales_channel_commands q SET status='CONFIRMED',processed_at=now(),updated_at=now()
      FROM changed o WHERE q.order_id=o.id AND q.tenant_id=o.tenant_id AND q.status='AWAITING_PARTNER' AND o.pending_action IS NULL RETURNING q.id
    ), history AS (
      INSERT INTO sales_channel_status_history(id,tenant_id,connection_id,order_id,event_id,from_status,to_status,provider_status,origin,reason,created_at)
      SELECT gen_random_uuid(),o.tenant_id,o.connection_id,o.id,(o.j->>'eventId')::uuid,o.old_status,o.status,o.partner_status,'PARTNER_EVENT_APPLIED',left(o.j->>'reason',500),now() FROM changed o RETURNING id
    ) SELECT count(*)+(SELECT count(*) FROM history)+(SELECT count(*) FROM confirmed) FROM changed
  """,params:[$connectionId,$providerOrderId,$payload])
}

# Coalesces product, promotion and branch-stock changes into one job per
# connection. Failed mappings remain paused until a user corrects and saves
# them, preventing a permanent partner error from creating an infinite loop.
mutation SystemQueueDueSalesChannelSyncJobs($requestKey: String!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH due AS (
      SELECT DISTINCT c.id,c.tenant_id,c.provider
      FROM sales_channel_connections c
      JOIN sales_channel_product_mappings m ON m.connection_id=c.id AND m.tenant_id=c.tenant_id AND m.active AND m.deleted_at IS NULL AND m.enabled
      JOIN products p ON p.id=m.product_id AND p.tenant_id=m.tenant_id AND p.active AND p.deleted_at IS NULL
      LEFT JOIN stock_balances sb ON sb.tenant_id=m.tenant_id AND sb.branch_id=c.branch_id AND sb.product_id=m.product_id
      LEFT JOIN LATERAL (
        SELECT max(pr.updated_at) updated_at FROM promotions pr
        WHERE pr.tenant_id=p.tenant_id AND pr.product_id=p.id AND pr.deleted_at IS NULL
      ) promotion ON true
      WHERE c.provider='IFOOD' AND c.active AND c.deleted_at IS NULL AND c.enabled AND c.status='ACTIVE' AND c.authorization_status='AUTHORIZED' AND c.catalog_profile='RESTAURANT'
        AND m.sync_status<>'ERROR' AND (m.sync_price OR m.sync_stock)
        AND (m.last_synced_at IS NULL
          OR (m.sync_price AND GREATEST(p.updated_at,COALESCE(promotion.updated_at,p.updated_at))>m.last_synced_at)
          OR (m.sync_stock AND sb.updated_at>m.last_synced_at))
        AND length(btrim($1)) BETWEEN 8 AND 150
        AND NOT EXISTS(SELECT 1 FROM sales_channel_sync_jobs active_job WHERE active_job.connection_id=c.id AND active_job.status IN ('QUEUED','RETRY','PROCESSING'))
    ), queued AS (
      INSERT INTO sales_channel_sync_jobs(id,tenant_id,connection_id,job_key,provider,job_type,status,scheduled_at,created_at,updated_at)
      SELECT gen_random_uuid(),d.tenant_id,d.id,concat(d.tenant_id,':AUTO:',d.id,':',floor(extract(epoch FROM now())/60)::bigint),d.provider,'FULL','QUEUED',now(),now(),now()
      FROM due d ON CONFLICT(job_key) DO NOTHING RETURNING id
    ) SELECT count(*) FROM queued
  """,params:[$requestKey])
}

# Retains immutable operational metadata while removing expired raw partner
# payloads. PII payloads have the shorter retention window set at ingestion.
mutation SystemPurgeExpiredSalesChannelPayloads($requestKey: String!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH purged AS (
      UPDATE sales_channel_event_inbox SET payload='{}'::jsonb,payload_hash='44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a',contains_personal_data=false,updated_at=now()
      WHERE retention_until<now() AND payload<>'{}'::jsonb AND length(btrim($1)) BETWEEN 8 AND 150 RETURNING id
    ) SELECT count(*) FROM purged
  """,params:[$requestKey])
}

mutation SystemRecordSalesChannelCommandResult($commandId: UUID!, $workerId: String!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($3::jsonb,'{}'::jsonb) j), command AS (
      UPDATE sales_channel_commands q SET status=CASE
        WHEN COALESCE((i.j->>'success')::boolean,false) AND EXISTS(
          SELECT 1 FROM sales_channel_orders current_order
          WHERE current_order.id=q.order_id AND current_order.tenant_id=q.tenant_id
            AND current_order.command_status='CONFIRMED'
            AND (current_order.pending_action IS NULL OR current_order.pending_action<>q.action)
        ) THEN 'CONFIRMED'
        WHEN COALESCE((i.j->>'success')::boolean,false) THEN 'AWAITING_PARTNER'
        WHEN COALESCE((i.j->>'retryable')::boolean,false) AND q.attempts<7 THEN 'RETRY' ELSE 'ERROR' END,
        attempts=q.attempts+1,scheduled_at=CASE WHEN NOT COALESCE((i.j->>'success')::boolean,false) AND COALESCE((i.j->>'retryable')::boolean,false) AND q.attempts<7 THEN now()+interval '1 second'*LEAST(GREATEST(COALESCE((i.j->>'retryAfterSeconds')::int,5),5),900) ELSE q.scheduled_at END,
        locked_at=NULL,locked_by=NULL,lease_until=NULL,processed_at=CASE WHEN COALESCE((i.j->>'success')::boolean,false) OR NOT COALESCE((i.j->>'retryable')::boolean,false) OR q.attempts>=7 THEN now() ELSE NULL END,partner_request_id=NULLIF(left(btrim(i.j->>'requestId'),180),''),response_code=NULLIF(i.j->>'responseCode','')::int,last_error=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN NULL ELSE COALESCE(NULLIF(left(btrim(i.j->>'error'),1000),''),'Falha não detalhada pelo parceiro.') END,updated_at=now()
      FROM input i WHERE q.id=$1 AND q.status='PROCESSING' AND q.locked_by=left($2,180) AND q.lease_until>now() RETURNING q.*,i.j
    ), changed AS (
      UPDATE sales_channel_orders o SET
        pending_action=CASE WHEN o.pending_action=q.action THEN o.pending_action ELSE NULL END,
        command_status=CASE WHEN o.pending_action IS NULL THEN o.command_status WHEN COALESCE((q.j->>'success')::boolean,false) THEN 'AWAITING_PARTNER' WHEN q.status='RETRY' THEN 'QUEUED' ELSE 'ERROR' END,
        last_partner_request_id=q.partner_request_id,status_updated_at=now(),version=o.version+1,updated_at=now()
      FROM command q WHERE o.id=q.order_id AND o.tenant_id=q.tenant_id RETURNING o.*,q.id command_id,q.action,q.payload command_payload,q.last_error
    ), history AS (
      INSERT INTO sales_channel_status_history(id,tenant_id,connection_id,order_id,command_id,from_status,to_status,provider_status,origin,reason,correlation_id,created_at)
      SELECT gen_random_uuid(),o.tenant_id,o.connection_id,o.id,o.command_id,NULLIF(o.command_payload->>'orderStatus',''),o.status,o.partner_status,CASE WHEN o.command_status IN ('CONFIRMED','AWAITING_PARTNER') THEN 'PARTNER_ACKNOWLEDGMENT' ELSE 'PARTNER_ERROR' END,o.last_error,o.last_partner_request_id,now() FROM changed o RETURNING id
    ), connection_health AS (
      UPDATE sales_channel_connections c SET last_health_check_at=now(),last_success_at=CASE WHEN q.status IN ('CONFIRMED','AWAITING_PARTNER') THEN now() ELSE c.last_success_at END,last_request_id=q.partner_request_id,last_error=q.last_error,consecutive_failures=CASE WHEN q.status IN ('CONFIRMED','AWAITING_PARTNER') THEN 0 ELSE LEAST(c.consecutive_failures+1,100000) END,updated_at=now()
      FROM command q WHERE c.id=q.connection_id AND c.tenant_id=q.tenant_id RETURNING c.id
    ) SELECT count(*)+(SELECT count(*) FROM history)+(SELECT count(*) FROM connection_health) FROM changed
  """,params:[$commandId,$workerId,$payload])
}

mutation SystemRecordSalesChannelSyncResult($jobId: UUID!, $workerId: String!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($3::jsonb,'{}'::jsonb) j), job AS (
      UPDATE sales_channel_sync_jobs j SET status=CASE WHEN COALESCE((i.j->>'continuation')::boolean,false) THEN 'QUEUED' WHEN COALESCE((i.j->>'success')::boolean,false) THEN 'COMPLETED' WHEN COALESCE((i.j->>'retryable')::boolean,false) AND j.attempts<7 THEN 'RETRY' ELSE 'ERROR' END,attempts=CASE WHEN COALESCE((i.j->>'continuation')::boolean,false) THEN j.attempts ELSE j.attempts+1 END,cursor=NULLIF(i.j->>'cursor','')::uuid,
        scheduled_at=CASE WHEN COALESCE((i.j->>'continuation')::boolean,false) THEN now()+interval '5 seconds' WHEN NOT COALESCE((i.j->>'success')::boolean,false) AND COALESCE((i.j->>'retryable')::boolean,false) AND j.attempts<7 THEN now()+interval '1 second'*LEAST(GREATEST(COALESCE((i.j->>'retryAfterSeconds')::int,10),10),900) ELSE j.scheduled_at END,
        total_items=GREATEST(COALESCE((i.j->>'totalItems')::int,j.total_items),0),processed_items=GREATEST(COALESCE((i.j->>'processedItems')::int,j.processed_items),0),failed_items=GREATEST(COALESCE((i.j->>'failedItems')::int,j.failed_items),0),
        locked_by=NULL,lease_until=NULL,started_at=COALESCE(j.started_at,now()),finished_at=CASE WHEN COALESCE((i.j->>'continuation')::boolean,false) THEN NULL WHEN COALESCE((i.j->>'success')::boolean,false) OR NOT COALESCE((i.j->>'retryable')::boolean,false) OR j.attempts>=7 THEN now() ELSE NULL END,last_error=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN NULL ELSE COALESCE(NULLIF(left(btrim(i.j->>'error'),1000),''),'Falha não detalhada pelo parceiro.') END,updated_at=now()
      FROM input i WHERE j.id=$1 AND j.status='PROCESSING' AND j.locked_by=left($2,180) AND j.lease_until>now() RETURNING j.*
    ), connection_health AS (
      UPDATE sales_channel_connections c SET last_health_check_at=now(),last_success_at=CASE WHEN j.status='COMPLETED' THEN now() ELSE c.last_success_at END,last_synced_at=CASE WHEN j.status='COMPLETED' THEN now() ELSE c.last_synced_at END,last_error=j.last_error,consecutive_failures=CASE WHEN j.status='COMPLETED' THEN 0 ELSE LEAST(c.consecutive_failures+1,100000) END,updated_at=now()
      FROM job j WHERE c.id=j.connection_id AND c.tenant_id=j.tenant_id AND j.status<>'QUEUED' RETURNING c.id
    ) SELECT count(*)+(SELECT count(*) FROM connection_health) FROM job
  """,params:[$jobId,$workerId,$payload])
}

mutation SystemRecordSalesChannelMappingResult($mappingId: UUID!, $payload: Any!) @auth(level: NO_ACCESS) @transaction {
  _execute(sql: """
    WITH input AS (SELECT COALESCE($2::jsonb,'{}'::jsonb) j), changed AS (
      UPDATE sales_channel_product_mappings m SET sync_status=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN 'COMPLETED' ELSE 'ERROR' END,
        status=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN 'MAPPED' ELSE m.status END,last_synced_at=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN (i.j->>'snapshotAt')::timestamptz ELSE m.last_synced_at END,
        last_error=CASE WHEN COALESCE((i.j->>'success')::boolean,false) THEN NULL ELSE COALESCE(NULLIF(left(btrim(i.j->>'error'),1000),''),'Falha não detalhada na sincronização do produto.') END,version=m.version+1,updated_at=now()
      FROM input i WHERE m.id=$1 AND m.active AND m.enabled AND m.deleted_at IS NULL AND m.version=(i.j->>'expectedVersion')::int
        AND EXISTS(SELECT 1 FROM sales_channel_sync_jobs job JOIN sales_channel_connections c ON c.id=job.connection_id AND c.tenant_id=job.tenant_id WHERE job.id=(i.j->>'jobId')::uuid AND job.connection_id=m.connection_id AND job.tenant_id=m.tenant_id AND job.status='PROCESSING' AND job.locked_by=i.j->>'workerId' AND job.lease_until>now() AND c.active AND c.enabled AND c.deleted_at IS NULL) RETURNING m.id
    ) SELECT count(*) FROM changed
  """,params:[$mappingId,$payload])
}

mutation CloseCashSession($sessionId: UUID!, $countedAmountCents: Int64!, $notes: String!) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN app_pages pg ON pg.page_key='CAIXA' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id
      LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND COALESCE(up.can_manage,rp.can_manage,false)
    ), calculated AS (
      SELECT cs.id,cs.tenant_id,cs.opening_amount_cents+COALESCE(sum(cm.amount_cents) FILTER(WHERE cm.movement_type<>'OPENING'),0) expected
      FROM cash_sessions cs JOIN actor a ON a.tenant_id=cs.tenant_id LEFT JOIN cash_movements cm ON cm.session_id=cs.id
      WHERE cs.id=$2 AND cs.status='OPEN' GROUP BY cs.id
    ), closed AS (
      UPDATE cash_sessions cs SET closed_by_uid=$1,closed_at=now(),expected_amount_cents=c.expected,counted_amount_cents=GREATEST($3,0),difference_cents=GREATEST($3,0)-c.expected,status='CLOSED',notes=concat_ws(E'\n',cs.notes,NULLIF(left(btrim($4),500),'')),updated_at=now()
      FROM calculated c WHERE cs.id=c.id RETURNING cs.*
    )
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
    SELECT tenant_id,$1,'Vendas','CAIXA','CLOSE','CashSession',id::text,'Caixa fechado',true,'SQL_CONNECT',jsonb_build_object('expectedAmountCents',expected_amount_cents,'countedAmountCents',counted_amount_cents,'differenceCents',difference_cents),now() FROM closed
  """,params:[{_expr:"auth.uid"},$sessionId,$countedAmountCents,$notes])
}
