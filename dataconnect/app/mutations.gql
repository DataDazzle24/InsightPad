    SELECT q.tenant_id,$1,'Integrações','CANAIS_VENDA','RETRY','SalesChannelCommand',q.id::text,'Comando de parceiro reenfileirado',true,'SQL_CONNECT',jsonb_build_object('action',q.action,'attempts',q.attempts,'orderUpdated',(SELECT count(*) FROM order_changed)),now() FROM changed q
  """,params:[{_expr:"auth.uid"},$id])
}

