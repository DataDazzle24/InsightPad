      WHERE u.id=$1 AND u.active AND CASE WHEN $3 THEN COALESCE(up.can_update,rp.can_update,false) ELSE COALESCE(up.can_delete,rp.can_delete,false) END),
    changed AS (UPDATE customers c SET active=$3,deleted_at=CASE WHEN $3 THEN NULL ELSE now() END,updated_at=now() FROM actor a
      WHERE c.id=$2 AND c.tenant_id=a.tenant_id RETURNING c.id,c.tenant_id,c.name)
    INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
      SELECT tenant_id,$1,'Cadastros','CAD_CLIENTE',CASE WHEN $3 THEN 'RESTORE' ELSE 'ARCHIVE' END,'Customer',id::text,'Status do cliente alterado',true,
      'SQL_CONNECT',jsonb_build_object('active',$3,'name',name),now() FROM changed
  """,params:[{_expr:"auth.uid"},$id,$active])
}


mutation SaveProduct($id: UUID, $payload: Any!, $components: Any) @auth(level: USER) @transaction {
  _execute(sql: """
    WITH actor AS (
      SELECT u.id,u.tenant_id FROM users u JOIN tenants t ON t.id=u.tenant_id AND t.active AND t.deleted_at IS NULL JOIN roles r ON r.id=u.role_id AND r.tenant_id=u.tenant_id AND r.active AND r.deleted_at IS NULL JOIN app_pages pg ON pg.page_key='CAD_PRODUTO' AND pg.active
      LEFT JOIN user_page_permissions up ON up.user_id=u.id AND up.page_id=pg.id AND up.tenant_id=u.tenant_id LEFT JOIN role_page_permissions rp ON rp.role_id=u.role_id AND rp.page_id=pg.id AND rp.tenant_id=u.tenant_id
      WHERE u.id=$1 AND u.active AND u.deleted_at IS NULL AND CASE WHEN $2::uuid IS NULL THEN COALESCE(up.can_create,rp.can_create,false) ELSE COALESCE(up.can_update,rp.can_update,false) END
    ),saved AS (
      INSERT INTO products(id,tenant_id,category_id,subcategory_id,supplier_id,name,internal_code,ean,brand,size_type,size,color,maximum_stock,minimum_stock,
        sale_price_cents,cost_price_cents,weighted_product,bundle_product,allow_negative_stock,notes,active,created_at,updated_at)
      SELECT COALESCE($2::uuid,gen_random_uuid()),a.tenant_id,($3::jsonb->>'categoryId')::uuid,NULLIF($3::jsonb->>'subcategoryId','')::uuid,
        NULLIF($3::jsonb->>'supplierId','')::uuid,btrim($3::jsonb->>'name'),nullif(btrim($3::jsonb->>'internalCode'),''),
        nullif(regexp_replace($3::jsonb->>'ean','\s','','g'),''),nullif(btrim($3::jsonb->>'brand'),''),nullif($3::jsonb->>'sizeType',''),
        nullif($3::jsonb->>'size',''),nullif($3::jsonb->>'color',''),NULLIF($3::jsonb->>'maximumStock','')::numeric,
        NULLIF($3::jsonb->>'minimumStock','')::numeric,COALESCE(($3::jsonb->>'salePriceCents')::bigint,0),COALESCE(($3::jsonb->>'costPriceCents')::bigint,0),
        COALESCE(($3::jsonb->>'weightedProduct')::boolean,false),COALESCE(($3::jsonb->>'bundleProduct')::boolean,false),
        COALESCE(($3::jsonb->>'allowNegativeStock')::boolean,false),nullif(btrim($3::jsonb->>'notes'),''),true,now(),now() FROM actor a
      JOIN categories c ON c.id=($3::jsonb->>'categoryId')::uuid AND c.tenant_id=a.tenant_id AND c.active
      LEFT JOIN subcategories sc ON sc.id=NULLIF($3::jsonb->>'subcategoryId','')::uuid AND sc.tenant_id=a.tenant_id AND sc.category_id=c.id AND sc.active
      LEFT JOIN suppliers sp ON sp.id=NULLIF($3::jsonb->>'supplierId','')::uuid AND sp.tenant_id=a.tenant_id AND sp.active
      WHERE length(btrim($3::jsonb->>'name'))>=2 AND COALESCE(($3::jsonb->>'salePriceCents')::bigint,0)>=0 AND COALESCE(($3::jsonb->>'costPriceCents')::bigint,0)>=0
        AND COALESCE(NULLIF($3::jsonb->>'minimumStock','')::numeric,0)>=0
        AND COALESCE(NULLIF($3::jsonb->>'maximumStock','')::numeric,0)>=0
        AND (NULLIF($3::jsonb->>'subcategoryId','') IS NULL OR sc.id IS NOT NULL) AND (NULLIF($3::jsonb->>'supplierId','') IS NULL OR sp.id IS NOT NULL)
        AND (NULLIF($3::jsonb->>'maximumStock','') IS NULL OR NULLIF($3::jsonb->>'minimumStock','') IS NULL OR
             ($3::jsonb->>'maximumStock')::numeric>=($3::jsonb->>'minimumStock')::numeric)
        AND (NULLIF($3::jsonb->>'sizeType','') IS NULL OR
          (($3::jsonb->>'sizeType')='ML' AND ($3::jsonb->>'size')=ANY(ARRAY['150','250','275','313','330','350','473','500','510','600','750','965','998'])) OR
          (($3::jsonb->>'sizeType')='L' AND ($3::jsonb->>'size')=ANY(ARRAY['1','1,5','2','2,5','3'])) OR
          (($3::jsonb->>'sizeType')='KG' AND ($3::jsonb->>'size')=ANY(ARRAY['1','3','5'])) OR
          (($3::jsonb->>'sizeType')='G' AND ($3::jsonb->>'size')=ANY(ARRAY['76','140','150','500'])) OR
          (($3::jsonb->>'sizeType')='UN' AND ($3::jsonb->>'size')='100'))
        AND (
          (NOT COALESCE(($3::jsonb->>'bundleProduct')::boolean,false) AND jsonb_array_length(COALESCE($4::jsonb,'[]'::jsonb))=0)
          OR (
            COALESCE(($3::jsonb->>'bundleProduct')::boolean,false)
            AND jsonb_array_length(COALESCE($4::jsonb,'[]'::jsonb))>0
            AND jsonb_array_length(COALESCE($4::jsonb,'[]'::jsonb))=(
              SELECT count(DISTINCT item->>'productId') FROM jsonb_array_elements(COALESCE($4::jsonb,'[]'::jsonb)) item
              JOIN products component ON component.id=(item->>'productId')::uuid AND component.tenant_id=a.tenant_id
                AND component.active AND component.deleted_at IS NULL AND NOT component.bundle_product
              WHERE component.id<>COALESCE($2::uuid,'00000000-0000-0000-0000-000000000000')
                AND (item->>'quantity')::numeric>0
            )
            AND ($2::uuid IS NULL OR NOT EXISTS(
              SELECT 1 FROM product_components membership
              JOIN products parent ON parent.id=membership.parent_product_id AND parent.tenant_id=membership.tenant_id
              WHERE membership.component_product_id=$2 AND parent.active AND parent.deleted_at IS NULL AND parent.bundle_product
            ))
          )
        )
        AND NOT EXISTS(SELECT 1 FROM products x WHERE x.tenant_id=a.tenant_id AND x.id<>COALESCE($2::uuid,'00000000-0000-0000-0000-000000000000') AND x.active AND
          ((nullif($3::jsonb->>'internalCode','') IS NOT NULL AND x.internal_code=$3::jsonb->>'internalCode') OR
           (nullif($3::jsonb->>'ean','') IS NOT NULL AND x.ean=$3::jsonb->>'ean')))
      ON CONFLICT(id) DO UPDATE SET category_id=EXCLUDED.category_id,subcategory_id=EXCLUDED.subcategory_id,supplier_id=EXCLUDED.supplier_id,name=EXCLUDED.name,
        internal_code=EXCLUDED.internal_code,ean=EXCLUDED.ean,brand=EXCLUDED.brand,size_type=EXCLUDED.size_type,size=EXCLUDED.size,color=EXCLUDED.color,
        maximum_stock=EXCLUDED.maximum_stock,minimum_stock=EXCLUDED.minimum_stock,sale_price_cents=EXCLUDED.sale_price_cents,cost_price_cents=EXCLUDED.cost_price_cents,
        weighted_product=EXCLUDED.weighted_product,bundle_product=EXCLUDED.bundle_product,allow_negative_stock=EXCLUDED.allow_negative_stock,
        notes=EXCLUDED.notes,updated_at=now() WHERE products.tenant_id=EXCLUDED.tenant_id RETURNING id,tenant_id,name
    ),cleared AS (
      DELETE FROM product_components pc USING saved s WHERE pc.parent_product_id=s.id AND pc.tenant_id=s.tenant_id RETURNING pc.parent_product_id
    ),components_saved AS (
      INSERT INTO product_components(tenant_id,parent_product_id,component_product_id,quantity,allocated_unit_price_cents,created_at,updated_at)
      SELECT s.tenant_id,s.id,(item->>'productId')::uuid,(item->>'quantity')::numeric,NULLIF(item->>'allocatedUnitPriceCents','')::bigint,now(),now()
      FROM saved s CROSS JOIN jsonb_array_elements(COALESCE($4::jsonb,'[]'::jsonb)) item
      JOIN products component ON component.id=(item->>'productId')::uuid AND component.tenant_id=s.tenant_id AND component.active AND component.deleted_at IS NULL AND NOT component.bundle_product
      WHERE component.id<>s.id AND (item->>'quantity')::numeric>0 RETURNING parent_product_id
    ),recalculated AS (
      UPDATE products parent
      SET cost_price_cents=calculation.total_cost,updated_at=now()
      FROM saved s
      CROSS JOIN LATERAL (
        SELECT COALESCE(ROUND(SUM(component.cost_price_cents*(item->>'quantity')::numeric)),0)::bigint AS total_cost
        FROM jsonb_array_elements(COALESCE($4::jsonb,'[]'::jsonb)) item
        JOIN products component ON component.id=(item->>'productId')::uuid AND component.tenant_id=s.tenant_id
          AND component.active AND component.deleted_at IS NULL
        WHERE component.id<>s.id AND (item->>'quantity')::numeric>0
      ) calculation
      WHERE parent.id=s.id AND parent.tenant_id=s.tenant_id
        AND COALESCE(($3::jsonb->>'bundleProduct')::boolean,false)
        AND jsonb_array_length(COALESCE($4::jsonb,'[]'::jsonb))>0
      RETURNING parent.id
    ),parents_recalculated AS (
      UPDATE products parent SET cost_price_cents=totals.total_cost,updated_at=now()
      FROM (
        SELECT pc.parent_product_id,COALESCE(ROUND(SUM(component.cost_price_cents*pc.quantity)),0)::bigint total_cost
        FROM product_components pc JOIN saved changed ON changed.id=pc.component_product_id
        JOIN products component ON component.id=pc.component_product_id AND component.tenant_id=pc.tenant_id
        GROUP BY pc.parent_product_id
      ) totals
      WHERE parent.id=totals.parent_product_id AND parent.active AND parent.bundle_product
      RETURNING parent.id
    ) INSERT INTO audit_logs(tenant_id,user_id,module,page_key,action,entity_name,entity_id,summary,success,origin,after_data,created_at)
      SELECT tenant_id,$1,'Cadastros','CAD_PRODUTO',CASE WHEN $2::uuid IS NULL THEN 'CREATE' ELSE 'UPDATE' END,'Product',id::text,'Produto salvo',true,
      'SQL_CONNECT',jsonb_build_object('id',id,'name',name),now() FROM saved
  """,params:[{_expr:"auth.uid"},$id,$payload,$components])
}

