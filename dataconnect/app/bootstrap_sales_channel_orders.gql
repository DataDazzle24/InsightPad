# Compatibility verification only. Constraints are now managed by @unique in schema.gql.
# No privileged DDL is executed through the application connector.
query VerifySalesChannelOrderConstraints @auth(level: NO_ACCESS) {
  _select(sql: """
    SELECT jsonb_build_object(
      'ordersTable',to_regclass('sales_channel_orders') IS NOT NULL,
      'itemsTable',to_regclass('sales_channel_order_items') IS NOT NULL,
      'mappingsTable',to_regclass('sales_channel_product_mappings') IS NOT NULL
    ) data
  """,params:[])
}
